ected": {"checks": [{"query": "SELECT * FROM \"2022\"", "columns": ["id", "title"], "rows": [[14, "Heaven"], [15, "Elena Knows"], [16, "The Book of Mother"], [17, "Tomb of Sand"], [18, "A New Name: Septology VI-VII"], [19, "The Books of Jacob"], [20, "Love in the Big City"], [21, "Paradais"], [22, "Phenotypes"], [23, "Happy Stories, Mostly"], [24, "More Than I Love My Life"], [25, "After the Sun"], [26, "Cursed Bunny"]]}]}}, {"id": "D5-01", "module": "M5", "title": "An index with the columns backwards", "bug_type": "performance", "origin": "generated", "concepts": ["C5.3"], "difficulty": 3, "db": "movies", "kind": "modify", "setup": "CREATE INDEX \"name_index\" ON \"people\" (\"name\");\n", "prompt": "Meant to give the Tom Hanks query a covering index on `stars`, but EXPLAIN QUERY PLAN shows it can't **search** with it. Fix the index.\n", "broken": "CREATE INDEX \"person_index\" ON \"stars\" (\"movie_id\", \"person_id\");\n", "hints": ["A multi-column index is sorted by its first column, then by the second.", "The query filters on `person_id`. Can a list sorted by movie_id be searched by person_id?", "Put the filter column first, `(\"person_id\", \"movie_id\")`."], "solution": "CREATE INDEX \"person_index\" ON \"stars\" (\"person_id\", \"movie_id\");\n", "check": [{"plan": "SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT \"id\" FROM \"people\" WHERE \"name\" = 'Tom Hanks'))", "contains": ["SEARCH stars USING COVERING INDEX person_index"]}], "diagnosis": "Column order in an index matters. The leading column(s) must match the WHERE clause.", "source": [{"file": "lecture5", "lines": "507-517", "quote": "Let's also include in this case, the movie ID column like this.", "text": " 507  I'll come back over and I'll create this new index\n 508  that intends to cover our search here.\n 509  I want to include not just the person ID column but also the movie ID\n 510  column so I can quickly find that data inside the index itself.\n 511  Let me drop our current implementation of the person index like this.\n 512  And I'll hit semicolon here, and now that index is gone.\n 513  But if I type now CREATE INDEX, I'll also\n 514  call this \"person_index\" ON \"stars.\"\n 515  and I'll say let's include not just the person ID column.\n 516  Let's also include in this case, the movie ID column like this.\n 517  Now I'll hit semicolon, Enter."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT \"id\" FROM \"people\" WHERE \"name\" = 'Tom Hanks'))", "plan": "SEARCH movies USING INTEGER PRIMARY KEY (rowid=?) | LIST SUBQUERY 2 | SEARCH stars USING COVERING INDEX person_index (person_id=?) | SCALAR SUBQUERY 1 | SEARCH people USING COVERING INDEX name_index (name=?)"}]}}, {"id": "D5-02", "module": "M5", "title": "An index nobody uses", "bug_type": "performance", "origin": "generated", "concepts": ["C5.2"], "difficulty": 2, "db": "movies", "kind": "modify", "prompt": "The 'Cars' lookup is still a SCAN after creating this index. Create the index that fixes it.", "broken": "CREATE INDEX \"year_index\" ON \"movies\" (\"year\");\n", "hints": ["Run EXPLAIN QUERY PLAN on `SELECT * FROM \"movies\" WHERE \"title\" = 'Cars';`", "An index only helps queries that filter (or sort) on its columns.", "Index `title`."], "solution": "CREATE INDEX \"title_index\" ON \"movies\" (\"title\");\n", "check": [{"plan": "SELECT * FROM \"movies\" WHERE \"title\" = 'Cars'", "contains": ["USING INDEX title_index"]}], "diagnosis": "Every index costs space and write time (lecture5 L548-561, L852-861), so build only the ones your queries use.", "source": [{"file": "lecture5", "lines": "273-278", "quote": "I should probably include the Title column in this index", "text": " 273  I want to create an index.\n 274  And if I'm searching my title column in Movies,\n 275  I should probably include the Title column in this index.\n 276  So I'll say call this the \"title_index\" here.\n 277  It'll be on the Movies table and it'll contain the data in the Title\n 278  column of Movies a bit like this."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT * FROM \"movies\" WHERE \"title\" = 'Cars'", "plan": "SEARCH movies USING INDEX title_index (title=?)"}]}}, {"id": "D5-03", "module": "M5", "title": "A partial index that doesn't match the query", "bug_type": "performance", "origin": "generated", "concepts": ["C5.5"], "difficulty": 3, "db": "movies", "kind": "modify", "prompt": "Searching this year's titles should use a partial index. The query is `SELECT \"title\" FROM \"movies\" WHERE \"year\" = 2023;`.\nThe index below isn't used. Write one that is (name it `recents`).\n", "broken": "CREATE INDEX \"recents\" ON \"movies\" (\"title\") WHERE \"year\" = 2022;\n", "hints": ["SQLite can use a partial index only when the query's WHERE implies the index's WHERE.", "Does `year = 2023` imply `year = 2022`?", "Make the index condition match the query."], "solution": "CREATE INDEX \"recents\" ON \"movies\" (\"title\") WHERE \"year\" = 2023;\n", "check": [{"plan": "SELECT \"title\" FROM \"movies\" WHERE \"year\" = 2023", "contains": ["recents"]}], "diagnosis": "A partial index is a bet on which rows people query. Make it match the real query.", "source": [{"file": "lecture5", "lines": "917-924", "quote": "because my WHERE clause included 2023", "text": " 917  I would try EXPLAIN QUERY PLAN.\n 918  And let me try SELECT \"title\" FROM \"movies\" where the year = 1998\n 919  like this.\n 920  And see now I'm only back to scanning movies.\n 921  So before in my prior query I was able to use the index\n 922  because my WHERE clause included 2023.\n 923  Now though I'm using 1998, which were rows that were not\n 924  included in this partial index."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"year\" = 2023", "plan": "SCAN movies USING COVERING INDEX recents"}]}}, {"id": "D5-04", "module": "M5", "title": "A transfer that created money", "bug_type": "transaction", "origin": "source-demo", "concepts": ["C5.7"], "difficulty": 3, "db": "bank", "kind": "modify", "continue_on_error": true, "require": ["BEGIN", "ROLLBACK"], "setup": "UPDATE \"accounts\" SET \"balance\" = 0 WHERE \"id\" = 1;\nUPDATE \"accounts\" SET \"balance\" = 30 WHERE \"id\" = 2;\n", "prompt": "Alice ($0) \"pays\" Bob $10. The debit fails its CHECK, but Bob keeps the $10, so the bank now holds $70 instead of $60.\nRewrite it so a failure leaves both balances untouched. (Statements keep running after an error here.)\n", "broken": "UPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" - 10 WHERE \"id\" = 1;\n", "hints": ["Without a transaction, each statement commits on its own.", "Group the two updates into one unit of work.", "`BEGIN TRANSACTION;` … both updates … then `ROLLBACK;` after the failure."], "solution": "BEGIN TRANSACTION;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" - 10 WHERE \"id\" = 1;\nROLLBACK;\n", "check": ["SELECT * FROM \"accounts\""], "diagnosis": "The lecturer hits this exact state without a transaction (lecture5 L1270-1305).", "source": [{"file": "lecture5", "lines": "1285-1296", "quote": "So I need to undo this but I don't have a transaction here.", "text": "1285  Now I'll try to subtract $10 from Alice, but I get a constraint failure here.\n1286  My check constraint failed on the balance column.\n1287  Why did it do that?\n1288  Because I now have less than $0 in that balance column.\n1289  So I need to undo this but I don't have a transaction here.\n1290  What could I do instead to undo what I've just done?\n1291  AUDIENCE: So we can roll back.\n1292  CARTER ZENKE: We could roll back, but here's the thing.\n1293  A rollback only works while we're inside of a transaction.\n1294  And a transaction begins when we say begin transaction.\n1295  So here I actually didn't say begin transaction.\n1296  What I have to do instead is run another update statement."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"accounts\"", "columns": ["id", "name", "balance"], "rows": [[1, "Alice", 0], [2, "Bob", 30], [3, "Charlie", 30]]}]}}, {"id": "D6-01", "module": "M6", "title": "Query built by string formatting", "bug_type": "security", "origin": "source-question", "concepts": ["C6.8"], "difficulty": 2, "db": "bank", "kind": "selfcheck", "prompt": "This Python code is vulnerable. What input exploits it, and what is the fix?\n```python\naccount = input(\"Account id: \")\nrows = db.execute(f\"SELECT * FROM accounts WHERE id = {account}\").fetchall()\n```\n", "broken": "-- f\"SELECT * FROM accounts WHERE id = {account}\"\n", "hints": ["What happens if `account` is `1 UNION SELECT * FROM accounts`?", "The input becomes SQL code. The fix is to keep code and data separate.", "Use a placeholder and pass the value separately."], "solution": "-- exploit input: 1 UNION SELECT * FROM accounts      (or: 1 OR 1=1)\n-- fix (Python sqlite3):\n--   rows = db.execute(\"SELECT * FROM accounts WHERE id = ?\", (account,)).fetchall()\n-- MySQL equivalent:\nPREPARE balance_check FROM 'SELECT * FROM accounts WHERE id = ?';\nSET @id = 1;\nEXECUTE balance_check USING @id;\n", "diagnosis": "Formatting user input into SQL is the root cause. Placeholders (`?`) fix it. `python3 tools/labs.py injection` demonstrates both.", "source": [{"file": "lecture6", "lines": "2138-2147", "quote": "So is this the same reason why we", "text": "2138  AUDIENCE: So is this the same reason why we\n2139  shouldn't use a formatted string in Python to execute a SQL query?\n2140  CARTER ZENKE: Yeah, so if you're familiar with Python format strings,\n2141  it's a similar kind of pitfall, which is you\n2142  can add in any possible value for this variable you're substituting into.\n2143  And that can lead to some unintended consequences.\n2144  So similarly, should we create prepared statements\n2145  that can actually clean and escape the data\n2146  that we might want to insert into our queries or our statements over there\n2147  too."}], "origin_label": "SOURCE · question posed in the lecture"}, {"id": "D6-02", "module": "M6", "title": "A procedure cut short by the delimiter", "bug_type": "syntax", "origin": "source-question", "concepts": ["C6.4"], "difficulty": 2, "db": null, "kind": "selfcheck", "engine": "mysql", "verify_setup": "CREATE TABLE `collections` (`id` INT AUTO_INCREMENT, `title` VARCHAR(64), `deleted` TINYINT DEFAULT 0, PRIMARY KEY(`id`));\n", "prompt": "In the `mysql` client this fails with a syntax error near the end of the SELECT line. Why, and how do you fix it?", "broken": "CREATE PROCEDURE `current_collection`()\nBEGIN\n    SELECT `title` FROM `collections` WHERE `deleted` = 0;\nEND;\n", "hints": ["Where does the client think your statement ends?", "At the first `;`, which is in the middle of the procedure body.", "Temporarily change the delimiter with `DELIMITER //`."], "solution": "DELIMITER //\nCREATE PROCEDURE `current_collection`()\nBEGIN\n    SELECT `title` FROM `collections` WHERE `deleted` = 0;\nEND//\nDELIMITER ;\n", "diagnosis": "The client splits statements at the delimiter before the server sees them. SQLite's shell recognises trigger bodies automatically, but the MySQL client doesn't.", "source": [{"file": "lecture6", "lines": "1049-1063", "quote": "So a workaround is to temporarily declare a different delimiter.", "text": "1049  Well, to end a SQL statement, we have to have a semicolon.\n1050  But MySQL might actually prematurely end this statement.\n1051  If I type quit procedure name begin some statement then a semicolon,\n1052  it'll say, OK, you're done.\n1053  But I'm actually not.\n1054  I might want to add more statements.\n1055  I might want to conclude with this end down here.\n1056  So a workaround is to temporarily declare a different delimiter.\n1057  Instead of ending my queries with a semicolon here,\n1058  I'll end them with, let's say, slash slash.\n1059  And we'll see that in just a moment here.\n1060  I'll come back to my computer.\n1061  And for the sake of writing this procedure,\n1062  I'll change my delimiter, that is what icon represents the end of my query\n1063  to slash slash, like this."}], "origin_label": "SOURCE · question posed in the lecture"}], "review": [{"id": "R0-01", "type": "quick", "front": "What does `LIMIT 5` do, and why use it on a big table?", "back": "It returns at most 5 rows. It lets you peek at the data without printing every row.", "source": [{"file": "lecture0", "lines": "366-374", "quote": "And for that, I could use this other SQL keyword, this one called LIMIT.", "text": " 366  But it's often maybe good practice for me to not look at all the data.\n 367  Like, imagine if we had millions of rows in this column,\n 368  but only to give back some.\n 369  Take a peek of what's inside this database.\n 370  And for that, I could use this other SQL keyword, this one called LIMIT.\n 371  So LIMIT, as its name might imply, limits\n 372  the number of queries or the number of rows I get back from my query.\n 373  I could say LIMIT 3, for instance, or LIMIT 5\n 374  to get back only the top 3 or the top 5 rows from my table."}], "module": "M0"}, {"id": "R0-02", "type": "predict", "db": "longlist0", "sql": "SELECT COUNT(*) FROM \"longlist\" WHERE \"translator\" = NULL;", "choices": ["2", "0", "78", "ERROR: no such column"], "answer": 1, "why": "`= NULL` is never true, so nothing is counted. `IS NULL` would find 2.", "source": [{"file": "lecture0", "lines": "598-606", "quote": "We could use IS NULL to figure out if a value is null.", "text": " 598  And we'll see that we have this type called NULL, where this\n 599  means that this value doesn't exist.\n 600  It's not in our database.\n 601  We can actually put together a condition around this idea of null, something\n 602  not being there.\n 603  We could use IS NULL to figure out if a value is null.\n 604  It's not there.\n 605  It's missing from our database.\n 606  Or IS IT NULL, meaning that it actually is there."}], "module": "M0"}, {"id": "R0-03", "type": "concept", "question": "Which quotes go around what in SQLite?", "choices": ["Double quotes for strings, single quotes for column names", "Double quotes for identifiers (tables, columns), single quotes for strings", "Either, interchangeably", "No quotes ever"], "answer": 1, "why": "The lecture's style convention is `\"title\"` for identifiers and `'hardcover'` for strings. Mixing them up can silently change meaning (debugging D0-03).", "source": [{"file": "lecture0", "lines": "306-315", "quote": "double quotes for column names and single quotes for string names", "text": " 306  Do I have to use quotes around the words like I am?\n 307  In general, it's a good practice to use these double quotes around your table\n 308  names and your column names.\n 309  These are called SQL identifiers.\n 310  Later on, we'll see we'll also have strings in SQL-- strings\n 311  being collections of characters we can use.\n 312  For those, we'll simply single-quote them\n 313  to note the difference between a string and an actual column name.\n 314  So good style convention here to use-- double quotes for column names\n 315  and single quotes for string names."}], "module": "M0"}, {"id": "R0-04", "type": "predict", "db": "longlist0", "sql": "SELECT \"title\" FROM \"longlist\" WHERE \"title\" = 'pyre';", "choices": ["Pyre", "(no rows)", "ERROR: no such column: pyre"], "answer": 1, "why": "`=` compares text exactly, including case. `LIKE 'pyre'` would match *Pyre* because LIKE ignores (ASCII) case.", "source": [{"file": "lecture0", "lines": "963-971", "quote": "So in this case, the equal is going to be case-sensitive.", "text": " 963  Now this is in contrast to saying WHERE \"title\" equals lowercase 'pyre'.\n 964  Let's try that.\n 965  I'll come back over here.\n 966  And I'll say again SELECT \"title\" from \"longlist,\"\n 967  but now WHERE \"title\" equals, quote, unquote, 'pyre' Semicolon.\n 968  I'll hit Enter.\n 969  And now I see no results.\n 970  So in this case, the equal is going to be case-sensitive.\n 971  Case matters in this case, but LIKE is case-insensitive."}], "module": "M0"}, {"id": "R0-05", "type": "predict", "db": "longlist0", "sql": "SELECT COUNT(*), COUNT(\"translator\") FROM \"longlist\";", "choices": ["78 | 78", "78 | 76", "76 | 78", "76 | 76"], "answer": 1, "why": "COUNT(column) skips NULLs, and two books have no translator.", "source": [{"file": "lecture0", "lines": "1336-1343", "quote": "So COUNT, when given a column, counts only those that", "text": "1336  OK, so I'm seeing maybe we have some number of rows, 78.\n1337  But for our translators, you remember, two of those were null values.\n1338  They didn't exist in our table.\n1339  So it seems like if we use COUNT star, we're counting all the rows.\n1340  But if we use COUNT \"translator,\" some column that has null values,\n1341  we're only getting back those rows or those values that aren't null.\n1342  So COUNT, when given a column, counts only those that\n1343  are not null that exist in our table."}], "module": "M0"}, {"id": "R0-06", "type": "concept", "question": "`ORDER BY \"rating\" LIMIT 10` returns…", "choices": ["the 10 best-rated books", "the 10 worst-rated books", "10 random books", "an error: DESC is required"], "answer": 1, "why": "ORDER BY is ascending (smallest first) by default. The lecturer got 3.05 … 3.42 at first and fixed it with DESC.", "source": [{"file": "lecture0", "lines": "1002-1017", "quote": "So let me show you that ORDER BY does by default sort from least to greatest.", "text": "1002  And I'll get back, well, not quite the top 10.\n1003  I see rating of 3.05 here and rating of 3.42 down here.\n1004  So based on this, what do you think the default ordering of ORDER BY is?\n1005  So you might be from least to greatest.\n1006  So we saw here that we have rating being pretty small,\n1007  but we said ORDER BY our rating.\n1008  So it starts from small and goes down to large.\n1009  So we need to fix this in some way.\n1010  And let's introduce a new addition to ORDER BY\n1011  to have us fix this query overall.\n1012  So let me show you that ORDER BY does by default sort from least to greatest.\n1013  But let's try some addition here.\n1014  We have not just ORDER BY but ORDER BY some column\n1015  and then ascending or descending.\n1016  So ascending is the default. It means from least to greatest.\n1017  Descending, we can specify meaning from greatest to smallest."}], "module": "M0"}, {"id": "R0-07", "type": "predict", "db": "longlist0", "sql": "SELECT MAX(\"title\"), MIN(\"title\") FROM \"longlist\";", "choices": ["A New Name: Septology VI-VII | Wretchedness", "Wretchedness | A New Name: Septology VI-VII", "The Adventures of China Iron | Tyll"], "answer": 1, "why": "On text, MAX and MIN compare alphabetically, not by length. MAX is the alphabetically last title.", "source": [{"file": "lecture0", "lines": "1305-1325", "quote": "So MAX seems to give us the lowest alphabetically", "text": "1305  And let me try to use MAX and MIN with some book titles.\n1306  So I'll say Select--\n1307  let's select the MAX title.\n1308  And at the same time, why don't we select the MIN title as well?\n1309  And I'll select these from my \"longlist\" table.\n1310  I'll hit Semicolon.\n1311  And now, let me try this out.\n1312  I'll get back Wretchedness and A New Name--\n1313  Septology VI-VII.\n1314  Now, there's a few hypotheses here.\n1315  It does seem that our MAX \"title\" is shorter than our MIN \"title.\"\n1316  So it's probably not that MAX gives us the length of the string,\n1317  but what do you notice?\n1318  Well, I see MIN is really early on in the alphabet.\n1319  It has an A here, whereas MAX has a W, pretty low in the alphabet.\n1320  And I would bet if we ordered these book titles,\n1321  we would see a new name up at the very top and a Wretchedness, the book here,\n1322  down at the bottom.\n1323  So MAX seems to give us the lowest alphabetically, which\n1324  is kind of contradictory with titles here or strings.\n1325  And MIN gives us the earliest in the alphabet using this A as well."}], "module": "M0"}, {"id": "R0-08", "type": "concept", "question": "Which pattern matches exactly four-character titles beginning with T?", "choices": ["'T%'", "'T___'", "'T_%'", "'%T___%'"], "answer": 1, "why": "Each `_` is exactly one character, while `%` is any run of characters (including none).", "source": [{"file": "lecture0", "lines": "805-814", "quote": "This is the only title that has T and then three characters after it.", "text": " 805  I'll say SELECT, let's say, \"title\" FROM \"longlist\" WHERE my \"title\" is LIKE--\n 806  I know it begins with a T. I don't know if this is a Y or an I.\n 807  And maybe I know that it has maybe one or two characters after it.\n 808  So I'll try this one.\n 809  Now I have three underscores, single underscore.\n 810  So match any book title that has T and then any three\n 811  individual characters after it.\n 812  I'll hit Enter.\n 813  And I'll see I get back Tyll.\n 814  This is the only title that has T and then three characters after it."}], "module": "M0"}, {"id": "R0-09", "type": "quick", "front": "What does `BETWEEN 2019 AND 2022` include?", "back": "Both ends, so it is the same as `>= 2019 AND <= 2022`.", "source": [{"file": "lecture0", "lines": "878-883", "quote": "This is inclusive.", "text": " 878  Let me go back to some slides and show you we could use these keywords\n 879  BETWEEN blank AND blank, where this can be some condition\n 880  or some number in this case.\n 881  I could say between, let's say, 2019 AND 2022.\n 882  This is inclusive.\n 883  So if I say 2019 AND 2022, I'll get back a query that includes 2019 and 2022."}], "module": "M0"}, {"id": "R0-10", "type": "debug", "ref": "D0-02", "module": "M0", "source": []}, {"id": "R0-11", "type": "debug", "ref": "D0-03", "module": "M0", "source": []}, {"id": "R0-12", "type": "write", "ref": "M0-E13", "module": "M0", "source": []}, {"id": "R1-01", "type": "quick", "front": "Name the three kinds of relationship between tables and give a longlist example of each.", "back": "One-to-one (each author writes exactly one book, an assumption the lecture rejects), one-to-many (a book has many ratings, a publisher many books), many-to-many (authors ↔ books, translators ↔ books).", "source": [{"file": "lecture1", "lines": "119-146", "quote": "one-to-one,", "text": " 119  So as it stands now, we could call this kind of relationship\n 120  a one-to-one relationship.\n 121  If this is our idea of authors and books, one author writes one book,\n 122  and one book is written by one author.\n 123  This is a one-to-one relationship.\n 124  Well, as we know, authors can write more than one book.\n 125  Olga, for example, didn't write just Flights.\n 126  They also wrote another book.\n 127  And so we could say, well, Olga wrote not just this book up top.\n 128  They also wrote this book down below.\n 129  And now we're moving from a one-to-one relationship to what we'll\n 130  call a one-to-many relationship.\n 131  There are many books that one author could write.\n 132  But, of course, is this the full picture, too?\n 133  Some books are only written by one author.\n 134  But, presumably, some books are written by multiple authors.\n 135  So we need to enhance our picture even further.\n 136  Let's try that.\n 137  Let me add another author into the mix here.\n 138  This author wrote this book along with Olga, let's say.\n 139  So notice how here we have one author writing more than one book,\n 140  and we also have one book being written by more than one author.\n 141  Well, this is called a many-to-many relationship.\n 142  And it's called that because we have many books that\n 143  can be written by many authors.\n 144  So these, in general, are the kinds of relationships\n 145  we'll have amongst our tables in a relational database-- one-to-one,\n 146  one-to-many, and many-to-many."}], "module": "M1"}, {"id": "R1-02", "type": "concept", "question": "In `ratings(book_id, rating)`, what is `book_id`?", "choices": ["The primary key of ratings", "A foreign key: books' primary key stored in another table", "A composite key", "An ISBN"], "answer": 1, "why": "A foreign key is a primary key from one table placed in a column of another table, here linking each rating to its book.", "source": [{"file": "lecture1", "lines": "317-324", "quote": "Well, a foreign key is simply taking a primary key from one table", "text": " 317  Well, what is a foreign key?\n 318  Well, a foreign key is simply taking a primary key from one table\n 319  and including it in the column of some other table.\n 320  So here we have, in the ratings table, the ISBN column still.\n 321  This is the primary key for the books table.\n 322  But now notice how it's inside the ratings table.\n 323  This is now a foreign key because it is outside of this books table\n 324  and inside the ratings table."}], "module": "M1"}, {"id": "R1-03", "type": "concept", "question": "A subquery returns several rows. Which outer operator compares against all of them?", "choices": ["=", "IN", "LIKE", "IS"], "answer": 1, "why": "`= (subquery)` uses only the first row in SQLite. `IN (subquery)` tests membership in the whole list.", "source": [{"file": "lecture1", "lines": "975-984", "quote": "if you're looking to see if some id is part of a list of ids", "text": " 975  In general-- if you want just a rule of thumb to follow--\n 976  if you're looking to see if some id is part of a list of ids,\n 977  or part of a set of ids that is more than one, you should use IN.\n 978  IN is good for checking if something is inside of more than one item,\n 979  let's say.\n 980  Equals, though, is good if you know you have only one id.\n 981  Let's say I have an id equal to 23 or equal to 25.\n 982  That's a good place for equals.\n 983  If, though, I had 23 or 25, I might use IN to match\n 984  either/or of those in that set--"}], "module": "M1"}, {"id": "R1-04", "type": "predict", "db": "sea_lions", "sql": "SELECT COUNT(*) FROM \"sea_lions\" JOIN \"migrations\" ON \"migrations\".\"id\" = \"sea_lions\".\"id\";", "choices": ["5", "6", "7", "8"], "answer": 0, "why": "An INNER JOIN keeps only matching ids. Jolee has no migration, and two migrations have no sea lion, so 5 rows remain.", "source": [{"file": "lecture1", "lines": "1149-1162", "quote": "So, this is our example, then, of an INNER JOIN.", "text": "1149  But what do you notice?\n1150  This one seems to match this id.\n1151  And this id seems to match this id.\n1152  But these two-- well, they don't match.\n1153  I mean poor Jolee down here-- we don't know how far Jolee went.\n1154  And if we don't know this data-- if these ids don't match--\n1155  is if we can not find a match for this id or for this id,\n1156  well, let's sadly just get rid of the row.\n1157  It's not part of our joined table anymore.\n1158  It's gone from our memory.\n1159  We now have only these tables--\n1160  or these rows that we could actually JOIN together\n1161  with the row and the other table here.\n1162  So, this is our example, then, of an INNER JOIN."}], "module": "M1"}, {"id": "R1-05", "type": "predict", "db": "sea_lions", "sql": "SELECT COUNT(*) FROM \"sea_lions\" FULL JOIN \"migrations\" ON \"migrations\".\"id\" = \"sea_lions\".\"id\";", "choices": ["5", "6", "7", "8"], "answer": 3, "why": "5 matches + Jolee (left only) + 2 untracked migrations (right only) = 8 rows.", "source": [{"file": "lecture1", "lines": "1274-1287", "quote": "Well, we see both tables in their entirety.", "text": "1274  A FULL JOIN, though, allows us to see the entirety of both tables\n1275  and which values are missing.\n1276  Let's try that now.\n1277  I'll come back over here.\n1278  And I'll do a FULL JOIN.\n1279  I'll say SELECT * FROM \"sea_lions\" FULL JOIN \"migrations\" ON \"migrations\"--\n1280  oh, \"migrations\" dot \"id\" is equal to \"sea_lions\" dot \"id\"; Enter.\n1281  And now what do we see?\n1282  Well, we see both tables in their entirety.\n1283  We have Jolee here still, even though Jolee doesn't\n1284  have a distance or some number of days.\n1285  We also have our sea lions-- our mystery sea lions down\n1286  below-- who don't have any name but are still included in our migration table\n1287  too."}], "module": "M1"}, {"id": "R1-06", "type": "predict", "db": "longlist", "sql": "SELECT ROUND(AVG(\"rating\"), 2) FROM \"ratings\" WHERE \"book_id\" = 1;", "choices": ["3.67", "3.77", "3.84", "4"], "answer": 1, "why": "Book 1 (Boulder) has 2,779 ratings averaging 3.774…, the real figure in lecture1 L1737 and lecture4 L409. The slides' 4, 3, 4 example (3.67) is only an illustration.", "source": [{"file": "lecture1", "lines": "1733-1737", "quote": "3.77, 3.97, 3.04-- for each book", "text": "1733  Let me scroll to the top and notice how using GROUP BY,\n1734  I was able to take each book_id, collapse the rows--\n1735  the ratings that were associated with this book--\n1736  and find the average of that rating--\n1737  3.77, 3.97, 3.04-- for each book, so kind of handy here."}], "module": "M1"}, {"id": "R1-07", "type": "concept", "question": "Which clause filters *groups* (e.g. average > 4.0) rather than rows?", "choices": ["WHERE", "HAVING", "ORDER BY", "LIMIT"], "answer": 1, "why": "WHERE runs before grouping, and HAVING runs after it. The order is GROUP BY → HAVING → ORDER BY → LIMIT.", "source": [{"file": "lecture1", "lines": "1759-1764", "quote": "SQL uses a different keyword for conditions on groups", "text": "1759  But I can't because these are now not individual rows.\n1760  They are groups.\n1761  SQL uses a different keyword for conditions on groups\n1762  than for conditions on individual rows.\n1763  And this keyword is called HAVING--\n1764  H-A-V-I-N-G. Let me try that--"}], "module": "M1"}, {"id": "R1-08", "type": "predict", "db": "longlist", "sql": "SELECT \"name\" FROM \"authors\" INTERSECT SELECT \"name\" FROM \"translators\";", "choices": ["(no rows)", "Ngũgĩ wa Thiong'o", "Sophie Hughes", "ERROR: no such column"], "answer": 1, "why": "INTERSECT keeps the names present in both sets. Ngũgĩ translated his own book.", "source": [{"file": "lecture1", "lines": "1537-1542", "quote": "His name is Ngugi", "text": "1537  I'll say INTERSECT and SELECT \"name\" FROM \"translators\".\n1538  And now I'll hit semicolon, Enter.\n1539  And I'll see one.\n1540  His name is Ngugi, who is both an author and a translator.\n1541  They translated their own book into English\n1542  for the International Booker Prize."}], "module": "M1"}, {"id": "R1-09", "type": "concept", "question": "What do UNION, INTERSECT and EXCEPT require of the two queries?", "choices": ["Same table", "Same number of columns (of compatible kinds)", "Same WHERE clause", "An ORDER BY"], "answer": 1, "why": "Rows from both sides are stacked or compared, so they must have the same shape (debugging D1-09).", "source": [{"file": "lecture1", "lines": "1652-1662", "quote": "you always have to have the same number", "text": "1652  The key thing here, though, is that in your INTERSECTs, or in your UNIONs,\n1653  or in your EXCEPT, you always have to have the same number\n1654  and the same type of columns.\n1655  So if I was trying to combine, let's say, author names with book titles,\n1656  I can't INTERSECT or UNION those quite well because they\n1657  have different kind of meanings.\n1658  They're different kinds of things.\n1659  So if you're trying to JOIN multiple thing-- trying to JOIN multiple tables\n1660  or INTERSECT multiple tables, make sure you always\n1661  have those same column names and those same column types--\n1662  the type of data that's stored inside."}], "module": "M1"}, {"id": "R1-10", "type": "quick", "front": "What does a NATURAL JOIN do, and what is its risk?", "back": "It joins on every column whose name appears in both tables and keeps one copy of it. If another shared name appears later, the join silently changes.", "source": [{"file": "lecture1", "lines": "1380-1399", "quote": "A NATURAL JOIN kind of allows me to omit the part of my previous JOINs", "text": "1380  OK, let's show one final type of JOIN here, this one called a NATURAL JOIN.\n1381  A NATURAL JOIN kind of allows me to omit the part of my previous JOINs\n1382  where I was saying \"migrations\" dot \"id\" = \"sea_lions\" dot \"id\".\n1383  NATURAL JOIN says, both these columns are called \"id\".\n1384  I could just assume that I want you to JOIN by these two columns.\n1385  So let's try a NATURAL JOIN and see what we get back.\n1386  I'll come back over here.\n1387  And we'll try a NATURAL JOIN with our sea lions table\n1388  and our migrations table.\n1389  I'll say SELECT * FROM \"sea_lions\".\n1390  Then I'll NATURAL JOIN \"migrations\" here.\n1391  And I no longer need to say \"migrations\" dot \"id\" = \"sea_lions\" dot \"id\".\n1392  I can just hit semicolon, and now I can hit Enter.\n1393  So we'll see that the JOIN worked just as we wanted it to.\n1394  And we didn't even have to specify which id column corresponded\n1395  to which other id column because these were named the same column name id.\n1396  Notice, too, we don't get a duplicate id column.\n1397  In some prior JOINs, we had an id column here and an id column here.\n1398  Now, we've just combined them into one single column,\n1399  or we've only kept one column among this JOIN here."}], "module": "M1"}, {"id": "R1-11", "type": "debug", "ref": "D1-01", "module": "M1", "source": []}, {"id": "R1-12", "type": "debug", "ref": "D1-04", "module": "M1", "source": []}, {"id": "R1-13", "type": "write", "ref": "M1-E08", "module": "M1", "source": []}, {"id": "R1-14", "type": "write", "ref": "M1-E18", "module": "M1", "source": []}, {"id": "R2-01", "type": "quick", "front": "What does it mean to *normalize* a database?", "back": "Reduce redundancy by putting each entity (riders, stations, …) in its own table, so that every column of a table describes only that entity.", "source": [{"file": "lecture2", "lines": "245-262", "quote": "To normalize means to reduce redundancies", "text": " 245  the process we're going through is one called normalizing.\n 246  We're normalizing our data.\n 247  To normalize means to reduce redundancies, effectively,\n 248  to take a table--\n 249  take one table, for instance, split up into multiple,\n 250  and have each entity be part of its very own table.\n 251  Some academics in the world have named different normal forms, quote unquote.\n 252  There's like first normal form, second normal form, third normal form,\n 253  this progression of making your day more and more efficient.\n 254  You can use those as heuristics.\n 255  But end of the day, a few principles might apply.\n 256  First, take your entities, like in this case stations and riders,\n 257  and put them each in their own table.\n 258  And if you add more data, make sure that if I were to add a column, let's say,\n 259  to riders, it is only a data point about riders--\n 260  not about stations, not about fares, only about riders.\n 261  And that process can help us make a data set that\n 262  is more dynamic, more easy to reproduce, and more easy to write queries on."}], "module": "M2"}, {"id": "R2-02", "type": "concept", "question": "Riders visit many stations and stations have many riders. What implements this relationship?", "choices": ["A rider_ids column in stations", "A junction table such as visits(rider_id, station_id)", "A UNIQUE constraint", "A composite primary key on riders"], "answer": 1, "why": "Many-to-many relationships need an associative (junction) table holding pairs of ids.", "source": [{"file": "lecture2", "lines": "425-438", "quote": "a junction table, an associative entity, a join table", "text": " 425  So let me try making a table to implement\n 426  this many to many relationship.\n 427  And if you remember, we might call this kind of table a junction table,\n 428  an associative entity, a join table.\n 429  It has a lot of names, but it looks a bit like this.\n 430  I'll create this new table to represent, let's say, visits.\n 431  A rider visits a station.\n 432  So I'll call this table visits.\n 433  And inside, I'll make sure it has two columns, one for a rider\n 434  ID to represent a rider, and one, let's say, for a station ID,\n 435  to represent a station.\n 436  Now when I see a rider ID next to a station ID in this table,\n 437  I'll know the rider with that certain ID visited\n 438  the station with that certain ID."}], "module": "M2"}, {"id": "R2-03", "type": "quick", "front": "Name SQLite's 5 storage classes and its 5 type affinities.", "back": "Storage classes (values): NULL, INTEGER, REAL, TEXT, BLOB. Affinities (columns): TEXT, NUMERIC, INTEGER, REAL, BLOB.", "source": [{"file": "lecture2", "lines": "599-611", "quote": "type affinities are now associated with individual columns", "text": " 599  Now there are, let's say five type affinities in SQLite--\n 600  text.\n 601  Columns can be of the type affinity text,\n 602  meaning they store just characters at the end of the day.\n 603  There's also numeric, which stores either integer values or real values,\n 604  depending on which one seems best to convert to.\n 605  You have integer type affinity, which means it can store whole numbers.\n 606  Real, to store floating points or decimal values.\n 607  And we have blob here again, our old friend\n 608  to store binary exactly as we get it.\n 609  So whereas before we were talking about storage classes--\n 610  those are associated with individual values--\n 611  type affinities are now associated with individual columns."}], "module": "M2"}, {"id": "R2-04", "type": "predict", "db": null, "setup": "CREATE TABLE \"t\" (\"amount\" INTEGER);\nINSERT INTO \"t\" VALUES ('25');\n", "sql": "SELECT typeof(\"amount\") FROM \"t\";", "choices": ["text", "integer", "real", "ERROR: datatype mismatch"], "answer": 1, "why": "The INTEGER affinity converts the text '25' to the integer 25.", "source": [{"file": "lecture2", "lines": "632-634", "quote": "Now I'll have 25 as an integer.", "text": " 632  Let's try this.\n 633  25, some text again I'll insert it into this table.\n 634  Now I'll have 25 as an integer."}], "module": "M2"}, {"id": "R2-05", "type": "predict", "db": null, "setup": "CREATE TABLE \"t\" (\"amount\" INTEGER);\nINSERT INTO \"t\" VALUES ('red line');\n", "sql": "SELECT typeof(\"amount\") FROM \"t\";", "choices": ["text", "integer", "null", "ERROR: datatype mismatch"], "answer": 0, "why": "An affinity is a preference, not a rule. Text that can't be converted is stored as TEXT. (MySQL would reject it, lecture6 L844-852.)", "source": [{"file": "lecture6", "lines": "844-852", "quote": "But if it couldn't, it would actually just store text.", "text": " 844  One difference though is that SQLite will\n 845  allow you to add in some value that doesn't actually\n 846  have the type of that given column.\n 847  So if I had a SQLite column of type text or of type, let's say, type numeric\n 848  and I added some text, it would try to convert.\n 849  But if it couldn't, it would actually just store text.\n 850  MySQL is more strict than that.\n 851  It will make sure you have the proper type when\n 852  you insert some new rows, at least by default. OK, great questions here."}], "module": "M2"}, {"id": "R2-06", "type": "concept", "question": "Why did the class favour INTEGER (cents) over REAL for fares?", "choices": ["REAL uses more disk", "Integers are represented exactly, so sums stay exact", "REAL can't be negative", "SQLite has no REAL"], "answer": 1, "why": "Floating-point values like 0.10 are stored approximately, and the errors add up over many fares.", "source": [{"file": "lecture2", "lines": "563-571", "quote": "you know you can precisely represent integers", "text": " 563  So if I go back to some slides here, you might argue for the integer\n 564  because you know you can precisely represent integers.\n 565  And let's say I want to add up fares over a lot, a lot of riders.\n 566  This might be useful for me because I know that each number will\n 567  be perfectly, precisely represented.\n 568  I can do lots of big kind of math with this number here.\n 569  To your point, this decimal might kind of, as you said,\n 570  get wonky later on towards the later decimal points.\n 571  I might get some unexpected results if we add up these overall."}], "module": "M2"}, {"id": "R2-07", "type": "concept", "question": "Which constraints does `PRIMARY KEY(\"id\")` already imply (for an INTEGER id)?", "choices": ["UNIQUE only", "NOT NULL only", "UNIQUE and NOT NULL", "CHECK and DEFAULT"], "answer": 2, "why": "A primary key must be unique and present, so adding them again is redundant.", "source": [{"file": "lecture2", "lines": "1016-1022", "quote": "A primary key, for instance, must not be null, it must be unique", "text": "1016  CARTER ZENKE: That is true.\n1017  So when you use a primary key or a foreign key constraint,\n1018  there are other constraints that go along with that constraint.\n1019  A primary key, for instance, must not be null, it must be unique, and so on.\n1020  So it would be redundant to apply that again,\n1021  to say that this primary key should be unique or not null.\n1022  Good clarification there."}], "module": "M2"}, {"id": "R2-08", "type": "predict", "db": null, "setup": "CREATE TABLE \"t\" (\"x\");\nINSERT INTO \"t\" VALUES ('10');\n", "sql": "SELECT typeof(\"x\") FROM \"t\";", "choices": ["integer", "text", "numeric", "blob"], "answer": 1, "why": "A column with no declared type has BLOB (\"no\") affinity, so nothing is converted. Lecture 2 says NUMERIC, which is errata", "source": [{"file": "lecture2", "lines": "1338-1347", "quote": "the default type affinity is numeric in this case", "text": "1338  CARTER ZENKE: Yeah, great question.\n1339  So you're asking if I didn't tell SQLite what kind of type affinity\n1340  a column had, what type of affinity would it actually have?\n1341  A great question.\n1342  In this case, by default, SQLite gives the numeric type affinity,\n1343  where numeric can store integers or real values.\n1344  But if you give it like a string of text, like let's say red line,\n1345  it will store that for you, too, kind of non-intuitively, but it will.\n1346  But the default type affinity is numeric in this case,\n1347  if you don't otherwise specify."}], "module": "M2"}, {"id": "R2-09", "type": "predict", "db": null, "setup": "CREATE TABLE \"cards\" (\"id\" INTEGER, PRIMARY KEY(\"id\"));\nCREATE TABLE \"swipes\" (\"card_id\" INTEGER, FOREIGN KEY(\"card_id\") REFERENCES \"cards\"(\"id\"));\nINSERT INTO \"swipes\" VALUES (NULL);\n", "sql": "SELECT COUNT(*) FROM \"swipes\";", "choices": ["0", "1", "ERROR: FOREIGN KEY constraint failed", "ERROR: NOT NULL constraint failed"], "answer": 1, "why": "A NULL foreign key references nothing and is accepted. Add NOT NULL if the link is mandatory (errata", "source": [{"file": "lecture2", "lines": "968-978", "quote": "This would be in this case, redundant.", "text": " 968  You might also think, could I do it for rider ID and station ID?\n 969  Should I include not null here?\n 970  Rider ID, not null, station ID, not null.\n 971  Well, that would be a good thought, but again, we're\n 972  taken care of by our table constraint using our foreign key here.\n 973  Again, this constraint will say, if rider ID doesn't already\n 974  exist in the ID column of rider's, I can't insert that value.\n 975  And we could probably presume that if rider's ID is a primary key,\n 976  well, null will not be part of this column,\n 977  and therefore, I already can't insert null for rider ID or station ID.\n 978  This would be in this case, redundant."}], "module": "M2"}, {"id": "R2-10", "type": "debug", "ref": "D2-02", "module": "M2", "source": []}, {"id": "R2-11", "type": "write", "ref": "M2-E12", "module": "M2", "source": []}, {"id": "R3-01", "type": "quick", "front": "Syntax of a multi-row INSERT, and its two advantages?", "back": "`INSERT INTO t (a, b) VALUES (1, 2), (3, 4);`. It is more convenient and usually faster than many single INSERTs, and it is all-or-nothing if a row breaks a constraint.", "source": [{"file": "lecture3", "lines": "324-330", "quote": "this is not just a manner of convenience", "text": " 324  And it's worth noting, this is not just a manner of convenience.\n 325  Like if I tried to insert 100 rows, this is certainly convenient for me.\n 326  But it's also most often in most cases going\n 327  to be faster for me to insert 100 rows in one go,\n 328  than to insert one row 100 times.\n 329  So this is both a convenience thing for programmers\n 330  and also an efficiency thing to actually optimize your database as well."}], "module": "M3"}, {"id": "R3-02", "type": "predict", "db": "mfa", "sql": "INSERT INTO \"collections\" (\"title\", \"accession_number\") VALUES ('A', 'x1'), ('B', '56.257');\nSELECT COUNT(*) FROM \"collections\";\n", "choices": ["4", "5", "6", "ERROR: UNIQUE constraint failed"], "answer": 3, "why": "The second row duplicates an accession number. The statement fails, and neither row is inserted.", "source": [{"file": "lecture3", "lines": "632-638", "quote": "then we won't actually insert any of those rows", "text": " 632  SPEAKER 7: What happens if one of the rows you're trying to insert\n 633  violates a constraint on the table?\n 634  SPEAKER 1: Yeah, so here we're inserting multiple rows.\n 635  And if one actually violates some constraint,\n 636  then we won't actually insert any of those rows.\n 637  And this is because this insert is bundled inside\n 638  of a transaction, which we'll learn more about later on in the course."}], "module": "M3"}, {"id": "R3-03", "type": "quick", "front": "Two ways to import a CSV with `.import`, and when to use each?", "back": "`.import --csv --skip 1 file.csv existing_table` when the columns match the table. `.import --csv file.csv new_table` (the header names the columns), then `INSERT INTO real (...) SELECT ... FROM new_table;` and `DROP TABLE new_table;` when they don't (e.g. no id column).", "source": [{"file": "lecture3", "lines": "604-605", "quote": "one to import into an existing table and one to import into a brand new table", "text": " 604  OK, so we've seen several versions of import, one\n 605  to import into an existing table and one to import into a brand new table."}], "module": "M3"}, {"id": "R3-04", "type": "concept", "question": "`id INTEGER PRIMARY KEY AUTOINCREMENT`; rows 1, 2, 3 exist; you delete row 3 and insert a new row. Its id?", "choices": ["3", "4", "1", "NULL"], "answer": 1, "why": "AUTOINCREMENT never reuses an id, not even the deleted maximum. Without AUTOINCREMENT you would get 3 (max + 1). Lecture 3 states this backwards (errata", "source": [{"file": "lecture3", "lines": "1077-1087", "quote": "autoincrement", "text": "1077  I could if I wanted to get more specific,\n1078  and if I had done in my id integer column here in my [? create ?]\n1079  [? table, ?] if I had also said this [? keyword ?] [? call ?]\n1080  [? autoincrement, ?] all one word, what would happen instead is I would\n1081  actually reinsert an ID that is not used.\n1082  So in this case 3 is not used, I could insert that one here.\n1083  So up to you what you want to do.\n1084  In general, SQlite by default will take the highest ID, add one from there.\n1085  If you specify this constraint [? called ?] [? autoincrement, ?] you\n1086  will instead take whatever id is not being used and use that in your insert\n1087  afterwards."}], "module": "M3"}, {"id": "R3-05", "type": "predict", "db": "mfa", "sql": "DELETE FROM \"collections\" WHERE \"acquired\" < '1912-01-01';\nSELECT \"title\" FROM \"collections\" ORDER BY \"id\";\n", "choices": ["Profusion of Flowers; Spring Outing", "Imaginative Landscape; Profusion of Flowers; Spring Outing", "Spring Outing", "(no rows)"], "answer": 1, "why": "Farmers (1911) is deleted. `NULL < date` is not true, so Imaginative Landscape stays.", "source": [{"file": "lecture3", "lines": "798-808", "quote": "And I can use these same operators with dates.", "text": " 798  I'll say WHERE the \"acquired\" column is less than some date that I'll give.\n 799  And here, I'll give 1909-01-01.\n 800  It turns out that SQLite has a few ways to represent dates.\n 801  One of which is this format that follows the YYYY or the year,\n 802  four digits, and then dash, and then MM or the month with two digits,\n 803  and then dash again, DD, in this case, the day in two digits.\n 804  So 1909-01-01 means January 1st, 1909.\n 805  And I can use these same operators with dates.\n 806  I could say greater than, or less than, or equal to this particular date.\n 807  And SQLite will be able to parse this for me to understand what I mean,\n 808  which is earlier than 1909."}], "module": "M3"}, {"id": "R3-06", "type": "concept", "question": "Which ON DELETE action turns \"delete the artist, then their links\" into one step?", "choices": ["RESTRICT", "NO ACTION", "SET NULL", "CASCADE"], "answer": 3, "why": "CASCADE deletes the referencing rows automatically. SET NULL would keep them with artist_id = NULL.", "source": [{"file": "lecture3", "lines": "1010-1013", "quote": "Or perhaps, most compellingly, I could try to CASCADE the deletion.", "text": "1010  Or perhaps, most compellingly, I could try to CASCADE the deletion.\n1011  Where CASCADE means if I delete the artist, for instance,\n1012  let's also delete their affiliation with their artwork all in one go.\n1013  This converts our 2-step process into a 1-step process."}], "module": "M3"}, {"id": "R3-07", "type": "predict", "db": "votes", "sql": "UPDATE \"votes\" SET \"title\" = upper(trim(\"title\"));\nSELECT COUNT(DISTINCT \"title\") FROM \"votes\";\n", "choices": ["4", "9", "12", "20"], "answer": 1, "why": "trim and upper merge the whitespace and case variants, but the typos remain as their own groups: FAMERS…, FARMESR…, FARMERS WORKING, IMAGINTIVE…, and PROFUSION. That gives 4 + 5 = 9.\n", "source": [{"file": "lecture3", "lines": "1330-1339", "quote": "But there's still some typos", "text": "1330  But now, I want to group by.\n1331  So let's try this.\n1332  I'll go up arrow to get back to my old query that GROUP BY \"title,\" hit Enter.\n1333  And now, we're still making some more progress.\n1334  I'm reducing my number of groups until I get to 4.\n1335  But there's still some typos, like we see Famers working at dawn,\n1336  or Farmers working, or Farmesr working at dawn.\n1337  We want these to be included as part of this group--\n1338  Farmers working at dawn.\n1339  So we should fix some of these typos here."}], "module": "M3"}, {"id": "R3-08", "type": "concept", "question": "In a `BEFORE DELETE` trigger, how do you refer to the title of the row being deleted?", "choices": ["NEW.title", "OLD.title", "DELETED.title", "title"], "answer": 1, "why": "OLD is the row being removed. NEW exists only for INSERT and UPDATE.", "source": [{"file": "lecture3", "lines": "1604-1608", "quote": "So old.title gives me access to the old row", "text": "1604  Well, I should insert the old title, and actually, in triggers,\n1605  you get access to this keyword called old.\n1606  This is the title that we've just deleted from our collection.\n1607  So old.title gives me access to the old row, the row we deleted,\n1608  its title column in particular."}], "module": "M3"}, {"id": "R3-09", "type": "predict", "db": null, "setup": "CREATE TABLE \"c\" (\"accession_number\" TEXT);\nINSERT INTO \"c\" VALUES (06.1899);\n", "sql": "SELECT \"accession_number\" FROM \"c\";", "choices": ["06.1899", "6.1899", "ERROR: syntax error", "6"], "answer": 1, "why": "Unquoted, 06.1899 is a number. The TEXT column stores its text form, and the leading zero is gone. Quote identifiers that look numeric (errata", "source": [{"file": "lecture3", "lines": "357-359", "quote": "Now, I'll say the", "text": " 357  This next one we acquired is called \"Peonies and butterfly.\"\n 358  Now, I'll say the [? accession ?] [? number ?] is 06.1899.\n 359  And we got this one-- it was back in 1906-01-01 now I'll hit semicolon here."}], "module": "M3"}, {"id": "R3-10", "type": "quick", "front": "What is a soft delete, and one ethical concern?", "back": "Marking a row as deleted (e.g. deleted = 1) instead of removing it. For personal data it may not honour a user's request to be forgotten (GDPR).", "source": [{"file": "lecture3", "lines": "1774-1784", "quote": "and the right to be forgotten", "text": "1774  We can still recover it later on, but it also has some tricky ethical questions,\n1775  too.\n1776  Like it's OK if we're talking about artwork here,\n1777  but if you're talking about user data, is it right to only soft delete it\n1778  if they ask you to delete it?\n1779  Particularly in conversation with new frameworks like GDPR,\n1780  and the right to be forgotten, and so on, it's up to you\n1781  as a programmer to make the right decision here.\n1782  When should you find data that [INAUDIBLE] and actually delete it,\n1783  or when is it better to just soft delete it and keep it around\n1784  in case you need it for later?"}], "module": "M3"}, {"id": "R3-11", "type": "debug", "ref": "D3-06", "module": "M3", "source": []}, {"id": "R3-12", "type": "write", "ref": "M3-E14", "module": "M3", "source": []}, {"id": "R4-01", "type": "quick", "front": "Define a view, and give the four uses from the lecture.", "back": "A virtual table defined by a query. Uses: simplify, aggregate, partition, secure.\n", "source": [{"file": "lecture4", "lines": "97-105", "quote": "You could use it to simplify your data", "text": "  97  Well, you might want to for a few reasons here.\n  98  You could use it to simplify your data, as we just saw here.\n  99  You can use it to aggregate your data, to try to sum up some values\n 100  and store that in a single table.\n 101  You could use it to partition your data, or divide it into logical pieces.\n 102  And you could even use it to secure your data,\n 103  to perhaps hide some columns you don't want somebody to see.\n 104  There are more reasons, too, to use views.\n 105  We'll focus on these four today."}], "module": "M4"}, {"id": "R4-02", "type": "concept", "question": "Lifetimes. Which construct exists only for the duration of one query?", "choices": ["VIEW", "TEMPORARY VIEW", "CTE (WITH …)", "INDEX"], "answer": 2, "why": "A view lasts until dropped, a temporary view lasts until the connection closes, and a CTE lasts for one statement.", "source": [{"file": "lecture4", "lines": "636-638", "quote": "But a CTE exists for a single query.", "text": " 636  So a regular view, as we saw before, exists forever in my schema.\n 637  A temporary view exists for a single connection.\n 638  But a CTE exists for a single query."}], "module": "M4"}, {"id": "R4-03", "type": "predict", "db": "longlist", "setup": "CREATE VIEW \"v\" AS SELECT COUNT(*) AS \"n\" FROM \"ratings\" WHERE \"book_id\" = 2;\nINSERT INTO \"ratings\" (\"book_id\", \"rating\") VALUES (2, 5);\n", "sql": "SELECT \"n\" FROM \"v\";", "choices": ["176", "177", "ERROR: view is stale"], "answer": 1, "why": "A view re-runs its query every time, so it always reflects the current data.", "source": [{"file": "lecture4", "lines": "519-526", "quote": "Every time I query this view", "text": " 519  Well, if I'm a data analyst and I come back in a little later\n 520  and I want to find the updated rating, I can do it just again,\n 521  by selecting from, selecting star, from average book ratings like this,\n 522  average book ratings.\n 523  Hit Enter.\n 524  And now I see perhaps some updated averages as well.\n 525  Every time I query this view, I'll rerun essentially that query from before.\n 526  And now I'll see the updated averages for each book."}], "module": "M4"}, {"id": "R4-04", "type": "predict", "db": "longlist", "setup": "CREATE VIEW \"2021\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2021;\n", "sql": "DELETE FROM \"2021\" WHERE \"id\" = 34;", "choices": ["(no rows)", "ERROR: cannot modify 2021 because it is a view"], "answer": 1, "why": "SQLite views are read-only unless an INSTEAD OF trigger handles the write.", "source": [{"file": "lecture4", "lines": "837-838", "quote": "cannot modify 2021 because it is", "text": " 837  And if I do this, I get this error, cannot modify 2021 because it is\n 838  a view."}], "module": "M4"}, {"id": "R4-05", "type": "concept", "question": "You give an analyst the rideshare.db file with an anonymizing view. What stops them reading rider names?", "choices": ["The view hides the base table", "Nothing. SQLite has no per-user access control", "PRAGMA secure_delete", "Temporary views"], "answer": 1, "why": "In SQLite you give access to the whole file or nothing. Real access control needs MySQL/PostgreSQL GRANT.", "source": [{"file": "lecture4", "lines": "962-968", "quote": "I either give you", "text": " 962  And this is a downside of SQLite.\n 963  In SQLite we can't set access controls, meaning I either give you\n 964  the entire database or nothing at all.\n 965  In other DBMSes though, I could set access controls.\n 966  I could give David access only to the analysis view.\n 967  I can give myself access to both the rides table and the analysis view.\n 968  So keep that in mind when you're working with SQLite."}], "module": "M4"}, {"id": "R4-06", "type": "quick", "front": "How does an INSTEAD OF INSERT trigger choose between \"re-activate\" and \"insert new\"?", "back": "Two triggers with complementary WHEN conditions: `WHEN NEW.accession_number IN (SELECT …)` updates deleted = 0, and `WHEN … NOT IN (…)` inserts a new row.", "source": [{"file": "lecture4", "lines": "1236-1242", "quote": "one that runs when the item is already in our table", "text": "1236  I could say for each row when some condition is true run this trigger.\n1237  And you can imagine having two triggers to insert\n1238  into our view, one that runs when the item is already in our table.\n1239  We could then flip that bit from a 1 to a 0.\n1240  We could also have a different trigger to actually insert a new item.\n1241  In that case, actually inserting a brand new row\n1242  to our underlying collections table."}], "module": "M4"}, {"id": "R4-07", "type": "predict", "db": "longlist", "sql": "WITH \"a\" AS (SELECT 1 AS \"x\"), \"b\" AS (SELECT \"x\" + 1 AS \"y\" FROM \"a\")\nSELECT \"y\" FROM \"b\";\n", "choices": ["1", "2", "ERROR: no such table: a"], "answer": 1, "why": "A later CTE can use an earlier one. Separate CTEs with commas, with no comma after the last.", "source": [{"file": "lecture4", "lines": "642-646", "quote": "I could then optionally follow it up with more CTEs", "text": " 642  To do so, I would say with and give it some name, as and then\n 643  inside these parentheses say the query I want to be this CTE here.\n 644  I could then optionally follow it up with more CTEs for this same query.\n 645  Or I could omit the comma, and then use just select from the name of a CTE\n 646  up above."}], "module": "M4"}, {"id": "R4-08", "type": "debug", "ref": "D4-02", "module": "M4", "source": []}, {"id": "R4-09", "type": "write", "ref": "M4-E13", "module": "M4", "source": []}, {"id": "R5-01", "type": "quick", "front": "SCAN vs SEARCH in EXPLAIN QUERY PLAN?", "back": "SCAN reads every row of the table (or index) in order. SEARCH uses an index (or the primary key) to jump straight to matching rows.", "source": [{"file": "lecture5", "lines": "328-332", "quote": "The plan is to scan movies", "text": " 328  But now if I try EXPLAIN QUERY PLAN SELECT * from \"movies\" WHERE \"title\"\n 329  = 'Cars' semicolon, I'll see that the plan is not to use the index.\n 330  The plan is to scan movies, where scan, we saw before,\n 331  means to go top to bottom through that title column\n 332  and find me all the rows that have Cars in them."}], "module": "M5"}, {"id": "R5-02", "type": "predict", "db": "movies", "sql": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"id\" = 114709;", "choices": ["SCAN movies", "SEARCH movies USING INTEGER PRIMARY KEY (rowid=?)", "SEARCH movies USING INDEX title_index (title=?)"], "answer": 1, "why": "Primary keys are indexed automatically, so no CREATE INDEX is needed.", "source": [{"file": "lecture5", "lines": "427-430", "quote": "using integer primary key", "text": " 427  But then up here I'm finally going to search movies\n 428  using integer primary key.\n 429  Some index is automatically created for me\n 430  as we saw before for my primary keys."}], "module": "M5"}, {"id": "R5-03", "type": "concept", "question": "What makes an index *covering* for a query?", "choices": ["It has more than one column", "It contains every column the query needs from that table, so no table lookup", "It is on the primary key", "It has a WHERE clause"], "answer": 1, "why": "Multi-column is common but not sufficient. What matters is that the query never has to go back to the table.", "source": [{"file": "lecture5", "lines": "483-488", "quote": "It's one in which the query data can be found only by searching the index.", "text": " 483  A covering index, it turns out, is still an index.\n 484  It's the same kind of idea, but it is one\n 485  in which we have all the data we need inside the index itself.\n 486  It's one in which the query data can be found only by searching the index.\n 487  There's no need for me to go from the index to the table.\n 488  I can just look it up in the index."}], "module": "M5"}, {"id": "R5-04", "type": "concept", "question": "Two costs of an index (lecture's B-tree discussion)?", "choices": ["More disk space and slower INSERT/UPDATE/DELETE", "Slower SELECTs and less space", "It locks the table forever", "It disables foreign keys"], "answer": 0, "why": "An index is a sorted copy plus pointers, which costs space, and every write must also update the tree.", "source": [{"file": "lecture5", "lines": "852-857", "quote": "if I want to insert something into this structure, it'll take me more time", "text": " 852  There's also one more trade-off, which is\n 853  if I want to insert something into this structure, it'll take me more time.\n 854  I have to navigate this structure here.\n 855  I have to figure out should it come before this value or after this value?\n 856  And I'll have to traverse this tree every time verses\n 857  without an index I could just add something to the end of this list."}], "module": "M5"}, {"id": "R5-05", "type": "predict", "db": "movies", "setup": "CREATE INDEX \"recents\" ON \"movies\" (\"title\") WHERE \"year\" = 2023;\n", "sql": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"year\" = 1998;", "choices": ["SCAN movies", "SCAN movies USING COVERING INDEX recents", "SEARCH movies USING INDEX recents"], "answer": 0, "why": "1998 rows aren't in the partial index, so it can't be used.", "source": [{"file": "lecture5", "lines": "917-924", "quote": "Now I'm only back to scanning movies.", "text": " 917  I would try EXPLAIN QUERY PLAN.\n 918  And let me try SELECT \"title\" FROM \"movies\" where the year = 1998\n 919  like this.\n 920  And see now I'm only back to scanning movies.\n 921  So before in my prior query I was able to use the index\n 922  because my WHERE clause included 2023.\n 923  Now though I'm using 1998, which were rows that were not\n 924  included in this partial index."}], "module": "M5"}, {"id": "R5-06", "type": "concept", "question": "You DROP three large indexes. What happens to the database file size?", "choices": ["Shrinks immediately", "Unchanged until VACUUM", "Grows", "The file is deleted"], "answer": 1, "why": "Freed pages are only marked reusable. VACUUM returns them to the OS.", "source": [{"file": "lecture5", "lines": "996-999", "quote": "we don't actually shrink our database file", "text": " 996  If you remember here when we delete an index-- we drop the index,\n 997  we don't actually shrink our database file.\n 998  We just mark those bits that were part of the index as being\n 999  available for re-use."}], "module": "M5"}, {"id": "R5-07", "type": "quick", "front": "Spell out ACID in one line each.", "back": "Atomicity, all or nothing. Consistency, never violate constraints. Isolation, concurrent transactions don't interfere. Durability, committed data survives crashes.", "source": [{"file": "lecture5", "lines": "1110-1127", "quote": "A stands for atomicity", "text": "1110  In fact, A stands for atomicity, which means I can't break a transaction down\n1111  into smaller pieces.\n1112  I can't break a transaction between Alice and Bob\n1113  into Bob's update and then Alice's update.\n1114  It's just update both accounts at the same time.\n1115  Consistency means a transaction to help me ensure that I\n1116  don't violate some database constraint.\n1117  Let's say I try to pay Bob from Alice's account,\n1118  but Alice doesn't have the money.\n1119  If that is the case, a transaction will revert, undo.\n1120  So I go back to being in this consistent state for my database.\n1121  Isolation means if I have more than one person trying to access\n1122  this database, their queries--\n1123  their transactions won't interfere with each other.\n1124  And then finally, durability means if I were to unplug this database\n1125  or we were to encounter a power failure or the server to crash,\n1126  all that data would still be there from the time we committed our transaction\n1127  or saved the results there."}], "module": "M5"}, {"id": "R5-08", "type": "predict", "db": "bank", "sql": "BEGIN TRANSACTION;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2;\nROLLBACK;\nSELECT \"balance\" FROM \"accounts\" WHERE \"id\" = 2;\n", "choices": ["20", "30", "ERROR: cannot rollback"], "answer": 0, "why": "ROLLBACK undoes everything since BEGIN.", "source": [{"file": "lecture5", "lines": "1263-1267", "quote": "think about it as if this transaction never even", "text": "1263  There's a technical name for this, which is rolling back.\n1264  So if I ever want to not save the changes in this transaction,\n1265  I can say ROLLBACK.\n1266  Go back to the beginning, think about it as if this transaction never even\n1267  happened at all."}], "module": "M5"}, {"id": "R5-09", "type": "concept", "question": "Which SQLite lock lets many connections read at once?", "choices": ["EXCLUSIVE", "SHARED", "UNLOCKED"], "answer": 1, "why": "SHARED is for readers. A writer needs EXCLUSIVE, which blocks everyone else.", "source": [{"file": "lecture5", "lines": "1476-1479", "quote": "A shared lock means I'm only reading.", "text": "1476  They're able to read the database but also\n1477  it's to allow others to read as well.\n1478  A shared lock means I'm only reading.\n1479  You too could read as well."}], "module": "M5"}, {"id": "R5-10", "type": "debug", "ref": "D5-01", "module": "M5", "source": []}, {"id": "R5-11", "type": "write", "ref": "M5-E03", "module": "M5", "source": []}, {"id": "R6-01", "type": "concept", "question": "How many values can a MySQL `TINYINT` (signed) hold at most, and why does it matter?", "choices": ["127 (1 byte), so pick the smallest type that safely fits", "255 always", "2^31", "Unlimited"], "answer": 0, "why": "Signed TINYINT is −128…127. More bytes count higher, and fewer bytes save space.", "source": [{"file": "lecture6", "lines": "227-233", "quote": "You could see for a tiny int we can only count up to 127.", "text": " 227  So if I take a look at this table here, each data type\n 228  has a range of values that it could possibly store.\n 229  If I'm talking about both negative and positive values,\n 230  here's the range for each of these data types.\n 231  You could see for a tiny int we can only count up to 127.\n 232  And that is it.\n 233  We cannot count higher using a single byte."}], "module": "M6"}, {"id": "R6-02", "type": "concept", "question": "A station has exactly one line, from a fixed list. Which MySQL type fits best?", "choices": ["SET", "ENUM", "TEXT", "BLOB"], "answer": 1, "why": "ENUM allows exactly one value from the list, and SET allows several.", "source": [{"file": "lecture6", "lines": "423-432", "quote": "Now, set complements enum.", "text": " 423  Now, set complements enum.\n 424  Enum means I can only have one of these options.\n 425  If I had xs, x, s, m and so on for t-shirt sizes, I can only choose one.\n 426  But a set will allow me to choose more than one to store in that same cell.\n 427  You could think of, for example, movie genres.\n 428  A movie isn't just a horror, or a fiction.\n 429  Or it isn't just comedy.\n 430  It could be all of those together.\n 431  And so set would allow you to choose not just one option from your list,\n 432  but multiple and put it inside of that single cell there."}], "module": "M6"}, {"id": "R6-03", "type": "concept", "question": "What range does `DECIMAL(5,2)` store?", "choices": ["−999.99 to 999.99", "−99999.99 to 99999.99", "−9999.9 to 9999.9", "0 to 5.2"], "answer": 0, "why": "5 total digits, 2 of them after the point. (The lecture's spoken \"5 comma 1\" is a slip, errata", "source": [{"file": "lecture6", "lines": "656-661", "quote": "And one type for this will be the decimal type", "text": " 656  And one type for this will be the decimal type, where I can use a decimal\n 657  and then say, I want to store a certain number of digits\n 658  with some number coming after the decimal point.\n 659  Now, for example, I could say decimal 5 comma 1.\n 660  And I could store any number between negative 999.99 up to 999.99\n 661  so long as there are only two places after the decimal here."}], "module": "M6"}, {"id": "R6-04", "type": "quick", "front": "Identifier quoting in SQLite vs MySQL vs PostgreSQL?", "back": "SQLite: double quotes. MySQL: backticks. PostgreSQL: double quotes.", "source": [{"file": "lecture6", "lines": "1320-1323", "quote": "Well, in Postgres you have double quotes for your identifiers here.", "text": "1320  Well, it seems like these double quotes are back in Postgres.\n1321  So in MySQL you had back ticks.\n1322  In SQLite you had double quotes.\n1323  Well, in Postgres you have double quotes for your identifiers here."}], "module": "M6"}, {"id": "R6-05", "type": "quick", "front": "Why change the DELIMITER before CREATE PROCEDURE in MySQL?", "back": "The body contains `;`. The client would end the statement at the first one, so you switch the delimiter (e.g. to `//`) while defining the procedure.", "source": [{"file": "lecture6", "lines": "1049-1058", "quote": "temporarily declare a different delimiter", "text": "1049  Well, to end a SQL statement, we have to have a semicolon.\n1050  But MySQL might actually prematurely end this statement.\n1051  If I type quit procedure name begin some statement then a semicolon,\n1052  it'll say, OK, you're done.\n1053  But I'm actually not.\n1054  I might want to add more statements.\n1055  I might want to conclude with this end down here.\n1056  So a workaround is to temporarily declare a different delimiter.\n1057  Instead of ending my queries with a semicolon here,\n1058  I'll end them with, let's say, slash slash."}], "module": "M6"}, {"id": "R6-06", "type": "concept", "question": "Synchronous vs asynchronous replication. Which is right for a bank's ledger?", "choices": ["Asynchronous: faster", "Synchronous: the leader confirms only after the follower has the data", "Neither; use sharding", "Leaderless only"], "answer": 1, "why": "Synchronous is slower but guarantees the copy exists. Asynchronous risks losing acknowledged writes, which is acceptable for a lost tweet, not for money.", "source": [{"file": "lecture6", "lines": "1700-1706", "quote": "You might use this, though, if you're working in finance or healthcare", "text": "1700  And maybe my application shouldn't wait around that long.\n1701  You might use this, though, if you're working in finance or healthcare, where\n1702  you have to be doubly sure you have data stored exactly as you want it to be.\n1703  But if you're like a social media site, like a Facebook or a Twitter,\n1704  I mean, maybe you don't care if you lose a tweet every once in a while.\n1705  It's OK.\n1706  So maybe synchronous isn't the best, most ideal scenario for that as well."}], "module": "M6"}, {"id": "R6-07", "type": "concept", "question": "Names A-I, J-R, S-Z are sharded on three servers. What two risks does the lecture name?", "choices": ["Hotspots (one shard overloaded) and a single point of failure without replication", "Slower writes and type errors", "Deadlocks and VACUUM", "None"], "answer": 0, "why": "Shard keys should spread load evenly, and each shard should be replicated.", "source": [{"file": "lecture6", "lines": "1763-1784", "quote": "The goal is to really to avoid what we call a hotspot", "text": "1763  Now, there's a lot of thought that goes behind the best way to shard your data.\n1764  The goal is to really to avoid what we call a hotspot, wherein one database\n1765  server becomes more frequently accessed or requested than others.\n1766  Let's say for some reason the data in 1,001 to 2,000\n1767  gets accessed quite a lot.\n1768  Well, now we're actually trying to run into a problem\n1769  here where one server gets overloaded, the same problem we're\n1770  trying to guard against using sharding.\n1771  So it's important then to think about what's\n1772  the best, most logical way to distribute your data so you\n1773  don't have one server being accessed much more than another.\n1774  And there's another problem here too, which is if I'm not using replication,\n1775  I'm only using sharding, well, let's say that one server goes down.\n1776  What do we have now?\n1777  Maybe we're missing all the names that went to the middle of our partition.\n1778  Or maybe we're missing all of those rows,\n1779  let's see, 1,001 to 2,000 for instance.\n1780  And that would be what we call a single point of failure.\n1781  If one system goes down, our entire system is now not usable.\n1782  So something to keep in mind as you work on sharding is also\n1783  could combine it with some strategies from replication\n1784  to keep copies of your data across servers too."}], "module": "M6"}, {"id": "R6-08", "type": "concept", "question": "Which statement lets user carter read only the `analysis` view?", "choices": ["GRANT ALL ON *.* TO 'carter';", "GRANT SELECT ON rideshare.analysis TO 'carter';", "CREATE VIEW carter AS …", "REVOKE SELECT ON rides FROM 'carter';"], "answer": 1, "why": "Grant the smallest privilege on the smallest object.", "source": [{"file": "lecture6", "lines": "1883-1886", "quote": "and in particular,", "text": "1883  And I will try to grant the select permission\n1884  privilege on the rideshare database, and in particular,\n1885  the analysis table inside of it.\n1886  And I'll grant that to Carter, like this, semicolon and Enter."}], "module": "M6"}, {"id": "R6-09", "type": "predict", "db": "bank", "sql": "SELECT COUNT(*) FROM \"accounts\" WHERE \"id\" = 1 OR 1 = 1;", "choices": ["1", "3", "0"], "answer": 1, "why": "An injected `OR 1 = 1` makes the WHERE true for every row.", "source": [{"file": "lecture6", "lines": "1959-1966", "quote": "notice that 1 equals 1, that condition will always be true", "text": "1959  But then I type in a single quote followed by or 1 equals 1.\n1960  Now, what w
