ccounts\";`.\nWhat happens in B, and what happens after A runs `COMMIT;`?\n", "hints": ["Which lock kinds exist in SQLite? Which one allows other readers?", "EXCLUSIVE means nobody else may read or write.", "B gets an error until A ends its transaction."], "solution": "-- connection A\nBEGIN EXCLUSIVE TRANSACTION;\n-- connection B\nSELECT * FROM \"accounts\";   -- Runtime error: database is locked\n-- connection A\nCOMMIT;\n-- connection B\nSELECT * FROM \"accounts\";   -- works again\n", "explanation": "SHARED locks let many readers in at once. An EXCLUSIVE lock blocks everyone else. In SQLite the lock covers the whole database file (the coarsest granularity).\n", "module": "M5", "source": [{"file": "lecture5", "lines": "1534-1546", "quote": "Runtime error--", "text": "1534  If I go to my terminal, I can begin a transaction that\n1535  automatically has an exclusive lock.\n1536  In SQLite the statement is BEGIN EXCLUSIVE.\n1537  BEGIN EXCLUSIVE TRANSACTION.\n1538  I'll hit Enter like this, and now I'm in the middle of this transaction.\n1539  It's exclusive.\n1540  Has an exclusive lock nobody else can read.\n1541  If I go back to my other terminal here, connect to my database,\n1542  I could try SELECT * FROM \"accounts\" just to read from this table.\n1543  And now I see Runtime error--\n1544  database is locked.\n1545  The entire database cannot be read from at the very coarsest level\n1546  of an exclusive lock."}, {"file": "lecture5", "lines": "1464-1494", "quote": "unlocked, shared, and exclusive", "text": "1464  We have a few different kinds--\n1465  unlocked, shared, and exclusive, among some others here.\n1466  Each one has a different meaning for different processes.\n1467  So let's take a look here at our bank account table.\n1468  Let's say two computers want to access this account's table.\n1469  Well at this time because nobody is accessing our database, it is unlocked.\n1470  Anyone could read from the database, sort of see what's inside,\n1471  or write to it-- add some data or update some data.\n1472  But let's say we have one computer here who wants to read from this database.\n1473  They want to see what data is inside.\n1474  Well that database in SQLite would acquire\n1475  what's called a shared lock like this.\n1476  They're able to read the database but also\n1477  it's to allow others to read as well.\n1478  A shared lock means I'm only reading.\n1479  You too could read as well.\n1480  So let's say this computer comes in.\n1481  They decide to read from this table.\n1482  They could acquire the same shared lock.\n1483  And because we're only reading, not updating,\n1484  multiple transactions can read all at once.\n1485  We don't have to make these sequential.\n1486  But if we have a transaction that's hoping to write to the database,\n1487  to update some value--\n1488  well that's when things get a little weird.\n1489  I can't let somebody else read my data while I'm updating it.\n1490  So what I need is for this process here, if it's\n1491  writing, to acquire an exclusive lock.\n1492  Meaning this is the only computer, only transaction that\n1493  can read and write to this database.\n1494  All others must hold off in order to be sequential."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M5-E10", "title": "Lab: VACUUM gives space back", "origin": "source-demo", "concepts": ["C5.6"], "difficulty": 1, "skills": ["VACUUM"], "db": "movies", "kind": "selfcheck", "prompt": "Run `python3 tools/labs.py vacuum`. It builds a big movies file, creates indexes, drops them, and prints the file size after each step.\nBefore running it, predict: does the file shrink after `DROP INDEX`? After `VACUUM`?\n", "hints": ["What does SQLite do with the pages an index used to occupy?", "It marks them free for reuse and keeps them in the file.", "Only VACUUM rebuilds the file and returns those pages to the operating system."], "solution": "DROP INDEX \"title_index\";   -- file size unchanged (pages only marked as free)\nVACUUM;                     -- file shrinks\n", "explanation": "The lecture saw 158 MB → 158 MB after dropping three indexes, then 100 MB after VACUUM.", "module": "M5", "source": [{"file": "lecture5", "lines": "991-1010", "quote": "We're down to in this case 100 million after dropping our indexes", "text": " 991  So now let's check on the disk usage in bytes.\n 992  I'll go back to my other terminal, hit du -b again,\n 993  and it's still 158 megabytes.\n 994  Well what can we do to clean this up?\n 995  We could run vacuum.\n 996  If you remember here when we delete an index-- we drop the index,\n 997  we don't actually shrink our database file.\n 998  We just mark those bits that were part of the index as being\n 999  available for re-use.\n1000  So let's now vacuum and compress our file\n1001  to give back those bytes and those bits to the operating system.\n1002  I'll come back to my terminal here and type VACUUM; hit Enter,\n1003  and I'll wait for it to find those bits and bytes,\n1004  wait for it to give them back, to de-allocate them,\n1005  to go back to the operating system.\n1006  And now if I come back and I type du -b again, hit Enter--\n1007  I should see a much smaller file.\n1008  So before we had about 158 million bytes.\n1009  We're down to in this case 100 million after dropping our indexes\n1010  and using VACUUM."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M5-E11", "title": "Lab: time a query before and after an index", "origin": "source-demo", "concepts": ["C5.1", "C5.2"], "difficulty": 1, "skills": [".timer"], "db": "movies", "kind": "selfcheck", "prompt": "Run `python3 tools/build_db.py --big`, then `sqlite3 database/movies_big.db`, then `.timer on`.\nTime `SELECT * FROM \"movies\" WHERE \"title\" = 'Cars';` before and after `CREATE INDEX \"title_index\" ON \"movies\" (\"title\");`.\n`python3 tools/labs.py timer` does the same automatically.\n", "hints": ["`.timer on` is a sqlite3 shell command (no semicolon).", "Look at the \"real\" figure, the wall-clock time.", "Creating the index takes a while, but you pay that cost only once."], "solution": ".timer on\nSELECT * FROM \"movies\" WHERE \"title\" = 'Cars';      -- e.g. Run Time: real 0.03x\nCREATE INDEX \"title_index\" ON \"movies\" (\"title\");\nSELECT * FROM \"movies\" WHERE \"title\" = 'Cars';      -- e.g. Run Time: real 0.000x\n", "explanation": "real = stopwatch time, user = CPU time spent on the query, sys = time spent in the operating system (the lecture loosely calls it waiting for other processes).", "module": "M5", "source": [{"file": "lecture5", "lines": "127-148", "quote": "I'll say .timer on to make sure that I time my future queries.", "text": " 127  Well I can use a SQLite command here called timer.\n 128  I'll say .timer on to make sure that I time my future queries.\n 129  I'll hit Enter now.\n 130  And now if I try selecting again, I'll hit the up arrow twice\n 131  to get back my old query.\n 132  I can type Enter and I'll see not just the results\n 133  but the time it took to run that query.\n 134  Now notice, we have several different measures of time here.\n 135  I have the quote, unquote \"real time\" which is essentially\n 136  the stopwatch time, meaning from the time I press Enter to the time I saw\n 137  these results, how long did that take?\n 138  But of course you're familiar with computers.\n 139  You know there's more involved than just this query running.\n 140  I also have to wait for the operating system\n 141  to finish other processes as well.\n 142  That's where user and system time come in.\n 143  User time is how much time this query particularly took on the CPU.\n 144  System time is how long I spent waiting around for other processes\n 145  to finish before I could run this query.\n 146  For us, we'll focus on real time.\n 147  What was the wall clock time, the stopwatch time, so to speak,\n 148  between the time I pressed Enter and the time I saw these results."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M5-E12", "title": "Walk the B-tree to find Turning Red", "origin": "source-question", "concepts": ["C5.4"], "difficulty": 2, "skills": ["B-tree search", "index trade-offs"], "db": "movies", "kind": "selfcheck", "prompt": "The lecture's index on `title` is a small B-tree: the root node holds **Frozen | Soul**,\nand its three leaf nodes hold *Cars, Cars 3, Frozen* · *Luca, Ratatouille, Soul* · *Toy Story, Turning Red, WALL-E*.\n1. List the comparisons SQLite makes to find **Turning Red**, and say what it gets back from the index.\n2. Why can't SQLite simply sort the `title` column of the table itself?\n3. Name the two costs you pay for this index.\n", "hints": ["At each node, ask \"does my value come before this key?\" to pick the child to follow.", "Turning Red comes after Frozen and after Soul, so which child does that leave?", "Costs: think about pages in a printed book, and about where a new title has to be inserted."], "solution": "-- Model answer:\n-- 1. Root: is \"Turning Red\" before \"Frozen\"? No. Before \"Soul\"? No, so follow the third child.\n--    Leaf: Toy Story, then Turning Red, found. The index returns the ROW NUMBER (pointer) of Turning Red in the table,\n--    which SQLite then uses to fetch the other columns (unless the index is covering).\n-- 2. Sorting the table would change which title sits next to which id. Other tables reference those ids, so the\n--    primary key would no longer identify the same movie. The index is a sorted COPY instead.\n-- 3. Space (the copy plus pointers) and slower writes (every INSERT/UPDATE/DELETE must also update the tree).\n", "explanation": "Each comparison discards most of the remaining candidates, which is why the search stays fast even with millions of rows.", "module": "M5", "source": [{"file": "lecture5", "lines": "782-809", "quote": "How could I find Turning Red?", "text": " 782  And now for one more--\n 783  let me check for understanding here.\n 784  How could I find Turning Red?\n 785  What steps would I follow to find Turning Red?\n 786  I might start at that root node, but then what questions should I ask?\n 787  AUDIENCE: From Frozen also we can see Ratatouille is to the right\n 788  so that we move in direction of Soul.\n 789  Now once we get there we find the middle elements and we can see Ratatouille\n 790  is to the right of the middle elements.\n 791  So that's how we find it.\n 792  Divide the list into two halves and look into the half\n 793  that the element is found.\n 794  CARTER ZENKE: Yeah, I like what you were thinking here.\n 795  So you're talking about traversing this tree we've built and turned on its side\n 796  here.\n 797  And let's visualize that search here.\n 798  So first we'll start at Frozen and ask, does Turning Red come before Frozen?\n 799  It doesn't.\n 800  It comes after, so I'll keep looking.\n 801  I'll look at Soul.\n 802  Does Turning Red come before Soul?\n 803  It doesn't.\n 804  It comes after Soul, so I know I need to look at this node down here.\n 805  I'll go find Toy Story.\n 806  Not quite there yet, but now I'll see Turning Red.\n 807  I'm able to find what I'm looking for.\n 808  And not just that.\n 809  I can find what row number Turning Red is actually in in my table."}, {"file": "lecture5", "lines": "624-648", "quote": "I've broken that relationship", "text": " 624  So let me sort this title column.\n 625  I'll put it like this.\n 626  What have I done wrong?\n 627  First I had this, then I wanted to sort my title\n 628  column to make it faster to search.\n 629  But what rule did I break here by sorting this title column like that?\n 630  AUDIENCE: Yes, Carter, the thing is that by sorting only the movie's\n 631  name and not the ID you will break the entire other databases that\n 632  relates to that one.\n 633  So for example, let's look for a movie in which, I don't know,\n 634  Johnny Depp is working or has worked on.\n 635  And the result may be, I don't know, Titanic.\n 636  CARTER ZENKE: Yeah, I love that example.\n 637  That really drives it home here.\n 638  And in more general terms, I had this primary key called ID.\n 639  And in the prior state I had Toy Story with the ID of 114709.\n 640  A primary key means that Toy Story should be consistently identified\n 641  with this number, 114709.\n 642  But to your point, Mateo, if I sort only the title column,\n 643  well now Cars has that ID--\n 644  114709.\n 645  I've broken that relationship, particularly\n 646  if other tables are relying on Toy Story being identified by 114709.\n 647  So I can't do this.\n 648  This is bad."}, {"file": "lecture5", "lines": "848-861", "quote": "So these trade-offs are something you should", "text": " 848  So we've seen now the trade-off that we get\n 849  with index, which is they're very fast to look up some data\n 850  but they take up a lot more space.\n 851  There's a lot of redundancy to them here.\n 852  There's also one more trade-off, which is\n 853  if I want to insert something into this structure, it'll take me more time.\n 854  I have to navigate this structure here.\n 855  I have to figure out should it come before this value or after this value?\n 856  And I'll have to traverse this tree every time verses\n 857  without an index I could just add something to the end of this list.\n 858  But with a B-Tree, with an index, I need to traverse all these nodes\n 859  and figure out where should that piece of data go?\n 860  So these trade-offs are something you should\n 861  keep in mind as you build indexes and optimize your queries."}], "origin_label": "SOURCE · question posed in the lecture"}, {"id": "M6-E01", "title": "The cards table in MySQL", "origin": "source-demo", "concepts": ["C6.1", "C6.2"], "difficulty": 1, "skills": ["MySQL", "INT", "AUTO_INCREMENT", "backticks"], "db": null, "kind": "selfcheck", "engine": "mysql", "prompt": "Translate the SQLite table `CREATE TABLE \"cards\" (\"id\" INTEGER, PRIMARY KEY(\"id\"));` to MySQL.\nChoose an integer type that comfortably fits one card per person on Earth, and make ids generate automatically.\n", "hints": ["MySQL quotes identifiers with backticks, not double quotes.", "INT holds about ±2.1 billion values, or about 4.2 billion if UNSIGNED.", "SQLite generated keys for free. MySQL needs `AUTO_INCREMENT`."], "solution": "CREATE TABLE `cards` (\n    `id` INT AUTO_INCREMENT,\n    PRIMARY KEY(`id`)\n);\n", "verify_after": "INSERT INTO `cards` () VALUES (), ();\nSELECT `id` FROM `cards`;\nDESCRIBE `cards`;\n", "verify_expect": ["auto_increment", "PRI"], "explanation": "`INT UNSIGNED` (0 to about 4.29 billion) is an even better fit, as the audience suggested (L295-305).\nCheck your table with `SHOW TABLES;` and `DESCRIBE cards;`.\n", "module": "M6", "source": [{"file": "lecture6", "lines": "274-292", "quote": "But in MySQL, I have to actually say auto increment.", "text": " 274  So let's update this.\n 275  Let's go from SQLite now to MySQL.\n 276  So here I had the ID column with type affinity integer.\n 277  And my first step in converting should probably\n 278  be to get rid of these double quotes.\n 279  I no longer need to use double quotes.\n 280  I should use back ticks as a matter of style in MySQL.\n 281  But now I should update this type from integer perhaps to a plain old int.\n 282  As we discussed before, some intuition for that is we'll\n 283  probably never have more than four billion CharlieCards in our table.\n 284  Now, there's one more thing to add too, which is this, auto increment.\n 285  So SQLite for free gave us a primary key that if I inserted some value\n 286  and didn't provide a value for the primary key,\n 287  SQLite would generate that for me.\n 288  But in MySQL, I have to actually say auto increment.\n 289  If I add some new row, make sure you take the highest primary key right now,\n 290  increase it by 1, and assign it to that new value.\n 291  So you'll often see primary keys being defined with the name ID,\n 292  and the type int, and the auto increment property of that column there."}, {"file": "lecture6", "lines": "264-273", "quote": "So it seems like that's a pretty safe bet", "text": " 264  And let me offer some intuition here.\n 265  So if there are fewer than four billion people\n 266  on this Earth, which I believe is a true fact,\n 267  and we're using one of these IDs to represent one card,\n 268  well, if everyone on Earth visited Boston and got their own CharlieCard,\n 269  we wouldn't run out of values using an int here.\n 270  So it seems like that's a pretty safe bet,\n 271  unless we knew that everyone in Boston was\n 272  going to have 10 CharlieCards, or 20, or more, then we could use a big int.\n 273  But in this case, an int seems pretty safe."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M6-E02", "title": "Stations with VARCHAR and ENUM", "origin": "source-question", "concepts": ["C6.2"], "difficulty": 2, "skills": ["VARCHAR", "ENUM", "NOT NULL", "UNIQUE"], "db": null, "kind": "selfcheck", "engine": "mysql", "prompt": "Create the MySQL `stations` table: auto-increment `id`; `name` up to 32 characters, required and unique;\n`line` limited to blue, green, orange or red, and required.\n", "hints": ["Variable-length short text is VARCHAR(M). Use CHAR only for fixed lengths like 'MA'.", "A column with a fixed list of allowed values is an ENUM.", "`` `line` ENUM('blue', 'green', 'orange', 'red') NOT NULL ``"], "solution": "CREATE TABLE `stations` (\n    `id` INT AUTO_INCREMENT,\n    `name` VARCHAR(32) NOT NULL UNIQUE,\n    `line` ENUM('blue', 'green', 'orange', 'red') NOT NULL,\n    PRIMARY KEY(`id`)\n);\n", "verify_after": "INSERT INTO `stations` (`name`, `line`) VALUES ('Harvard', 'red');\nDESCRIBE `stations`;\n", "verify_expect": ["UNI", "enum('blue','green','orange','red')"], "verify_fail": "INSERT INTO `stations` (`name`, `line`) VALUES ('Mystery', 'purple');\n", "explanation": "SET would allow a station to be on several lines at once. ENUM allows exactly one (L485-493).\n", "module": "M6", "source": [{"file": "lecture6", "lines": "442-456", "quote": "So a varchar is good if we have some variable amount of characters", "text": " 442  the name of a station, let me actually ask you all, what do you think\n 443  is the best type to use?\n 444  I'm just wanting the name of some station.\n 445  AUDIENCE: It would be a varchar simply because you don't know\n 446  how long the station name actually is.\n 447  CARTER ZENKE: Yeah, a good point.\n 448  So we're always creating new stations.\n 449  And maybe some station name is pretty long.\n 450  Or maybe it's short.\n 451  We can't really tell, right?\n 452  So a varchar is good if we have some variable amount of characters\n 453  inside the text we're trying to store.\n 454  And notice how a station name isn't paragraphs of text.\n 455  It's just maybe a few words.\n 456  That's good for a varchar."}, {"file": "lecture6", "lines": "499-521", "quote": "So I'll say enum here.", "text": " 499  And I will create this table.\n 500  So we saw before I could simply use create table.\n 501  I could say create table.\n 502  And then I could say give it a name called stations.\n 503  And inside I'll make sure to include--\n 504  let me indent four spaces here, one, two, three, four--\n 505  give it an ID, which has the type integer and auto increment.\n 506  Then afterwards, we also want to include the name of our station, which\n 507  could be a varchar up to size 32.\n 508  It could include up to 32 characters.\n 509  And this should also be not null and unique.\n 510  Those same kind of column constraints, they're still here in MySQL.\n 511  Now I could also include the line column.\n 512  And for simplicity, I could just assume every station is part of only one line.\n 513  So I'll say enum here.\n 514  And I'll choose blue, and green, and orange, and red.\n 515  These are four lines for the subway that exist here in Boston.\n 516  And I'll make sure this has to have a value.\n 517  It can't be null.\n 518  Put that not null constraint here.\n 519  Then I'll say my primary key is the ID column.\n 520  And I will go ahead and close this out, hit semicolon and Enter.\n 521  And I'll see query OK."}], "origin_label": "SOURCE · question posed in the lecture"}, {"id": "M6-E03", "title": "Swipes with DATETIME and DECIMAL", "origin": "source-demo", "concepts": ["C6.2"], "difficulty": 3, "skills": ["ENUM", "DATETIME", "DEFAULT CURRENT_TIMESTAMP", "DECIMAL", "CHECK", "FOREIGN KEY"], "db": null, "kind": "selfcheck", "engine": "mysql", "verify_setup": "CREATE TABLE `cards` (`id` INT AUTO_INCREMENT, PRIMARY KEY(`id`));\nCREATE TABLE `stations` (`id` INT AUTO_INCREMENT, `name` VARCHAR(32) NOT NULL UNIQUE,\n  `line` ENUM('blue', 'green', 'orange', 'red') NOT NULL, PRIMARY KEY(`id`));\nINSERT INTO `cards` () VALUES ();\nINSERT INTO `stations` (`name`, `line`) VALUES ('Harvard', 'red');\n", "prompt": "Create the MySQL `swipes` table: `id`, `card_id`, `station_id` (INT); `type` (enter/exit/deposit, required);\n`datetime` (date and time, required, default now); `amount` (exact money with up to 5 digits, 2 after the point, required, never 0);\nprimary and foreign keys.\n", "hints": ["Money must be exact, so avoid FLOAT and DOUBLE. Which type is *fixed precision*?", "`DECIMAL(M, D)`: M total digits, D after the point. `DECIMAL(5,2)` stores −999.99 to 999.99.", "`` `datetime` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP, `amount` DECIMAL(5,2) NOT NULL CHECK(`amount` != 0) ``"], "solution": "CREATE TABLE `swipes` (\n    `id` INT AUTO_INCREMENT,\n    `card_id` INT,\n    `station_id` INT,\n    `type` ENUM('enter', 'exit', 'deposit') NOT NULL,\n    `datetime` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    `amount` DECIMAL(5,2) NOT NULL CHECK(`amount` != 0),\n    PRIMARY KEY(`id`),\n    FOREIGN KEY(`card_id`) REFERENCES `cards`(`id`),\n    FOREIGN KEY(`station_id`) REFERENCES `stations`(`id`)\n);\n", "verify_after": "INSERT INTO `swipes` (`card_id`, `station_id`, `type`, `amount`) VALUES (1, 1, 'enter', -2.40);\nSELECT `amount`, `datetime` IS NOT NULL FROM `swipes`;\nDESCRIBE `swipes`;\n", "verify_expect": ["-2.40", "MUL", "decimal(5,2)"], "verify_fail": "INSERT INTO `swipes` (`card_id`, `station_id`, `type`, `amount`) VALUES (1, 1, 'enter', 0);\n", "explanation": "In `DESCRIBE`, `MUL` marks a non-unique index. InnoDB creates one for each foreign key (errata #10).\nThe lecture's spoken example \"decimal 5 comma 1 … ±999.99\" is a slip: that range belongs to DECIMAL(5,2) (errata #7).\n", "module": "M6", "source": [{"file": "lecture6", "lines": "723-777", "quote": "I'll say I want five decimal digits with two after the decimal point.", "text": " 723  I'll come back to my computer here.\n 724  And my goal is to run this create table statement to create\n 725  this table on our server.\n 726  I'll say create a table called swipes, like this.\n 727  And I'll include a few columns we didn't show on the slides just for simplicity.\n 728  All first include the ID column with type int.\n 729  And I also want to make sure this auto increments as I add to it.\n 730  I'll then go on.\n 731  And I will also include a card ID column that has a type int.\n 732  And then I'll include a station ID column, which also has type int.\n 733  So now, I can see which card ID is swiped at which station.\n 734  Now, when they swipe here at the MBTA, swipe can mean a few different things.\n 735  You can have a different type.\n 736  One type we might care about is the enter type,\n 737  when I swipe to enter some station.\n 738  I could also swipe to exit some station or to deposit\n 739  some funds into my account.\n 740  And a type should never be null.\n 741  It has to be not null constraint here.\n 742  Now, a swipe happens at some particular date and time.\n 743  So I'll include the date time column and say that this is of type date time.\n 744  I want to make sure this column always has some value.\n 745  So it's not null.\n 746  And the default when I insert some new row\n 747  will be this special value here, current timestamp, the current date and time.\n 748  Now I'll go on.\n 749  And I'll include the amount of some swipe.\n 750  I'll hit space.\n 751  And then I'll say amount here.\n 752  This is the amount associated with that swipe.\n 753  Was I charged money?\n 754  Was I adding money?\n 755  Here I'll say I want this to be a decimal type because you\n 756  said we want this to be precise.\n 757  And decimal is a fixed precision type.\n 758  I'll say I want five decimal digits with two after the decimal point.\n 759  Now, decimal should be not null.\n 760  And I'll include our same check constraint.\n 761  I'll check that amount with back ticks here does not equal 0.\n 762  And if that's the case, I'll be able to insert some new swipe.\n 763  Now, I'll assign my table constraints, like primary keys and foreign keys."}, {"file": "lecture6", "lines": "653-668", "quote": "fixed precision means I can specify I want to always have two places", "text": " 653  because you also get access to fixed precision types, where\n 654  fixed precision means I can specify I want to always have two places\n 655  after the decimal precisely represented.\n 656  And one type for this will be the decimal type, where I can use a decimal\n 657  and then say, I want to store a certain number of digits\n 658  with some number coming after the decimal point.\n 659  Now, for example, I could say decimal 5 comma 1.\n 660  And I could store any number between negative 999.99 up to 999.99\n 661  so long as there are only two places after the decimal here.\n 662  Now, I could increase this.\n 663  I could say I want to go beyond this range.\n 664  I want to have more digits.\n 665  I could increase this first parameter here from five, let's say, to six.\n 666  And now I have a wider range.\n 667  I have 9,999 all the way down to negative 9,999, in both cases\n 668  0.992 decimal digits after this decimal point."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M6-E04", "title": "Add the silver line with MODIFY", "origin": "source-demo", "concepts": ["C6.3"], "difficulty": 2, "skills": ["ALTER TABLE MODIFY"], "db": null, "kind": "selfcheck", "engine": "mysql", "verify_setup": "CREATE TABLE `stations` (`id` INT AUTO_INCREMENT, `name` VARCHAR(32) NOT NULL UNIQUE,\n  `line` ENUM('blue', 'green', 'orange', 'red') NOT NULL, PRIMARY KEY(`id`));\n", "prompt": "The MBTA adds a **silver** line. Change `stations.line` so that `'silver'` is allowed, without losing NOT NULL.", "hints": ["In MySQL, `ALTER TABLE ... MODIFY` replaces a column's whole definition.", "The new definition must repeat every old ENUM value and the NOT NULL.", "`ALTER TABLE `stations` MODIFY `line` ENUM('blue', 'green', 'orange', 'red', 'silver') NOT NULL;`"], "solution": "ALTER TABLE `stations`\nMODIFY `line` ENUM('blue', 'green', 'orange', 'red', 'silver') NOT NULL;\n", "verify_after": "INSERT INTO `stations` (`name`, `line`) VALUES ('South Station', 'silver');\nDESCRIBE `stations`;\n", "verify_expect": ["'silver'"], "explanation": "SQLite's ALTER TABLE cannot change a column definition. In SQLite you would rebuild the table.\nThe same MODIFY can also widen a VARCHAR later (L577-580).\n", "module": "M6", "source": [{"file": "lecture6", "lines": "905-919", "quote": "So this is one example of using alter table to adjust a column definition.", "text": " 905  And I will try this again.\n 906  I will alter table stations.\n 907  And then I will modify the line column, as we said before,\n 908  to be an enum with a few different values,\n 909  blue, green, orange, red, closing both quotes now, and then silver,\n 910  again closing both quotes.\n 911  And let me double check.\n 912  I believe we're all set.\n 913  I'll then say not null, semicolon, Enter.\n 914  And I'll see the query is OK.\n 915  Now if I do describe stations, like this, semicolon,\n 916  and zoom out just a bit, I see I've added to my possible values\n 917  for this enum.\n 918  I have blue, green, orange, red, and silver.\n 919  So this is one example of using alter table to adjust a column definition."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M6-E05", "title": "A stored procedure for the current collection", "origin": "source-demo", "concepts": ["C6.4"], "difficulty": 2, "skills": ["DELIMITER", "CREATE PROCEDURE", "CALL"], "db": null, "kind": "selfcheck", "engine": "mysql", "verify_setup": "CREATE TABLE `collections` (`id` INT AUTO_INCREMENT, `title` VARCHAR(64) NOT NULL,\n  `accession_number` VARCHAR(16) NOT NULL UNIQUE, `acquired` DATE, PRIMARY KEY(`id`));\nINSERT INTO `collections` (`title`, `accession_number`, `acquired`) VALUES\n  ('Farmers Working at Dawn', '11.6152', '1911-08-03'), ('Imaginative Landscape', '56.496', NULL),\n  ('Profusion of Flowers', '56.257', '1956-04-12'), ('Spring Outing', '14.76', '1914-01-08');\nALTER TABLE `collections` ADD COLUMN `deleted` TINYINT DEFAULT 0;\nUPDATE `collections` SET `deleted` = 1 WHERE `title` = 'Farmers Working at Dawn';\n", "prompt": "`collections` has a `deleted` TINYINT flag. Create a procedure `current_collection()` that returns\n`title`, `accession_number`, `acquired` for items not deleted, then call it.\n", "hints": ["The body contains `;`, so first change the client's delimiter (e.g. to `//`).", "`CREATE PROCEDURE name() BEGIN ...; END//`, then switch the delimiter back.", "`DELIMITER //` … `SELECT ... FROM `collections` WHERE `deleted` = 0; END//` `DELIMITER ;` `CALL current_collection();`"], "solution": "DELIMITER //\nCREATE PROCEDURE `current_collection`()\nBEGIN\n    SELECT `title`, `accession_number`, `acquired` FROM `collections`\n    WHERE `deleted` = 0;\nEND//\nDELIMITER ;\nCALL `current_collection`();\n", "verify_expect": ["Imaginative Landscape"], "verify_absent": ["Farmers Working at Dawn"], "explanation": "`TINYINT` is the smallest integer type, which is enough for 0/1 (L1027-1031). Compare with the SQLite *view* `current_collections` (M4-E10).\n", "module": "M6", "source": [{"file": "lecture6", "lines": "1056-1090", "quote": "So using call, can I then call this procedure I've made and stored?", "text": "1056  So a workaround is to temporarily declare a different delimiter.\n1057  Instead of ending my queries with a semicolon here,\n1058  I'll end them with, let's say, slash slash.\n1059  And we'll see that in just a moment here.\n1060  I'll come back to my computer.\n1061  And for the sake of writing this procedure,\n1062  I'll change my delimiter, that is what icon represents the end of my query\n1063  to slash slash, like this.\n1064  Then I'll hit Enter.\n1065  Now I can start creating my procedure.\n1066  I'll say create procedure.\n1067  And I'll call this one current collections with a open and closed\n1068  parentheses after this.\n1069  This is common for names here.\n1070  Then I'll say begin this procedure.\n1071  And in this procedure, I want to select the title, accession number,\n1072  and acquired columns.\n1073  I want to do it from the collections table, where deleted equals 0.\n1074  And now I can safely include a semicolon because my delimiter\n1075  for this entire query is a slash slash.\n1076  So this is the end of this particular query inside my procedure.\n1077  It's also the end of my procedure in general.\n1078  And now to declare the end of this procedure,\n1079  the end of this overarching statement, I could\n1080  say slash slash instead of semicolon.\n1081  Now, if I hit Enter, I'll see query OK.\n1082  And now I should change back to, in this case, semicolon,\n1083  so I can get back to what I'm used to using to end my queries.\n1084  I'll hit Enter.\n1085  And now let's see what we can do.\n1086  I could say call current collection.\n1087  I think we called it collection, singular.\n1088  And I'll say this, semicolon there.\n1089  Now, I should see all of the items that are marked as not deleted.\n1090  So using call, can I then call this procedure I've made and stored?"}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M6-E06", "title": "Assigned: a sell procedure that refuses double sales", "origin": "source-assigned", "concepts": ["C6.4"], "difficulty": 4, "skills": ["IN parameter", "IF", "procedures"], "db": null, "kind": "selfcheck", "engine": "mysql", "verify_setup": "CREATE TABLE `collections` (`id` INT AUTO_INCREMENT, `title` VARCHAR(64) NOT NULL,\n  `accession_number` VARCHAR(16) NOT NULL UNIQUE, `acquired` DATE, `deleted` TINYINT DEFAULT 0, PRIMARY KEY(`id`));\nINSERT INTO `collections` (`title`, `accession_number`, `acquired`) VALUES\n  ('Farmers Working at Dawn', '11.6152', '1911-08-03'), ('Imaginative Landscape', '56.496', NULL);\nCREATE TABLE `transactions` (`id` INT AUTO_INCREMENT, `title` VARCHAR(64) NOT NULL,\n  `action` ENUM('bought', 'sold') NOT NULL, PRIMARY KEY(`id`));\n", "prompt": "The lecture builds `sell(IN sold_id INT)`: it marks the item deleted **and** logs `'sold'` in `transactions`.\nIt then warns: *\"if I try to sell something that has already been sold, I might … mark something as being sold twice.\nI'll actually leave this up to you as your own exercise.\"*\nWrite `sell` so that a second `CALL sell(2);` changes nothing.\n", "hints": ["Stored procedures support `IF condition THEN ... END IF;`", "Only act when the item exists and `deleted = 0`.", "`IF (SELECT `deleted` FROM `collections` WHERE `id` = sold_id) = 0 THEN UPDATE ...; INSERT ...; END IF;`"], "solution": "DELIMITER //\nCREATE PROCEDURE `sell`(IN `sold_id` INT)\nBEGIN\n    IF (SELECT `deleted` FROM `collections` WHERE `id` = `sold_id`) = 0 THEN\n        UPDATE `collections` SET `deleted` = 1 WHERE `id` = `sold_id`;\n        INSERT INTO `transactions` (`title`, `action`)\n        VALUES ((SELECT `title` FROM `collections` WHERE `id` = `sold_id`), 'sold');\n    END IF;\nEND//\nDELIMITER ;\nCALL `sell`(2);\nCALL `sell`(2);\n", "verify_after": "SELECT COUNT(*) AS sold_rows FROM `transactions`;\n", "verify_expect": ["sold_rows\n1"], "explanation": "Without the IF, calling sell twice would log two sales of one painting.\nA unique constraint or a transaction with a re-check are alternative guards.\n", "module": "M6", "source": [{"file": "lecture6", "lines": "1258-1277", "quote": "I'll actually leave this up to you as your own exercise.", "text": "1258  And we'll kind of end stored procedures on this note here, which is I seem to--\n1259  if I go back to what I had discussed before,\n1260  I was able to update some item in my collections table\n1261  and then add it to the transactions table too.\n1262  So if I say select star from collections, there is some danger here.\n1263  Like if I try to sell something that has already been sold,\n1264  I might run the procedure and mark something as being sold twice.\n1265  Now, I'll actually leave this up to you as your own exercise.\n1266  But I want to give you a few tools to think about\n1267  for writing your own procedures.\n1268  Among them are some constructs you might be\n1269  familiar with if you've programmed before.\n1270  So here you might notice a stored procedure can actually\n1271  be compatible with some familiar programming syntax, like conditions,\n1272  for example, if, else if, and else, and also loops,\n1273  like the ability to do something more than once\n1274  or to repeat something over, and over, and over again.\n1275  So you can use these to really build up your own stored procedures\n1276  to combine statements and automate processes that you're\n1277  going to do very frequently on your database at large scale."}, {"file": "lecture6", "lines": "1169-1222", "quote": "I'll say the input is something called sold ID", "text": "1169  So I'll say create procedure.\n1170  And I'll call this one sell, like this.\n1171  But now instead of open parentheses and closed parentheses,\n1172  I actually want to give some input to this function.\n1173  And let me actually ask you all here, what kind of input\n1174  should I give to this sell function, so I can\n1175  identify the painting I want to sell?\n1176  AUDIENCE: It should be with a primary key\n1177  and refer to the name of the painting probably.\n1178  CARTER ZENKE: Yeah, I like your thinking.\n1179  We could think about what identifies this artwork.\n1180  Maybe it's the ID or the title.\n1181  In this case, I like your intuition for the ID, which is unique,\n1182  will never change.\n1183  So let's actually use the ID here of an item in the collections table\n1184  to mark it as sold.\n1185  So I'll come back to my computer.\n1186  And I'll say that sell actually takes an input.\n1187  And I can say in here to note a value as an input.\n1188  I'll say the input is something called sold ID, the item we're selling.\n1189  And the type of this is an int, like this.\n1190  So now I have a procedure that takes in some value in integer called sold ID.\n1191  Now, I'll say let's begin this procedure.\n1192  Let's begin down below.\n1193  And the first thing I should do is update collections, like this,\n1194  and set deleted equal to 1 under what condition?\n1195  Well, perhaps under the condition where the ID is equal to our input, which\n1196  is called sold ID.\n1197  So I'm using the input of sold ID to find in collections which\n1198  artwork I'm marking now as deleted.\n1199  But the next step--\n1200  I'll say semicolon here to end that step--\n1201  is to then insert it into the transactions table.\n1202  I've marked it as being deleted.\n1203  But now I need to insert into transactions.\n1204  I'll say then I want to insert into transactions in the title and action\n1205  columns some values here.\n1206  Well, what values?\n1207  The first value is actually the title of this artwork.\n1208  And I only have the ID right now.\n1209  But I could use the ID to get back the title."}], "origin_label": "SOURCE · explicitly left to the learner in the lecture"}, {"id": "M6-E07", "title": "Swipes in PostgreSQL", "origin": "source-demo", "concepts": ["C6.5"], "difficulty": 3, "skills": ["CREATE TYPE ENUM", "SERIAL", "TIMESTAMP", "now()", "NUMERIC"], "db": null, "kind": "selfcheck", "engine": "postgres", "verify_setup": "CREATE TABLE \"cards\" (\"id\" SERIAL, PRIMARY KEY(\"id\"));\nCREATE TABLE \"stations\" (\"id\" SERIAL, \"name\" VARCHAR(32) NOT NULL UNIQUE, \"line\" VARCHAR(32) NOT NULL, PRIMARY KEY(\"id\"));\nINSERT INTO \"cards\" DEFAULT VALUES;\nINSERT INTO \"stations\" (\"name\", \"line\") VALUES ('Harvard', 'red');\n", "prompt": "Write the PostgreSQL version of `swipes`. Define the allowed swipe types as **their own type**;\nuse an auto-incrementing id, a timestamp defaulting to now, and `NUMERIC(5,2)` for the amount.\n", "hints": ["In Postgres an enum is declared once as a type: `CREATE TYPE name AS ENUM (...);`", "`SERIAL` is an auto-incrementing integer. The timestamp default is the function `now()`.", "`\"type\" \"swipe_type\" NOT NULL, \"datetime\" TIMESTAMP NOT NULL DEFAULT now(), \"amount\" NUMERIC(5,2) NOT NULL CHECK(\"amount\" != 0)`"], "solution": "CREATE TYPE \"swipe_type\" AS ENUM('enter', 'exit', 'deposit');\nCREATE TABLE \"swipes\" (\n    \"id\" SERIAL,\n    \"card_id\" INT,\n    \"station_id\" INT,\n    \"type\" \"swipe_type\" NOT NULL,\n    \"datetime\" TIMESTAMP NOT NULL DEFAULT now(),\n    \"amount\" NUMERIC(5,2) NOT NULL CHECK(\"amount\" != 0),\n    PRIMARY KEY(\"id\"),\n    FOREIGN KEY(\"card_id\") REFERENCES \"cards\"(\"id\"),\n    FOREIGN KEY(\"station_id\") REFERENCES \"stations\"(\"id\")\n);\n", "verify_after": "INSERT INTO \"swipes\" (\"card_id\", \"station_id\", \"type\", \"amount\") VALUES (1, 1, 'deposit', 20);\nSELECT \"type\", \"amount\" FROM \"swipes\";\n", "verify_expect": ["deposit", "20.00"], "verify_fail": "INSERT INTO \"swipes\" (\"card_id\", \"station_id\", \"type\", \"amount\") VALUES (1, 1, 'teleport', 20);\n", "explanation": "Postgres uses double quotes like SQLite, not backticks. Its CLI commands are `\\l` (list databases), `\\c` (connect), `\\dt` (list tables), `\\d table`, `\\q` (quit).\n", "module": "M6", "source": [{"file": "lecture6", "lines": "1422-1476", "quote": "Create a type and give it some name.", "text": "1422  Among them are enum, our old friend again.\n1423  But we use enum a little bit differently.\n1424  So instead of including enum inside of our column definition,\n1425  we actually create our very own type.\n1426  Postgres supports something like this.\n1427  Create a type and give it some name.\n1428  And then I could say what that type actually is.\n1429  So here I've created some type and called it swipe type and then said,\n1430  this type can have the following values, enter, exit, or deposit.\n1431  And I can then use this name, swipe type, as my very own type in future\n1432  create table statements, so something that Postgres has that MySQL might not\n1433  in this form.\n1434  Let's consider then dates and times.\n1435  So dates and times, largely similar.\n1436  I have timestamp, date, time, and interval,\n1437  a particular type representing the distance between times,\n1438  how long did something take?\n1439  But we still have our old friend's date and time for dates and times\n1440  respectively, and also timestamp to combine these two into one.\n1441  And then we also have precision with these.\n1442  I could say I want to represent to the hundreds place, the thousands\n1443  place, or so on for each of timestamp, time, and interval.\n1444  Continuing on, we could also work with real numbers, which\n1445  are largely the same amenities between MySQL and Postgres\n1446  with a few differences.\n1447  One is that at least in Postgres we call decimal numeric.\n1448  So numeric in this case can specify some precision, that\n1449  is the number of digits, and the scale, that\n1450  is the number that come after the decimal point.\n1451  And newer to Postgres is a type particularly for money,\n1452  which depending on your settings in your database\n1453  will put to you either a certain number of decimal points\n1454  and include perhaps a dollar sign, or a euro sign, or a pound sign,\n1455  whatever it is you're using and whatever it\n1456  is you've configured in your database.\n1457  So let's update now.\n1458  Let's go ahead and improve this statement in swipes\n1459  from SQLite to Postgres.\n1460  Here, I had type.\n1461  Well, that could now be our very own swipe type.\n1462  Notice here I defined up above as an enum."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M6-E08", "title": "Dump every account with SQL injection", "origin": "source-demo", "concepts": ["C6.8"], "difficulty": 2, "skills": ["SQL injection", "UNION"], "db": "bank", "kind": "injection", "template": "SELECT * FROM \"accounts\" WHERE \"id\" = {input};", "prompt": "A careless bank website pastes whatever you type into this query:\n\n`SELECT * FROM \"accounts\" WHERE \"id\" = <your input>;`\n\nYou are Alice (id 1). Type an **input** (not a whole query) that makes the site show **every** account.\n", "hints": ["Your text becomes part of the SQL. What could you append after the `1`?", "Either make the WHERE always true, or glue on a second query.", "`1 UNION SELECT * FROM \"accounts\"` (or `1 OR 1 = 1`)"], "solution": "1 UNION SELECT * FROM \"accounts\"\n", "explanation": "The fix is a **prepared statement**: `PREPARE balance_check FROM 'SELECT * FROM accounts WHERE id = ?';` then `EXECUTE ... USING @id`.\nThe `?` value is bound as data and never parsed as SQL (see errata #8 for why MySQL still returned Alice).\n`python3 tools/labs.py injection` shows the safe version in SQLite.\n", "module": "M6", "source": [{"file": "lecture6", "lines": "2020-2031", "quote": "I see everyone's balances and their names too.", "text": "2020  Well, now, what else could I do?\n2021  I could try to deliberately mess up this query\n2022  to run my own SQL injection attack.\n2023  I could select, let's say, star from accounts.\n2024  And then let me try where the ID equals 1.\n2025  I give them 1.\n2026  But I also give them some SQL statements they unwittingly execute.\n2027  I say union and then select star from accounts, a bit like this.\n2028  Now I'll hit Enter.\n2029  And if I complete this query, I see not just my own.\n2030  I see everyone's balances and their names too.\n2031  So this is one demo of how SQL injection attacks can show and leak"}, {"file": "lecture6", "lines": "2050-2067", "quote": "A prepared statement is a statement that we", "text": "2050  Well one strategy is using what we call a prepared statement.\n2051  A prepared statement is kind of what it sounds like.\n2052  A prepared statement is a statement that we\n2053  will later on Insert some values into.\n2054  We might treat it like a fill in the blank, like here is my select\n2055  and I'll let you fill in what you want me to select.\n2056  But I'll make sure to clean your input before actually adding it in.\n2057  So let's think through a few of these here.\n2058  Here I have prepare name from statement.\n2059  This is a SQL statement I can use to prepare some statement, to take\n2060  some user input to make sure that when I add in that user input,\n2061  nothing malicious will happen.\n2062  And in particular, I can make sure the statement looks something\n2063  like this, select balance from accounts where ID equals question mark.\n2064  This question mark is just a question mark.\n2065  But syntactically it stands for the ability of this statement\n2066  to clean whatever I put inside of it to make sure it doesn't inadvertently\n2067  run SQL code I don't want it to run."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["id", "name", "balance"], "rows": [[1, "Alice", 10], [2, "Bob", 20], [3, "Charlie", 30]], "error": null}}, {"id": "M6-E09", "title": "Log in as Carter without the password", "origin": "source-question", "concepts": ["C6.8"], "difficulty": 3, "skills": ["SQL injection", "comments", "OR"], "db": null, "kind": "injection", "setup": "CREATE TABLE \"users\" (\"id\" INTEGER, \"username\" TEXT, \"password\" TEXT, PRIMARY KEY(\"id\"));\nINSERT INTO \"users\" VALUES (1, 'carter', 'correct horse'), (2, 'alice', 'battery staple');\n", "template": "SELECT \"id\" FROM \"users\" WHERE \"username\" = 'carter' AND \"password\" = '{input}';", "prompt": "A login form builds:\n\n`SELECT \"id\" FROM \"users\" WHERE \"username\" = 'carter' AND \"password\" = '<your input>';`\n\nand logs you in if any id comes back. You don't know the password. Type a password input that returns Carter's id **1**.\n", "hints": ["Your input lands *inside* a quoted string. How do you get out of it?", "Close the quote, add a condition that is always true, and neutralize the leftover `'` (for example with `--`, which starts a comment).", "`' OR 1 = 1 --` would match every user. To return only Carter, keep his username: `' OR \"username\" = 'carter' --`"], "solution": "' OR \"username\" = 'carter' --\n", "explanation": "The lecture's `' OR 1=1` makes the condition always true. With AND binding tighter than OR, `1 = 1` alone would return **every** user.\nParameterized queries defeat all of these, because the input can never close the quote.\n", "module": "M6", "source": [{"file": "lecture6", "lines": "1958-1966", "quote": "But then I type in a single quote followed by or 1 equals 1.", "text": "1958  So you could imagine maybe I type in my password.\n1959  But then I type in a single quote followed by or 1 equals 1.\n1960  Now, what would that do?\n1961  Well, notice that 1 equals 1, that condition will always be true.\n1962  And so this condition, where username equals\n1963  Carter and password equals password, well, in that case,\n1964  I have access to Carter's account because I\n1965  modified the condition just always be true whether or not\n1966  the password is correct."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["id"], "rows": [[1]], "error": null}}, {"id": "M6-E10", "title": "Give an analyst read access to one view only", "origin": "source-demo", "concepts": ["C6.7", "C4.7"], "difficulty": 2, "skills": ["CREATE USER", "GRANT", "REVOKE"], "db": null, "kind": "selfcheck", "engine": "mysql", "verify_setup": "CREATE TABLE `rides` (`id` INT AUTO_INCREMENT, `origin` VARCHAR(32), `destination` VARCHAR(32), `rider` VARCHAR(32), PRIMARY KEY(`id`));\nINSERT INTO `rides` (`origin`, `destination`, `rider`) VALUES ('Good Egg Galaxy', 'Honeyhive Galaxy', 'Peach');\nCREATE VIEW `analysis` AS SELECT `id`, `origin`, `destination`, 'anonymous' AS `rider` FROM `rides`;\n", "prompt": "As root, create the user `carter` (password `password`, for the demo only) and give it permission to **read the `analysis` view** and nothing else.\nThen write the statement that would take that permission away again.\n", "hints": ["`CREATE USER 'name' IDENTIFIED BY '...';`", "`GRANT privilege ON database.object TO 'user';`", "`GRANT SELECT ON <db>.`analysis` TO 'carter';` … `REVOKE SELECT ON <db>.`analysis` FROM 'carter';`"], "solution": "CREATE USER 'carter' IDENTIFIED BY 'password';\nGRANT SELECT ON `analysis` TO 'carter';\n-- later, to remove it:\n-- REVOKE SELECT ON `analysis` FROM 'carter';\n", "verify_after": "SHOW GRANTS FOR 'carter';\n", "verify_expect": ["GRANT SELECT ON", "`analysis`"], "verify_cleanup": "DROP USER 'carter';\n", "explanation": "The lecture writes `rideshare.analysis` (database.table). Inside the current database, the bare name works too.\nUnlike SQLite (M4-E09), carter now cannot `SELECT * FROM rides`. Avoid `GRANT ALL ON *.*` in production.\n", "module": "M6", "source": [{"file": "lecture6", "lines": "1796-1804", "quote": "create a user whose name is Carter in single quotes", "text": "1796  And in this case, I will create a new user, one named Carter.\n1797  So to do so, I can use this command here,\n1798  this statement here, create a user whose name is Carter in single quotes.\n1799  Now, I can say they are identified by the password.\n1800  And this password is literally password, P-A-S-S-W-O-R-D.\n1801  It is one of, unfortunately, the most popular passwords.\n1802  Do not use this password.\n1803  So I will hit Enter here.\n1804  And now I have created some new user named Carter."}, {"file": "lecture6", "lines": "1878-1899", "quote": "I can't see the ride data", "text": "1878  So I want to give Carter it seems like a select privilege on the view I\n1879  created for analysis in this database.\n1880  So I'll come back over here.\n1881  And I'll try that.\n1882  I will log in as root here.\n1883  And I will try to grant the select permission\n1884  privilege on the rideshare database, and in particular,\n1885  the analysis table inside of it.\n1886  And I'll grant that to Carter, like this, semicolon and Enter.\n1887  Now I'll see the query is OK.\n1888  If I log back in as Carter down here, and now type show databases Enter,\n1889  I should see I can now see the rideshare database.\n1890  So I'll type use rideshare semicolon.\n1891  The database changed.\n1892  I could say show tables.\n1893  And what do I see but that virtual table, that view called analysis.\n1894  So now as Carter I can select star from analysis semicolon\n1895  and see that same data.\n1896  But I can't see the ride data.\n1897  If I say select star from rides, that table is currently hidden to me.\n1898  I get back, you don't have permission.\n1899  So this is the benefit of MySQL's users and privileges"}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M6-E11", "title": "Choose a scaling plan", "origin": "source-question", "concepts": ["C6.6"], "difficulty": 4, "skills": ["replication", "sharding", "vertical vs horizontal scaling"], "db": null, "kind": "selfcheck", "prompt": "Your app grows from 100 to 100,000 reads and from 50 to 50,000 writes per minute (the lecture's scenario), and it slows down.\nFor (a) a bank ledger and (b) a social network's profile photos, decide:\n1. Vertical or horizontal scaling first, and why.\n2. Which replication model and whether it should be synchronous or asynchronous. Where do reads go, and where do writes go?\n3. If the data no longer fits on one server, how would you shard it, and what two risks must you design against?\n", "hints": ["Start with the cheapest fix (optimize queries), then a bigger single server, then more servers.", "Single-leader: writes go to the leader and reads can go to followers (read replicas). Then ask: can you afford to lose an acknowledged write?", "Sharding risks: hotspots (uneven load) and a single point of failure (a shard without replicas)."], "solution": "-- Model answer:\n-- 1. Optimize queries, then scale vertically; when one machine is not enough, scale horizontally.\n-- 2. Single-leader replication: all writes go to the leader, and reads are spread over read replicas.\n--    (a) Bank: SYNCHRONOUS, because the client is told OK only once a follower also has the data (slower, but no lost money).\n--    (b) Photos: ASYNCHRONOUS. It is faster, and losing a rare update is acceptable.\n-- 3. Shard by a key that spreads load evenly (e.g. a hash of the user id rather than name ranges, which can create hotspots),\n--    and replicate each shard so that no shard is a single point of failure.\n", "explanation": "There is no single right answer. The point is to state the trade-off (latency vs durability, evenness vs locality) explicitly.", "module": "M6", "source": [{"file": "lecture6", "lines": "1498-1545", "quote": "So vertical scaling is about increasing your application's capacity", "text": "1498  So let's envision a sample application here, one that starts off pretty small.\n1499  We have users trying to read from this database about 100 times per minute.\n1500  But they're also writing to the database,\n1501  adding new data about 50 times per minute.\n1502  And maybe this application over time it grows a little bit.\n1503  Maybe instead of 100 reads, it goes up to 1,000 and multiplies by 10,\n1504  and same thing for our writes.\n1505  They also multiply on average by about 10.\n1506  And this application, it gets even more popular, increases by 10-fold again.\n1507  Now we have 10,000 reads per minute, 5,000 writes per minute.\n1508  And then finally, it keeps growing another 10-fold.\n1509  And now we're at 100,000 reads per minute and 50,000 writes per minute.\n1510  What might be the problem?\n1511  If I had a single server, like this, why might my application\n1512  start to slow down?\n1513  AUDIENCE: So yeah, I would like to say that whenever the requests are\n1514  increasing with the time to which the server would reply will also increase.\n1515  And the list would seem to grow on and on.\n1516  CARTER ZENKE: Yeah, I like your thinking there.\n1517  So you can think of the time that each query takes.\n1518  As we saw in our optimizing lecture, we could time our queries.\n1519  And if I have many, many, many of those queries running all at one time,\n1520  I mean that could add up substantially.\n1521  So it's worth thinking about whether one computer can really\n1522  handle all of these reads and all of these writes.\n1523  So if you find yourself writing some application\n1524  and it behaves a little bit slower than you want it to, particularly at scale,\n1525  you have a few options.\n1526  And I want to ask you just to use your own intuition here.\n1527  Like if you encountered this problem of your application slowing down,\n1528  what might you try to do to solve that problem?\n1529  AUDIENCE: You could try to optimize your queries.\n1530  CARTER ZENKE: Yeah, try to optimize your queries,\n1531  make sure they take a little less time than before.\n1532  Or you could even try to throw more hardware at the problem.\n1533  Like maybe you have optimized your queries\n1534  to the maximum you think you can.\n1535  And it's just still not fast enough.\n1536  Well, one approach might be what's called vertical scaling,\n1537  trying to make this single server all the more quicker\n1538  at replying to your queries."}, {"file": "lecture6", "lines": "1676-1738", "quote": "But it's up to you to decide which one might", "text": "1676  Now let's focus on synchronous replication\n1677  here, where the leader and the follower are always in sync.\n1678  So this might look a bit like this.\n1679  If I add in the follower, I now have a leader and a follower.\n1680  I might send that profile photo to the leader, a bit like this.\n1681  The leader then sends it to the follower down below and waits.\n1682  It waits until the follower has confirmed\n1683  they have received that photo.\n1684  They have added to the database.\n1685  And now they send back a request saying, look, I got it.\n1686  Everything is OK.\n1687  And now only at this point, once the leader\n1688  has received the OK from the follower, does it then communicate with me.\n1689  It then says, everything's OK.\n1690  We got your photo.\n1691  So this is great because it's redundant.\n1692  Like I know for sure that my photo is on both the leader and the follower.\n1693  But there is a downside.\n1694  And looking at this diagram here, what do you think that downside might be?\n1695  AUDIENCE: Maybe it's too slow.\n1696  CARTER ZENKE: Yeah, exactly.\n1697  It could be just too slow.\n1698  Like if I have to wait for the follower to get the OK back to the leader\n1699  and then back to me, that's just more time for me to wait.\n1700  And maybe my application shouldn't wait around that long.\n1701  You might use this, though, if you're working in finance or healthcare, where\n1702  you have to be doubly sure you have data stored exactly as you want it to be.\n1703  But if you're like a social media site, like a Facebook or a Twitter,\n1704  I mean, maybe you don't care if you lose a tweet every once in a while.\n1705  It's OK.\n1706  So maybe synchronous isn't the best, most ideal scenario for that as well.\n1707  So let's think through now asynchronous.\n1708  So we'll go back to asynchronous here and think through our diagram again.\n1709  Well, in asynchronous, the leader doesn't wait around\n1710  for the follower to get the data.\n1711  So to visualize, my client could send this\n1712  to the leader, maybe a photo update, for example.\n1713  Then simultaneously, the leader tells me, I got your photo, everything's OK,\n1714  and then sends the photo to the follower.\n1715  The follower might later on tell the leader that everything is OK.\n1716  But the leader already told me, look, all good, we got your photo."}, {"file": "lecture6", "lines": "1763-1784", "quote": "The goal is to really to avoid what we call a hotspot", "text": "1763  Now, there's a lot of thought that goes behind the best way to shard your data.\n1764  The goal is to really to avoid what we call a hotspot, wherein one database\n1765  server becomes more frequently accessed or requested than others.\n1766  Let's say for some reason the data in 1,001 to 2,000\n1767  gets accessed quite a lot.\n1768  Well, now we're actually trying to run into a problem\n1769  here where one server gets overloaded, the same problem we're\n1770  trying to guard against using sharding.\n1771  So it's important then to think about what's\n1772  the best, most logical way to distribute your data so you\n1773  don't have one server being accessed much more than another.\n1774  And there's another problem here too, which is if I'm not using replication,\n1775  I'm only using sharding, well, let's say that one server goes down.\n1776  What do we have now?\n1777  Maybe we're missing all the names that went to the middle of our partition.\n1778  Or maybe we're missing all of those rows,\n1779  let's see, 1,001 to 2,000 for instance.\n1780  And that would be what we call a single point of failure.\n1781  If one system goes down, our entire system is now not usable.\n1782  So something to keep in mind as you work on sharding is also\n1783  could combine it with some strategies from replication\n1784  to keep copies of your data across servers too."}], "origin_label": "SOURCE · question posed in the lecture"}], "debugging": [{"id": "D0-01", "module": "M0", "title": "The NULL that never matches", "bug_type": "null", "origin": "generated", "concepts": ["C0.6"], "difficulty": 1, "db": "longlist0", "kind": "query", "prompt": "This should list the books that have no translator. It returns nothing.", "broken": "SELECT \"title\" FROM \"longlist\" WHERE \"translator\" = NULL;\n", "hints": ["What is the result of `NULL = NULL` in SQL? Is it true?", "Comparisons with NULL produce NULL (unknown), and WHERE keeps only rows where the condition is true.", "Use the operator built for NULL tests."], "solution": "SELECT \"title\" FROM \"longlist\" WHERE \"translator\" IS NULL;\n", "diagnosis": "`= NULL` is never true. NULL means unknown, so use `IS NULL` / `IS NOT NULL`.", "source": [{"file": "lecture0", "lines": "596-633", "quote": "We could use IS NULL to figure out if a value is null.", "text": " 596  this one called NULL.\n 597  So I'll walk over here.\n 598  And we'll see that we have this type called NULL, where this\n 599  means that this value doesn't exist.\n 600  It's not in our database.\n 601  We can actually put together a condition around this idea of null, something\n 602  not being there.\n 603  We could use IS NULL to figure out if a value is null.\n 604  It's not there.\n 605  It's missing from our database.\n 606  Or IS IT NULL, meaning that it actually is there.\n 607  So I'll go back to SQLite and show you what we could\n 608  do with some of these concepts here.\n 609  Let me go back to my terminal.\n 610  And let's say I do want to find those translators that\n 611  don't exist in my database.\n 612  Well, I could use SELECT, let's say, \"title\" and \"translator\" from my\n 613  \"longlist.\"\n 614  And I want to make sure that these translators are null--\n 615  they don't exist.\n 616  So I'll say WHERE \"translator\" IS NULL Semicolon.\n 617  Now, I'll hit Enter.\n 618  And I should see two books.\n 619  Titles are The Perfect Nine and the indictment of The Enlightenment\n 620  of The Greengate Tree.\n 621  But notice how over here, this value is null--\n 622  it doesn't exist in my table.\n 623  I could conversely find those books that do have translators using IS NOT NULL.\n 624  And I will try this one again.\n 625  But in this case, I'll say, WHERE \"translator\" IS NOT NULL Semicolon.\n 626  And I'll hit Enter.\n 627  And now, let me just zoom out a little bit.\n 628  I can see that I have both titles on the left-hand side\n 629  and translators on the right-hand side.\n 630  All of these actually exists.\n 631  These are books that did have translators in this case.\n 632  So a good way to find data that's missing in your table using\n 633  NULL or IS NOT NULL."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"columns": ["title"], "rows": [["The Perfect Nine"], ["The Enlightenment of the Greengage Tree"]], "error": null}}, {"id": "D0-02", "module": "M0", "title": "AND without parentheses", "bug_type": "logic", "origin": "generated", "concepts": ["C0.5"], "difficulty": 2, "db": "longlist0", "kind": "query", "prompt": "Meant to list 2022 and 2023 books that are not hardcover, but hardcovers from 2022 slip through.", "broken": "SELECT \"title\", \"format\" FROM \"longlist\"\nWHERE \"year\" = 2022 OR \"year\" = 2023 AND \"format\" != 'hardcover';\n", "hints": ["Which operator binds more tightly, AND or OR?", "The condition is read as `year = 2022 OR (year = 2023 AND format != 'hardcover')`.", "Put parentheses around the OR."], "solution": "SELECT \"title\", \"format\" FROM \"longlist\"\nWHERE (\"year\" = 2022 OR \"year\" = 2023) AND \"format\" != 'hardcover';\n", "diagnosis": "AND is evaluated before OR. Parentheses make the grouping you mean different ones.\n1356  I might double count the publisher along the way.\n1357  And let me show you what we mean here."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["COUNT(DISTINCT \"publisher\")"], "rows": [[30]], "error": null}}, {"id": "D1-01", "module": "M1", "title": "Joined on the wrong column", "bug_type": "join", "origin": "generated", "concepts": ["C1.6"], "difficulty": 2, "db": "longlist", "kind": "query", "prompt": "This should return Fernanda Melchor's book titles, but the titles are wrong.", "broken": "SELECT \"title\" FROM \"authors\"\nJOIN \"authored\" ON \"authors\".\"id\" = \"authored\".\"book_id\"\nJOIN \"books\" ON \"books\".\"id\" = \"authored\".\"book_id\"\nWHERE \"name\" = 'Fernanda Melchor';\n", "hints": ["Read each ON clause aloud. Does it connect a primary key to the matching foreign key?", "`authors.id` is an *author* id. Which column of `authored` holds author ids?", "The first ON should use `authored.author_id`."], "solution": "SELECT \"title\" FROM \"authors\"\nJOIN \"authored\" ON \"authors\".\"id\" = \"authored\".\"author_id\"\nJOIN \"books\" ON \"books\".\"id\" = \"authored\".\"book_id\"\nWHERE \"name\" = 'Fernanda Melchor';\n", "diagnosis": "The broken query matched author id 24 with **book** id 24, which is a coincidence of numbers, not a relationship.\nIds from different tables share values (lecture2 L310-326), so the database can't catch this. Only you can.\n", "source": [{"file": "lecture1", "lines": "1119-1132", "quote": "I have to tell SQL which two columns to try to JOIN these tables by.", "text": "1119  I'll say \"migrations\", and I have to tell it one more thing.\n1120  I have to tell it what we saw visually earlier,\n1121  which is that the id column in sea lions matches the id column in migrations.\n1122  I have to tell SQL which two columns to try to JOIN these tables by.\n1123  So let me do that.\n1124  I'll say JOIN \"migrations\" ON--\n1125  which is a SQL keyword--\n1126  what two columns should correspond?\n1127  I'll now say \"migrations\" dot \"id\"--\n1128  this means the id column inside of migrations table--\n1129  is equal to, or is going to be joined with,\n1130  this \"sea_lions\" table and the \"id\" column within that.\n1131  Again, these two columns should have some matching values\n1132  that we could use to make these rows longer with more columns."}, {"file": "lecture4", "lines": "207-219", "quote": "linking it up by looking at the authors dot ID column", "text": " 207  I'll hit Enter and I'll say JOIN, let's say, the authored table on authors\n 208  dot id equals authored dot author_id.\n 209  And all I'm doing here is saying I'll take first the authors table and then\n 210  why don't I try to combine this table with the authored table,\n 211  linking it up by looking at the authors dot ID column\n 212  and the authored dot author_id column.\n 213  And visually, let's take a look what we're doing here in this join.\n 214  If I look at this in my slides here, I should see--\n 215  I started with my authors table.\n 216  Here I had names of those authors and I had an ID column in that author table.\n 217  Now I'm trying to join the authored table\n 218  by telling SQL that these two columns, author_id and id, should align.\n 219  They should line up like this so their rows are all together."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"columns": ["title"], "rows": [["Paradais"], ["Hurricane Season"]], "error": null}}, {"id": "D1-02", "module": "M1", "title": "Duplicate rows from a one-to-many join", "bug_type": "duplicates", "origin": "generated", "concepts": ["C1.6", "C1.10"], "difficulty": 2, "db": "longlist", "kind": "query", "prompt": "Goal: the titles of 2022 books that have at least one rating, each title **once**.\nThe query returns hundreds of rows.\n", "broken": "SELECT \"title\" FROM \"books\"\nJOIN \"ratings\" ON \"ratings\".\"book_id\" = \"books\".\"id\"\nWHERE \"year\" = 2022;\n", "hints": ["How many rows of `ratings` match one book?", "A JOIN outputs one row per *matching pair*, so a book with 20 ratings appears 20 times.", "Collapse the duplicates with `DISTINCT` or `GROUP BY \"books\".\"id\"`, or use `WHERE \"id\" IN (SELECT \"book_id\" FROM \"ratings\")`."], "solution": "SELECT \"title\" FROM \"books\"\nWHERE \"year\" = 2022\nAND \"id\" IN (SELECT \"book_id\" FROM \"ratings\");\n", "diagnosis": "Joining to the \"many\" side of a one-to-many relationship multiplies rows.", "source": [{"file": "lecture1", "lines": "320-334", "quote": "So this is an example of how we could represent", "text": " 320  So here we have, in the ratings table, the ISBN column still.\n 321  This is the primary key for the books table.\n 322  But now notice how it's inside the ratings table.\n 323  This is now a foreign key because it is outside of this books table\n 324  and inside the ratings table.\n 325  And what could I do with this?\n 326  Well, I now see if I want to find all of the individual users ratings\n 327  for Boulder, I could look-- what is the ISBN of Boulder\n 328  and, then which ratings correspond to that ISBN in some other table?\n 329  So this is an example of how we could represent\n 330  these one-to-many relationships.\n 331  I have, here, a table that has an ISBN, or a list of ISBNs,\n 332  and I have another table that can tell me\n 333  which ratings correspond to this ISBN, this primary key in this other table\n 334  here."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"columns": ["title"], "rows": [["Heaven"], ["Elena Knows"], ["The Book of Mother"], ["Tomb of Sand"], ["A New Name: Septology VI-VII"], ["The Books of Jacob"], ["Love in the Big City"], ["Paradais"], ["Phenotypes"], ["Happy Stories, Mostly"], ["More Than I Love My Life"], ["After the Sun"], ["Cursed Bunny"]], "error": null}}, {"id": "D1-03", "module": "M1", "title": "One ave
