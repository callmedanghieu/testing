e4", "lines": "106-336"}]}, "C4.3": {"name": "Aggregating view; view on view", "refs": [{"file": "lecture4", "lines": "337-526"}, {"file": "lecture4", "lines": "554-603"}]}, "C4.4": {"name": "Temporary view", "refs": [{"file": "lecture4", "lines": "527-632"}]}, "C4.5": {"name": "CTE", "refs": [{"file": "lecture4", "lines": "633-703"}]}, "C4.6": {"name": "Partitioning view", "refs": [{"file": "lecture4", "lines": "709-811"}]}, "C4.7": {"name": "Securing view", "refs": [{"file": "lecture4", "lines": "853-968"}]}, "C4.8": {"name": "INSTEAD OF triggers on views", "refs": [{"file": "lecture4", "lines": "974-1336"}]}, "C5.1": {"name": "Measuring queries; scans", "refs": [{"file": "lecture5", "lines": "124-211"}]}, "C5.2": {"name": "Index + EXPLAIN QUERY PLAN", "refs": [{"file": "lecture5", "lines": "214-348"}]}, "C5.3": {"name": "Covering index", "refs": [{"file": "lecture5", "lines": "349-542"}]}, "C5.4": {"name": "B-trees & trade-offs", "refs": [{"file": "lecture5", "lines": "543-861"}]}, "C5.5": {"name": "Partial index", "refs": [{"file": "lecture5", "lines": "862-942"}]}, "C5.6": {"name": "VACUUM", "refs": [{"file": "lecture5", "lines": "943-1042"}]}, "C5.7": {"name": "Transactions / ACID", "refs": [{"file": "lecture5", "lines": "1049-1330"}]}, "C5.8": {"name": "Race conditions / isolation", "refs": [{"file": "lecture5", "lines": "1331-1455"}]}, "C5.9": {"name": "Locks", "refs": [{"file": "lecture5", "lines": "1456-1553"}]}, "C6.1": {"name": "Database servers", "refs": [{"file": "lecture6", "lines": "40-156"}, {"file": "lecture6", "lines": "159-352"}, {"file": "lecture6", "lines": "1288-1490"}]}, "C6.2": {"name": "MySQL types", "refs": [{"file": "lecture6", "lines": "183-852"}]}, "C6.3": {"name": "ALTER TABLE ... MODIFY", "refs": [{"file": "lecture6", "lines": "853-923"}]}, "C6.4": {"name": "Stored procedures", "refs": [{"file": "lecture6", "lines": "947-1278"}]}, "C6.5": {"name": "PostgreSQL types", "refs": [{"file": "lecture6", "lines": "1293-1477"}]}, "C6.6": {"name": "Scaling strategies", "refs": [{"file": "lecture6", "lines": "1494-1785"}]}, "C6.7": {"name": "Access control", "refs": [{"file": "lecture6", "lines": "1786-1920"}]}, "C6.8": {"name": "SQL injection & prepared statements", "refs": [{"file": "lecture6", "lines": "1921-2148"}]}}, "errata_md": "# Source issues: errata, ambiguities and environment differences\n\nThe transcripts are the primary source of truth for **what** this system teaches. Where a statement in them turned out to be wrong when **executed**, this system teaches the verified behavior and links back here.\nCovers all seven transcripts (lecture0-lecture6). Verification environment: SQLite 3.45.1, MariaDB 10.11 (stands in for MySQL), PostgreSQL 16. The tests in `tests/test_system.py::test_errata_claims` re-run the SQLite checks, and `tests/test_servers.py` re-runs the server checks.\n\n| # | Where | What the lecture says | What actually happens (verified) | Impact on this system |\n|---|---|---|---|---|\n| 1 | lecture2 L1335-1347 | A column declared with no type gets **NUMERIC** affinity. | It gets **BLOB** affinity (also called \"no affinity\"): `CREATE TABLE t(x); INSERT INTO t VALUES ('10');` gives `typeof(x) = 'text'`. A NUMERIC column would give `'integer'`. | Lesson C2.5 and review item R2-08 teach BLOB affinity. |\n| 2 | lecture3 L1077-1087 | With `AUTOINCREMENT`, SQLite reuses an unused id (e.g. 3). | **Reversed.** Without AUTOINCREMENT, SQLite uses max(id)+1, so after deleting the *highest* id, that id can come back. With AUTOINCREMENT, ids are **never** reused: after deleting id 3 (the max), the next id is 4. Neither mode fills gaps. | Lesson C3.1 and review R3-04. The part about the default (L1073-1076, \"take the highest and add 1\") is correct. |\n| 3 | lecture2 L971-978 | `NOT NULL` on foreign-key columns is redundant, because the FK constraint already prevents NULL. | A foreign-key column **accepts NULL** (a NULL references nothing and is never checked). If a link is mandatory, add `NOT NULL` yourself. The PRIMARY KEY half of the claim is right for `INTEGER PRIMARY KEY`. | Lesson C2.7, debugging D2-03. |\n| 4 | lecture2 L1311-1313 | \"My foreign key constraints aren't actually being checked right now, but yours might be.\" | SQLite **does not enforce foreign keys by default**. Each connection must run `PRAGMA foreign_keys = ON;`. The lecture3 demo that raises a FOREIGN KEY error (L895) only works with it on. | Every practice database in this system runs `PRAGMA foreign_keys = ON`, and Lesson C3.6 explains it. |\n| 5 | lecture3 L358, L1324 | Inserts accession number `06.1899` (spoken unquoted). | Unquoted, `06.1899` is a *number*. The TEXT affinity column stores `'6.1899'` and the leading zero is lost. Identifiers that look numeric should be inserted as quoted strings. | The seed data quotes them; review R3-09 asks you to predict this. |\n| 6 | lecture4 L1136 | `create trigger delete ...` | `delete` is a keyword and must be quoted (`CREATE TRIGGER \"delete\" ...`). Otherwise the result is `near \"delete\": syntax error`. The lecture's on-screen code presumably quoted it. | Solutions name it `\"delete\"`. |\n| 7 | lecture6 L659-668 | \"decimal 5 comma 1 ... between -999.99 and 999.99\". | `DECIMAL(5,2)` is ±999.99. `DECIMAL(5,1)` is ±9999.9 (MariaDB accepted 9999.9 into DECIMAL(5,1) and rejected 99999.9). The rule: M total digits, D of them after the point. | Lesson C6.2 and review R6-03 use the correct rule. |\n| 8 | lecture6 L2124-2136 | The prepared statement \"escapes\" SQL keywords, so `1 UNION SELECT * FROM accounts` only runs the `= 1` part. | A prepared statement **never parses the value as SQL**. It is bound as data. MariaDB/MySQL then compares the INT id with the string `'1 UNION ...'` by converting it to a number (1), raising warning 1292 *Truncated incorrect DECIMAL value*. That is why Alice comes back. In SQLite, the same bound string matches **no** row (there is no numeric conversion). | Lesson C6.8 and exercise M6-E08 explain binding vs escaping. |\n| 9 | lecture6 L564-574 | VARCHAR(300) uses up to 300 bytes for every short string. | VARCHAR stores the actual length plus 1-2 length bytes. It is **CHAR(M)** that always uses M characters. Over-sized VARCHARs still have costs (memory for temporary tables and sorts, weaker validation), so \"size it thoughtfully\" stays good advice. | Lesson C6.2 notes it. |\n| 10 | lecture6 L787-797 | `MUL` in `DESCRIBE` means \"foreign key / multiple\". | `MUL` means the column is the first column of a **non-unique index**, so duplicate values are allowed. In InnoDB, foreign-key columns get such an index automatically, which is why they show MUL. | Lesson C6.2 explains it. |\n| 11 | lecture4 L820-848 | \"You can't update a view.\" | True **in SQLite** (verified: `cannot modify v because it is a view`) unless you add INSTEAD OF triggers. MySQL and PostgreSQL allow INSERT/UPDATE/DELETE through *simple* single-table views. | Lesson C4.8 makes it SQLite-specific. |\n| 12 | lecture4 L324-330 | Put ORDER BY in the view and its rows are \"saved\" sorted. | SQLite does honor an ORDER BY inside a view, but standard SQL does not guarantee row order unless the **outer** query has ORDER BY. | Lesson C4.2 recommends ordering in the outer query. |\n| 13 | lecture5 L475-476 | \"search stars using the index ... called name_index given some person ID\". | Slip of the tongue: that line of the plan uses **person_index**. | None |\n| 14 | lecture3 L1618 | \"create trigger sell before delete on transactions\". | Misread on screen: the trigger is `BEFORE DELETE ON collections`. | None |\n| 15 | lecture4 L1192 | \"the ID column has been updated from a 0 now to a 1\". | Slip: the **deleted** column changed. | None |\n| 16 | lecture3 L929 | \"DELETE FROM artists WHERE artist_id = ...\" | The lecturer catches this at L947-953: it must be `DELETE FROM created`. | Used as debugging item D3-02. |\n| 17 | lecture5 L1260-1325, L1536 | ROLLBACK / BEGIN EXCLUSIVE demos. | The behavior is correct. One note: in SQLite a failed statement inside a transaction does **not** automatically roll the transaction back. You must issue ROLLBACK (as the lecture does). | Lesson C5.7 |\n| 18 | lecture3 L1000-1004 | `ON DELETE NO ACTION`: \"I could delete the primary key referenced by this foreign key, and nothing would happen. I would actually be allowed to do that.\" | **Not allowed.** NO ACTION means \"take no *special* action\", but the foreign-key constraint is still checked. With `PRAGMA foreign_keys=ON`, SQLite fails with `FOREIGN KEY constraint failed`, and MariaDB with error 1451. The difference from RESTRICT is only timing: RESTRICT fails immediately, while NO ACTION is checked at the end of the statement (or transaction, if deferred). | Lesson C3.6 table. |\n| 19 | lecture0 L1314-1325 | \"MAX seems to give us the lowest alphabetically\". | Slip: on text, `MAX` returns the alphabetically **last** value (*Wretchedness*), and `MIN` the first (*A New Name…*). The lecture's conclusion that MAX/MIN don't measure length is right. | Lesson C0.10, review R0-07. |\n| 20 | lecture1 L1652-1662 | UNION / INTERSECT / EXCEPT need \"the same number and the same type of columns … same column names\". | Only the **number** of columns must match. The result takes its column names from the first SELECT, and SQLite does not enforce matching types (verified: `SELECT n AS first_name … UNION SELECT n AS other_name …` works). Matching kinds of data is still good practice. | Lesson C1.9, debugging D1-09. |\n| 21 | lecture0 L951-971 | LIKE is case-insensitive. | True only for **ASCII** letters by default: `'A' LIKE 'a'` is 1, but `'Ñ' LIKE 'ñ'` is 0 (verified). | Lesson C0.7. |\n| 22 | lecture0 L1363-1373 | A misspelled column `\"pubsliher\"` \"creates this data for me\". | The mechanism: SQLite treats a double-quoted identifier that matches no column as a **string literal** (a legacy misfeature). MySQL and PostgreSQL would report an unknown column. | Debugging D0-03. |\n| 23 | lecture1 L1673-1677, lecture4 L374-384 | Slides: book 1 has ratings 4, 3, 4 (avg 3.67), and book 2 has 2, 3 (avg 2.5). | These are **illustrations**. The same lectures' real query outputs say book 1 has 2,779 ratings averaging 3.774… and book 2 has 176 averaging 3.97 (lecture1 L1737, L1799-1800; lecture4 L409). The datasets follow the real outputs. | Review R1-06, exercise M1-E19. |\n| 24 | lecture0 L603-606 | \"Or IS IT NULL, meaning that it actually is there.\" | Transcription: the operator is `IS NOT NULL`. | None |\n| 25 | lecture1 L1349-1351 | \"the first one's on the left; the first one's on the right\". | Slip: for two joined tables, the first is on the left and the second on the right. | None |\n| 26 | lecture1 L1213-1288 | RIGHT JOIN / FULL JOIN demonstrated. | Correct, but supported only since **SQLite 3.39.0** (2022). Older versions fail with \"RIGHT and FULL OUTER JOINs are not currently supported\". | Lesson C1.7. |\n\n## Environment differences you will notice\n\n* **Dataset size.** `movies` here is a small sample (19 movies), not the 400k-row IMDb file, so `.timer` differences are tiny. `python3 tools/build_db.py --big` adds 300,000 synthetic movies and people so the Lecture 5 timing demos become visible again. `EXPLAIN QUERY PLAN` output is the same at any size.\n* **Ratings and votes are synthetic but engineered.** The individual ratings in `longlist` are generated so that the lectures' own query results come out the same: lecture1 L1685, L1737, L1769-1770, L1799-1800, and lecture4 L409, L581-586. The same applies to the ratings and votes in `longlist0` (lecture0 L1003, L1037-1075, L1166, L1243-1267, L1288). `tests/test_system.py::test_facts_from_the_lectures` checks them.\n* **Publishers.** `longlist0` has 30 distinct publishers, while the lecture's data has 33 (lecture0 L1401). Three books' publishers were left unknown (NULL) rather than guessed.\n* **MySQL → MariaDB.** Everything in Lecture 6 that this system executes ran on MariaDB 10.11. MariaDB's `DESCRIBE` output and some messages differ slightly from MySQL 8.\n* **Plan wording.** SQLite ≥ 3.36 prints `SCAN movies` where older versions printed `SCAN TABLE movies`.\n", "roadmap_md": "# Learning roadmap\n\n## Dependency graph (concept level)\n\nArrows point from a concept to the concepts that need it. Concept IDs are defined in [knowledge_map.md](knowledge_map.md). Module *n* = CS50 SQL week *n* = `sources/lecture<n>.txt`.\n\n```mermaid\ngraph LR\n  subgraph M0[M0 Querying]\n    C01[C0.1 DB & SQL] --> C02[C0.2 SELECT] --> C03[C0.3 LIMIT]\n    C02 --> C04[C0.4 WHERE] --> C05[C0.5 AND/OR] & C06[C0.6 NULL] & C07[C0.7 LIKE] & C08[C0.8 ranges]\n    C02 --> C09[C0.9 ORDER BY]\n    C06 --> C010[C0.10 aggregates] --> C011[C0.11 DISTINCT]\n  end\n  subgraph M1[M1 Relating]\n    C11[C1.1 relationships] --> C12[C1.2 ER] --> C13[C1.3 keys]\n    C14[C1.4 subqueries] --> C15[C1.5 IN]\n    C13 --> C16[C1.6 JOIN] --> C17[C1.7 OUTER] & C18[C1.8 NATURAL]\n    C19[C1.9 sets]\n    C110[C1.10 GROUP BY/HAVING]\n  end\n  subgraph M2[M2 Designing]\n    C21[C2.1 shell & schema.sql] --> C24[C2.4 CREATE TABLE]\n    C24 --> C25[C2.5 types] --> C26[C2.6 PK/FK] --> C27[C2.7 column constraints]\n    C24 --> C22[C2.2 normalizing] --> C23[C2.3 relationships]\n    C24 --> C28[C2.8 ALTER TABLE]\n  end\n  subgraph M3[M3 Writing]\n    C31[C3.1 INSERT] --> C32[C3.2 violations] --> C33[C3.3 multi-row / INSERT SELECT] --> C34[C3.4 .import]\n    C35[C3.5 DELETE] --> C36[C3.6 ON DELETE]\n    C37[C3.7 UPDATE] --> C38[C3.8 cleaning]\n    C39[C3.9 triggers]\n    C310[C3.10 soft delete]\n  end\n  subgraph M4[M4 Viewing]\n    C41[C4.1 view] --> C42[C4.2 simplify] & C43[C4.3 aggregate] & C46[C4.6 partition] & C47[C4.7 secure]\n    C43 --> C44[C4.4 temp view] --> C45[C4.5 CTE]\n    C48[C4.8 INSTEAD OF]\n  end\n  subgraph M5[M5 Optimizing]\n    C51[C5.1 timer/scan] --> C52[C5.2 index] --> C53[C5.3 covering] & C54[C5.4 B-tree] & C55[C5.5 partial]\n    C54 --> C56[C5.6 VACUUM]\n    C57[C5.7 transactions] --> C58[C5.8 races] --> C59[C5.9 locks]\n  end\n  subgraph M6[M6 Scaling]\n    C61[C6.1 servers] --> C62[C6.2 MySQL types] --> C63[C6.3 MODIFY] & C65[C6.5 Postgres types]\n    C61 --> C64[C6.4 procedures] & C66[C6.6 scaling] & C67[C6.7 access control]\n    C68[C6.8 injection]\n  end\n  C04 --> C14\n  C02 --> C11\n  C010 --> C110\n  C011 --> C19\n  C06 --> C17\n  C12 --> C23\n  C13 --> C26\n  C04 --> C24\n  C26 --> C31\n  C27 --> C32\n  C04 --> C35 & C37\n  C14 --> C35 & C37 & C33\n  C110 --> C38 & C43\n  C07 --> C38\n  C16 --> C42\n  C28 --> C310\n  C37 --> C310\n  C31 --> C39\n  C39 --> C48\n  C310 --> C48\n  C04 --> C51\n  C14 --> C53\n  C27 --> C57\n  C37 --> C57\n  C25 --> C62\n  C310 --> C64\n  C47 --> C67\n  C04 --> C68\n```\n\n## Recommended sequence\n\nThe lectures' own order (query → relate → design → write → view → optimize → scale) is a sound progression, and it is **kept**: module *n* = week *n*. Changes made:\n\n1. **Within M0, the lecture order is kept.** It builds well: SELECT → filters → patterns → ranges → sorting → aggregates.\n2. **In M1, GROUP BY/HAVING come last**, as in the lecture, because they combine aggregates (M0) with multi-table thinking. The lecture's two left-open tasks (M1-E17 title lookup, M1-E18 symmetric difference) are the module's challenges.\n3. **In M2, constraints are grouped by kind**, not by when they were spoken. The lecture introduces NOT NULL/UNIQUE (L915-1022), detours into the CharlieCard redesign, and returns to CHECK/DEFAULT (L1231-1305). Here C2.7 holds all four.\n4. **Relationships appear twice by design.** M1 *reads* them (ER diagrams, keys), and M2 *designs* them (CREATE TABLE with keys). C2.3 builds on C1.2.\n5. **Soft deletion spans M3 → M4 → M6**, as in the sources: flag (lecture3) → view + INSTEAD OF triggers (lecture4) → stored procedure (lecture6).\n6. **Two optional shortcuts.** Transactions (C5.7-C5.9) depend only on M2-M3, and SQL injection (C6.8) only on M0. If you work on a production app, study them early.\n\n| Step | Module | Core concepts | Est. study time | Practice items | Gate to move on (mastery criteria) |\n|---|---|---|---|---|---|\n| 0 | [M0 Querying](modules/M0.md) | C0.1-C0.11 | 3-4 h | 18 + 4 debugging | M0-E05, M0-E13, M0-E17 without hints |\n| 1 | [M1 Relating](modules/M1.md) | C1.1-C1.10 | 5-6 h | 23 + 9 debugging | The two lecture assignments (M1-E17, M1-E18); JOIN row counts predicted |\n| 2 | [M2 Designing](modules/M2.md) | C2.1-C2.8 | 4-5 h | 13 + 4 debugging | You can write the full mbta schema from a blank file |\n| 3 | [M3 Writing](modules/M3.md) | C3.1-C3.10 | 5-6 h | 15 + 6 debugging | votes cleanup and the sell/buy triggers from memory |\n| 4 | [M4 Viewing](modules/M4.md) | C4.1-C4.8 | 4-5 h | 13 + 3 debugging | current_collections with all three INSTEAD OF triggers |\n| 5 | [M5 Optimizing](modules/M5.md) | C5.1-C5.9 | 4-5 h | 12 + 4 debugging | Reach a covering-index plan for the Tom Hanks query; explain ACID with the bank example |\n| 6 | [M6 Scaling](modules/M6.md) | C6.1-C6.8 | 4-6 h | 11 + 2 debugging | Translate mbta to MySQL and Postgres; explain sync vs async replication; demo injection vs a bound parameter |\n\n## Spaced review plan\n\nUse the review decks in [`../review/`](../review/) (or the **Review** tab in the app). After finishing a module, review it on this schedule, counting from the day you finish it:\n\n| When | What |\n|---|---|\n| Day 1 (same day) | The module's quick-review and concept-check items |\n| Day 3 | Predict-the-output items + 2 debugging items |\n| Day 7 | Re-solve 3 exercises from the module **without hints** (pick ones you needed hints for) |\n| Day 14 | Mixed deck: this module + all earlier modules |\n| Day 30 | Write one full solution from scratch for the module's capstone (listed in each module page) |\n\nThe app's Review tab records your self-rating (Again / Hard / Good / Easy) for each card and schedules the next review: Again = 1 day, Hard = 3 days, Good = 7 days, Easy = 14 days. Each successful review doubles the interval.\n\n## Gaps in the source material\n\nThese are **not** taught in the seven transcripts, so this system does not invent lessons for them. Learn them from another source when needed:\n- **Window functions** (`OVER`, `PARTITION BY`, `RANK`, …): never mentioned. No window-function lessons or debugging items exist here.\n- `CASE` expressions, `COALESCE`/`IFNULL`, string and date functions beyond `trim`/`upper`/`lower`/`ROUND`, `LIMIT … OFFSET`.\n- Recursive CTEs, `UPSERT`/`ON CONFLICT`, `RETURNING`, JSON functions.\n- Formal normal forms (1NF/2NF/3NF), which lecture2 L251-254 mentions only by name.\n- Isolation *levels* (READ COMMITTED, SERIALIZABLE, …) and MVCC. Lecture 5 covers only SQLite's database-level locks.\n- Stored-procedure control flow (IF / loops) and OUT parameters. Lecture 6 L1254-1277 only names them.\n"};
const MODS = DATA.modules;
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));
const ITEMS = Object.fromEntries(DATA.exercises.concat(DATA.debugging).map(e => [e.id, e]));
const ORDERED = DATA.exercises.concat(DATA.debugging);

let E = null; // grading engine, set once sql.js loads

/* ---------- storage (per-viewer convenience; never required) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("sqlline:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sqlline:" + k, JSON.stringify(v)); } catch (e) {} }
};
let P = store.get("progress", { items: {}, cards: {} });
const saveP = () => { store.set("progress", P); paintRail(); };
const st = id => (P.items[id] = P.items[id] || {});

const today = () => new Date().toISOString().slice(0, 10);

/* ---------- tiny helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
const modColor = m => `var(--m${m[1]})`;
const stars = n => "★".repeat(n);
function inline(s) {
  const codes = [];
  let t = String(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = esc(t);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span title="$2">$1</span>');
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function md(src) {
  const lines = String(src).replace(/<!--[\s\S]*?-->/g, "").split("\n");
  let out = [], i = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (/^```/.test(l)) {
      const lang = l.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(lang === "mermaid" ? `<pre class="mermaid">${esc(buf.join("\n"))}</pre>` : `<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    if (/^#{1,4} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n + 1}>${inline(l.slice(n + 1))}</h${n + 1}>`); i++; continue; }
    if (/^---\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\|/.test(l) && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, "|")));
      const head = cells(l); i += 2; const body = [];
      while (i < lines.length && /^\|/.test(lines[i])) body.push(cells(lines[i++]));
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^> ?/.test(l)) { const buf = []; while (i < lines.length && /^> ?/.test(lines[i])) buf.push(lines[i++].replace(/^> ?/, "")); out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue; }
    if (/^\s*([-*]|\d+\.) /.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const buf = [];
      while (i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i])) { let item = lines[i++].replace(/^\s*([-*]|\d+\.) /, ""); while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.) /.test(lines[i])) item += " " + lines[i++].trim(); buf.push(item); }
      out.push(`<${ordered ? "ol" : "ul"}>${buf.map(x => `<li>${inline(x.replace(/^\[ \] /, "☐ "))}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,4} |```|\||> |\s*([-*]|\d+\.) |---)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}
function resultTable(res, limit = 200) {
  if (res.error) return `<div class="feedback bad"><b>Error.</b> ${esc(res.error)}</div>`;
  if (!res.columns) return `<p class="muted small">Statement ran. No result set${res.notes && res.notes.length ? " (errors along the way: " + esc(res.notes.join("; ")) + ")" : ""}.</p>`;
  const rows = res.rows || [];
  const body = rows.slice(0, limit).map(r => "<tr>" + r.map(v => v === null ? `<td class="null">NULL</td>` : `<td>${esc(v)}</td>`).join("") + "</tr>").join("");

    <p class="muted small">${rows.length} row${rows.length === 1 ? "" : "s"}${rows.length > limit ? `, first ${limit} shown` : ""}</p>`;
}
function expectedHtml(ex) {

}

const INTERVALS = { again: 1, hard: 3, good: 7, easy: 14 };

function wireDeck() {
  const box = document.getElementById("deck");

  const c = deck[deckPos], ref = c.ref && ITEMS[c.ref];
  const kinds = { quick: "Quick review", concept: "Concept check", predict: "Predict the output", debug: "Debugging", write: "Query writing" };
  let body = "";
  if (c.type === "quick") body = `<div class="prompt">${md(c.front)}</div><button class="btn" id="reveal">Reveal answer</button><div id="ans" hidden>${md(c.back)}</div>`;
  if (c.type === "concept" || c.type === "predict") {
    body = (c.type === "predict" ? `<p class="small muted">Dataset <code>${esc(c.db || "empty")}</code>${c.setup ? ", after this setup:" : ":"}</p>${c.setup ? `<pre><code>${esc(c.setup)}</code></pre>` : ""}<pre><code>${esc(c.sql)}</code></pre><p>What is printed?</p>` : `<div class="prompt">${md(c.question)}</div>`) +
      `<div class="choices">${c.choices.map((ch, i) => `<button data-i="${i}">${String.fromCharCode(65 + i)}. ${c.type === "predict" ? `<code>${esc(ch)}</code>` : inline(ch)}</button>`).join("")}</div><div id="ans" hidden></div>`;
  }
  if (c.type === "debug" || c.type === "write") body = `<p>Solve <b>${esc(ref.id)} · ${esc(ref.title)}</b> without hints, then rate yourself.</p><button class="btn" data-go="${ref.id}">Open ${esc(ref.id)}</button><div id="ans"></div>`;
  box.innerHTML = `<p class="out-label">${esc(kinds[c.type])} · card ${deckPos + 1}/${deck.length} · ${esc(c.id)}</p>${body}
    ${c.source && c.source.length ? sourceHtml(c.source) : ""}
    <div class="rate" id="rate" ${c.type === "quick" || c.type === "concept" || c.type === "predict" ? "hidden" : ""}><span class="small muted">How well did you know it?</span>
    ${Object.keys(INTERVALS).map(k => `<button class="btn" data-rate="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("")}</div>`;
  const rate = document.getElementById("rate"), ans = document.getElementById("ans");

  if (rv) rv.onclick = () => { ans.hidden = false; rate.hidden = false; rv.remove(); };
  box.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    box.querySelectorAll(".choices button").forEach(x => { x.disabled = true; if (+x.dataset.i === c.answer) x.classList.add("right"); });
    if (i !== c.answer) b.classList.add("wrong");
    ans.hidden = false;
    ans.innerHTML = `<div class="feedback ${i === c.answer ? "ok" : "bad"}">${i === c.answer ? "✔ Right." : "✘ Not quite."} ${inline(c.why)}</div>` +
      (c.type === "predict" ? `<p><button class="btn" id="runit">Run it and see</button></p><div id="runout"></div>` : "");
    const ri = document.getElementById("runit");
    if (ri) ri.onclick = () => { const db = E.freshDb(c.db); try { if (c.setup) db.exec(c.setup); document.getElementById("runout").innerHTML = resultTable(E.runScript(db, c.sql)); } finally { db.close(); } };
    rate.hidden = false;
  });
  box.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => {
    const k = b.dataset.rate, prev = P.cards[c.id];

}

  const types = [...new Set(DATA.debugging.map(d => d.bug_type))];
  view.innerHTML = `<h1>Debugging yard</h1><p class="prose">Each item starts from a <b>broken</b> query, already loaded in the editor. Find what's wrong, fix it, and Check.
  Bug categories here: ${types.map(t => `<span class="chip">${esc(t)}</span>`).join("")}. Window-function bugs are absent on purpose: your lectures don't cover window functions.</p>
  <div class="list">${DATA.debugging.map(d => `<button class="row" data-go="${d.id}"><span class="line-chip" style="--c:${modColor(d.module)}">${d.module}</span>
  <span><span class="t">${esc(d.id)} · ${esc(d.title)}</span><br><span class="s">${originBadge(d)} <span class="stars">${stars(d.difficulty)}</span></span></span>${itemState(d.id)}</button>`).join("")}</div>`;
}
function renderSandbox() {
  const ds = store.get("sandbox:db", "longlist");
  view.innerHTML = `<h1>Sandbox</h1><p class="prose">Free practice on any dataset. Each Run starts from a fresh copy, so experiment freely. Dot-commands like <code>.schema</code> don't exist here; query <code>sqlite_master</code> instead.</p>
  <div class="tools"><label for="dsel">Dataset</label><select id="dsel">${Object.keys(DATA.datasets).map(n => `<option ${n === ds ? "selected" : ""}>${n}</option>`).join("")}<option value="">(empty)</option></select>
  <button class="btn" id="sch">Show schema</button></div>
  <div class="bench"><textarea class="sql" id="sbx" spellcheck="false">${esc(store.get("sandbox:sql", 'SELECT "name", "sql" FROM sqlite_master;'))}</textarea>
  <div class="tools"><button class="btn primary" id="srun">Run</button><span class="kbd">Ctrl+Enter</span></div><div id="sout"></div></div>`;
  const ed = document.getElementById("sbx"), sel = document.getElementById("dsel");
  const run = sql => { const db = E.freshDb(sel.value || null); try { document.getElementById("sout").innerHTML = resultTable(E.runScript(db, sql, true)); } finally { db.close(); } };
  document.getElementById("srun").onclick = () => { store.set("sandbox:sql", ed.value); store.set("sandbox:db", sel.value); run(ed.value); };
  document.getElementById("sch").onclick = () => run(`SELECT "type", "name", "sql" FROM sqlite_master WHERE "sql" IS NOT NULL;`);
  ed.addEventListener("keydown", ev => { if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); document.getElementById("srun").click(); } if (ev.key === "Tab") { ev.preventDefault(); ed.setRangeText("    ", ed.selectionStart, ed.selectionEnd, "end"); } });
}
function renderSources() {
  const files = { lecture0: "Querying", lecture1: "Relating", lecture2: "Designing", lecture3: "Writing", lecture4: "Viewing", lecture5: "Optimizing", lecture6: "Scaling" };
  const byFile = {};
  for (const [cid, c] of Object.entries(DATA.concepts)) for (const r of c.refs) (byFile[r.file] = byFile[r.file] || []).push([+r.lines.split("-")[0], `<b>${cid}</b> ${esc(c.name)}`, r.lines, null]);
  for (const e of ORDERED) for (const r of e.source) (byFile[r.file] = byFile[r.file] || []).push([+r.lines.split("-")[0], `${esc(e.id)} ${esc(e.title)} ${originBadge(e)}`, r.lines, e.id]);
  view.innerHTML = `<h1>Source map</h1><p class="prose">Where every concept and practice item comes from in your transcripts (line numbers refer to the uploaded <code>.txt</code> files).
  Concepts come from <code>curriculum/knowledge_map.md</code>. Each practice item shows its excerpt on its own page.</p>` +
    Object.entries(files).map(([f, t]) => `<h3>${f} · ${t}</h3><div class="tablewrap"><table><thead><tr><th>Lines</th><th>Concept / item</th></tr></thead><tbody>${(byFile[f] || []).sort((a, b) => a[0] - b[0]).map(([, label, lines, id]) =>
      `<tr><td>L${esc(lines)}</td><td>${id ? `<a href="#${id}">${label}</a>` : label}</td></tr>`).join("")}</tbody></table></div>`).join("");
}
function renderBackup() {
  view.innerHTML = `<h1>Progress backup</h1><p class="prose">Your progress lives in this browser only. Copy it somewhere safe, or paste a backup to restore it (it also works with <code>progress/progress.json</code> from the terminal trainer).</p>
  <textarea class="backup" id="bk" spellcheck="false">${esc(JSON.stringify(P))}</textarea>
  <div class="tools"><button class="btn" id="cp">Copy</button><button class="btn" id="rs">Restore from the box</button><span id="bmsg" class="small"></span></div>`;
  const msg = t => document.getElementById("bmsg").textContent = t;
  document.getElementById("cp").onclick = () => { const t = document.getElementById("bk"); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => msg("Copied."), () => { t.select(); msg("Selected. Press Ctrl+C to copy."); }); };
  document.getElementById("rs").onclick = () => { try { const v = JSON.parse(document.getElementById("bk").value); const fromCli = v.items && Object.values(v.items).some(x => "passed_on" in x || "saw_solution" in x || "self_done" in x);
    if (fromCli) for (const x of Object.values(v.items)) { x.sawSolution = x.saw_solution; x.selfDone = x.self_done; }
    P = { items: v.items || {}, cards: v.cards || {} }; saveP(); msg("Restored."); } catch (e) { msg("That isn't valid progress JSON."); } };
}
function route() {
  const t = location.hash.slice(1) || "home";
  if (!E) return;
  if (MOD[t]) renderModule(t);
  else if (ITEMS[t]) renderItem(t);
  else if (t === "review") renderReview();
  else if (t === "debug") renderDebugIndex();
  else if (t === "sandbox") renderSandbox();
  else if (t === "sources") renderSources();
  else if (t === "errata") view.innerHTML = `<article class="prose">${md(DATA.errata_md)}</article>`;
  else if (t === "roadmap") view.innerHTML = `<article class="prose">${md(DATA.roadmap_md)}</article>`;
  else if (t === "backup") renderBackup();
  else renderHome();
  paintRail();
  window.scrollTo(0, 0);
}
paintRail();
if (typeof initSqlJs !== "function") {
  view.innerHTML = `<div class="feedback bad">The SQLite engine (vendor/sql-asm.js) did not load. Open this page from the <code>app/</code> folder so that <code>vendor/sql-asm.js</code> is next to it.</div>`;
} else {
  initSqlJs().then(SQL => { E = SQLEngine.make(SQL, DATA.datasets); route(); })
    .catch(err => { view.innerHTML = `<div class="feedback bad">Could not start SQLite: ${esc(err.message || err)}</div>`; });
}
</script>

</html>
