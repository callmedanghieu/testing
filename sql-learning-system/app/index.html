"use strict";
const DATA = {"modules": [{"id": "M0", "title": "Querying", "lesson": "lessons/M0-querying.md", "sources": "lecture0 (whole file)", "prerequisites": ["none"], "objectives": ["Explain what databases, DBMSs and SQL are, and why they beat spreadsheets at scale", "Read data with SELECT / FROM / LIMIT, quoting identifiers and strings correctly", "Filter with =, != / <>, NOT, AND / OR (with parentheses), IS NULL, LIKE (% and _), ranges and BETWEEN", "Sort with ORDER BY (ASC / DESC, several keys)", "Summarize with COUNT, AVG, MIN, MAX, SUM, ROUND, AS and DISTINCT"], "challenge": ["M0-E13", "M0-E17", "M0-E05"], "mastery": ["Solve M0-E05, M0-E13 and M0-E17 without opening any hint", "Explain why `= NULL` and `COUNT(\"translator\")` behave as they do (D0-01, R0-05)", "Score ≥ 80% on review deck R0"], "lesson_md": "# M0 · Querying\n*Source: lecture0 (Week 0 · Querying). Dataset: `longlist0`, a single `longlist` table of the 78 books longlisted for the International Booker Prize, 2018-2023.*\n\nStory: a librarian and an avid reader want answers from one table of books. Which ones are from 2023? Which aren't hardcover? Which have \"love\" in the title? What are the ten best rated? Every question becomes a query.\n\n---\n\n## C0.1 Databases, DBMSs and SQL\n*Source: lecture0 L28-169*\n\n**Level 1: Intuition.** A table is a very old idea (rows = items, columns = attributes). Spreadsheets hold tables too. A **database** adds scale (millions of rows), frequent updates, and fast search. A **DBMS** (database management system) is the program you talk to: SQLite, MySQL, PostgreSQL, Oracle and others. **SQL**, the Structured Query Language, is the language you talk in. With it you **c**reate, **r**ead, **u**pdate and **d**elete data (CRUD).\n\n**Level 2.** `sqlite3 longlist.db` opens a database file. The prompt changes to `sqlite>`, and you can type SQL ending in `;`. `.quit` leaves.\n\n**Level 3.** Trade-offs between DBMSs (L132-154): proprietary systems come with support, while open-source ones are free but you run them yourself. MySQL and PostgreSQL are heavier and more featureful, while SQLite is light and everywhere (phones, desktop apps, websites). This course starts in SQLite and reaches MySQL and PostgreSQL in M6.\n\n---\n\n## C0.2 SELECT and FROM\n*Source: lecture0 L251-360*\n\n**Level 1.** \"Show me these columns of that table.\"\n\n**Level 2.**\n```sql\nSELECT * FROM \"longlist\";                  -- every column\nSELECT \"title\", \"author\" FROM \"longlist\";  -- just two\n```\n* **Identifiers** (table and column names) go in **double quotes**. **Strings** go in **single quotes** (L304-315).\n* Write SQL keywords in UPPERCASE. It isn't required, but it makes long queries readable (L338-360).\n\n**Level 3.** Select only the columns you need. In SQLite, a double-quoted name that matches no column is silently treated as a *string*, so a typo like `\"pubsliher\"` prints the word instead of an error (L1363-1377, debugging D0-03).\n\n---\n\n## C0.3 LIMIT\n*Source: lecture0 L366-396*\n\n`SELECT \"title\" FROM \"longlist\" LIMIT 5;` returns at most 5 rows. Use it to peek. Without ORDER BY you get the rows \"in whatever order they were added\". That is fine for a peek, but don't rely on it for anything else.\n\n---\n\n## C0.4 WHERE, not-equals and NOT\n*Source: lecture0 L397-515*\n\n**Level 1.** Ask a yes/no question of every row, and keep the \"yes\" rows.\n\n**Level 2.**\n```sql\nSELECT \"title\", \"author\" FROM \"longlist\" WHERE \"year\" = 2023;\nSELECT \"title\", \"format\" FROM \"longlist\" WHERE \"format\" != 'hardcover';   -- also: <>\nSELECT \"title\", \"format\" FROM \"longlist\" WHERE NOT \"format\" = 'hardcover';\n```\nNumbers are not quoted (`2023`), and strings are (`'hardcover'`).\n\n**Level 3.** `!=` and `<>` are identical, and `!=` is more common. NOT negates a whole condition, which helps when the condition is complex.\n\n---\n\n## C0.5 AND, OR and parentheses\n*Source: lecture0 L517-564*\n\n```sql\nSELECT \"title\", \"format\" FROM \"longlist\"\nWHERE (\"year\" = 2022 OR \"year\" = 2023) AND \"format\" != 'hardcover';\n```\n**Level 3.** AND is evaluated before OR. Without the parentheses the query means `2022 OR (2023 AND not hardcover)` and lets 2022 hardcovers through (D0-02). Long queries can continue on the next line; the shell waits for the `;`.\n\n---\n\n## C0.6 NULL\n*Source: lecture0 L587-633*\n\n**Level 1.** NULL means \"no value here\", not zero and not an empty string.\n\n**Level 2.** `WHERE \"translator\" IS NULL` finds the 2 books without a translator, and `IS NOT NULL` finds the others.\n\n**Level 3.** `= NULL` is never true (D0-01). Aggregates such as `COUNT(\"translator\")` skip NULLs, which is why it returns 76 while `COUNT(*)` returns 78 (C0.10).\n\n---\n\n## C0.7 LIKE, % and _\n*Source: lecture0 L638-830, L951-971*\n\n| Pattern | Matches |\n|---|---|\n| `'%love%'` | \"love\" anywhere (Love in the Big City, More Than I Love My Life, …) |\n| `'The %'` | starts with the word \"The\" |\n| `'P_re'` | P + one character + re → Pyre |\n| `'T___'` | T + exactly three characters → Tyll |\n\n**Level 3.** `LIKE` ignores case for ASCII letters, while `=` is case-sensitive (`= 'pyre'` finds nothing). Make patterns as specific as your intent. `'The%'` also matches \"There…\" and \"They…\".\n\n---\n\n## C0.8 Ranges and BETWEEN\n*Source: lecture0 L834-930*\n\n```sql\nWHERE \"year\" >= 2019 AND \"year\" <= 2022\nWHERE \"year\" BETWEEN 2019 AND 2022          -- inclusive at both ends\nWHERE \"rating\" > 4.0 AND \"votes\" > 10000     -- 4 books\nWHERE \"pages\" < 300\n```\n**Level 3.** Replace chains of `OR \"year\" = …` with a range (the lecturer calls the OR chain badly designed). You need to know a column's type to compare it well. Here year and votes are integers and rating is a real number (L937-950).\n\n---\n\n## C0.9 ORDER BY\n*Source: lecture0 L976-1130*\n\n```sql\nSELECT \"title\", \"rating\", \"votes\" FROM \"longlist\"\nORDER BY \"rating\" DESC, \"votes\" DESC\nLIMIT 10;\n```\n* The default is **ASC** (smallest first). The lecturer's first \"top 10\" showed the worst books (3.05 … 3.42).\n* A second key breaks ties. *When We Cease to Understand the World* and *Still Born* both have 4.14, and votes decide their order.\n* On text, ASC means A→Z and DESC means Z→A.\n\n---\n\n## C0.10 Aggregate functions, ROUND and AS\n*Source: lecture0 L1131-1343*\n\n```sql\nSELECT ROUND(AVG(\"rating\"), 2) AS \"average rating\" FROM \"longlist\";   -- 3.75\nSELECT MAX(\"rating\"), MIN(\"rating\"), SUM(\"votes\") FROM \"longlist\";    -- 4.52, 3.05, > 600,000\nSELECT COUNT(*), COUNT(\"translator\") FROM \"longlist\";                  -- 78, 76\n```\n**Level 1.** An aggregate turns many rows into one value. `ROUND(x, 2)` tidies the number, and `AS` gives the column a readable name.\n**Level 3.** `COUNT(*)` counts rows, while `COUNT(column)` counts non-NULL values. On text, MAX and MIN compare **alphabetically**, not by length: MAX = *Wretchedness*, MIN = *A New Name…* (the lecture misspeaks here, see errata #19). Per-group aggregates (GROUP BY) come in M1.\n\n---\n\n## C0.11 DISTINCT\n*Source: lecture0 L1344-1401*\n\n`SELECT DISTINCT \"publisher\" FROM \"longlist\";` lists each publisher once, and `SELECT COUNT(DISTINCT \"publisher\") FROM \"longlist\";` counts them. Plain `COUNT(\"publisher\")` counts a publisher once per book (D0-04).\n\n**Practice:** M0-E01 … M0-E18 · **Debug:** D0-01 … D0-04 · **Review deck:** R0\n"}, {"id": "M1", "title": "Relating", "lesson": "lessons/M1-relating.md", "sources": "lecture1 (whole file)", "prerequisites": ["M0"], "objectives": ["Classify relationships as one-to-one, one-to-many or many-to-many and read crow's-foot ER diagrams", "Explain primary keys, foreign keys and junction tables (and why ISBNs make poor keys)", "Query across tables with subqueries and IN", "Combine tables with JOIN, LEFT / RIGHT / FULL JOIN and NATURAL JOIN, predicting which rows survive", "Combine result sets with UNION, INTERSECT and EXCEPT", "Aggregate per group with GROUP BY, filter groups with HAVING, and sort the result"], "challenge": ["M1-E17", "M1-E18", "M1-E20"], "mastery": ["Solve the lecture's two assignments (M1-E17, M1-E18) without hints", "Predict the row counts of INNER vs FULL JOIN on sea_lions (R1-04, R1-05)", "Explain WHERE vs HAVING (D1-07) and = vs IN (D1-04)"], "lesson_md": "# M1 · Relating\n*Source: lecture1 (Week 1 · Relating). Datasets: `longlist` (authors, books, publishers, translators, authored, translated, ratings) and `sea_lions` (sea_lions, migrations).*\n\nStory: the single table of M0 repeats authors and can't say which book has which ratings. Splitting it into related tables fixes that, and then you need subqueries, JOINs, sets and groups to ask questions across tables.\n\n---\n\n## C1.1 Relational databases and relationships\n*Source: lecture1 L48-146*\n\n**Level 1.** Put authors in one table and books in another. Now you need a reliable way to say *who wrote what*. The \"honor system\" (row 1 of authors goes with row 1 of books) breaks the first time someone adds a row to only one table (L70-83). One big table repeats Olga Tokarczuk once per book (L90-106).\n\n**Level 2: the three relationships.**\n\n| Relationship | Meaning | Example |\n|---|---|---|\n| one-to-one | each A has exactly one B, and vice versa | (a simplifying assumption the lecture rejects) |\n| one-to-many | one A has many B, each B has one A | a book has many ratings; a publisher, many books |\n| many-to-many | A has many B, and B has many A | authors ↔ books, translators ↔ books |\n\n**Level 3.** Choosing the relationship is a design decision (L220-235). Lecture 2 makes you choose (M2).\n\n---\n\n## C1.2 ER diagrams\n*Source: lecture1 L147-246*\n\nEntities are boxes, relationships are lines labelled with verbs (*wrote*, *published*, *translated*), and the line ends carry **crow's-foot** marks:\n\n| Mark | Meaning |\n|---|---|\n| circle | zero (optional) |\n| bar | one (at least one) |\n| three-pronged foot | many |\n\nRead each line in both directions: \"an author wrote one to many books\" and \"a book was written by one to many authors\". A book can have *zero* to many translators.\n\n---\n\n## C1.3 Primary keys and foreign keys\n*Source: lecture1 L247-482*\n\n**Level 1.** A librarian can't find \"The Birthday Party\" by title alone, because there are several books with that name and several editions. A unique number solves it.\n\n**Level 2.**\n* **Primary key**: unique for every row of its table (`books.id`).\n* **Foreign key**: a primary key copied into another table to point at a row (`ratings.book_id` → `books.id`).\n* **Many-to-many** needs a junction table: `authored(author_id, book_id)`. The row `(23, 1)` means author 23 (Eva Baltasar) wrote book 1 (*Boulder*).\n\n**Level 3.** The ISBN is unique, but it is a poor key. As text it is about 17 bytes copied into every referencing row, and as a number it loses leading zeros. A made-up integer id is small and stable. Ids from different tables may share values (author 1 and book 1 are fine) because each column knows which table it refers to (L419-438). Avoid changing ids (L465-481).\n\n---\n\n## C1.4 Subqueries\n*Source: lecture1 L491-861*\n\n**Level 1.** Answer in steps. First find Fitzcarraldo Editions' id, then the books with that publisher id.\n\n**Level 2.**\n```sql\nSELECT \"title\" FROM \"books\" WHERE \"publisher_id\" = (\n    SELECT \"id\" FROM \"publishers\" WHERE \"publisher\" = 'Fitzcarraldo Editions'\n);\n\nSELECT \"name\" FROM \"authors\" WHERE \"id\" = (            -- many-to-many: three tables\n    SELECT \"author_id\" FROM \"authored\" WHERE \"book_id\" = (\n        SELECT \"id\" FROM \"books\" WHERE \"title\" = 'The Birthday Party'\n    )\n);\n```\nThe innermost query runs first. Indent each level for readability. Indentation is not required, but it is good style (L945-967).\n\n**Level 3.** A subquery replaces hard-coded ids (`= 5`) that break silently. If the inner query finds nothing, the outer one returns nothing too (L603-610). The wrong table name gives `no such table` (D1-06).\n\n---\n\n## C1.5 IN\n*Source: lecture1 L862-985*\n\n```sql\nSELECT \"title\" FROM \"books\" WHERE \"id\" IN (\n    SELECT \"book_id\" FROM \"authored\" WHERE \"author_id\" = (\n        SELECT \"id\" FROM \"authors\" WHERE \"name\" = 'Fernanda Melchor'\n    )\n);\n```\nRule of thumb: use `=` when exactly one value can come back, and `IN` when it may be several. A foreign key may repeat in a junction table (a book with three authors has three rows), but a primary key never repeats (L987-1020).\n\n---\n\n## C1.6 JOIN … ON\n*Source: lecture1 L1022-1162*\n\n**Level 1.** Extend each row of one table with the matching row of another, where the keys line up.\n\n**Level 2.**\n```sql\nSELECT * FROM \"sea_lions\"\nJOIN \"migrations\" ON \"migrations\".\"id\" = \"sea_lions\".\"id\";\n```\n**Level 3.** A plain JOIN is an **INNER JOIN**. Rows without a match on the other side are dropped (Jolee disappears). The result is a temporary result set; it isn't stored (L1357-1379). For a many-to-many query, join through the junction table: authors JOIN authored JOIN books (M1-E13).\n\n---\n\n## C1.7 OUTER JOINs: LEFT, RIGHT, FULL\n*Source: lecture1 L1208-1379*\n\n| Join | Keeps unmatched rows from | sea lions example |\n|---|---|---|\n| `LEFT JOIN` | the left table (written first) | Jolee kept, with NULL distance |\n| `RIGHT JOIN` | the right table (after JOIN) | untracked migrations kept, with NULL name |\n| `FULL JOIN` | both | everything |\n\nWith several joins, each JOIN's left side is everything to its left (L1340-1355). RIGHT and FULL JOIN need SQLite 3.39 or newer.\n\n---\n\n## C1.8 NATURAL JOIN\n*Source: lecture1 L1380-1404*\n\n`SELECT * FROM \"sea_lions\" NATURAL JOIN \"migrations\";` joins on every column with the same name (here `id`) and shows it only once. It is short but fragile, so prefer an explicit `ON` in real code. When the key columns have different names, write `ON a.x = b.y` (L1626-1638).\n\n---\n\n## C1.9 Sets: UNION, INTERSECT, EXCEPT\n*Source: lecture1 L1408-1663*\n\n| Operator | Venn region | Example |\n|---|---|---|\n| `UNION` | in either | all authors and translators (add `'author' AS \"profession\"` to label) |\n| `INTERSECT` | in both | Ngũgĩ wa Thiong'o; the book Hughes and Jull Costa both translated |\n| `EXCEPT` | in the first, not the second | authors who are not translators |\n\n**Level 3.** Both sides need the same number of columns (and the same kind of data). Chained operators run left to right, so the lecture's homework, *in exactly one set*, needs subqueries (M1-E18). UNION removes duplicates, and UNION ALL keeps them.\n\n---\n\n## C1.10 GROUP BY and HAVING\n*Source: lecture1 L1664-1839*\n\n```sql\nSELECT \"book_id\", ROUND(AVG(\"rating\"), 2) AS \"average rating\"\nFROM \"ratings\"\nGROUP BY \"book_id\"\nHAVING \"average rating\" > 4.0\nORDER BY \"average rating\" DESC;\n```\n**Level 1.** GROUP BY collapses the rows of each book into one, and the aggregate is computed per group.\n**Level 2.** Clause order: `SELECT … FROM … WHERE … GROUP BY … HAVING … ORDER BY … LIMIT`.\n**Level 3.** WHERE filters **rows** before grouping, and HAVING filters **groups** after (D1-07). Without GROUP BY, `AVG` covers the whole table, giving one number (D1-03). Swap AVG for COUNT to get ratings per book (book 1 has 2,779).\n\n**Practice:** M1-E01 … M1-E23 · **Debug:** D1-01 … D1-09 · **Review deck:** R1\n"}, {"id": "M2", "title": "Designing", "lesson": "lessons/M2-designing.md", "sources": "lecture2 (whole file)", "prerequisites": ["M0", "M1"], "objectives": ["Use the sqlite3 shell (.schema, .read) and keep the schema in a re-runnable schema.sql", "Normalize a messy table into entity tables and describe relationships with ER cardinalities", "Write CREATE TABLE with suitable type affinities, PRIMARY/FOREIGN KEYs and NOT NULL / UNIQUE / DEFAULT / CHECK", "Explain storage classes vs type affinities (including the fares-as-integer argument)", "Evolve a schema with ALTER TABLE (RENAME TO, ADD/RENAME/DROP COLUMN)"], "challenge": ["M2-E12", "M2-E08"], "mastery": ["Write the complete mbta schema (M2-E12) from a blank file and pass every probe", "Predict typeof() results for values inserted into INTEGER, TEXT and untyped columns (R2-04, R2-05, R2-08)", "Explain when a composite primary key is wrong (M2-E04 / D2-04)"], "lesson_md": "# M2 · Designing\n*Source: lecture2 (Week 2 · Designing). Datasets: `charlie` (the first draft table), `mbta` (final design).*\n\nStory of the lecture: represent Boston's subway (the MBTA). Start with one messy table of riders paying fares, split it into entities, relate them, add types and constraints, then redesign around **CharlieCards** because the MBTA tracks cards, not people.\n\n---\n\n## C2.1 The sqlite3 shell and schema files\n*Source: lecture2 L23-110, L659-720*\n\n**Level 1.** The `sqlite3` program has its own **dot-commands** for housekeeping. They are not SQL. Keep your design in a `schema.sql` file you can edit and re-run, instead of retyping CREATE TABLEs.\n\n**Level 2.**\n```text\nsqlite3 mbta.db          -- open (or create) a database file\n.schema                  -- show every CREATE statement\n.schema books            -- just one table\n.read schema.sql         -- run every statement in a file\n.mode table              -- boxed output (Q&A, L739-741)\n.quit\n```\nDot-commands take **no semicolon** and run only in the shell (not in this trainer's editor).\n\n**Level 3.** The workflow from the lecture is: edit `schema.sql` → `DROP TABLE` the old tables → `.read schema.sql`. Version-control that file. It is the documentation of your database.\n\n---\n\n## C2.2 Normalizing\n*Source: lecture2 L147-263*\n\n**Level 1: Intuition.** The first table had rows like *Charlie · Kendall/MIT · enter · $0.10 · $0.05 left*. Names and station names repeat, two different Charlies are indistinguishable, and renaming a station means editing many rows. Normalizing splits facts so that each one is stored **once**.\n\n**Level 2.** There is no syntax. It is a design process with two heuristics from the lecture:\n1. Put each **entity** (rider, station) in **its own table** with its own primary key.\n2. Every column you add to a table should describe **only that entity**.\n\n**Level 3.** The lecture names 1NF/2NF/3NF but stays with the heuristics (formal normal forms are a gap, see the roadmap). The payoff: queries are easier to write, data is easier to change in one place, and anomalies (two Charlies) disappear.\n\n---\n\n## C2.3 Relationships and ER diagrams\n*Source: lecture2 L265-346, L425-444, L1060-1090*\n\n**Level 1.** Ask how many of B one A can have, and how many of A one B can have. A rider visits many stations, and a station has many riders, so the relationship is **many-to-many**.\n\n**Level 2.** In crow's-foot notation: a single bar means *exactly one / at least one*, a circle means *zero*, and three prongs mean *many*. A many-to-many relationship is implemented with a **junction table** (also called an associative entity or join table):\n```sql\nCREATE TABLE \"visits\" (\"rider_id\" INTEGER, \"station_id\" INTEGER, ...);\n```\nEach row says \"this rider visited this station\".\n\n**Level 3.** The cardinalities are judgement calls. The class debated whether a station must have at least one rider (L329-346). In the CharlieCard redesign, each **swipe** belongs to exactly one card and one station, while cards and stations have many swipes.\n\n---\n\n## C2.4 CREATE TABLE and DROP TABLE\n*Source: lecture2 L348-468, L647-658*\n\n**Level 1.** CREATE TABLE writes down the shape of a table: its name, its columns, and their rules. DROP TABLE throws the table and all of its rows away.\n\n**Level 2.**\n```sql\nCREATE TABLE \"riders\" (\n    \"id\" INTEGER,          -- column name + type affinity\n    \"name\" TEXT,           -- comma between items …\n    PRIMARY KEY(\"id\")      -- … but none after the last one\n);\nDROP TABLE \"riders\";\n```\n\n**Level 3.** The trailing-comma error is the most common syntax slip (debugging D2-01). DROP is irreversible. To change a table that already holds data, prefer ALTER TABLE (C2.8).\n\n---\n\n## C2.5 Storage classes vs type affinities\n*Source: lecture2 L475-640, L754-767, L1335-1347*\n\n**Level 1: Intuition.** In SQLite, **values** carry a type (the storage class), and **columns** have a *preference* (the affinity) that converts incoming values when it reasonably can.\n\n**Level 2.**\n\n| Storage classes (values) | Type affinities (columns) |\n|---|---|\n| NULL, INTEGER, REAL, TEXT, BLOB | TEXT, NUMERIC, INTEGER, REAL, BLOB |\n\n```sql\nCREATE TABLE \"t\" (\"amount\" INTEGER);\nINSERT INTO \"t\" VALUES ('25');        -- stored as integer 25\nINSERT INTO \"t\" VALUES ('red line');  -- can't convert, so it is stored as TEXT\nSELECT typeof(\"amount\") FROM \"t\";\n```\n* An INTEGER storage class covers 1- to 8-byte integers, and SQLite picks the size for you (L495-512).\n* There is no BOOLEAN. Use INTEGER 0/1 (L754-766).\n* Dates are TEXT `'YYYY-MM-DD'` or NUMERIC.\n\n**Level 3: Practical reasoning**\n* **Money:** the class compared fares as INTEGER (exact cents), TEXT `'$0.10'` (can't add), and REAL 0.10 (imprecise). Prefer integer cents, or DECIMAL in MySQL (C6.2).\n* A column with **no declared type** has BLOB (\"no\") affinity, not NUMERIC as the lecture says (errata #1).\n* SQLite is permissive and MySQL is strict (lecture6 L844-852). Don't rely on SQLite to reject bad types; use CHECK constraints if it matters.\n\n---\n\n## C2.6 Table constraints: PRIMARY KEY and FOREIGN KEY\n*Source: lecture2 L769-913, L1311-1318*\n\n**Level 1.** A primary key is a row's unique name tag. A foreign key is a reference to another table's name tag, and the database refuses references to rows that don't exist.\n\n**Level 2.**\n```sql\nCREATE TABLE \"visits\" (\n    \"id\" INTEGER,\n    \"rider_id\" INTEGER,\n    \"station_id\" INTEGER,\n    PRIMARY KEY(\"id\"),\n    FOREIGN KEY(\"rider_id\") REFERENCES \"riders\"(\"id\"),\n    FOREIGN KEY(\"station_id\") REFERENCES \"stations\"(\"id\")\n);\n```\n* **Composite key:** `PRIMARY KEY(\"rider_id\", \"station_id\")` makes the *pair* unique.\n* Every SQLite table without an explicit integer PK still has a hidden **`rowid`** you can query (L840-845).\n\n**Level 3**\n* The composite key is wrong for visits, because people revisit stations (M2-E04, D2-04). Choose keys that match the real-world uniqueness rule.\n* **SQLite only enforces foreign keys after `PRAGMA foreign_keys = ON;`** (errata #4). This trainer always turns it on.\n* Different tables may reuse the same id values (riders 1, 2, 3 and stations 1, 2, 3). That is fine (L310-326).\n\n---\n\n## C2.7 Column constraints: NOT NULL, UNIQUE, DEFAULT, CHECK\n*Source: lecture2 L915-1022, L1231-1305*\n\n**Level 1.** These are guardrails that stop bad data at the door.\n\n**Level 2.**\n```sql\n\"name\"     TEXT NOT NULL UNIQUE,\n\"type\"     TEXT NOT NULL CHECK(\"type\" IN ('enter', 'exit', 'deposit')),\n\"datetime\" NUMERIC NOT NULL DEFAULT CURRENT_TIMESTAMP,\n\"amount\"   NUMERIC NOT NULL CHECK(\"amount\" != 0)\n```\n\n**Level 3**\n* PRIMARY KEY already implies NOT NULL and UNIQUE, so don't repeat them (L958-966).\n* **Foreign-key columns do accept NULL.** Add NOT NULL if the link is mandatory (errata #3, debugging D2-03).\n* Write CHECK expressions carefully. `\"type\" = 'enter' OR 'exit'` does not mean what it says (D2-02).\n* The lecture's closing story is a reminder to design constraints so a rider can always get *off* the train (L1365-1380).\n\n---\n\n## C2.8 ALTER TABLE\n*Source: lecture2 L1094-1180*\n\n**Level 1.** Change a table's structure in place, keeping its rows.\n\n**Level 2.**\n```sql\nALTER TABLE \"visits\" RENAME TO \"swipes\";\nALTER TABLE \"swipes\" ADD COLUMN \"type\" TEXT;\nALTER TABLE \"swipes\" RENAME COLUMN \"ttpe\" TO \"type\";\nALTER TABLE \"swipes\" DROP COLUMN \"type\";\n```\n\n**Level 3.** SQLite's ALTER TABLE cannot change a column's type or constraints. To do that, rebuild the table, or in MySQL use `MODIFY` (C6.3). Existing rows get NULL in a new column, or the column's DEFAULT (used for soft deletes in C3.10).\n\n**Practice:** M2-E01 … M2-E12 · **Debug:** D2-01 … D2-04 · **Review deck:** R2\n"}, {"id": "M3", "title": "Writing", "lesson": "lessons/M3-writing.md", "sources": "lecture3 (whole file)", "prerequisites": ["M0", "M1", "M2"], "objectives": ["Insert single and multiple rows and let SQLite generate primary keys", "Read constraint errors (UNIQUE, NOT NULL, FOREIGN KEY) as guardrails", "Import CSV data, including via a temporary table and INSERT … SELECT, and fix '' vs NULL", "Delete safely (WHERE, IS NULL, dates, subqueries) and choose ON DELETE actions", "Update rows with subqueries and clean text data with trim / upper / LIKE", "Automate side effects with BEFORE/AFTER triggers using OLD and NEW", "Implement soft deletion and discuss its ethics"], "challenge": ["M3-E13", "M3-E14", "M3-E06"], "mastery": ["Clean the votes table to four groups (M3-E13) in ≤ 6 statements", "Write the sell/buy triggers (M3-E14) from memory", "Spot the bug in D3-02, D3-03 and D3-06 within a minute each"], "lesson_md": "# M3 · Writing\n*Source: lecture3 (Week 3 · Writing). Datasets: `mfa` (Museum of Fine Arts), `votes`. CSVs: `database/csv/`.*\n\nStory: the MFA logs new acquisitions (INSERT), imports a CSV, sells pieces (DELETE) despite foreign keys, corrects attributions and cleans messy vote data (UPDATE), automates a sales log (TRIGGER), and finally keeps history with soft deletes.\n\n---\n\n## C3.1 INSERT INTO\n*Source: lecture3 L65-246*\n\n**Level 1.** Add a new row: say where, which columns, and what values.\n\n**Level 2.**\n```sql\nINSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\")\nVALUES ('Spring Outing', '14.76', '1914-01-08');\n```\n* Value *n* goes into column *n*. You may list columns in any order, as long as the values match (L612-630).\n* Leave out an `INTEGER PRIMARY KEY` and SQLite assigns **max(id) + 1**.\n\n**Level 3**\n* Let the database generate ids. Choosing them yourself risks collisions.\n* Gaps after deletes are normal. Without AUTOINCREMENT, a deleted *maximum* id can be reused. With AUTOINCREMENT, an id is never reused (the lecture states this backwards, errata #2).\n* Quote identifiers that look numeric (`'06.1899'`), or the leading zero is lost (errata #5).\n\n---\n\n## C3.2 Constraints at write time\n*Source: lecture3 L247-312*\n\n**Level 1.** The constraints you designed in M2 now *refuse* bad writes.\n\n**Level 2.** `Runtime error: UNIQUE constraint failed: collections.accession_number` and `NOT NULL constraint failed: collections.title`. Nothing is written.\n\n**Level 3.** Read the error message. It names the constraint and the column, and it means a guardrail worked, not that SQL is broken.\n\n---\n\n## C3.3 Multi-row INSERT and INSERT … SELECT\n*Source: lecture3 L313-364, L570-603, L632-638*\n\n**Level 2.**\n```sql\nINSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES\n('Imaginative Landscape', '56.496', NULL),\n('Peonies and Butterfly', '06.1899', '1906-01-01');\n\nINSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\")\nSELECT \"title\", \"accession_number\", \"acquired\" FROM \"temp\";\n```\n\n**Level 3.** A multi-row insert is faster than many single inserts and **atomic**: if one row violates a constraint, no row is inserted. That is the first glimpse of transactions (M5). With `INSERT … SELECT`, the column lists must line up by position.\n\n---\n\n## C3.4 Importing CSV files\n*Source: lecture3 L381-663*\n\n**Level 1.** You often receive data as a CSV (comma-separated values). The sqlite3 shell can load it directly.\n\n**Level 2.**\n```text\n.import --csv --skip 1 mfa.csv collections   -- table exists: skip the header row\n.import --csv mfa_noid.csv temp              -- table doesn't exist: header becomes column names\n```\nthen `INSERT INTO \"collections\" (...) SELECT ... FROM \"temp\";` and `DROP TABLE \"temp\";`\n\n**Level 3**\n* `.import` is a shell command, so it doesn't run in the browser trainer. Try it in the terminal with `database/csv/*.csv`, or let `tools/labs.py import` run it for you.\n* Importing into a new table makes **every column TEXT**, and **blank fields become `''`, not NULL** (L640-663). Fix them with `NULLIF(col, '')` or `UPDATE … SET col = NULL WHERE col = ''`.\n* Prefer CSVs without ids, and let the table generate the primary keys (L501-515).\n\n---\n\n## C3.5 DELETE\n*Source: lecture3 L670-819*\n\n**Level 1.** Remove the rows that match a condition.\n\n**Level 2.**\n```sql\nDELETE FROM \"collections\" WHERE \"title\" = 'Spring Outing';\nDELETE FROM \"collections\" WHERE \"acquired\" IS NULL;\nDELETE FROM \"collections\" WHERE \"acquired\" < '1909-01-01';\n```\n\n**Level 3**\n* `DELETE FROM t;` with no WHERE deletes **everything** (D3-01). First run the same WHERE as a SELECT.\n* Choose the condition that expresses your *intent*. \"Acquired before 1909\" should use the date, not `id >= 5`, which only matches by coincidence (L783-792).\n* Rows whose date is NULL are not \"before 1909\", so they survive the date DELETE.\n\n---\n\n## C3.6 Foreign keys when deleting\n*Source: lecture3 L820-1052*\n\n**Level 1.** If `created` says *artist 3 painted artwork 1*, deleting artist 3 would leave a reference to nobody. The database stops you, unless you declare what should happen instead.\n\n**Level 2.**\n```sql\nFOREIGN KEY(\"artist_id\") REFERENCES \"artists\"(\"id\") ON DELETE CASCADE\n```\n\n| Action | Effect when the referenced row is deleted |\n|---|---|\n| RESTRICT | refuse the delete |\n| NO ACTION | no *special* action, but the foreign-key check still runs, so the delete **fails** (the lecture says it would be allowed; errata #18) |\n| SET NULL | referencing column becomes NULL |\n| SET DEFAULT | referencing column gets its default |\n| CASCADE | referencing rows are deleted too |\n\nWithout an action, delete in two steps, children first:\n```sql\nDELETE FROM \"created\" WHERE \"artist_id\" = (SELECT \"id\" FROM \"artists\" WHERE \"name\" = 'Unidentified artist');\nDELETE FROM \"artists\" WHERE \"name\" = 'Unidentified artist';\n```\n\n**Level 3.** CASCADE is convenient but powerful, since one DELETE can remove many rows in other tables. Use it where the child rows mean nothing without the parent, as with authorship links. The lecturer's first attempt deleted from the wrong table (D3-02).\n\n---\n\n## C3.7 UPDATE\n*Source: lecture3 L1093-1196*\n\n**Level 2.**\n```sql\nUPDATE \"created\"\nSET \"artist_id\" = (SELECT \"id\" FROM \"artists\" WHERE \"name\" = 'Li Yin')\nWHERE \"collection_id\" = (SELECT \"id\" FROM \"collections\" WHERE \"title\" = 'Farmers Working at Dawn');\n```\n`SET` may list several `col = value` pairs. Values can be expressions or subqueries.\n\n**Level 3.** As with DELETE, a forgotten WHERE changes every row (D3-03). To fix a typo, UPDATE the row (L369-380). Never delete and re-insert it.\n\n---\n\n## C3.8 Cleaning data\n*Source: lecture3 L1197-1486*\n\n**Level 1.** Twenty typed votes give far more than four groups, because of stray spaces, inconsistent capitals and typos. Clean systematically, re-checking with GROUP BY after each step.\n\n**Level 2.**\n```sql\nUPDATE \"votes\" SET \"title\" = trim(\"title\");     -- leading/trailing whitespace\nUPDATE \"votes\" SET \"title\" = upper(\"title\");    -- one capitalization\nUPDATE \"votes\" SET \"title\" = 'FARMERS WORKING AT DAWN' WHERE \"title\" LIKE 'Fa%';\nUPDATE \"votes\" SET \"title\" = 'IMAGINATIVE LANDSCAPE' WHERE \"title\" = 'IMAGINTIVE LANDSCAPE';\n```\nOther scalar functions: `lower()`, `length()`, `replace()`, `substr()`, … (search \"SQLite scalar functions\", L1464-1468).\n\n**Level 3.** Go from broad fixes (all rows) to narrow ones. Make patterns as specific as the data allows, because `'Fa%'` would also rewrite a *Fan Painting* (D3-06). An alternative is to keep the raw titles and add a category column (L1471-1486).\n\n---\n\n## C3.9 Triggers\n*Source: lecture3 L1494-1693*\n\n**Level 1.** \"Whenever X happens to this table, also do Y\", automatically, for every affected row.\n\n**Level 2.**\n```sql\nCREATE TRIGGER \"sell\"\nBEFORE DELETE ON \"collections\"\nFOR EACH ROW\nBEGIN\n    INSERT INTO \"transactions\" (\"title\", \"action\") VALUES (OLD.\"title\", 'sold');\nEND;\n```\n* Timing: `BEFORE` / `AFTER`. Event: `INSERT`, `UPDATE OF column`, or `DELETE` (`INSTEAD OF` comes in M4).\n* `OLD.col` is the row before the change (UPDATE, DELETE). `NEW.col` is the row after (INSERT, UPDATE).\n* The body may hold several statements, each ending with `;` (L1688-1693).\n\n**Level 3.** Triggers keep logs and derived tables in sync without relying on every program to remember. The cost is hidden behaviour, so name triggers clearly and document them in `schema.sql`. A trigger that references `NEW` on DELETE is accepted when created but fails on every delete (D3-05).\n\n---\n\n## C3.10 Soft deletion\n*Source: lecture3 L1694-1793*\n\n**Level 2.**\n```sql\nALTER TABLE \"collections\" ADD COLUMN \"deleted\" INTEGER DEFAULT 0;\nUPDATE \"collections\" SET \"deleted\" = 1 WHERE \"title\" = 'Farmers Working at Dawn';\nSELECT * FROM \"collections\" WHERE \"deleted\" = 0;      -- every query must remember this filter\n```\n\n**Level 3.** History is preserved and recoverable. The cost is that every query must filter, which motivates the view in M4. The ethical question: for personal data, a soft delete may not honour \"the right to be forgotten\" (GDPR). Decide case by case.\n\n**Practice:** M3-E01 … M3-E15 · **Debug:** D3-01 … D3-06 · **Review deck:** R3\n"}, {"id": "M4", "title": "Viewing", "lesson": "lessons/M4-viewing.md", "sources": "lecture4 (whole file)", "prerequisites": ["M1", "M3"], "objectives": ["Create, query and drop views; explain why they cost almost no space and stay current", "Use views to simplify (hide joins), aggregate (and build views on views), partition and secure", "Choose between VIEW, TEMPORARY VIEW and CTE by lifetime", "Make a read-only view writable with INSTEAD OF triggers, including conditional (WHEN) triggers"], "challenge": ["M4-E12", "M4-E13", "M4-E05"], "mastery": ["Build current_collections with all three INSTEAD OF triggers (M4-E11 … M4-E13)", "Rewrite a view-on-view analysis as a single CTE (M4-E05)", "Explain why the rideshare view is not real security in SQLite"], "lesson_md": "# M4 · Viewing\n*Source: lecture4 (Week 4 · Viewing). Datasets: `longlist`, `rideshare`, `mfa`.*\n\nStory: three joined tables make simple questions painful. A **view** saves a query as a virtual table, which can simplify, aggregate, partition and secure data, and with triggers it can even accept writes.\n\n---\n\n## C4.1 What a view is\n*Source: lecture4 L77-104, L244-278, L653-658*\n\n**Level 1: Intuition.** A view is a saved question that you can treat like a table. Each time you look at it, the question is asked again, so the answer is always current and almost no extra space is used.\n\n**Level 2.**\n```sql\nCREATE VIEW \"longlist\" AS\nSELECT \"name\", \"title\" FROM \"authors\"\nJOIN \"authored\" ON \"authors\".\"id\" = \"authored\".\"author_id\"\nJOIN \"books\" ON \"books\".\"id\" = \"authored\".\"book_id\";\n\nSELECT * FROM \"longlist\";      -- query it like a table\nDROP VIEW \"longlist\";\n```\n`.schema` lists views alongside tables (L271-273).\n\n**Level 3.** A view is not a copy. New ratings appear in an aggregate view immediately (L514-526). In SQLite, views are read-only (C4.8 shows the workaround).\n\n---\n\n## C4.2 Views to simplify\n*Source: lecture4 L106-336*\n\n**Level 1.** Write the complicated join once, then ask simple questions.\n\n**Level 2.** Before: a three-level nested subquery (M1-E08). After: `SELECT \"title\" FROM \"longlist\" WHERE \"name\" = 'Fernanda Melchor';`\n\n**Level 3.** Keep the columns you may need later. The `longlist` view dropped the ids, so it can't be joined to `ratings` (L502-510). Sort in the outer query (`… ORDER BY \"title\"`) rather than relying on an ORDER BY inside the view (errata #12).\n\n---\n\n## C4.3 Views to aggregate, and views on views\n*Source: lecture4 L337-526, L554-603*\n\n**Level 2.**\n```sql\nCREATE VIEW \"average_book_ratings\" AS\nSELECT \"book_id\", \"title\", \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\"\nFROM \"ratings\" JOIN \"books\" ON \"ratings\".\"book_id\" = \"books\".\"id\"\nGROUP BY \"book_id\";\n```\nA view can be the FROM of another view, for example averages by year built on averages by book.\n\n**Level 3.** Store raw data (individual ratings) and expose summaries through views, not the other way round. You keep the ability to compute other statistics later (L355-370). The \"average of averages\" by year weights each *book* equally, not each rating. Know which one you mean.\n\n---\n\n## C4.4 Temporary views\n*Source: lecture4 L527-632*\n\n**Level 2.** `CREATE TEMPORARY VIEW \"average_ratings_by_year\" AS …;` lasts only until the connection closes (`.quit`).\n\n**Level 3.** Use it for one session's analysis or to test a view before making it permanent (L615-630). A developer who wants the view part of the database uses plain `CREATE VIEW`.\n\n---\n\n## C4.5 Common table expressions (CTEs)\n*Source: lecture4 L633-708*\n\n**Level 1.** A view that exists for a single query.\n\n**Level 2.**\n```sql\nWITH \"average_book_ratings\" AS (\n    SELECT \"book_id\", \"title\", \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\"\n    FROM \"ratings\" JOIN \"books\" ON \"ratings\".\"book_id\" = \"books\".\"id\"\n    GROUP BY \"book_id\"\n)                                   -- more CTEs: \"), name2 AS ( … )\"\nSELECT \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\"\nFROM \"average_book_ratings\"\nGROUP BY \"year\";\n```\n\n**Level 3.** Lifetimes: VIEW lasts until dropped, TEMPORARY VIEW until the connection closes, CTE for one statement. CTEs name intermediate steps, avoid repeating subqueries, and read top to bottom instead of inside-out. Don't put a comma after the last CTE (D4-01).\n\n---\n\n## C4.6 Views to partition\n*Source: lecture4 L709-852*\n\n**Level 2.** `CREATE VIEW \"2022\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2022;`. Names made of digits need quotes (D4-03).\n\n**Level 3.** Partitions suit applications that only ever need one slice of the data (a page per year). Naming is a trade-off between `\"2021\"` (short, ambiguous) and `books_nominated_in_2021` (clear, long). A single view with a WHERE added at query time is the alternative (L797-811).\n\n---\n\n## C4.7 Views to secure\n*Source: lecture4 L853-973*\n\n**Level 2.**\n```sql\nCREATE VIEW \"analysis\" AS\nSELECT \"id\", \"origin\", \"destination\", 'anonymous' AS \"rider\"\nFROM \"rides\";\n```\nA literal column tells the reader that the data exists but has been withheld.\n\n**Level 3.** Expose only what someone needs to know (PII such as rider names stays hidden). **In SQLite this is cosmetic.** Whoever has the file can still `SELECT * FROM \"rides\"`, because SQLite has no access control. MySQL and PostgreSQL enforce it with `GRANT` (C6.7). Also beware linking ids back to the base table (L952-956).\n\n---\n\n## C4.8 Writing through a view: INSTEAD OF triggers\n*Source: lecture4 L974-1336*\n\n**Level 1: Intuition.** The view `current_collections` hides soft-deleted items. People want to `DELETE` from it or `INSERT` into it as if it were a table. INSTEAD OF triggers intercept those writes and translate them into the right change on `collections`.\n\n**Level 2.**\n```sql\nCREATE VIEW \"current_collections\" AS\nSELECT \"id\", \"title\", \"accession_number\", \"acquired\" FROM \"collections\" WHERE \"deleted\" = 0;\n\nCREATE TRIGGER \"delete\"                      -- quoted: delete is a keyword\nINSTEAD OF DELETE ON \"current_collections\"\nFOR EACH ROW\nBEGIN\n    UPDATE \"collections\" SET \"deleted\" = 1 WHERE \"id\" = OLD.\"id\";\nEND;\n\nCREATE TRIGGER \"insert_when_exists\"\nINSTEAD OF INSERT ON \"current_collections\"\nFOR EACH ROW\nWHEN NEW.\"accession_number\" IN (SELECT \"accession_number\" FROM \"collections\")\nBEGIN\n    UPDATE \"collections\" SET \"deleted\" = 0 WHERE \"accession_number\" = NEW.\"accession_number\";\nEND;\n```\nA third trigger (`WHEN … NOT IN …`) inserts genuinely new items. The lecture assigns it to you (M4-E13).\n\n**Level 3**\n* Without `WHERE \"id\" = OLD.\"id\"`, one DELETE soft-deletes every row (D4-02).\n* Match on the natural key (the accession number) for inserts, because the inserted view row has no `id` yet.\n* Two triggers with complementary `WHEN` conditions cover both cases. Make sure every possible insert matches exactly one of them.\n* Lecture 6 implements the same soft-delete idea with a MySQL stored procedure (C6.4).\n\n**Practice:** M4-E01 … M4-E13 · **Debug:** D4-01 … D4-03 · **Review deck:** R4\n"}, {"id": "M5", "title": "Optimizing", "lesson": "lessons/M5-optimizing.md", "sources": "lecture5 (whole file)", "prerequisites": ["M0", "M1", "M2", "M3"], "objectives": ["Measure queries (.timer) and read EXPLAIN QUERY PLAN (SCAN vs SEARCH)", "Create single-column, multi-column/covering and partial indexes for a given query", "Explain B-tree indexes and their space/write-time trade-offs; reclaim space with VACUUM", "Use BEGIN / COMMIT / ROLLBACK; explain ACID, race conditions and SQLite locks"], "challenge": ["M5-E03", "M5-E07", "M5-E08"], "mastery": ["Reach two covering indexes for the Tom Hanks query (M5-E03) and explain column order (D5-01)", "Recover from the failed transfer with ROLLBACK (M5-E07) and explain why ROLLBACK needs BEGIN", "Explain the double-transfer attack and its fix in your own words (M5-E08)"], "lesson_md": "# M5 · Optimizing\n*Source: lecture5 (Week 5 · Optimizing). Datasets: `movies` (IMDb sample; `--big` for timing), `bank`.*\n\nStory: IMDb has 400k movies, and every search costs server time multiplied by many users. Indexes trade **space** for **time**. Then the second half: many users at once, where transactions and locks keep the data consistent.\n\n---\n\n## C5.1 Measuring: .timer and scans\n*Source: lecture5 L124-211*\n\n**Level 1.** Measure before optimizing. Without help, SQLite answers `WHERE \"title\" = 'Cars'` by looking at every row, top to bottom. That is a **scan** (linear search).\n\n**Level 2.** `.timer on` in the shell prints `real` (stopwatch time), `user` (CPU time spent on your query) and `sys` (time in the operating system) after each statement.\n\n**Level 3.** 0.084 s seems fast until thousands of users run it every minute and you pay per second of server time (L153-168). Focus on `real`.\n\n---\n\n## C5.2 Indexes and EXPLAIN QUERY PLAN\n*Source: lecture5 L214-348*\n\n**Level 1: Intuition.** Like a textbook's index, a database index is a separate, **sorted** list of a column's values with pointers back to the rows. Find \"Cars\" in the sorted list quickly, then jump to the row.\n\n**Level 2.**\n```sql\nCREATE INDEX \"title_index\" ON \"movies\" (\"title\");\nEXPLAIN QUERY PLAN SELECT * FROM \"movies\" WHERE \"title\" = 'Cars';\n-- QUERY PLAN\n-- `--SEARCH movies USING INDEX title_index (title=?)\nDROP INDEX \"title_index\";\n-- `--SCAN movies\n```\n\n**Level 3**\n* Read plans from the innermost subquery outward. **SCAN** means reading everything, and **SEARCH** means using an index.\n* **Primary keys are indexed automatically** (`USING INTEGER PRIMARY KEY`). Other columns aren't (L338-348).\n* Index the columns your WHERE clauses (and joins) filter on. An index on another column does nothing (D5-02).\n* Indexes appear in `.schema` (L929-941).\n\n---\n\n## C5.3 Multi-column and covering indexes\n*Source: lecture5 L349-542*\n\n**Level 1.** If the index itself contains everything the query needs, SQLite never has to visit the table. Answering from the book's index without turning to the pages is the fastest case.\n\n**Level 2.**\n```sql\nCREATE INDEX \"name_index\"   ON \"people\" (\"name\");\nCREATE INDEX \"person_index\" ON \"stars\"  (\"person_id\", \"movie_id\");\n-- SEARCH people USING COVERING INDEX name_index (name=?)\n-- SEARCH stars  USING COVERING INDEX person_index (person_id=?)\n-- SEARCH movies USING INTEGER PRIMARY KEY (rowid=?)\n```\n\n**Level 3.** Column order matters. The column you filter on must come **first** (`person_id`), and the extra column (`movie_id`) rides along for coverage (D5-01). On the full IMDb data: 0.197 s → 0.004 s. `name_index` is covering on its own because every index entry also stores the rowid, which here is `people.id`.\n\n---\n\n## C5.4 B-trees and the cost of indexes\n*Source: lecture5 L543-861*\n\n**Level 1.** Sorting the table itself would break the ids that other tables rely on (L626-648). So the index is a sorted **copy** of the column, plus row pointers, split into nodes that form a balanced tree: a root node, inner nodes, and leaves.\n\n**Level 2 (the search).** Looking for *Turning Red*: at the root, is it before *Frozen*? No. Before *Soul*? No. So go to the last child node, then find *Turning Red* in it, along with its row number. Each step discards most of the remaining candidates (binary-search style), so even millions of rows take only a few steps.\n\n**Level 3: Trade-offs**\n* **Space:** an index is extra data (\"paying in pages\", L558-563).\n* **Write time:** every INSERT/UPDATE/DELETE must also update every affected index, finding the right place in the tree (L852-861).\n* So don't index every column \"just in case\" (L350-357). Index what your real queries need.\n\n---\n\n## C5.5 Partial indexes\n*Source: lecture5 L862-942*\n\n**Level 2.** `CREATE INDEX \"recents\" ON \"movies\" (\"title\") WHERE \"year\" = 2023;`\n\n**Level 3.** A smaller index, useful when most queries target a known subset (this year's movies). SQLite uses it only when the query's WHERE implies the index's WHERE (`year = 2023`). For `year = 1998` it is back to a scan (D5-03).\n\n---\n\n## C5.6 VACUUM\n*Source: lecture5 L943-1048*\n\n**Level 1.** Deleting rows or dropping an index doesn't shrink the file. The space is only marked as reusable. `VACUUM;` rebuilds the file and returns the free pages to the operating system.\n\n**Level 2.** `du -b movies.db` (Unix, size in bytes) → `DROP INDEX …` (same size) → `VACUUM;` → smaller. The lecture went from 158 MB to 100 MB. Try `python3 tools/labs.py vacuum`.\n\n**Level 3.** VACUUM rewrites the whole database, which takes time on big files. Run it occasionally, after large deletions. Once vacuumed, the deleted bytes are no longer recoverable from the file (L1031-1041).\n\n---\n\n## C5.7 Transactions and ACID\n*Source: lecture5 L1049-1330*\n\n**Level 1: Intuition.** Alice pays Bob $10 in two updates. Between them, an observer sees $70 in a $60 bank. A transaction makes the pair happen **all at once or not at all**.\n\n**Level 2.**\n```sql\nBEGIN TRANSACTION;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" - 10 WHERE \"id\" = 1;\nCOMMIT;                 -- save; or ROLLBACK; to undo everything since BEGIN\n```\nACID:\n* **Atomicity**, all or nothing.\n* **Consistency**, constraints hold. Here `CHECK(\"balance\" >= 0)` makes the debit fail, and you ROLLBACK.\n* **Isolation**, concurrent transactions don't interfere.\n* **Durability**, committed data survives crashes.\n\n**Level 3**\n* ROLLBACK works only inside a transaction. Without BEGIN you must undo by hand (L1289-1305, D5-04).\n* In SQLite a failed statement does **not** end the transaction. You decide to COMMIT or ROLLBACK.\n* Identify accounts by id, not name, since there can be two Alices (L1239-1248).\n\n---\n\n## C5.8 Race conditions and isolation\n*Source: lecture5 L1331-1455*\n\n**Level 1.** Charlie ($30) clicks *transfer $30 to Alice* on two laptops at once. Both transfers check his balance before either one subtracts, so Alice receives $60 and withdraws it at an ATM.\n\n**Level 2.** The fix is design: each transfer (check, credit, debit) is **one transaction**, and transactions run **sequentially (isolated)**. The second transfer then sees $0, fails its constraint, and rolls back.\n\n**Level 3.** Any \"read a value, decide, then write\" sequence is vulnerable if the read happens outside the transaction that writes. Real systems serialize with locks (C5.9), possibly with timestamp ordering (L1509-1523).\n\n---\n\n## C5.9 Locks\n*Source: lecture5 L1456-1553*\n\n| SQLite lock | Meaning |\n|---|---|\n| UNLOCKED | nobody is using the database |\n| SHARED | reading; many connections may hold it at once |\n| EXCLUSIVE | writing; no one else may read or write |\n\n`BEGIN EXCLUSIVE TRANSACTION;` takes the exclusive lock up front. Another connection then gets `Runtime error: database is locked`. Run `python3 tools/labs.py locks` to see it.\n\n**Level 3.** SQLite locks the **whole database** (coarse granularity). Other DBMSs can lock tables or rows. Hold exclusive locks as briefly as possible, since everyone else waits.\n\n**Practice:** M5-E01 … M5-E11 · **Debug:** D5-01 … D5-04 · **Review deck:** R5\n"}, {"id": "M6", "title": "Scaling", "lesson": "lessons/M6-scaling.md", "sources": "lecture6 (whole file)", "prerequisites": ["M2", "M3", "M4", "M5"], "objectives": ["Connect to and navigate MySQL and PostgreSQL; translate a SQLite schema with appropriate types", "Modify columns (MODIFY) and write stored procedures with parameters (MySQL)", "Compare vertical/horizontal scaling, replication models (sync/async, read replicas) and sharding", "Grant least-privilege access; demonstrate SQL injection and defend with prepared statements"], "challenge": ["M6-E06", "M6-E03", "M6-E09"], "mastery": ["Translate the mbta schema to MySQL and PostgreSQL and run it (database/scaling/*)", "Write the double-sale-proof sell procedure (M6-E06)", "Pick sync vs async replication for two scenarios and justify it (R6-06)", "Exploit M6-E08 / M6-E09, then explain exactly why a bound parameter stops it"], "lesson_md": "# M6 · Scaling\n*Source: lecture6 (Week 6 · Scaling). MySQL scripts: `database/scaling/mysql/`, PostgreSQL: `database/scaling/postgres/`. All executed on MariaDB 10.11 / PostgreSQL 16 by `tests/test_servers.py`.*\n\nStory: SQLite is an *embedded* database (a file). MySQL and PostgreSQL are *servers* with users, stricter types, procedures, replication and access control. The lecture re-implements MBTA (types), MFA (procedures), rideshare (permissions) and bank (injection) on them.\n\n---\n\n## C6.1 Database servers and their command-line clients\n*Source: lecture6 L40-156, L159-352, L1329-1490*\n\n**Level 1.** A server runs on its own machine. You connect over the network as a **user**, and one server holds many databases.\n\n**Level 2.**\n\n| Task | SQLite | MySQL | PostgreSQL |\n|---|---|---|---|\n| connect | `sqlite3 mbta.db` | `mysql -u root -h 127.0.0.1 -P 3306 -p` | `psql -U postgres` |\n| list databases | n/a | `SHOW DATABASES;` | `\\l` |\n| create / use db | n/a | `CREATE DATABASE \\`mbta\\`; USE \\`mbta\\`;` | `CREATE DATABASE \"mbta\";` `\\c mbta` |\n| list tables | `.tables` | `SHOW TABLES;` | `\\dt` |\n| describe table | `.schema t` | `DESCRIBE t;` | `\\d t` |\n| quit | `.quit` | `quit` | `\\q` |\n| identifier quotes | `\"x\"` | `` `x` `` | `\"x\"` |\n\n**Level 3.** Servers can keep data in RAM and offer replication and sharding (L48-53). The price is operating a server, with users, passwords and network access.\n\n---\n\n## C6.2 MySQL types\n*Source: lecture6 L183-852*\n\n**Integers** (signed range; `UNSIGNED` shifts the range to 0…):\n\n| Type | Bytes | Max (signed) |\n|---|---|---|\n| TINYINT | 1 | 127 |\n| SMALLINT | 2 | 32,767 |\n| MEDIUMINT | 3 | 8,388,607 |\n| INT | 4 | 2,147,483,647 (unsigned about 4.29 billion) |\n| BIGINT | 8 | 2⁶³−1 |\n\n**Text.** `CHAR(M)` has a fixed width (e.g. state codes 'MA'). `VARCHAR(M)` is variable, up to M characters. `TEXT` (TINY/MEDIUM/LONG) is for long passages. `BLOB` is binary.\n**Choices.** `ENUM('a','b')` allows exactly one of the listed values, and `SET(...)` allows several (movie genres).\n**Time.** `DATE`, `TIME`, `DATETIME`, `TIMESTAMP`, `YEAR`. TIME, DATETIME and TIMESTAMP accept `(fsp)` fractional-second digits up to 6.\n**Real numbers.** `FLOAT` (4 bytes) and `DOUBLE PRECISION` (8 bytes) are approximate. **`DECIMAL(M,D)`** is exact, with M total digits and D after the point: `DECIMAL(5,2)` holds −999.99…999.99 (the lecture's \"5 comma 1\" is a slip, errata #7).\n\n```sql\nCREATE TABLE `swipes` (\n    `id` INT AUTO_INCREMENT,\n    `card_id` INT, `station_id` INT,\n    `type` ENUM('enter', 'exit', 'deposit') NOT NULL,\n    `datetime` DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,\n    `amount` DECIMAL(5,2) NOT NULL CHECK(`amount` != 0),\n    PRIMARY KEY(`id`),\n    FOREIGN KEY(`card_id`) REFERENCES `cards`(`id`),\n    FOREIGN KEY(`station_id`) REFERENCES `stations`(`id`)\n);\n```\n\n**Level 3**\n* Choose the smallest type that will *safely* fit. INT for card ids, because fewer than 4 billion people exist (L264-273).\n* MySQL is **strict** (it rejects mismatched values by default), unlike SQLite's affinities (L839-852).\n* `DESCRIBE` shows Key = `PRI` (primary), `UNI` (unique) and `MUL` (non-unique index, which foreign keys get, errata #10).\n* VARCHAR stores the actual length, so over-sizing doesn't waste disk per row as the lecture suggests (errata #9). Still size thoughtfully. You can widen later with MODIFY.\n\n---\n\n## C6.3 ALTER TABLE … MODIFY (MySQL)\n*Source: lecture6 L853-923*\n\n```sql\nALTER TABLE `stations` MODIFY `line` ENUM('blue', 'green', 'orange', 'red', 'silver') NOT NULL;\nALTER TABLE `collections` ADD COLUMN `deleted` TINYINT DEFAULT 0;\n```\nMODIFY replaces the whole column definition, so repeat every old ENUM value and constraint. SQLite has no equivalent.\n\n---\n\n## C6.4 Stored procedures (MySQL)\n*Source: lecture6 L947-1278*\n\n**Level 1.** A named, saved sequence of statements on the server that you can `CALL` again and again, optionally with inputs.\n\n**Level 2.**\n```sql\nDELIMITER //\nCREATE PROCEDURE `sell`(IN `sold_id` INT)\nBEGIN\n    UPDATE `collections` SET `deleted` = 1 WHERE `id` = `sold_id`;\n    INSERT INTO `transactions` (`title`, `action`)\n    VALUES ((SELECT `title` FROM `collections` WHERE `id` = `sold_id`), 'sold');\nEND//\nDELIMITER ;\nCALL `sell`(2);\n```\n* `DELIMITER //` lets the body contain `;` (D6-02).\n* Several parameters are separated by commas, and procedures can call procedures (L1110-1118, L1250-1256).\n* Control flow exists (IF / ELSEIF / ELSE, loops). The lecture leaves using it to you (M6-E06).\n\n**Level 3.** Procedures vs triggers vs views: a view is a *read* abstraction, a trigger *reacts* automatically to writes, and a procedure is an *action* you invoke explicitly. Calling `sell(2)` twice logs two sales unless you guard against it.\n\n---\n\n## C6.5 PostgreSQL types\n*Source: lecture6 L1293-1477*\n\n* Integers: `SMALLINT`, `INT`, `BIGINT`. Auto-increment: **`SERIAL`** (SMALLSERIAL, BIGSERIAL).\n* An enum is declared once as a type: `CREATE TYPE \"swipe_type\" AS ENUM('enter', 'exit', 'deposit');`, then used as `\"type\" \"swipe_type\" NOT NULL`.\n* Time: `TIMESTAMP`, `DATE`, `TIME`, `INTERVAL` (a duration), with precision. The default \"now\" is `now()`.\n* Exact numbers: `NUMERIC(precision, scale)`. Also `MONEY` (currency-formatted, locale-dependent).\n\n---\n\n## C6.6 Scaling strategies\n*Source: lecture6 L1494-1785*\n\n**Vertical scaling** means a more powerful single server. **Horizontal scaling** means more servers.\n\n**Replication** keeps copies on several servers:\n* *Single-leader*: all writes go to the leader, which forwards them to followers. Reads can go to any server, and a follower used only for reads is a **read replica**.\n* *Multi-leader* and *leaderless* exist too, and are much more complex.\n* **Synchronous**: the leader waits for the follower's OK before answering the client. This is safe but slower, which suits finance and healthcare.\n* **Asynchronous**: the leader answers immediately. This is faster, but an acknowledged write can be lost if the follower fails, which is acceptable for social media.\n\n**Sharding** splits one huge data set across servers (names A-I / J-R / S-Z, or id ranges). Watch out for **hotspots** (one shard gets most of the traffic) and the **single point of failure** (a shard without replicas goes down). Combine sharding with replication.\n\n---\n\n## C6.7 Access control\n*Source: lecture6 L1786-1920*\n\n```sql\nCREATE USER 'carter' IDENTIFIED BY 'password';          -- demo password only!\nGRANT SELECT ON `rideshare`.`analysis` TO 'carter';     -- read the view only\nREVOKE SELECT ON `rideshare`.`analysis` FROM 'carter';\n```\nThis finally makes the M4 \"secure view\" real: carter can read `analysis` but gets a permission error on `rides`. Grant several privileges with commas (`SELECT, INSERT`). Avoid `GRANT ALL ON *.*` outside a sandbox.\n\n---\n\n## C6.8 SQL injection and prepared statements\n*Source: lecture6 L1921-2148*\n\n**Level 1.** If an application pastes user input into SQL text, the user can write SQL.\n\n**Level 2: Attacks from the lecture.**\n```sql\n-- password field:  ' OR 1=1           →  … AND \"password\" = '' OR 1=1 …\n-- account id:      1 UNION SELECT * FROM accounts\nSELECT * FROM accounts WHERE id = 1 UNION SELECT * FROM accounts;\n```\n**Defence: prepared statements (bound parameters).**\n```sql\nPREPARE `balance_check` FROM 'SELECT * FROM `accounts` WHERE `id` = ?';\nSET @id = '1 UNION SELECT * FROM accounts';\nEXECUTE `balance_check` USING @id;      -- returns only Alice\n```\n\n**Level 3.** The bound value is **never parsed as SQL**. The lecture calls this escaping, but it is really binding (errata #8). MySQL returned Alice because it converted `'1 UNION …'` to the number 1 when comparing it with the INT column. SQLite returns no row for the same input. In application code, never build SQL with f-strings or concatenation. Use the driver's placeholders (`?`, `%s`). `python3 tools/labs.py injection` shows both versions.\n\n**Practice:** M6-E01 … M6-E10 · **Debug:** D6-01, D6-02 · **Review deck:** R6\n"}], "exercises": [{"id": "M0-E01", "title": "Titles and authors", "origin": "source-demo", "concepts": ["C0.1", "C0.2"], "difficulty": 1, "skills": ["SELECT", "identifiers"], "db": "longlist0", "kind": "query", "prompt": "The `longlist` table holds the 78 books longlisted for the International Booker Prize, 2018-2023.\nReturn two columns from it: `title` and `author`.\n", "hints": ["SELECT names the columns you want, and FROM names the table.", "Separate several columns with commas. Column and table names go in double quotes.", "`SELECT \"title\", \"author\" FROM ...;`"], "solution": "SELECT \"title\", \"author\" FROM \"longlist\";\n", "explanation": "`SELECT *` would return every column, which floods a small terminal (L272-276). Ask only for what you need.\n", "module": "M0", "source": [{"file": "lecture0", "lines": "286-298", "quote": "I'll select also the authors from this table.", "text": " 286  Now, the neat thing here is I can select more than one column too.\n 287  Let's say I don't want just the title--\n 288  I want titles and authors in my search.\n 289  Well, I could do that as well.\n 290  Let me try this.\n 291  SELECT not just \"title,\" quote, unquote, but then I'll\n 292  say comma and some new column to select.\n 293  I'll select also the authors from this table.\n 294  And I'll select them from the longlist table like this.\n 295  Now I'll hit Semicolon to end my query.\n 296  Hit Enter.\n 297  And now I'll see a variety of columns here,\n 298  in particular the title and the author column."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["title", "author"], "rows": [["Boulder", "Eva Baltasar"], ["Whale", "Cheon Myeong-kwan"], ["The Gospel According to the New World", "Maryse Condé"], ["Standing Heavy", "GauZ'"], ["Time Shelter", "Georgi Gospodinov"], ["Is Mother Dead",
