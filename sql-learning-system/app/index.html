, then delete their name."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"artists\"", "columns": ["id", "name"], "rows": [[1, "Li Yin"], [2, "Placeholder Artist"]]}, {"query": "SELECT * FROM \"created\"", "columns": ["artist_id", "collection_id"], "rows": [[1, 2], [2, 3], [2, 4]]}]}}, {"id": "M3-E10", "title": "Hit the FOREIGN KEY constraint", "origin": "source-demo", "concepts": ["C3.6"], "difficulty": 1, "skills": ["FOREIGN KEY"], "db": "mfa", "kind": "error", "expect_error": "FOREIGN KEY constraint failed", "setup": "DROP TABLE \"created\";\nCREATE TABLE \"created\" (\n    \"artist_id\" INTEGER, \"collection_id\" INTEGER,\n    FOREIGN KEY(\"artist_id\") REFERENCES \"artists\"(\"id\"),\n    FOREIGN KEY(\"collection_id\") REFERENCES \"collections\"(\"id\")\n);\nINSERT INTO \"created\" VALUES (1, 2), (3, 1), (2, 3), (2, 4);\n", "prompt": "Delete *Unidentified artist* directly from `artists` and read the error.", "hints": ["The artist's id is still referenced in `created`.", "A plain DELETE with a WHERE on the name.", "`DELETE FROM \"artists\" WHERE \"name\" = 'Unidentified artist';`"], "solution": "DELETE FROM \"artists\" WHERE \"name\" = 'Unidentified artist';\n", "explanation": "The default action is effectively RESTRICT. SQLite refuses to leave `created` pointing at nothing.\n(This only happens with `PRAGMA foreign_keys = ON`.)\n", "module": "M3", "source": [{"file": "lecture3", "lines": "885-896", "quote": "I do get that FOREIGN KEY constraint error", "text": " 885  So if I tried to delete an artist that is referenced in my created table,\n 886  I would probably raise a constraint error--\n 887  a FOREIGN KEY [? constraint ?] error.\n 888  So let's just try this and see what happens.\n 889  Let me try DELETE FROM the [? artist's ?] [? table, ?] DELETE FROM\n 890  \"artists\" WHERE, let's say the \"name\" of the artist is literally \"Unidentified\n 891  artist.\"\n 892  This is the name they have in the Museum of Fine Arts collections--\n 893  Unidentified artist.\n 894  So now I want to delete them from that table.\n 895  Well, if I hit Enter, I do get that FOREIGN KEY constraint error.\n 896  So does this mean I just can't delete this artist or is there a workaround?"}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"error": "FOREIGN KEY constraint failed"}}, {"id": "M3-E11", "title": "Let ON DELETE CASCADE do both steps", "origin": "source-demo", "concepts": ["C3.6"], "difficulty": 2, "skills": ["ON DELETE CASCADE"], "db": "mfa", "kind": "modify", "prompt": "In this version of the schema, `created`'s foreign keys say `ON DELETE CASCADE` (check with `.schema` or `SELECT sql FROM sqlite_master`).\nDelete *Unidentified artist* with **one** statement and confirm their row in `created` is gone too.\n", "hints": ["With CASCADE, deleting the referenced row also deletes the referencing rows.", "Just delete from `artists`.", "`DELETE FROM \"artists\" WHERE \"name\" = 'Unidentified artist';`"], "solution": "DELETE FROM \"artists\" WHERE \"name\" = 'Unidentified artist';\n", "check": ["SELECT * FROM \"artists\"", "SELECT * FROM \"created\""], "explanation": "The other ON DELETE choices: RESTRICT (refuse), NO ACTION (allow, leaving dangling ids), SET NULL, SET DEFAULT, and CASCADE.\n", "module": "M3", "source": [{"file": "lecture3", "lines": "988-1013", "quote": "This converts our 2-step process into a 1-step process.", "text": " 988  could specify some alternative action that happens when I try to delete\n 989  the id that is referenced by this [? foreign ?] [? key. ?] I can specify\n 990  that using a keyword called ON DELETE.\n 991  So after FOREIGN KEY REFERENCES [? \"artist id,\" ?] I could say\n 992  afterwards ON DELETE, and then specify some action I want to actually happen\n 993  when I tried to delete the primary key referenced by this [? foreign ?]\n 994  [? key. ?]\n 995  One thing I could use would be RESTRICT, which\n 996  is kind of  Yin"], [2, "Placeholder Artist"]]}, {"query": "SELECT * FROM \"created\"", "columns": ["artist_id", "collection_id"], "rows": [[1, 2], [2, 3], [2, 4]]}]}}, {"id": "M3-E12", "title": "Re-attribute an artwork with UPDATE", "origin": "source-demo", "concepts": ["C3.7", "C1.4"], "difficulty": 2, "skills": ["UPDATE", "subquery"], "db": "mfa", "kind": "modify", "prompt": "Research shows *Farmers Working at Dawn* was painted by **Li Yin**, not by \"Unidentified artist\".\nUpdate `created` accordingly, using subqueries for both ids.\n", "hints": ["The fact to change lives in the junction table `created`, not in `artists`.", "`SET \"artist_id\" = (subquery for Li Yin)` and `WHERE \"collection_id\" = (subquery for the painting)`.", "`UPDATE \"created\" SET \"artist_id\" = (SELECT \"id\" FROM \"artists\" WHERE \"name\" = 'Li Yin') WHERE \"collection_id\" = (SELECT \"id\" FROM \"collections\" WHERE \"title\" = 'Farmers Working at Dawn');`"], "solution": "UPDATE \"created\" SET \"artist_id\" = (\n    SELECT \"id\" FROM \"artists\" WHERE \"name\" = 'Li Yin'\n)\nWHERE \"collection_id\" = (\n    SELECT \"id\" FROM \"collections\" WHERE \"title\" = 'Farmers Working at Dawn'\n);\n", "check": ["SELECT * FROM \"created\""], "explanation": "Without the WHERE, every artwork would be attributed to Li Yin (debugging D3-03).", "module": "M3", "source": [{"file": "lecture3", "lines": "1146-1176", "quote": "So I have Li Yin associated with now two paintings overall.", "text": "1146  So let me try this.\n1147  I'll say UPDATE \"created\" and SET, let's say, \"artist_id\"\n1148  equal to some particular value.\n1149  Well, what value should I set it to?\n1150  I could try to set it to Li Yin's id, which we know is just 1.\n1151  But let me try instead to use a [? subquery ?] here.\n1152  Let me try to say parentheses, and then write some query to update this value.\n1153  I'll say SELECT \"id\" from \"artists\" like this Enter again,\n1154  WHERE the \"name\" equals Li Yin.\n1155  And then let fusion of Flowers*, *Spring Outing*.\nCapitalization is up to you; the checker compares case-insensitively but requires no leading or trailing spaces.\n", "hints": ["Fix the systematic problems first, for all rows (no WHERE): whitespace with `trim()`, case with `upper()`.", "Then fix families of typos with `LIKE` patterns (`%` = any characters; LIKE ignores case), and fix the one-off typos with `=`.", "Run the GROUP BY after each step. For example `UPDATE \"votes\" SET \"title\" = 'FARMERS WORKING AT DAWN' WHERE \"title\" LIKE 'Fa%';` Then do Imaginative, the `Imagintive` typo, and Profusion."], "solution": "UPDATE \"votes\" SET \"title\" = trim(\"title\");\nUPDATE \"votes\" SET \"title\" = upper(\"title\");\nUPDATE \"votes\" SET \"title\" = 'FARMERS WORKING AT DAWN' WHERE \"title\" LIKE 'Fa%';\nUPDATE \"votes\" SET \"title\" = 'IMAGINATIVE LANDSCAPE' WHERE \"title\" LIKE 'Imaginative %';\nUPDATE \"votes\" SET \"title\" = 'IMAGINATIVE LANDSCAPE' WHERE \"title\" = 'IMAGINTIVE LANDSCAPE';\nUPDATE \"votes\" SET \"title\" = 'PROFUSION OF FLOWERS' WHERE \"title\" LIKE 'Profusion%';\n", "check": ["SELECT upper(\"title\"), COUNT(*) FROM \"votes\" GROUP BY upper(\"title\")", "SELECT COUNT(*) FROM \"votes\" WHERE \"title\" != trim(\"title\")"], "explanation": "The final tally is Farmers 6, Imaginative 5, Profusion 5, Spring Outing 4. The lecture reports 6 and 5 for the first two.\n`LIKE 'Fa%'` is fine for this tiny data set, but in real data it could also match other titles (see debugging D3-06).\n", "module": "M3", "source": [{"file": "lecture3", "lines": "1281-1299", "quote": "takes a string and just removes leading and trailing", "text": "1281  I could try using a function in SQLite, one called [? trim. ?] [? Trim ?] takes\n1282  a string and just removes leading and trailing [? whitespace, ?] [INAUDIBLE]\n1283  back only the characters in the middle.\n1284  So let me try that.\n1285  I'll say UPDATE \"votes,\" my table here, and SET\n1286  the \"title\" column equal to what?\n1287  Well, the trimmed version of title.\n1288  Trim looks like this--\n1289  trim, and then some parentheses to say the input to this function.\n1290  I'll give it the \"title\" column.\n1291  Now, I'll hit semicolon.\n1292  And this query will run as follows.\n1293  It will update the votes table.\n1294  And inside the votes table set, the title column\n1295  equal to the trimmed version of whatever values are inside that column,\n1296  trimming here means remove trailing and leading [? whitespace. ?]\n1297  I don't need to apply any condition.\n1298  I don't need to say WHERE dot dot dot, because I want this\n1299  to apply to all rows in my data set."}, {"file": "lecture3", "lines": "1384-1394", "quote": "so be careful with this", "text": "1384  Now for this data set, it turns out that the only artwork that begins with F-A\n1385  is Farmers Working At Dawn.\n1386  So to match any title with F-A and then anything afterwards,\n1387  I could use F-A percent, and then close out that pattern.\n1388  Notice how I don't have to have consistent capitalization.\n1389  Like is case insensitive, and notice how, too, the percent matches\n1390  anything that comes after F-A. Now in this data set, this is OK,\n1391  but in a larger data set, you probably want to avoid this kind of query\n1392  because you could match much more than Farmers Working At Dawn.\n1393  You'd match anything that begins with F-A, so be careful with this\n1394  and think through what pattern should you use to fix up your titles."}, {"file": "lecture3", "lines": "1444-1448", "quote": "Farmers Working At Dawn has six votes.", "text": "1444  Now I can hit Enter, and if I do my usual query\n1445  to show you the votes grouped by title, I\n1446  see I'm finally at my correct, fully-formatted data set.\n1447  Farmers Working At Dawn has six votes.\n1448  Imaginative Landscape has five, and so on down the row."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query" e type dot schema.\n1617  I can actually see this trigger is part of my schema.\n1618  I can see create trigger sell before delete on transactions\n1619  underneath the transactions table.\n1620  OK, let's try putting this into action here.\n1621  Let me try actually deleting something from our collections table.\n1622  I'll say delete from collections where the title equals\n1623  \"Profusion of Flowers.\"\n1624  I want to sell this particular piece of artwork from our collection.\n1625  I'll hit semicolon here, and now nothing seems to happen as usual,\n1626  but if I select star from collections--\n1627  from collections, I see that piece is gone.\n1628  It's no longer in here, and if I select star from transactions--"}, {"file": "lecture3", "lines": "1638-1678", "quote": "So this is the power of triggers.", "text": "1638  So I create a trigger called buy.\n1639  Let me type create trigger \"buy,\" and now I\n1640  want to run this statement forthcoming after an insert on collections.\n1641  So I want to first insert a new item to collections, and when I do, after I do,\n1642  I want to run this query coming next.\n1643  Now, I want to, for each row, begin the statement I want to run.\n1644  So as we said before, I want to insert into the transactions table.\n1645  I want to insert into the title and action columns, just like this.\n1646  Now, I want to insert some values.\n1647  The values I want to insert--\n1648  well, I want to insert the new title, the new row I've just added.\n1649  So in addition to old, we also have new when\n1650  I'm talking when I'm using a trigger on an insert.\n1651  So I'll say new.title, where again, new is the new row or rows I'm inserting,\n1652  and the dot title is a column called title.\n1653  Now, here I'll say the action was bought.\n1654  We bought this artwork.\n1655  I'll hit semicolon here, and now, I'll say end\n1656  to say this is the end of my statement I want to run for every row I\n1657  insert on collections.\n165 2022 3.87, 2023 3.78 (L581-586).\n", "module": "M4", "source": [{"file": "lecture4", "lines": "588-612", "quote": "I'll say create a temporary view.", "text": " 588  I could store this temporarily inside of a view\n 589  that I could use while I'm doing some analysis on this given day.\n 590  So I'll say create a temporary view.\n 591  And I'll call this one average ratings by year.\n 592  How were the books rated each individual year on average?\n 593  And I'll say this is the query that I just did before.\n 594  Select, in this case, the year and the rounded average rating\n 595  to two decimal places, as the rating column from average book ratings,\n 596  that same view from before.\n 597  Now, I'm creating a view from my view.\n 598  I'll group by here, group by year.\n 599  And then I'll hit Enter.\n 600  And I should see nothing popping up.\n 601  But now if I wanted to query this view, I\n 602  could say select star from average ratings by year.\n 603  And I'll see the results of that view.\n 604  Now, though, here's the catch and why it's temporary.\n 605  If I were to type dot quit now, dot quit, and try it again,\n 606  SQLite 3 long list dot DB.\n 607  Let me retype that.\n 608  SQLite 3 long list dot DB.\n 609  If I now try to select star from average ratings by year semicolon,\n 610  I'll get no such table and really no such view.\n 611  I don't have a view called average ratings by year\n 612  anymore because this was temporary."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"average_ratings_by_year\"", "columns": ["year", "rating"], "rows": [[2018, 3.75], [2019, 3.64], [2020, 3.93], [2021, 3.69], [2022, 3.87], [2023, 3.78]]}, {"query": "SELECT COUNT(*) FROM sqlite_temp_master WHERE \"name\" = 'average_ratings_by_year'", "columns": ["COUNT(*)"], "rows": [[1]]}]}}, {"id": "M4-E05", "title": "The same analysis with a CTE", "origin": "source-demo", "concepts": ["C4.5"], "difficulty": 3, "skills": ["WITH (CTE)"], "db": "longlist", "kind": "query", "prompt": "Without creating any view, return `year` and the rounded average of the per-book average ratings (`rating`), one row per year.\nUse a common table expression named `average_book_ratings` for the per-book step.\n", "hints": ["`WITH name AS ( query ) SELECT ... FROM name ...;`", "The CTE body is the per-book average query from M4-E03, without CREATE VIEW.", "`WITH \"average_book_ratings\" AS (SELECT ... GROUP BY \"book_id\") SELECT \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\" FROM \"average_book_ratings\" GROUP BY \"year\";`"], "solution": "WITH \"average_book_ratings\" AS (\n    SELECT \"book_id\", \"title\", \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\"\n    FROM \"ratings\"\n    JOIN \"books\" ON \"ratings\".\"book_id\" = \"books\".\"id\"\n    GROUP BY \"book_id\"\n)\nSELECT \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\"\nFROM \"average_book_ratings\"\nGROUP BY \"year\";\n", "explanation": "Lifetimes: a view lasts forever, a temporary view lasts for one connection, and a CTE lasts for one query.\n", "module": "M4", "source": [{"file": "lecture4", "lines": "633-648", "quote": "a CTE exists for a single query", "text": " 633  And let's introduce now something called a common table expression, or a CTE.\n 634  And a common table expression is simply a view\n 635  that exists for the duration of a single query.\n 636  So a regular view, as we saw before, exists forever in my schema.\n 637  A temporary view exists for a single connection.\n 638  But a CTE exists for a single query.\n 639  And the syntax looks just a bit different.\n 640  With a CTE I can write a single query, but at the beginning of that query,\n 641  define the CTE, the Common Table Expression.\n 642  To do so, I would say with and give it some name, as and then\n 643  inside these parentheses say the query I want to be this CTE here.\n 644  I could then optionally follow it up with more CTEs for this same query.\n 645  Or I could omit the comma, and then use just select from the name of a CTE\n 646  up above.\n 647  This is useful if you want to have some very temporary view that you don't\n 648  want to store in your schema, but you do want to use for this particular query."}, {"file": "lecture4", "lines": "664-696", "quote": "I'll use a CTE.", "text": " 664  So I'll write the query like this.\n 665  I'll use a CTE.\n 666  And I'll say, with average book ratings, average book ratings,\n 667  as now this query I'll write now inside.\n 668  And this query should be familiar.\n 669  It's the same query we use to find the average rating for each book.\n 670  I'll say here, I want to select the book ID column, the title column, the year\n 671  column, and the rounded average rating to two decimal places,\n 672  calling it rating, in this case from my ratings table, like this.\n 673  Now, what do I need to do?\n 674  I also need to, as you saw before, join in my books table.\n 675  Join books on the primary and foreign keys aligning.\n 676  So I'll say the book ID column, that foreign key in the ratings table,\n 677  should equal books dot ID, that primary key column in books.\n 678  Then I will group by the book ID to find the average rating for each book.\n 679  And now, let me close out this CTE.\n 680  I'll close my parentheses.\n 681  And because I'm only using one CTE, I don't need a comma.\n 682  I can then just write the rest of my query.\n 683  I'll hit Enter for style sake.\n 684  And now with this CTE called average book ratings,\n 685  I want to find the average rating year over year\n 686  grouping not by book, but by year.\n 687  So I'll say select, in this case, year, and then\n 688  select the rounded average rating still to two decimal places as a new rating\n 689  column.\n 690  Then I'll select this from, in this case, my CTE.\n 691  So I'll hit Enter here as well from average book ratings,\n 692  that same CTE I defined earlier in my query.\n 693  Now finally, to find the average rating across individual years,\n 694  I'll say group by year semicolon.\n 695  And now hopefully, if I hit Enter, I should see the average rating\n 696  for each year in my database."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["year", "rating"], "rows": [[2018, 3.75], [2019, 3.64], [2020, 3.93], [2021, 3.69], [2022, 3.87], [2023, 3.78]], "error": null}}, {"id": "M4-E06", "title": "Partition the books by year", "origin": "source-demo", "concepts": ["C4.6"], "difficulty": 1, "skills": ["CREATE VIEW", "WHERE", "quoted identifiers"], "db": "longlist", "kind": "modify", "prompt": "Create two views, `\"2022\"` and `\"2021\"`, each with the `id` and `title` of the books longlisted in that year.\n", "hints": ["A partition is a filtered SELECT saved as a view.", "A name that is just digits must be quoted, as `\"2022\"`.", "`CREATE VIEW \"2022\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2022;`"], "solution": "CREATE VIEW \"2022\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2022;\nCREATE VIEW \"2021\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2021;\n", "check": ["SELECT * FROM \"2022\"", "SELECT * FROM \"2021\""], "explanation": "Naming trade-off from the lecture: `\"2021\"` is short but ambiguous, and `books_nominated_in_2021` is clear but long.\n", "module": "M4", "source": [{"file": "lecture4", "lines": "749-790", "quote": "I'll say create view 2021 as select ID, title from books.", "text": " 749  But now, I want to create a view that might actually\n 750  store the results of this query more long term.\n 751  I could say create view and call this, let's\n 752  say, 2022 as now same query from before, select ID and title from my books\n 753  table, in this case where the year equals 2022 semicolon.\n 754  Now, if I ever want to find only those books nominated in 2022,\n 755  I could now use my view.\n 756  I could say select star from 2022 quote and then semicolon, hit Enter.\n 757  And now I should see those very same books.\n 758  So what could I do now?\n 759  Maybe I want those books from 2021 as well.\n 760  Let me ask the audience, what could you do\n 761  to create the view for the books in 2021 based on what we've just seen now?\n 762  AUDIENCE: We could just change the year from 2022 to 2021.\n 763  CARTER ZENKE: Yeah, just change the year.\n 764  And what would you propose we call this new view?\n 765  if you had to take the reins on naming this view, what would you name it?\n 766  AUDIENCE: Books that were written in 2021.\n 767  CARTER ZENKE: Yeah, we could call it books that were nominated in 2021.\n 768  But I would argue that might be a bit of a long view title.\n 769  So let's shorten just a little bit.\n 770  And maybe in keeping with our current naming, we'll say 2021 instead.\n 771  So I'll come back over here.\n 772  And let's try this.\n 773  I'll say create a view.\n 774  And we could, by all accounts and purposes,\n 775  we could say books nominated in 2021.\n 776  And that's totally OK.\n 777  But if I were to pass this view on to a new programmer, a new database analyst,\n 778  well, I kind of want to shorten it for them, make it more simple for them\n 779  to read.\n 780  So I could just call this 2021.\n 781  Of course, this title is kind of ambiguous.\n 782  Like if I pass you a view called 2021, are you automatically going\n 783  to know what's inside that view?\n 784  Probably not.\n 785  So it's actually a balance between how descriptive\n 786  you want to be with your names here.\n 787  We'll stick though with 2021 to our earlier example here.\n 788  Now I'll say create view 2021 as select ID, title from books.\n 789  And to Fabian's point, I'll say where the year equals 2021 semicolon Enter."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"2022\"", "columns": ["id", "title"], "rows": [[14, "Heaven"], [15, "Elena Knows"], [16, "The Book of Mother"], [17, "Tomb of Sand"], [18, "A New Name: Septology VI-VII"], [19, "The Books of Jacob"], [20, "Love in the Big City"], [21, "Paradais"], [22, "Phenotypes"], [23, "Happy Stories, Mostly"], [24, "More Than I Love My Life"], [25, "After the Sun"], [26, "Cursed Bunny"]]}, {"query": "SELECT * FROM \"2021\"", "columns": ["id", "title"], "rows": [[27, "At Night All Blood Is Black"], [28, "The Dangers of Smoking in Bed"], [29, "The Employees"], [30, "When We Cease to Understand the World"], [31, "The War of the Poor"], [32, "I Live in the Slums"], [33, "In Memory of Memory"], [34, "Minor Detail"], [35, "An Inventory of Losses"], [36, "Summer Brother"], [37, "Wretchedness"], [38, "The Perfect Nine"], [39, "The Pear Field"]]}]}}, {"id": "M4-E07", "title": "Try to update a view", "origin": "source-demo", "concepts": ["C4.1", "C4.6"], "difficulty": 1, "skills": ["read-only views"], "db": "longlist", "kind": "error", "expect_error": "is a view", "setup": "CREATE VIEW \"2021\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2021;\n", "prompt": "Through the `\"2021\"` view, try to rename *Minor Detail* to *The Minor Detail* with an UPDATE. Read the error.\n", "hints": ["Write the UPDATE against the view's name.", "`UPDATE \"2021\" SET ... WHERE ...;`", "`UPDATE \"2021\" SET \"title\" = 'The Minor Detail' WHERE \"title\" = 'Minor Detail';`"], "solution": "UPDATE \"2021\" SET \"title\" = 'The Minor Detail' WHERE \"title\" = 'Minor Detail';\n", "explanation": "In SQLite a view holds no data of its own, so it cannot be modified directly (MySQL and PostgreSQL allow it for simple views, errata #11).\n", "module": "M4", "source": [{"file": "lecture4", "lines": "827-838", "quote": "cannot modify 2021 because it is", "text": " 827  And let's say we wanted to change a book in the 2021 view.\n 828  I could say select star from 2021 semicolon.\n 829  And maybe it turns out there's a typo in here.\n 830  So instead of a minor detail, it's called something\n 831  like the minor detail, this book on ID 34 here.\n 832  I could try to update this view.\n 833  I could say, update 2021 and set the title\n 834  equal to the minor detail, where the title currently is minor detail,\n 835  like this, minor detail.\n 836  Then I'll hit semicolon.\n 837  And if I do this, I get this error, cannot modify 2021 because it is\n 838  a view."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"error": "cannot modify 2021 because it is a view"}}, {"id": "M4-E08", "title": "Fix the typo where the data lives", "origin": "source-question", "concepts": ["C4.1", "C3.7"], "difficulty": 1, "skills": ["UPDATE"], "db": "longlist", "kind": "modify", "setup": "CREATE VIEW \"2021\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2021;\n", "prompt": "Make the `\"2021\"` view show *The Minor Detail* instead of *Minor Detail*.", "hints": ["The view only *reads* from another table.", "Change the underlying `books` row.", "`UPDATE \"books\" SET \"title\" = 'The Minor Detail' WHERE \"title\" = 'Minor Detail';`"], "solution": "UPDATE \"books\" SET \"title\" = 'The Minor Detail' WHERE \"title\" = 'Minor Detail';\n", "check": ["SELECT * FROM \"2021\""], "explanation": "Update the base table, and every view built on it reflects the change.", "module": "M4", "source": [{"file": "lecture4", "lines": "839-848", "quote": "What I should instead do is try to update", "text": " 839  Now, why can't we modify a view?\n 840  Well, recall that a view is simply the combination\n 841  of data from underlying tables.\n 842  I've assembled data from different pieces of my database\n 843  and put them into a single view.\n 844  But I can't then update that data because that data\n 845  is located in multiple individual tables around my database.\n 846  What I should instead do is try to update\n 847  the underlying table, which I can do as we saw before with just update\n 848  and set to."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"2021\"", "columns": ["id", "title"], "rows": [[27, "At Night All Blood Is Black"], [28, "The Dangers of Smoking in Bed"], [29, "The Employees"], [30, "When We Cease to Understand the World"], [31, "The War of the Poor"], [32, "I Live in the Slums"], [33, "In Memory of Memory"], [34, "The Minor Detail"], [35, "An Inventory of Losses"], [36, "Summer Brother"], [37, "Wretchedness"], [38, "The Perfect Nine"], [39, "The Pear Field"]]}]}}, {"id": "M4-E09", "title": "An anonymized view for analysts", "origin": "source-demo", "concepts": ["C4.7"], "difficulty": 2, "skills": ["CREATE VIEW", "constant column", "AS"], "db": "rideshare", "kind": "modify", "prompt": "Create a view `analysis` with `id`, `origin`, `destination`, and a `rider` column that always contains the text `anonymous`.\n", "hints": ["Leave out the real `rider` column, which is personally identifiable information (PII).", "A literal in the SELECT list produces that value on every row: `'anonymous' AS \"rider\"`.", "`CREATE VIEW \"analysis\" AS SELECT \"id\", \"origin\", \"destination\", 'anonymous' AS \"rider\" FROM \"rides\";`"], "solution": "CREATE VIEW \"analysis\" AS\nSELECT \"id\", \"origin\", \"destination\", 'anonymous' AS \"rider\"\nFROM \"rides\";\n", "check": ["SELECT * FROM \"analysis\""], "explanation": "In SQLite anyone who can open the file can still run `SELECT * FROM \"rides\"`. There are no per-user permissions.\nMySQL/PostgreSQL fix this with GRANT (M6-E10).\n", "module": "M4", "source": [{"file": "lecture4", "lines": "916-942", "quote": "I'll say quote unquote \"anonymous\" as this column name called rider.", "text": " 916  It turns out that in SQLite if I want to fill a column with some arbitrary\n 917  value, I can do that a bit like this.\n 918  Why don't I try to select ID and select origin and destination.\n 919  But I also want to let somebody know that this data has been anonymized.\n 920  There is rider information in the underlying table.\n 921  But you don't have access to it.\n 922  What I'll do instead is say, let me make this new column that's filled\n 923  with this value anonymous as a string.\n 924  I'll say quote unquote \"anonymous\" as this column name called rider.\n 925  And I'll select all of this from the rides table semicolon.\n 926  Now I have more helpfully indicated that there is a rider column.\n 927  But you deliberately don't have access to see who those riders are.\n 928  So my last step here is probably to turn this into a view.\n 929  I have a good query.\n 930  But I want to save it so I could query it later on.\n 931  Well, I could type select or not select.\n 932  I could type Create View first.\n 933  I'll create a view.\n 934  This one just called analysis.\n 935  I'll give this to my data analysts here.\n 936  Create view analysis.\n 937  And then I'll say as let's go with select ID, origin, and destination,\n 938  as well as the anonymous column as, in this case, the rider.\n 939  And I'll select all of this from my rides table semicolon, hit Enter.\n 940  Now, if I type dot schema, I see my new view analysis.\n 941  And if I say select star from analysis semicolon,\n 942  I should see my \"anonymized\", quote unquote, this data."}, {"file": "lecture4", "lines": "962-968", "quote": "In SQLite we can't set access controls", "text": " 962  And this is a downside of SQLite.\n 963  In SQLite we can't set access controls, meaning I either give you\n 964  the entire database or nothing at all.\n 965  In other DBMSes though, I could set access controls.\n 966  I could give David access only to the analysis view.\n 967  I can give myself access to both the rides table and the analysis view.\n 968  So keep that in mind when you're working with SQLite."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"analysis\"", "columns": ["id", "origin", "destination", "rider"], "rows": [[1, "Good Egg Galaxy", "Honeyhive Galaxy", "anonymous"], [2, "Castle Courtyard", "Cascade Kingdom", "anonymous"], [3, "Metro Kingdom", "Seaside Kingdom", "anonymous"], [4, "Ikaruga Pier", "Delfino Plaza", "anonymous"], [5, "Bob-omb Battlefield", "Castle Courtyard", "anonymous"], [6, "Honeyhive Galaxy", "Good Egg Galaxy", "anonymous"]]}]}}, {"id": "M4-E10", "title": "current_collections, a view over soft deletes", "origin": "source-demo", "concepts": ["C4.1", "C3.10"], "difficulty": 2, "skills": ["CREATE VIEW", "soft delete"], "db": "mfa", "kind": "modify", "setup": "ALTER TABLE \"collections\" ADD COLUMN \"deleted\" INTEGER DEFAULT 0;\nUPDATE \"collections\" SET \"deleted\" = 1 WHERE \"title\" = 'Farmers Working at Dawn';\n", "prompt": "`collections` now has a `deleted` flag. Create a view `current_collections` with `id`, `title`, `accession_number` and `acquired`\n(no `deleted` column) that contains only items **not** marked deleted.\n", "hints": ["Filter on the flag, and don't expose it.", "`WHERE \"deleted\" = 0`", "`CREATE VIEW \"current_collections\" AS SELECT \"id\", \"title\", \"accession_number\", \"acquired\" FROM \"collections\" WHERE \"deleted\" = 0;`"], "solution": "CREATE VIEW \"current_collections\" AS\nSELECT \"id\", \"title\", \"accession_number\", \"acquired\"\nFROM \"collections\"\nWHERE \"deleted\" = 0;\n", "probes": ["UPDATE \"collections\" SET \"deleted\" = 1 WHERE \"title\" = 'Spring Outing'"], "check": ["SELECT * FROM \"current_collections\""], "explanation": "Soft-deleting another item (the probe) removes it from the view at once.", "module": "M4", "source": [{"file": "lecture4", "lines": "1065-1077", "quote": "And now I'll see only those items that have not been deleted.", "text": "1065  I could say maybe create a view called current collections.\n1066  And then I'll make this the following query as select ID,\n1067  select title, accession number, and acquired.\n1068  But now I'll actually omit that deleted column.\n1069  I don't want this column to show up in my current collections.\n1070  I only want it to be in the underlying table.\n1071  So I'll select all of these columns from the collections table.\n1072  And then I'll say where deleted equals 0 to apply this condition\n1073  and only get those items that are not marked as deleted.\n1074  Now, I'll hit Enter.\n1075  And I should be able to do this, select star from current collections\n1076  semicolon.\n1077  And now I'll see only those items that have not been deleted."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"current_collections\"", "columns": ["id", "title", "accession_number", "acquired"], "rows": [[2, "Imaginative Landscape", "56.496", null], [3, "Profusion of Flowers", "56.257", "1956-04-12"], [4, "Spring Outing", "14.76", "1914-01-08"]]}]}}, {"id": "M4-E11", "title": "INSTEAD OF DELETE, turning a delete into a soft delete", "origin": "source-demo", "concepts": ["C4.8"], "difficulty": 3, "skills": ["INSTEAD OF trigger", "OLD"], "db": "mfa", "kind": "modify", "setup": "ALTER TABLE \"collections\" ADD COLUMN \"deleted\" INTEGER DEFAULT 0;\nCREATE VIEW \"current_collections\" AS\nSELECT \"id\", \"title\", \"accession_number\", \"acquired\" FROM \"collections\" WHERE \"deleted\" = 0;\n", "prompt": "Make `DELETE FROM \"current_collections\" WHERE ...` work: instead of deleting, set `deleted = 1` on the matching base row.\nName the trigger `\"delete\"` (quoted, because it is a keyword).\n", "hints": ["`CREATE TRIGGER \"delete\" INSTEAD OF DELETE ON \"current_collections\" FOR EACH ROW BEGIN ... END;`", "`OLD.\"id\"` is the id of the view row being deleted.", "Body: `UPDATE \"collections\" SET \"deleted\" = 1 WHERE \"id\" = OLD.\"id\";` Don't forget the WHERE."], "solution": "CREATE TRIGGER \"delete\"\nINSTEAD OF DELETE ON \"current_collections\"\nFOR EACH ROW\nBEGIN\n    UPDATE \"collections\" SET \"deleted\" = 1\n    WHERE \"id\" = OLD.\"id\";\nEND;\n", "probes": ["DELETE FROM \"current_collections\" WHERE \"title\" = 'Imaginative Landscape'"], "check": ["SELECT \"title\", \"deleted\" FROM \"collections\"", "SELECT \"title\" FROM \"current_collections\""], "explanation": "Without `WHERE \"id\" = OLD.\"id\"` the UPDATE would soft-delete every artwork (L1148-1153, debugging D4-02).\n", "module": "M4", "source": [{"file": "lecture4", "lines": "1133-1170", "quote": "where, in this case, the ID column is equal to the old ID", "text": "1133  To our point, I want to create a trigger that\n1134  runs instead of deleting on this view.\n1135  And what I want to instead happen is an update on the underlying table.\n1136  So I'll say create a trigger, this one called delete.\n1137  And then I'll say instead of delete on current collections, that\n1138  is whenever SQL listens and hears a delete on the current collections view,\n1139  I don't want that to happen.\n1140  I instead want this other statement to happen.\n1141  I'll say for each row affected by that delete,\n1142  for each row I ask delete on current collections, run\n1143  instead this other statement.\n1144  I'll say begin.\n1145  Here is that statement.\n1146  One, two, three, four indents for style sake.\n1147  And now I'll say I want to update collections and set deleted equal to 1.\n1148  But I don't want to leave this just as is.\n1149  If I say update collections, set deleted equal to 1,\n1150  what's the problem with that statement, if I end it there?\n1151  AUDIENCE: So yeah, it will update all the columns,\n1152  whether it is we want it to be deleted or not.\n1153  CARTER ZENKE: Yeah, with no condition it'll update all the columns here.\n1154  So I want to apply a condition to make sure it only affects\n1155  the particular row I'm working with.\n1156  Well, what uniquely identifies each row?\n1157  The ID does.\n1158  So let's try using the ID here.\n1159  I'll come back.\n1160  And I'll say I want to update collections, set deleted equal to 1\n1161  but only when some condition is true.\n1162  I'll indent again four times and say where, in this case,\n1163  the ID column is equal to the old ID.\n1164  Now, old here is a special keyword that means the row we just deleted\n1165  or that we would have deleted from current collections.\n1166  I want to update that same row with that same ID in the underlying collections\n1167  table.\n1168  So I'll put a semicolon here to end.\n1169  And then I'll say end this statement.\n1170  This is the entire statement I want to run"}, {"file": "lecture4", "lines": "1178-1194", "quote": "So a good way of trying to use triggers here", "text": "1178  What I can do now is try again to delete from current collections.\n1179  I'll say delete from current collections where.\n1180  In this case, the title equals Imaginative Landscape.\n1181  Let's say we sold this painting.\n1182  It's no longer part of our collection.\n1183  Imaginative Landscape semicolon.\n1184  And now it actually seems to work.\n1185  I get no error here.\n1186  So it seems like it went OK.\n1187  Well, if I select star from current collections,\n1188  I actually see that it's gone.\n1189  But is it really gone?\n1190  If I try select star from collections, not current collections, the underlying\n1191  table for current collections semicolon, what do I see?\n1192  That the ID column has been updated from a 0 now to a 1.\n1193  So a good way of trying to use triggers here\n1194  to update our views by instead modifying the underlying table."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT \"title\", \"deleted\" FROM \"collections\"", "columns": ["title", "deleted"], "rows": [["Farmers Working at Dawn", 0], ["Imaginative Landscape", 0], ["Profusion of Flowers", 0], ["Spring Outing", 0]]}, {"query": "SELECT \"title\" FROM \"current_collections\"", "columns": ["title"], "rows": [["Farmers Working at Dawn"], ["Imaginative Landscape"], ["Profusion of Flowers"], ["Spring Outing"]]}]}}, {"id": "M4-E12", "title": "INSTEAD OF INSERT ... WHEN, re-acquiring a deleted item", "origin": "source-demo", "concepts": ["C4.8"], "difficulty": 4, "skills": ["INSTEAD OF trigger", "WHEN", "NEW", "subquery"], "db": "mfa", "kind": "modify", "setup": "ALTER TABLE \"collections\" ADD COLUMN \"deleted\" INTEGER DEFAULT 0;\nUPDATE \"collections\" SET \"deleted\" = 1 WHERE \"title\" = 'Imaginative Landscape';\nCREATE VIEW \"current_collections\" AS\nSELECT \"id\", \"title\", \"accession_number\", \"acquired\" FROM \"collections\" WHERE \"deleted\" = 0;\n", "prompt": "*Imaginative Landscape* (accession `56.496`) was soft-deleted. When someone inserts into `current_collections`\nan item whose **accession number already exists** in `collections`, flip its `deleted` back to 0 instead of adding a row.\nName the trigger `\"insert_when_exists\"`.\n", "hints": ["Triggers can be conditional: `FOR EACH ROW WHEN <condition> BEGIN ... END;`", "The condition: `NEW.\"accession_number\" IN (SELECT \"accession_number\" FROM \"collections\")`.", "Body: `UPDATE \"collections\" SET \"deleted\" = 0 WHERE \"accession_number\" = NEW.\"accession_number\";`"], "solution": "CREATE TRIGGER \"insert_when_exists\"\nINSTEAD OF INSERT ON \"current_collections\"\nFOR EACH ROW\nWHEN NEW.\"accession_number\" IN (\n    SELECT \"accession_number\" FROM \"collections\"\n)\nBEGIN\n    UPDATE \"collections\" SET \"deleted\" = 0\n    WHERE \"accession_number\" = NEW.\"accession_number\";\nEND;\n", "probes": ["INSERT INTO \"current_collections\" (\"title\", \"accession_number\", \"acquired\") VALUES ('Imaginative Landscape', '56.496', NULL)"], "check": ["SELECT \"id\", \"title\", \"deleted\" FROM \"collections\""], "explanation": "The accession number is the museum's own unique id, which makes it the right thing to match on (not `id`, which an INSERT doesn't supply).\n", "module": "M4", "source": [{"file": "lecture4", "lines": "1246-1278", "quote": "I'll say create trigger insert when exists.", "text": "1246  I'll create a new trigger, in this case, called insert when exists.\n1247  I'll say create trigger insert when exists.\n1248  So this trigger will run when an item we're trying to insert\n1249  is already in our collections table.\n1250  I'll say instead of insert on the current collections table,\n1251  I want this to happen instead.\n1252  I'll say for each row.\n1253  Now I'll Enter again and say when--\n1254  just for style sake-- when new dot accession number is in my table\n1255  already.\n1256  I want to find which accession numbers I already have.\n1257  And if you remember, accession number is a unique ID for the museum.\n1258  It's not the ID column of my table, but a unique\n1259  ID to keep track of items in the museum.\n1260  So if I've already given this item an accession number,\n1261  I should already see it in my table already.\n1262  So I'll say then Enter, Enter, Enter for style sake,\n1263  select accession number from collections.\n1264  So this subquery tells me what accession numbers do we already have.\n1265  And this condition tells me is the new row I'm inserting,\n1266  does that have the same accession number or not?\n1267  Now, I'll close this subquery.\n1268  And I'll continue my trigger.\n1269  I'll say begin.\n1270  Well, in the case that this item already exists in my collections table,\n1271  I just want to update.\n1272  I want to flip that integer from a 1 back down to a 0.\n1273  So I'll say update collections and set deleted equal to 0.\n1274  Now, I want to do this not on my entire table,\n1275  but only where the accession number is equal to the new accession\n1276  number, that is the accession number I'm inserting here as well.\n1277  I'll then end like this.\n1278  And now I have my entire trigger."}, {"file": "lecture4", "lines": "1311-1330", "quote": "I only flipped that deleted value from a 1 back down to a 0.", "text": "1311  I'll say maybe I want to insert into my current collections.\n1312  Well, let me try this.\n1313  I'll say select star from collections.\n1314  And let's say I want to reinsert, in this case, Profusion of Flowers.\n1315  So I'll say insert into my current collections.\n1316  Actually, reinsert into current collections.\n1317  And I want to insert Imaginative Landscape.\n1318  So I'll say insert into current collections some set of values along\n1319  with some columns.\n1320  I'll say the title is Perfusion of Flowers as Imaginative Landscape\n1321  later on, then accession number, then the date it was acquired, like this.\n1322  Now I'll hit Enter and provide the values.\n1323  I'll say the title is Imaginative Landscape like this.\n1324  The accession number is 56.496.\n1325  And the acquired date is going to be null, in this case.\n1326  We don't know when we got it.\n1327  I'll hit semicolon here and Enter.\n1328  So if I select star from collections now, select star from collections\n1329  semicolon, I should see that I didn't actually insert a new row.\n1330  I only flipped that deleted value from a 1 back down to a 0."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT \"id\", \"title\", \"deleted\" FROM \"collections\"", "columns": ["id", "title", "deleted"], "rows": [[1, "Farmers Working at Dawn", 0], [2, "Imaginative Landscape", 1], [3, "Profusion of Flowers", 0], [4, "Spring Outing", 0]]}]}}, {"id": "M4-E13", "title": "Assigned: INSTEAD OF INSERT for genuinely new items", "origin": "source-assigned", "concepts": ["C4.8"], "difficulty": 4, "skills": ["INSTEAD OF trigger", "WHEN NOT IN"], "db": "mfa", "kind": "modify", "setup": "ALTER TABLE \"collections\" ADD COLUMN \"deleted\" INTEGER DEFAULT 0;\nUPDATE \"collections\" SET \"deleted\" = 1 WHERE \"title\" = 'Imaginative Landscape';\nCREATE VIEW \"current_collections\" AS\nSELECT \"id\", \"title\", \"accession_number\", \"acquired\" FROM \"collections\" WHERE \"deleted\" = 0;\nCREATE TRIGGER \"insert_when_exists\" INSTEAD OF INSERT ON \"current_collections\" FOR EACH ROW\nWHEN NEW.\"accession_number\" IN (SELECT \"accession_number\" FROM \"collections\")\nBEGIN\n    UPDATE \"collections\" SET \"deleted\" = 0 WHERE \"accession_number\" = NEW.\"accession_number\";\nEND;\n", "prompt": "The lecture ends: *\"I could write a trigger to actually add a brand new row to this table here … we leave all that up to you.\"*\nWrite `\"insert_when_new\"`: when the inserted accession number does **not** exist yet, insert a real new row into `collections`.\nThe checker inserts one brand-new artwork and one re-acquired artwork.\n", "hints": ["Same shape as `insert_when_exists`, with the opposite condition.", "`WHEN NEW.\"accession_number\" NOT IN (SELECT \"accession_number\" FROM \"collections\")`", "Body: `INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES (NEW.\"title\", NEW.\"accession_number\", NEW.\"acquired\");`"], "solution": "CREATE TRIGGER \"insert_when_new\"\nINSTEAD OF INSERT ON \"current_collections\"\nFOR EACH ROW\nWHEN NEW.\"accession_number\" NOT IN (\n    SELECT \"accession_number\" FROM \"collections\"\n)\nBEGIN\n    INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\")\n    VALUES (NEW.\"title\", NEW.\"accession_number\", NEW.\"acquired\");\nEND;\n", "probes": ["INSERT INTO \"current_collections\" (\"title\", \"accession_number\", \"acquired\") VALUES ('Peonies and Butterfly', '06.1899', '1906-01-01')", "INSERT INTO \"current_collections\" (\"title\", \"accession_number\", \"acquired\") VALUES ('Imaginative Landscape', '56.496', NULL)"], "check": ["SELECT \"title\", \"accession_number\", \"deleted\" FROM \"collections\""], "explanation": "Two complementary conditional triggers cover both cases. The lecture also suggests a follow-up you can try on your own:\nan INSTEAD OF UPDATE trigger, for example to fill in the unknown acquired date (L1333-1334).\n", "module": "M4", "source": [{"file": "lecture4", "lines": "1331-1336", "quote": "For now though, we leave all that up to you.", "text": "1331  Now, there's certainly more to do here.\n1332  I could write a trigger to actually add a brand new row to this table here.\n1333  I could also try to update this data, change, for example, the acquired\n1334  date from null to a date that we actually do know.\n1335  For now though, we leave all that up to you.\n1336  And we'll see you next time."}, {"file": "lecture4", "lines": "1236-1242", "quote": "In that case, actually inserting a brand new row", "text": "1236  I could say for each row when some condition is true run this trigger.\n1237  And you can imagine having two triggers to insert\n1238  into our view, one that runs when the item is already in our table.\n1239  We could then flip that bit from a 1 to a 0.\n1240  We could also have a different trigger to actually insert a new item.\n1241  In that case, actually inserting a brand new row\n1242  to our underlying collections table."}], "origin_label": "SOURCE · explicitly left to the learner in the lecture", "expected": {"checks": [{"query": "SELECT \"title\", \"accession_number\", \"deleted\" FROM \"collections\"", "columns": ["title", "accession_number", "deleted"], "rows": [["Farmers Working at Dawn", "11.6152", 0], ["Imaginative Landscape", "56.496", 1], ["Profusion of Flowers", "56.257", 0], ["Spring Outing", "14.76", 0]]}]}}, {"id": "M5-E01", "title": "Index the title column", "origin": "source-demo", "concepts": ["C5.1", "C5.2"], "difficulty": 1, "skills": ["CREATE INDEX", "EXPLAIN QUERY PLAN"], "db": "movies", "kind": "modify", "prompt": "First run `EXPLAIN QUERY PLAN SELECT * FROM \"movies\" WHERE \"title\" = 'Cars';` and note the word **SCAN**.\nThen create an index named `title_index` so that the plan becomes a **SEARCH** using that index.\n", "hints": ["An index is built on the column(s) your WHERE clause filters on.", "`CREATE INDEX name ON table (column);`", "`CREATE INDEX \"title_index\" ON \"movies\" (\"title\");`"], "solution": "CREATE INDEX \"title_index\" ON \"movies\" (\"title\");\n", "check": [{"plan": "SELECT * FROM \"movies\" WHERE \"title\" = 'Cars'", "contains": ["SEARCH movies USING INDEX title_index"]}], "explanation": "SCAN means reading every row top to bottom. SEARCH means using a structure to jump to matching rows.\nOn the full 400k-row IMDb file the lecture measured 0.084 s before the index and 0.01 s after.\n", "module": "M5", "source": [{"file": "lecture5", "lines": "273-286", "quote": "That's a savings of almost eight times.", "text": " 273  I want to create an index.\n 274  And if I'm searching my title column in Movies,\n 275  I should probably include the Title column in this index.\n 276  So I'll say call this the \"title_index\" here.\n 277  It'll be on the Movies table and it'll contain the data in the Title\n 278  column of Movies a bit like this.\n 279  Now I'll hit Enter and I'll see this index took some time to be created.\n 280  There's some stuff going on underneath the hood\n 281  where I'm putting this data in a new structure we're calling the index here.\n 282  But now if I rerun this query, if I say SELECT * FROM \"movies,\"\n 283  SELECT * from \"movies\" where the \"title\" = 'Cars' semicolon,\n 284  it was a lot faster.\n 285  Here I see 0.01 seconds real time compared to 0.084 seconds.\n 286  That's a savings of almost eight times."}, {"file": "lecture5", "lines": "297-316", "quote": "using the index that we called title_index", "text": " 297  I could use a SQL statement called EXPLAIN QUERY PLAN.\n 298  Other DBMSs might call this just simply EXPLAIN,\n 299  but in SQLite it's EXPLAIN QUERY PLAN.\n 300  And then after EXPLAIN QUERY PLAN, I can type the query\n 301  that I want to learn the plan for.\n 302  That is, how does SQLite plan to find me this information?\n 303  How does it plan to execute this query?\n 304  So now I'll type SELECT * FROM \"movies\" WHERE \"title\" = 'Cars'\n 305  like this, semicolon.\n 306  I'll hit Enter.\n 307  And now I don't get the results, but I do\n 308  get the plan SQLite intends to use to find me this result.\n 309  And take a look here.\n 310  I see QUERY PLAN, and underneath I see what SQLite intends to do.\n 311  It will search the movies table, but it will do so\n 312  using the index that we called title_index.\n 313  And it will do so given some value for title here.\n 314  So we can actually see SQLite does plan to use the index\n 315  to speed up this query.\n 316  We can confirm that this is exactly what's happening."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT * FROM \"movies\" WHERE \"title\" = 'Cars'", "plan": "SEARCH movies USING INDEX title_index (title=?)"}]}}, {"id": "M5-E02", "title": "Which columns should be indexed for the Tom Hanks query?", "origin": "source-question", "concepts": ["C5.2"], "difficulty": 3, "skills": ["EXPLAIN QUERY PLAN", "choosing index columns"], "db": "movies", "kind": "modify", "prompt": "Run `EXPLAIN QUERY PLAN` on the Tom Hanks query (M1-E22). Two tables are **scanned**.\nCreate one index per scanned table (`name_index` on people, `person_index` on stars) so that **neither table is scanned**.\n", "hints": ["Read the plan from the innermost subquery outward. Which tables say SCAN?", "Index the column each WHERE clause filters on, `people.name` and `stars.person_id`.", "`CREATE INDEX \"person_index\" ON \"stars\" (\"person_id\"); CREATE INDEX \"name_index\" ON \"people\" (\"name\");`"], "solution": "CREATE INDEX \"person_index\" ON \"stars\" (\"person_id\");\nCREATE INDEX \"name_index\" ON \"people\" (\"name\");\n", "check": [{"plan": "SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT \"id\" FROM \"people\" WHERE \"name\" = 'Tom Hanks'))", "contains": ["USING INDEX person_index", "COVERING INDEX name_index"], "not_contains": ["SCAN people", "SCAN stars"]}], "explanation": "`movies` is searched by `id`, its INTEGER PRIMARY KEY, which is always indexed for free.\nNote that `name_index` is reported as a *covering* index: the query needs only `people.id`, which every index entry already carries (rowid).\n", "module": "M5", "source": [{"file": "lecture5", "lines": "405-447", "quote": "Perhaps two separate indexes.", "text": " 405  Well one thing I could do is try EXPLAIN QUERY PLAN again.\n 406  I want to understand what SQLite plans to do to execute this query.\n 407  So I'll EXPLAIN QUERY PLAN and I'll type in the same query from before.\n 408  I'll say SELECT the \"title\" FROM \"movies\" WHERE\n 409  the \"id\" is IN those movies that Tom Hanks played a role in.\n 410  So I'll SELECT in this case movie_id from the \"stars\" table where\n 411  the person_id equals Tom Hanks's ID.\n 412  Now I'll find that.\n 413  I'll indent eight times to show this is my next level subquery.\n 414  I'll SELECT \"id\" from \"people\" WHERE \"name\"\n 415  = 'Tom Hanks' and I'll wrap the line just a little bit.\n 416  Let me zoom out so you can see it all in one go.\n 417  And now I'll close out these subqueries just like this, hit Enter,\n 418  and I should see if I zoom back in the plan SQLite intends to use to find me\n 419  the results of this query.\n 420  Now let's take a look here.\n 421  I'm planning to first scan people.\n 422  To understand the structure of this I need\n 423  to first go all the way in to this bottom part here.\n 424  I'm going to scan people to find presumably Tom Hanks's ID.\n 425  Then after I do that, I'm going to scan stars presumably\n 426  to find all the movie IDs that have Tom Hanks's ID.\n 427  But then up here I'm finally going to search movies\n 428  using integer primary key.\n 429  Some index is automatically created for me\n 430  as we saw before for my primary keys.\n 431  So it seems like the optimization here could be in the people\n 432  table and the stars table.\n 433  Now let me ask, if I wanted to create an index on either the people\n 434  table or the stars table, what do you think I should include?\n 435  Which column should I include in this index given my query here?\n 436  What column should I include in this index given this previous query?\n 437  AUDIENCE: We could index the ID and the name of the person?\n 438  CARTER ZENKE: Yeah, good idea.\n 439  Index the ID and the name of the person.\n 440  So if we look at this query again we'll see that our WHERE clause here\n 441  is searching by the name in the people table,\n 442  and up here this WHERE clause is searching by the person ID\n 443  column in our stars table.\n 444  So it would stand to reason that I should actually\n 445  create an index that includes the name column in people"}, {"file": "lecture5", "lines": "338-348", "quote": "will automatically create an index via which I can search for a primary key", "text": " 338  CARTER ZENKE: Yeah, good question.\n 339  Do databases have implicit algorithms to optimize search?\n 340  They do for some columns.\n 341  So if we saw in our table earlier, we had a primary key column like ID.\n 342  In SQLite and most other DBMSs, if I specify that a column is a primary key\n 343  then that database management system will automatically\n 344  create an index via which I can search for a primary key.\n 345  If though I have a regular old column like title or like year or so on,\n 346  it doesn't go through the process of automatically optimizing\n 347  that search for me.\n 348  I have to try to do that myself as we're doing here."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT \"id\" FROM \"people\" WHERE \"name\" = 'Tom Hanks'))", "plan": "SEARCH movies USING INTEGER PRIMARY KEY (rowid=?) | LIST SUBQUERY 2 | SEARCH stars USING INDEX person_index (person_id=?) | SCALAR SUBQUERY 1 | SEARCH people USING COVERING INDEX name_index (name=?)"}]}}, {"id": "M5-E03", "title": "Make the stars index covering", "origin": "source-demo", "concepts": ["C5.3"], "difficulty": 3, "skills": ["multi-column index", "covering index"], "db": "movies", "kind": "modify", "setup": "CREATE INDEX \"person_index\" ON \"stars\" (\"person_id\");\nCREATE INDEX \"name_index\" ON \"people\" (\"name\");\n", "prompt": "The plan still says `SEARCH stars USING INDEX person_index`, which means SQLite looks up each matching row in the table to get `movie_id`.\nReplace `person_index` with a two-column index so that `stars` is searched with a **covering index**.\n", "hints": ["A covering index contains every column the query reads from that table.", "Drop the old index, then create it on (`person_id`, `movie_id`). The filter column comes first.", "`DROP INDEX \"person_index\"; CREATE INDEX \"person_index\" ON \"stars\" (\"person_id\", \"movie_id\");`"], "solution": "DROP INDEX \"person_index\";\nCREATE INDEX \"person_index\" ON \"stars\" (\"person_id\", \"movie_id\");\n", "check": [{"plan": "SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT \"id\" FROM \"people\" WHERE \"name\" = 'Tom Hanks'))", "contains": ["SEARCH stars USING COVERING INDEX person_index"]}], "explanation": "On the full data the lecture measured 0.197 s with no indexes and 0.004 s with two covering indexes.\n", "module": "M5", "source": [{"file": "lecture5", "lines": "499-542", "quote": "Now I have two covering indexes.", "text": " 499  And we saw before that we had the index on the stars\n 500  table using just a regular old index.\n 501  Using index person index.\n 502  But what are we trying to find from this index?\n 503  We're trying to find the movie ID column.\n 504  So I could create an index that includes the movie ID column as well.\n 505  I can have indexes that span multiple columns.\n 506  So let's try that here.\n 507  I'll come back over and I'll create this new index\n 508  that intends to cover our search here.\n 509  I want to include not just the person ID column but also the movie ID\n 510  column so I can quickly find that data inside the index itself.\n 511  Let me drop our current implementation of the person index like this.\n 512  And I'll hit semicolon here, and now that index is gone.\n 513  But if I type now CREATE INDEX, I'll also\n 514  call this \"person_index\" ON \"stars.\"\n 515  and I'll say let's include not just the person ID column.\n 516  Let's also include in this case, the movie ID column like this.\n 517  Now I'll hit semicolon, Enter.\n 518  And it'll take a bit of time to run, but once it's\n 519  done I can probably try to explain the query plan again and see\n 520  if we have our covering index.\n 521  I'll go back up top here, I'll EXPLAIN QUERY PLAN,\n 522  and I'll choose to recreate this query from before just like this.\n 523  I'm going to select the \"movie_id\" FROM \"stars\" and then find Tom Hanks's ID\n 524  and then close out these subqueries here just like this.\n 525  And now once I EXPLAIN QUERY PLAN, we've optimized even further.\n 526  Now I have two covering indexes.\n 527  I can find all the information I need just by looking in these indexes,\n 528  not by doing a table lookup.\n 529  So let's now run this query and see just how much faster it might be.\n 530  I'll come back to my laptop here, and let's get rid of EXPLAIN QUERY PLAN.\n 531  Let's now turn our timer on.\n 532  I'll turn the timer on like this and I'll rerun this query.\n 533  I'll say we select title from movies where the ID is in the stars table\n 534  so long as the movie ID aligns with the person ID.\n 535  Then I'll find Tom Hanks's person ID here, I'll close out my subqueries,\n 536  and I should be able to find that this query is just a little bit--\n 537  this is an understatement here.\n 538  A lot faster.\n 539  So if I go back to my old query here, I'll see this one took 0.197 seconds."}, {"file": "lecture5", "lines": "482-496", "quote": "It's one in which the query data can be found only by searching the index.", "text": " 482  Well, what is a covering index?\n 483  A covering index, it turns out, is still an index.\n 484  It's the same kind of idea, but it is one\n 485  in which we have all the data we need inside the index itself.\n 486  It's one in which the query data can be found only by searching the index.\n 487  There's no need for me to go from the index to the table.\n 488  I can just look it up in the index.\n 489  It's similar to me searching this textbook and getting to the index\n 490  and not then needing to actually go back in the book's pages.\n 491  I can find everything I'm looking for in the index itself.\n 492  And this is good because if I need to not just find the items in my index\n 493  but then look them up in my table, that look up in the table takes some time.\n 494  So if I instead have a covering index, one\n 495  that includes all data I want to find exactly right there in it,\n 496  that's going to be faster for me than a regular old index."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT \"id\" FROM \"people\" WHERE \"name\" = 'Tom Hanks'))", "plan": "SEARCH movies USING INTEGER PRIMARY KEY (rowid=?) | LIST SUBQUERY 2 | SEARCH stars USING COVERING INDEX person_index (person_id=?) | SCALAR SUBQUERY 1 | SEARCH people USING COVERING INDEX name_index (name=?)"}]}}, {"id": "M5-E04", "title": "A partial index for recent movies", "origin": "source-demo", "concepts": ["C5.5"], "difficulty": 3, "skills": ["partial index", "WHERE in CREATE INDEX"], "db": "movies", "kind": "modify", "prompt": "Users mostly search this year's movies. Create a **partial** index named `recents` on `movies(title)` that only includes rows from **2023**.\nThe checker confirms it is used for `year = 2023` and **not** for `year = 1998`.\n", "hints": ["A partial index is a normal CREATE INDEX with a WHERE clause at the end.", "Only rows matching that WHERE are stored in the index, so it is smaller.", "`CREATE INDEX \"recents\" ON \"movies\" (\"title\") WHERE \"year\" = 2023;`"], "solution": "CREATE INDEX \"recents\" ON \"movies\" (\"title\") WHERE \"year\" = 2023;\n", "check": [{"plan": "SELECT \"title\" FROM \"movies\" WHERE \"year\" = 2023", "contains": ["recents"]}, {"plan": "SELECT \"title\" FROM \"movies\" WHERE \"year\" = 1998", "not_contains": ["recents"]}], "explanation": "The trade-off is a smaller index (less space and cheaper writes) that helps only the queries its condition covers.\n", "module": "M5", "source": [{"file": "lecture5", "lines": "892-924", "quote": "Now though I'm using 1998, which were rows that were not", "text": " 892  Now I'll try to create this partial index.\n 893  I'll say create an index called \"recents\" to indicate this\n 894  will help us search for recent movies.\n 895  Now I'll make this \"recents\" ON \"movies\" in the (\"title\") column.\n 896  I want to look up titles ultimately, but now I\n 897  only want to create an index for those rows where the year equals 2023.\n 898  I only want to include those titles in my index that were released in 2023.\n 899  So I'll hit Enter now and I'll see I created this index for myself here.\n 900  Now let me try searching for those.\n 901  I'll SELECT \"title\" FROM \"movies\" WHERE the \"year\" = 2023.\n 902  Enter.\n 903  And I'll see a lot of movies came out in 2023.\n 904  Now, it's taking 1.3 seconds here.\n 905  But now I could prove to you that we are using some index.\n 906  I could say EXPLAIN QUERY PLAN and now type SELECT \"title\" FROM \"movies\"\n 907  WHERE the \"year\" = 2023.\n 908  Hit Enter.\n 909  And now we'll see-- what are we doing?\n 910  We're going to-- we'll scan movies but we're still\n 911  going to use the index we just created called \"recents.\"\n 912  So it's helping speed us up just a little bit overall.\n 913  Now let me try dropping this index and showing you the opposite.\n 914  I'll come back over here and I could try dropping it.\n 915  And actually, before I do that let me show\n 916  you what would happen if I didn't search for movie in 2023.\n 917  I would try EXPLAIN QUERY PLAN.\n 918  And let me try SELECT \"title\" FROM \"movies\" where the year = 1998\n 919  like this.\n 920  And see now I'm only back to scanning movies.\n 921  So before in my prior query I was able to use the index\n 922  because my WHERE clause included 2023.\n 923  Now though I'm using 1998, which were rows that were not\n 924  included in this partial index."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"year\" = 2023", "plan": "SCAN movies USING COVERING INDEX recents"}, {"query": "EXPLAIN QUERY PLAN SELECT \"title\" FROM \"movies\" WHERE \"year\" = 1998", "plan": "SCAN movies"}]}}, {"id": "M5-E05", "title": "Drop an index", "origin": "source-demo", "concepts": ["C5.2"], "difficulty": 1, "skills": ["DROP INDEX"], "db": "movies", "kind": "modify", "setup": "CREATE INDEX \"title_index\" ON \"movies\" (\"title\");\n", "prompt": "Remove `title_index` and confirm that the 'Cars' lookup goes back to a SCAN.", "hints": ["Indexes are dropped like tables and views.", "`DROP INDEX name;`", "`DROP INDEX \"title_index\";`"], "solution": "DROP INDEX \"title_index\";\n", "check": [{"plan": "SELECT * FROM \"movies\" WHERE \"title\" = 'Cars'", "contains": ["SCAN movies"]}, "SELECT COUNT(*) FROM sqlite_master WHERE \"type\" = 'index' AND \"name\" = 'title_index'"], "explanation": "Dropping an index doesn't shrink the database file until you VACUUM (M5-E10).", "module": "M5", "source": [{"file": "lecture5", "lines": "322-332", "quote": "I can say DROP INDEX \"title_index\" semicolon.", "text": " 322  And now I'll remove the index we just created.\n 323  To remove an index I can drop it.\n 324  I can say DROP INDEX \"title_index\" semicolon.\n 325  And now that took just some amount of time,\n 326  but now I don't have the index anymore.\n 327  I can type .schema, and I'll see that index is not part of my schema.\n 328  But now if I try EXPLAIN QUERY PLAN SELECT * from \"movies\" WHERE \"title\"\n 329  = 'Cars' semicolon, I'll see that the plan is not to use the index.\n 330  The plan is to scan movies, where scan, we saw before,\n 331  means to go top to bottom through that title column\n 332  and find me all the rows that have Cars in them."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "EXPLAIN QUERY PLAN SELECT * FROM \"movies\" WHERE \"title\" = 'Cars'", "plan": "SCAN movies"}, {"query": "SELECT COUNT(*) FROM sqlite_master WHERE \"type\" = 'index' AND \"name\" = 'title_index'", "columns": ["COUNT(*)"], "rows": [[0]]}]}}, {"id": "M5-E06", "title": "Alice pays Bob $10, atomically", "origin": "source-demo", "concepts": ["C5.7"], "difficulty": 2, "skills": ["BEGIN TRANSACTION", "COMMIT"], "db": "bank", "kind": "modify", "require": ["BEGIN", "COMMIT"], "prompt": "Move $10 from Alice (id 1) to Bob (id 2) inside a single transaction so that no other connection can ever see Bob credited before Alice is debited.\n", "hints": ["Wrap both UPDATEs between `BEGIN TRANSACTION;` and `COMMIT;`", "Update relative to the current value: `SET \"balance\" = \"balance\" + 10`.", "`BEGIN TRANSACTION; UPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2; UPDATE ... - 10 WHERE \"id\" = 1; COMMIT;`"], "solution": "BEGIN TRANSACTION;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" - 10 WHERE \"id\" = 1;\nCOMMIT;\n", "check": ["SELECT * FROM \"accounts\""], "explanation": "Atomicity: a second terminal sees the old balances until COMMIT, then both changes at once (L1201-1230).\nThe checker also fails your answer if you leave the transaction open.\n", "module": "M5", "source": [{"file": "lecture5", "lines": "1201-1230", "quote": "So this is the atomicity part of transactions.", "text": "1201  I'll say BEGIN TRANSACTION; Enter.\n1202  And now I can include what I want to have happen in this transaction.\n1203  First I want to update Bob's account.\n1204  I'll say UPDATE \"accounts\" and SET \"balance\" equal to \"balance\" + 10\n1205  where the \"id\" in this case equals--\n1206  let's see, 2, because Bob's account ID is 2.\n1207  Now I'll hit Enter, and now I'm in the middle of this transaction.\n1208  But if I go to my other terminal-- let's say I'm somebody new\n1209  and I check on the balances of the bank.\n1210  I say SELECT * FROM \"accounts\".\n1211  What do I see?\n1212  I don't see any change from before.\n1213  Alice still has $10, Bob has $20, and Charlie has $30.\n1214  And even though in this terminal I've been\n1215  able to update the account balance, I haven't committed those changes.\n1216  I haven't saved them to the database just yet.\n1217  So let me try now removing money from Alice's account.\n1218  I'll say UPDATE \"accounts\" and set \"balance\" equal to balance minus 10\n1219  where the \"id\" equals 1.\n1220  Now I'll remove $10 from Alice's account.\n1221  Hit Enter, and still if I go back to this other perspective\n1222  here from somebody else checking on the bank balances, I see--\n1223  well everything is still the same.\n1224  But the moment I then go to this transaction\n1225  and finish it by typing COMMIT, meaning save these changes, I'll commit here.\n1226  I can go back and I'll see all in one moment\n1227  that it appears Alice has paid Bob $10.\n1228  So this is the atomicity part of transactions.\n1229  I don't see the intermediate steps in the transaction.\n1230  I only see that it happened all at once or not at all."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"accounts\"", "columns": ["id", "name", "balance"], "rows": [[1, "Alice", 0], [2, "Bob", 30], [3, "Charlie", 30]]}]}}, {"id": "M5-E07", "title": "Roll back a transfer that breaks a constraint", "origin": "source-demo", "concepts": ["C5.7"], "difficulty": 3, "skills": ["ROLLBACK", "CHECK constraint"], "db": "bank", "kind": "modify", "continue_on_error": true, "require": ["BEGIN", "ROLLBACK"], "setup": "UPDATE \"accounts\" SET \"balance\" = 0 WHERE \"id\" = 1;\nUPDATE \"accounts\" SET \"balance\" = 30 WHERE \"id\" = 2;\n", "prompt": "Alice now has $0 and Bob has $30. Run the same transfer of $10 from Alice to Bob in a transaction.\nThe debit violates `CHECK(\"balance\" >= 0)`, so undo the whole transaction so that nobody ever sees Bob at $40.\n(In this exercise, statements keep running after an error, just like typing them one by one in the shell.)\n", "hints": ["Credit Bob, then try to debit Alice. Which statement fails?", "After a failure inside a transaction, the earlier statements are *still pending*, not undone.", "`BEGIN TRANSACTION; UPDATE ... + 10 WHERE \"id\" = 2; UPDATE ... - 10 WHERE \"id\" = 1; ROLLBACK;`"], "solution": "BEGIN TRANSACTION;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" - 10 WHERE \"id\" = 1;\nROLLBACK;\n", "check": ["SELECT * FROM \"accounts\""], "explanation": "ROLLBACK only works inside a transaction. Without BEGIN, the lecturer had to \"undo\" Bob's credit by hand with another UPDATE (L1289-1305).\nThis is Consistency in ACID: the database never ends in a state that violates its constraints.\n", "module": "M5", "source": [{"file": "lecture5", "lines": "1309-1325", "quote": "ROLLBACK like this, hit Enter", "text": "1309  I'll say BEGIN TRANSACTION like this, hit Enter.\n1310  Now I want to update Bob's balance.\n1311  I'll say UPDATE \"accounts SET \"balance\" equal to \"balance\" +\n1312  10 where the \"id\" = 2.\n1313  Bob's account ID is 2.\n1314  Now let me subtract $10 from Alice like this.\n1315  - 10.\n1316  I'll go back here and say where the \"id\" equals 1\n1317  for Alice's account, hit Enter.\n1318  But now I get that same constraint failure.\n1319  Alice has less than $0, which can't be possible.\n1320  So what do we do?\n1321  Instead of having another update, we could just roll back.\n1322  We could undo all of these previous statements here.\n1323  ROLLBACK like this, hit Enter, and now I should see from another perspective\n1324  here my table exactly as it was before with no intermediate step of Bob\n1325  having money but Alice having negative $10."}, {"file": "lecture5", "lines": "1292-1296", "quote": "A rollback only works while we're inside of a transaction.", "text": "1292  CARTER ZENKE: We could roll back, but here's the thing.\n1293  A rollback only works while we're inside of a transaction.\n1294  And a transaction begins when we say begin transaction.\n1295  So here I actually didn't say begin transaction.\n1296  What I have to do instead is run another update statement."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"accounts\"", "columns": ["id", "name", "balance"], "rows": [[1, "Alice", 0], [2, "Bob", 30], [3, "Charlie", 30]]}]}}, {"id": "M5-E08", "title": "Defuse the race condition", "origin": "source-question", "concepts": ["C5.8"], "difficulty": 4, "skills": ["isolation", "transaction design"], "db": "bank", "kind": "selfcheck", "prompt": "Charlie ($30) clicks \"transfer $30 to Alice\" on two laptops at the same moment, while Alice waits at an ATM to withdraw $60.\n1. Using the lecture's timeline, explain how the bank loses $30.\n2. Rewrite each transfer so the attack fails, and say which ACID property is at work.\n", "hints": ["The danger is checking the balance in one step and spending it in a later step that runs concurrently.", "Each transfer (check + credit + debit) must run as one isolated unit, one after another.", "Put the balance check and both updates in one transaction; the second transfer then sees $0 and rolls back."], "solution": "-- Model answer:\n-- 1. Both transfers read Charlie's balance (30) before either one subtracts. Both credit Alice $30,\n--    so Alice sees $60 and withdraws it before the bank notices Charlie couldn't cover the second.\n-- 2. Make each transfer one transaction and process transactions sequentially (isolated):\nBEGIN TRANSACTION;\n-- (application checks: SELECT \"balance\" FROM \"accounts\" WHERE \"id\" = 3;  -> must be >= 30)\nUPDATE \"accounts\" SET \"balance\" = \"balance\" + 30 WHERE \"id\" = 1;\nUPDATE \"accounts\" SET \"balance\" = \"balance\" - 30 WHERE \"id\" = 3;\nCOMMIT;\n-- The second transfer starts after the first committed, sees Charlie at $0, and its debit violates\n-- CHECK(\"balance\" >= 0), so it is rolled back. Property: Isolation (with Consistency enforced by the CHECK).\n", "explanation": "The exclusive lock taken by a writing transaction is what makes the transactions happen one after another (see M5-E09).", "module": "M5", "source": [{"file": "lecture5", "lines": "1337-1388", "quote": "Charlie opened up his bank account", "text": "1337  We're into what we call race condition.\n1338  A race condition is when we have multiple people, multiple processes\n1339  trying to access some value and also making a decision based on that value.\n1340  If unaddressed it can lead to a scenario that's inconsistent in our database.\n1341  And actually hackers can exploit race conditions\n1342  to bring our database to an inconsistent state in a way that benefits them.\n1343  So let's say our friends Charlie and Alice here, they\n1344  decide to rob our bank.\n1345  They decide to take money from it by exploiting race conditions.\n1346  And here are the logs of what Charlie and Alice actually did.\n1347  We see here that Charlie and Alice executed three concurrent transactions\n1348  with our bank.\n1349  On the one hand Charlie opened up his bank account\n1350  on two different computers.\n1351  He logged in and he said let me transfer $30 to Alice.\n1352  He at the same time clicked transfer on both computers knowing just well\n1353  he had only $30 to give to Alice, but he was going to send her $60 in this case.\n1354  He was hoping that we weren't guarding against race conditions.\n1355  That he could send $30 on both accounts to Alice.\n1356  Now at the same time Alice is at the ATM,\n1357  and they're hoping that at the same time Charlie presses transfer\n1358  Alice hits confirm on their transaction to withdraw $60 from the ATM.\n1359  And when all of these happen at once, we might\n1360  run into some inconsistent states in our database.\n1361  Let's say first we run this transaction here.\n1362  Let's focus on this one.\n1363  The first step is to check Charlie's balance.\n1364  Does Charlie have $30?\n1365  It seems like Charlie does.\n1366  We continue we might say, OK, let me add $30 to Alice's account like this.\n1367  Then let me subtract $30 from Charlie's account down below here.\n1368  And finally, that's the end of our transaction.\n1369  We checked Charlie's balance, we added $30 to Alice,\n1370  and subtracted $30 from Charlie.\n1371  But now at the same time, we're also processing the other transfer of $30\n1372  to Alice.\n1373  So here we check in terms of our time, top to bottom here--\n1374  we check Charlie's balance at this point.\n1375  It's still $30.\n1376  Knowing this, this process goes ahead and says\n1377  let's add $30 to Alice's account."}, {"file": "lecture5", "lines": "1397-1430", "quote": "and the word for this", "text": "1397  CARTER ZENKE: Yeah.\n1398  So ideally we should treat each of these as a separate transaction.\n1399  Literally a transaction in the database sense where if I go back to this table\n1400  if Charlie transfers $30 to Alice at roughly the same time,\n1401  I should handle these sequentially.\n1402  I should first do this one, then I should do this one.\n1403  And only after that should Alice be able to withdraw their $60, or at least\n1404  try to in this case.\n1405  So we need to make these transactions sequential, and the word for this\n1406  is isolating our transactions.\n1407  Here they are not isolated.\n1408  They're working at the same time.\n1409  But in reality I want them to be isolated--\n1410  happen one after another after another.\n1411  So ideally our table looks more like this.\n1412  Charlie hits transfer at the exact same time on two laptops,\n1413  but because we're working in transactions we only process one first.\n1414  We start with this one here.\n1415  We check the balance, we say let's add $30 to Alice's account and subtract $30\n1416  from Charlie's.\n1417  Once we're sure that is OK, we'll commit the transaction\n1418  and that is a done deal.\n1419  Now though, we'll go down below.\n1420  We'll say begin transaction.\n1421  We'll then say Charlie's balance is $0 because we're doing this\n1422  after we did our first transaction.\n1423  Charlie has no more money to give Alice.\n1424  At that point what we'll do is try to add $30 to Alice\n1425  but subtract $30 from Charlie, and we'll realize we made a mistake.\n1426  We should roll back and undo what we just did here.\n1427  So these now are separate transactions happening sequentially,\n1428  and we avoid our error of giving Alice $60 when\n1429  she shouldn't have that money at all.\n1430  And then only after this is done do we let Alice try to withdraw $60."}], "origin_label": "SOURCE · question posed in the lecture"}, {"id": "M5-E09", "title": "Lab: see an exclusive lock block a reader", "origin": "source-demo", "concepts": ["C5.9"], "difficulty": 2, "skills": ["BEGIN EXCLUSIVE", "locks"], "db": "bank", "kind": "selfcheck", "prompt": "This needs two connections, so it runs as a lab: `python3 tools/labs.py locks`\n(or open `database/bank.db` in two terminals with `sqlite3`).\nIn connection A run `BEGIN EXCLUSIVE TRANSACTION;`. In connection B run `SELECT * FROM \"a
