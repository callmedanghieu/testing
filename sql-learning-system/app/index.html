<style>
/* Layout: a transit-line rail on the left (stations = modules, coloured like Boston's T lines from the lectures),
   one working panel on the right. On phones the rail becomes a horizontal strip. */
:root {
  --bg: #f2f3f0;
  --surface: #ffffff;
  --sunk: #e9ebe7;
  --ink: #17212b;
  --muted: #5b6671;
  --line: #d3d8da;
  --accent: #003da5;
  --accent-ink: #ffffff;
  --ok: #1d7a3a;
  --ok-bg: #e5f3e8;
  --bad: #b42318;
  --bad-bg: #fbe9e7;
  --warn: #8a5300;
  --code: #eef0ec;
  --m0: #5b6670; --m1: #80276c; --m2: #da291c; --m3: #e07d00; --m4: #00843d; --m5: #003da5; --m6: #7c878e;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e141a; --surface: #151d25; --sunk: #0b1016; --ink: #e5eaee; --muted: #9aa6b1; --line: #2a3540;
    --accent: #6d9bff; --accent-ink: #0b1220; --ok: #45c46f; --ok-bg: #12301d; --bad: #ff7a6b; --bad-bg: #3a1714;
    --warn: #f0b35a; --code: #0b1117;
    --m0: #93a0ab; --m1: #d77ac2; --m2: #ff5a4e; --m3: #ffa23a; --m4: #2fc06e; --m5: #6d9bff; --m6: #aeb8bf;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #151d25; --sunk: #0b1016; --ink: #e5eaee; --muted: #9aa6b1; --line: #2a3540;
  --accent: #6d9bff; --accent-ink: #0b1220; --ok: #45c46f; --ok-bg: #12301d; --bad: #ff7a6b; --bad-bg: #3a1714;
  --warn: #f0b35a; --code: #0b1117;
  --m0: #93a0ab; --m1: #d77ac2; --m2: #ff5a4e; --m3: #ffa23a; --m4: #2fc06e; --m5: #6d9bff; --m6: #aeb8bf;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body); }
a { color: var(--accent); }
button, select, textarea, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, textarea.sql { font-family: var(--font-mono); font-size: 0.86em; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; letter-spacing: 0.01em; line-height: 1.15; text-wrap: balance; margin: 1.2em 0 0.45em; }
h1 { font-size: 2.1rem; } h2 { font-size: 1.65rem; } h3 { font-size: 1.3rem; } h4 { font-size: 1.1rem; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand .roundel { width: 30px; height: 30px; border-radius: 50%; border: 4px solid var(--ink); display: grid; place-items: center;
  font: 700 15px/1 var(--font-display); }
.brand b { font: 700 1.45rem/1 var(--font-display); letter-spacing: 0.02em; }
.brand small { display: block; color: var(--muted); font-size: 0.78rem; letter-spacing: 0.02em; }
.topbar .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--sunk); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100% - 58px); }
.rail { border-right: 1px solid var(--line); padding: 20px 14px 28px; background: var(--surface); }
.rail h4 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin: 0 0 10px 6px; font-family: var(--font-body); font-weight: 600; }
.line { position: relative; margin: 0 0 22px; padding: 0; list-style: none; }
.line::before { content: ""; position: absolute; left: 17px; top: 14px; bottom: 14px; width: 6px; border-radius: 3px;
  background: linear-gradient(var(--m0) 0 14%, var(--m1) 14% 29%, var(--m2) 29% 43%, var(--m3) 43% 57%, var(--m4) 57% 71%, var(--m5) 71% 86%, var(--m6) 86% 100%); }
.stop { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 7px 8px; border: 0; border-radius: var(--radius); background: none; cursor: pointer; text-align: left; }
.stop:hover, .stop[aria-current="true"] { background: var(--sunk); }
.stop .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 5px solid var(--c); position: relative; z-index: 1; }
.stop .dot.full { background: var(--c); }
.stop .nm { display: block; font: 600 1.05rem/1.1 var(--font-display); }
.stop .meta { display: block; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.yard { display: grid; gap: 2px; }
.yard button { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border: 0; background: none; border-radius: var(--radius); cursor: pointer; text-align: left; }
.yard button:hover, .yard button[aria-current="true"] { background: var(--sunk); }

main { min-width: 0; padding: 24px 32px 64px; }
.wrap { max-width: 980px; }
.prose { max-width: 72ch; }
.prose p, .prose li { max-width: 72ch; }
.crumb { color: var(--muted); font-size: 0.9rem; margin-bottom: 4px; }
.crumb button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin: 14px 0 18px; }
.tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; border-bottom: 3px solid transparent; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--c, var(--accent)); }

.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 0.76rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border: 1.5px solid currentColor; }
.badge.src { color: var(--ok); }
.badge.gen { color: var(--warn); border-style: dashed; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--sunk); font-size: 0.8rem; margin: 2px 4px 2px 0; }
.line-chip { display: inline-grid; place-items: center; min-width: 34px; height: 22px; padding: 0 6px; border-radius: 4px; background: var(--c); color: #fff; font: 700 0.85rem/1 var(--font-display); letter-spacing: 0.04em; }
.stars { color: var(--warn); letter-spacing: 2px; }

.list { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; text-align: left; width: 100%; }
.row:hover { border-color: var(--muted); }
.row .t { font-weight: 600; }
.row .s { color: var(--muted); font-size: 0.85rem; }
.state { font-size: 0.82rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.state.done { color: var(--ok); font-weight: 600; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.prompt { font-size: 1.02rem; }
details.src { margin: 10px 0; }
details.src summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
pre { background: var(--code); padding: 12px 14px; border-radius: var(--radius); overflow-x: auto; line-height: 1.45; }
pre.excerpt { white-space: pre-wrap; font-size: 0.8rem; max-height: 340px; overflow-y: auto; }
:not(pre) > code { background: var(--code); padding: 0.1em 0.35em; border-radius: 4px; }
blockquote { margin: 1em 0; padding: 4px 14px; border-left: 4px solid var(--line); color: var(--muted); }
.tablewrap { overflow-x: auto; margin: 8px 0; }
table { border-collapse: collapse; font-size: 0.88rem; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; vertical-align: top; }
th { background: var(--sunk); font-weight: 600; }
td.null { color: var(--muted); font-style: italic; }

.bench { display: grid; gap: 10px; margin-top: 14px; }
textarea.sql { width: 100%; min-height: 190px; resize: vertical; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--code); line-height: 1.5; tab-size: 4; }
input.inj { width: 100%; padding: 10px 12px; font-family: var(--font-mono); border: 1px solid var(--line); border-radius: var(--radius); background: var(--code); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.go { background: var(--ok); color: #fff; border-color: var(--ok); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.armed { border-color: var(--warn); color: var(--warn); }
.kbd { color: var(--muted); font-size: 0.78rem; }
.feedback { padding: 10px 14px; border-radius: var(--radius); border: 1px solid; }
.feedback.ok { background: var(--ok-bg); border-color: var(--ok); }
.feedback.bad { background: var(--bad-bg); border-color: var(--bad); }
.feedback.info { background: var(--sunk); border-color: var(--line); }
.hint { padding: 8px 12px; border-left: 4px solid var(--warn); background: var(--sunk); border-radius: 0 var(--radius) var(--radius) 0; }
.hint b { font-family: var(--font-display); letter-spacing: 0.03em; }
.out-label { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

.hero { display: grid; gap: 14px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.hero h1 { margin: 0; font-size: clamp(2rem, 4vw, 2.8rem); }
.route { display: flex; align-items: center; overflow-x: auto; padding: 8px 2px 4px; }
.route .seg { flex: 1 0 34px; height: 8px; background: var(--c); }
.route .st { flex: none; display: grid; justify-items: center; gap: 4px; background: none; border: 0; cursor: pointer; padding: 0; }
.route .st .dot { width: 30px; height: 30px; border-radius: 50%; border: 6px solid var(--c); background: var(--surface); }
.route .st .dot.full { background: var(--c); }
.route .st span { font: 600 0.95rem/1 var(--font-display); white-space: nowrap; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.steps { counter-reset: s; list-style: none; padding: 0; display: grid; gap: 6px; }
.steps li { counter-increment: s; display: flex; gap: 10px; align-items: baseline; }
.steps li::before { content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 0.8rem/1 var(--font-display); }

.card { display: grid; gap: 12px; }
.choices { display: grid; gap: 6px; }
.choices button { text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; }
.choices button.right { border-color: var(--ok); background: var(--ok-bg); }
.choices button.wrong { border-color: var(--bad); background: var(--bad-bg); }
.rate { display: flex; gap: 6px; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.hidden-gen { display: none; }
textarea.backup { width: 100%; min-height: 120px; font-family: var(--font-mono); font-size: 0.8rem; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; overflow-x: auto; }
  .rail h4 { display: none; }
  .line { display: flex; gap: 2px; margin: 0 0 6px; }
  .line::before { left: 14px; right: 14px; top: 19px; bottom: auto; width: auto; height: 6px;
    background: linear-gradient(90deg, var(--m0) 0 14%, var(--m1) 14% 29%, var(--m2) 29% 43%, var(--m3) 43% 57%, var(--m4) 57% 71%, var(--m5) 71% 86%, var(--m6) 86% 100%); }
  .stop { flex-direction: column; gap: 4px; width: auto; min-width: 74px; text-align: center; }
  .stop .meta { display: none; }
  .stop .nm { font-size: 0.85rem; }
  .yard { display: flex; gap: 4px; overflow-x: auto; }
  .yard button { white-space: nowrap; }
  main { padding: 18px 16px 48px; }
  .topbar { padding: 8px 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .feedback, .hint { animation: in .18s ease-out; }
  @keyframes in { from { transform: translateY(3px); opacity: .6; } to { transform: none; opacity: 1; } }
}

<script src="vendor/sql-asm.js"></script>
<script>/* Grading engine for the browser trainer: a JavaScript port of tools/sqlcheck.py.
   Works in the browser (window.SQLEngine) and in Node (module.exports) on top of sql.js.
   tests/test_engine.js checks that it agrees with the Python engine on every item. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.SQLEngine = factory();
})(typeof self !== "undefined" ? self : this, function () {
  "use strict";

  function make(SQL, datasets) {
    function freshDb(name) {
      const db = new SQL.Database();
      db.run("PRAGMA foreign_keys = ON");
      if (name) db.exec(datasets[name]);
      return db;
    }
    function prepare(ex) {
      const db = freshDb(ex.db);
      if (ex.setup) db.exec(ex.setup);
      return db;
    }
    function inTransaction(db) {
      try { db.exec("BEGIN"); db.exec("ROLLBACK"); return false; } catch (e) { return true; }
    }
    function runScript(db, sql, continueOnError) {
      let last = { columns: null, rows: null, error: null, notes: [] };
      let it;
      try { it = db.iterateStatements(sql); } catch (e) { return Object.assign({}, last, { error: e.message }); }
      for (;;) {
        let r;
        try { r = it.next(); } catch (e) {
          if (!continueOnError) return Object.assign({}, last, { error: e.message });
          last.notes.push(e.message); break;
        }
        if (r.done) break;
        const st = r.value;
        try {
          const cols = st.getColumnNames();
          const rows = [];
          while (st.step()) rows.push(st.get());
          if (cols.length) last = { columns: cols, rows: rows, error: null, notes: last.notes };
        } catch (e) {
          if (!continueOnError) { try { st.free(); } catch (_) {} return Object.assign({}, last, { error: e.message }); }
          last.notes.push(e.message);
        }
        try { st.free(); } catch (_) {}
      }
      return last;
    }
    function normValue(v) {
      if (typeof v === "number") { const r = Math.round(v * 1e6) / 1e6; return r === 0 ? 0 : r; }
      if (v instanceof Uint8Array) return Array.from(v).map(b => b.toString(16).padStart(2, "0")).join("");
      return v;
    }
    const normRows = rows => (rows || []).map(r => r.map(normValue));
    const key = row => JSON.stringify(row);
    const sortRows = rows => rows.map(key).sort();
    const show = row => "(" + row.map(v => v === null ? "None" : typeof v === "string" ? "'" + v + "'" : String(v)).join(", ") + ")";

    function compare(user, ref, ordered) {
      if (user.error) return [false, "Your SQL raised an error: " + user.error];
      if (user.columns === null) return [false, "Your SQL did not return any rows/columns. End with a SELECT."];
      if (ref.columns !== null && user.columns.length !== ref.columns.length)
        return [false, `Column count differs: you returned ${user.columns.length} (${user.columns.join(", ")}), expected ${ref.columns.length} (${ref.columns.join(", ")}).`];
      const u = normRows(user.rows), r = normRows(ref.rows);
      if (ordered && JSON.stringify(u) === JSON.stringify(r)) return [true, "Correct."];
      const us = sortRows(u), rs = sortRows(r);
      if (JSON.stringify(us) === JSON.stringify(rs))
        return ordered ? [false, "Right rows, wrong order. Check your ORDER BY."] : [true, "Correct."];
      const msg = [`Expected ${r.length} row(s); you returned ${u.length}.`];
      const missing = r.filter(x => !us.includes(key(x))).slice(0, 3);
      const extra = u.filter(x => !rs.includes(key(x))).slice(0, 3);
      if (missing.length) msg.push("Missing e.g. " + missing.map(show).join("; "));
      if (extra.length) msg.push("Unexpected e.g. " + extra.map(show).join("; "));
      if (new Set(us).size !== us.length && new Set(rs).size === rs.length)
        msg.push("You have duplicate rows - check your JOIN or consider DISTINCT / GROUP BY.");
      return [false, msg.join(" ")];
    }
    function planText(db, q) {
      const res = db.exec("EXPLAIN QUERY PLAN " + q);
      if (!res.length) return "";
      return res[0].values.map(r => r[r.length - 1]).join(" | ");
    }
    function stateSnapshot(db, ex) {
      const snap = [];
      for (const p of ex.probes || []) {
        try { db.exec(p); snap.push(["probe", p, "ok"]); } catch (e) { snap.push(["probe", p, "error"]); }
      }
      for (const c of ex.check || []) {
        if (typeof c === "object") {
          const text = planText(db, c.plan).toUpperCase();
          for (const n of c.contains || []) snap.push(["plan", n, text.includes(n.toUpperCase())]);
          for (const n of c.not_contains || []) snap.push(["plan-not", n, !text.includes(n.toUpperCase())]);
        } else {
          try {
            const res = db.exec(c);
            const rows = res.length ? normRows(res[0].values) : [];
            snap.push(["check", c, sortRows(rows)]);
          } catch (e) { snap.push(["check", c, "error: " + e.message.split(":")[0]]); }
        }
      }
      return snap;
    }
    function evaluate(ex, userSql) {
      const opened = [];
      const origPrepare = prepare;
      const track = e => { const db = origPrepare(e); opened.push(db); return db; };
      try { return evaluateWith(ex, userSql, track); }
      finally { for (const db of opened) { try { db.close(); } catch (_) {} } }
    }
    function evaluateWith(ex, userSql, prepare) {
      const kind = ex.kind;
      if (kind === "selfcheck") return [false, "Self-check exercise: compare your answer with the reference solution."];
      for (const word of ex.require || [])
        if (!userSql.toUpperCase().includes(word.toUpperCase())) return [false, `This exercise asks you to use ${word}.`];
      if (kind === "injection") {
        const u = runScript(prepare(ex), ex.template.replace("{input}", userSql.trim()));
        const r = runScript(prepare(ex), ex.template.replace("{input}", ex.solution.trim()));
        return compare(u, r, !!ex.ordered);
      }
      if (kind === "error") {
        const u = runScript(prepare(ex), userSql);
        if (!u.error) return [false, "Your statement succeeded, but this exercise wants it to be rejected."];
        if (!u.error.toLowerCase().includes(ex.expect_error.toLowerCase())) return [false, "It failed, but with a different error: " + u.error];
        return [true, "Correct. SQLite refused it: " + u.error];
      }
      if (kind === "query") {
        return compare(runScript(prepare(ex), userSql), runScript(prepare(ex), ex.solution), !!ex.ordered);
      }
      if (kind === "modify") {
        const udb = prepare(ex), rdb = prepare(ex);
        const coe = !!ex.continue_on_error;
        const u = runScript(udb, userSql, coe);
        if (u.error) return [false, "Your SQL raised an error: " + u.error];
        if (inTransaction(udb)) return [false, "A transaction is still open: you never ran COMMIT (or ROLLBACK)."];
        runScript(rdb, ex.solution, coe);
        const us = stateSnapshot(udb, ex), rs = stateSnapshot(rdb, ex);
        for (let i = 0; i < Math.max(us.length, rs.length); i++) {
          const a = us[i], b = rs[i];
          if (JSON.stringify(a) === JSON.stringify(b)) continue;
          if (a[0] === "probe")
            return [false, `Test statement \`${a[1]}\` was ${a[2] === "ok" ? "accepted" : "rejected"} by your database but ${b[2] === "ok" ? "accepted" : "rejected"} by the reference.`];
          if (a[0] === "plan" || a[0] === "plan-not")
            return [false, `Query plan check failed: expected the plan ${a[0] === "plan" ? "to contain" : "NOT to contain"} '${a[1]}'.`];
          return [false, `After your SQL, \`${a[1]}\` does not return the expected rows. Compare with "Show expected".`];
        }
        return [true, "Correct. The database ends up in the expected state."];
      }
      throw new Error("unknown kind " + kind);
    }
    function formatResult(res, sql) {
      if (res.error) return "ERROR: " + res.error;
      if (!res.rows || !res.rows.length) return "(no rows)";
      let rows = res.rows;
      if ((sql || "").toUpperCase().includes("EXPLAIN QUERY PLAN")) rows = rows.map(r => [r[r.length - 1]]);
      return rows.map(r => r.map(v => v === null ? "NULL" : String(v)).join(" | ")).join("; ");
    }
    return { freshDb, prepare, runScript, evaluate, compare, planText, formatResult, inTransaction };
  }
  return { make };
});
</script>
