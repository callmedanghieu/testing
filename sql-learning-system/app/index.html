veral rows. `=` is fine for the innermost one, since there is one Tom Hanks.", "source": [{"file": "lecture1", "lines": "969-984", "quote": "if you're looking to see if some id is part of a list of ids", "text": " 969  SPEAKER: When do we need to use IN in WHERE\n 970  clause when we are doing subquerying?\n 971  I suppose that we can also use subquerying without IN as well.\n 972  CARTER ZENKE: You're right.\n 973  So we saw an example using equals.\n 974  And we all saw an example using IN.\n 975  In general-- if you want just a rule of thumb to follow--\n 976  if you're looking to see if some id is part of a list of ids,\n 977  or part of a set of ids that is more than one, you should use IN.\n 978  IN is good for checking if something is inside of more than one item,\n 979  let's say.\n 980  Equals, though, is good if you know you have only one id.\n 981  Let's say I have an id equal to 23 or equal to 25.\n 982  That's a good place for equals.\n 983  If, though, I had 23 or 25, I might use IN to match\n 984  either/or of those in that set--"}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"columns": ["title"], "rows": [["Forrest Gump"], ["Apollo 13"], ["Toy Story"], ["Toy Story 2"], ["Saving Private Ryan"], ["Cast Away"], ["Toy Story 3"], ["Toy Story 4"]], "error": null}}, {"id": "D1-05", "module": "M1", "title": "Grouped by the wrong column", "bug_type": "aggregation", "origin": "generated", "concepts": ["C1.10"], "difficulty": 1, "db": "longlist", "kind": "query", "prompt": "Should return how many books were longlisted each year (year, count). It returns 75 rows of 1.", "broken": "SELECT \"year\", COUNT(*) FROM \"books\" GROUP BY \"id\";\n", "hints": ["Each group becomes one output row. How many distinct ids are there?", "Group by what you want one row *per*.", "`GROUP BY \"year\"`"], "solution": "SELECT \"year\", COUNT(*) FROM \"books\" GROUP BY \"year\";\n", "diagnosis": "GROUP BY decides the grain of the result.", "source": [{"file": "lecture1", "lines": "1704-1713", "quote": "I could say, take all the books with id 1 and all the books with id 2", "text": "1704  And, I mean, wouldn't it be nice if I could do something like this?\n1705  I could kind of highlight the rows that are part of each group,\n1706  and then try to average those.\n1707  I could say, take all the books with id 1 and all the books with id 2\n1708  and just collapse their ratings, like this.\n1709  And once you do that, find the average for me,\n1710  and give me that back as a table.\n1711  That would be kind of nice.\n1712  And, luckily, we actually have the capacity to do that with SQL\n1713  using this GROUP BY keyword."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"columns": ["year", "COUNT(*)"], "rows": [[2018, 13], [2019, 13], [2020, 13], [2021, 13], [2022, 13], [2023, 13]], "error": null}}, {"id": "D1-06", "module": "M1", "title": "no such table", "bug_type": "syntax", "origin": "source-demo", "concepts": ["C1.4"], "difficulty": 1, "db": "longlist", "kind": "query", "prompt": "The lecturer's first attempt to find MacLehose Press's id fails. Read the error and fix it.", "broken": "SELECT \"id\" FROM \"publisher\" WHERE \"publisher\" = 'MacLehose Press';\n", "hints": ["The error message names the problem precisely.", "Run `SELECT \"name\" FROM sqlite_master WHERE \"type\" = 'table';` to list the table names.", "The table is plural."], "solution": "SELECT \"id\" FROM \"publishers\" WHERE \"publisher\" = 'MacLehose Press';\n", "diagnosis": "`Parse error: no such table: publisher`. The column is `publisher`, but the table is `publishers`.", "source": [{"file": "lecture1", "lines": "623-646", "quote": "There is no table called publisher.", "text": " 623  I'll say SELECT \"id\" FROM \"publisher\" where the publisher is equal to none\n 624  other than 'MacLehose Press,' like this, and my quotes semicolon hit Enter.\n 625  And hopefully-- oop--\n 626  I will see--\n 627  I'll see an error.\n 628  And based on this error--\n 629  let me ask our group here--\n 630  what did I do wrong?\n 631  \n 632  SPEAKER: Judging by the error, I think you just mistyped the table name.\n 633  CARTER ZENKE: Yeah, so I probably mistyped the table name.\n 634  And we could probably parse this if I look at the error itself.\n 635  So it says \"Parse error-- no such table--\n 636  publisher.\"\n 637  And that's true.\n 638  There is no table called publisher.\n 639  So let me fix this and run it again.\n 640  I'll say SELECT \"id\" FROM the \"publishers\" table--\n 641  plural-- and we'll say WHERE the \"publisher\"\n 642  is equal to 'MacLehose Press,' like this.\n 643  And I'll hit a semicolon here.\n 644  And now fingers crossed, this should work.\n 645  I do see an id of 12.\n 646  OK, So MacLehose Press-- the id is 12."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["id"], "rows": [[12]], "error": null}}, {"id": "D1-07", "module": "M1", "title": "WHERE on an aggregate", "bug_type": "aggregation", "origin": "source-question", "concepts": ["C1.10"], "difficulty": 2, "db": "longlist", "kind": "query", "prompt": "Meant to keep only books whose rounded average rating is above 4.0. It errors.", "broken": "SELECT \"book_id\", ROUND(AVG(\"rating\"), 2) AS \"average rating\"\nFROM \"ratings\"\nWHERE \"average rating\" > 4.0\nGROUP BY \"book_id\";\n", "hints": ["WHERE runs before rows are grouped. Does the average exist at that point?", "Conditions on groups use a different keyword.", "Move the condition into `HAVING`, after GROUP BY."], "solution": "SELECT \"book_id\", ROUND(AVG(\"rating\"), 2) AS \"average rating\"\nFROM \"ratings\"\nGROUP BY \"book_id\"\nHAVING \"average rating\" > 4.0;\n", "diagnosis": "WHERE filters individual rows and HAVING filters groups after aggregation.", "source": [{"file": "lecture1", "lines": "1755-1764", "quote": "But I can't because these are now not individual rows.", "text": "1755  To include a WHERE clause, I could try following up on this GROUP BY.\n1756  And you might think, I could say, well, WHERE the average--\n1757  WHERE \"average rating\"-- that new column I created--\n1758  is greater than or equal to 4.0.\n1759  But I can't because these are now not individual rows.\n1760  They are groups.\n1761  SQL uses a different keyword for conditions on groups\n1762  than for conditions on individual rows.\n1763  And this keyword is called HAVING--\n1764  H-A-V-I-N-G. Let me try that--"}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["book_id", "average rating"], "rows": [[5, 4.06], [10, 4.04], [20, 4.19], [21, 4.27], [22, 4.17], [26, 4.17], [29, 4.03], [33, 4.19], [35, 4.2], [40, 4.28], [42, 4.23], [43, 4.13], [46, 4.16], [48, 4.2], [52, 4.99], [60, 4.18], [71, 4.08], [73, 4.23], [75, 4.1]], "error": null}}, {"id": "D1-08", "module": "M1", "title": "LEFT JOIN wanted, INNER JOIN written", "bug_type": "join", "origin": "generated", "concepts": ["C1.7"], "difficulty": 2, "db": "sea_lions", "kind": "query", "prompt": "The research report must list **every tracked sea lion**, with its distance if known. Jolee is missing.", "broken": "SELECT \"name\", \"distance\" FROM \"sea_lions\"\nJOIN \"migrations\" ON \"migrations\".\"id\" = \"sea_lions\".\"id\";\n", "hints": ["What happens to a row with no match in an INNER JOIN?", "You want every row of the table written first.", "`LEFT JOIN`"], "solution": "SELECT \"name\", \"distance\" FROM \"sea_lions\"\nLEFT JOIN \"migrations\" ON \"migrations\".\"id\" = \"sea_lions\".\"id\";\n", "diagnosis": "An INNER JOIN silently drops unmatched rows. Choose the join from the question (\"every sea lion\" means LEFT).", "source": [{"file": "lecture1", "lines": "1149-1162", "quote": "well, let's sadly just get rid of the row.", "text": "1149  But what do you notice?\n1150  This one seems to match this id.\n1151  And this id seems to match this id.\n1152  But these two-- well, they don't match.\n1153  I mean poor Jolee down here-- we don't know how far Jolee went.\n1154  And if we don't know this data-- if these ids don't match--\n1155  is if we can not find a match for this id or for this id,\n1156  well, let's sadly just get rid of the row.\n1157  It's not part of our joined table anymore.\n1158  It's gone from our memory.\n1159  We now have only these tables--\n1160  or these rows that we could actually JOIN together\n1161  with the row and the other table here.\n1162  So, this is our example, then, of an INNER JOIN."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"columns": ["name", "distance"], "rows": [["Ayah", 1000], ["Spot", 1531], ["Tiger", 1370], ["Mabel", 1622], ["Rick", 1491], ["Jolee", null]], "error": null}}, {"id": "D1-09", "module": "M1", "title": "UNION of mismatched columns", "bug_type": "syntax", "origin": "source-question", "concepts": ["C1.9"], "difficulty": 1, "db": "longlist", "kind": "query", "prompt": "Meant to list everyone who is an author or a translator, but it fails.", "broken": "SELECT \"id\", \"name\" FROM \"authors\"\nUNION\nSELECT \"name\" FROM \"translators\";\n", "hints": ["Compare the number of columns on each side.", "Set operators stack rows, so every row must have the same shape.", "Select the same columns on both sides, here just `\"name\"`."], "solution": "SELECT \"name\" FROM \"authors\"\nUNION\nSELECT \"name\" FROM \"translators\";\n", "diagnosis": "\"SELECTs to the left and right of UNION do not have the same number of result columns\". Both sides need the same number of columns, and they should hold the same kind of data (L1652-1662).\n", "source": [{"file": "lecture1", "lines": "1652-1662", "quote": "you always have to have the same number", "text": "1652  The key thing here, though, is that in your INTERSECTs, or in your UNIONs,\n1653  or in your EXCEPT, you always have to have the same number\n1654  and the same type of columns.\n1655  So if I was trying to combine, let's say, author names with book titles,\n1656  I can't INTERSECT or UNION those quite well because they\n1657  have different kind of meanings.\n1658  They're different kinds of things.\n1659  So if you're trying to JOIN multiple thing-- trying to JOIN multiple tables\n1660  or INTERSECT multiple tables, make sure you always\n1661  have those same column names and those same column types--\n1662  the type of data that's stored inside."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["name"], "rows": [["Adania Shibli"], ["Adrian Nathan West"], ["Ahmed Saadawi"], ["Alia Trabucco Zerán"], ["Alison L. Strayer"], ["Amanda Svensson"], ["Andrzej Tichý"], ["Angela Rodel"], ["Aniruddhan Vasudevan"], ["Anna Moschovakis"], ["Anne McLean"], ["Annelise Finegan Wasmoen"], ["Annie Ernaux"], ["Anton Hur"], ["Antonia Lloyd-Jones"], ["Antonio Muñoz Molina"], ["Ariana Harwicz"], ["Benjamín Labatut"], ["Bora Chung"], ["Bruna Dantas Lobato"], ["Camilo A. Ramirez"], ["Can Xue"], ["Carolina Orloff"], ["Charlotte Barslund"], ["Charlotte Collins"], ["Chen Zeping"], ["Cheon Myeong-kwan"], ["Chi-Young Kim"], ["Christoph Ransmayr"], ["Claudia Piñeiro"], ["Clemens Meyer"], ["Daisy Rockwell"], ["Damion Searls"], ["Daniel Hahn"], ["Daniel Kehlmann"], ["Daniel Levin Becker"], ["Darryl Sterk"], ["David Boyd"], ["David Diop"], ["David Doherty"], ["David Grossman"], ["Deborah Bragan-Turner"], ["Deborah Smith"], ["Elisabeth Jaquette"], ["Elizabeth Heighway"], ["Emmanuelle Pagano"], ["Enrique Vila-Matas"], ["Eva Baltasar"], ["Fernanda Melchor"], ["Fiona Mackintosh"], ["Frances Riddle"], ["Frank Wynne"], ["Gabriela Cabezón Cámara"], ["Gabriela Ybarra"], ["GauZ'"], ["Geetanjali Shree"], ["George Szirtes"], ["Georgi Gospodinov"], ["Guadalupe Nettel"], ["Han Kang"], ["Hubert Mingarelli"], ["Hwang Sok-yong"], ["Iona Macintyre"], ["Jaap Robben"], ["Jackie Smith"], ["Javier Cercas"], ["Jen Calle fore `)`?", "Commas *separate* items; they don't end them.", "Remove the comma after the last item."], "solution": "CREATE TABLE \"riders\" (\n    \"id\" INTEGER,\n    \"name\" TEXT,\n    PRIMARY KEY(\"id\")\n);\n", "check": ["SELECT \"name\", upper(\"type\"), \"pk\" FROM pragma_table_info('riders')"], "diagnosis": "Every item except the last one ends with a comma.", "source": [{"file": "lecture2", "lines": "883-895", "quote": "So whatever is the last portion, I should not have a comma after", "text": " 883  And if that's the case, well, it's just convention, just style here.\n 884  So if I want to keep adding some constraint\n 885  or like a new line to my table, I should include a comma.\n 886  Here, this name column was the last portion of my table I had specified.\n 887  I have this column called name that has type affinity text, right?\n 888  But now, if I add this new constraint, we'll\n 889  have to follow it up with-- follow it up after a comma from this new column\n 890  here.\n 891  Notice now, this constraint, primary key ID, is the last--\n 892  let's say attribute of my table I specified.\n 893  I no longer need to include a comma at the end of it.\n 894  So whatever is the last portion, I should not have a comma after,\n 895  but everything else, I should."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"checks": [{"query": "SELECT \"name\", upper(\"type\"), \"pk\" FROM pragma_table_info('riders')", "columns": ["name", "upper(\"type\")", "pk"], "rows": [["id", "INTEGER", 1], ["name", "TEXT", 0]]}]}}, {"id": "D2-02", "module": "M2", "title": "A CHECK that checks nothing", "bug_type": "logic", "origin": "generated", "concepts": ["C2.7"], "difficulty": 3, "db": null, "kind": "modify", "setup": "CREATE TABLE \"cards\" (\"id\" INTEGER, PRIMARY KEY(\"id\"));\nINSERT INTO \"cards\" VALUES (1);\n", "prompt": "This swipes table should accept exactly 'enter', 'exit' and 'deposit'. Valid 'exit' and 'deposit' swipes are rejected. Fix the CHECK.", "broken": "CREATE TABLE \"swipes\" (\n    \"id\" INTEGER,\n    \"card_id\" INTEGER,\n    \"type\" TEXT NOT NULL CHECK(\"type\" = 'enter' OR 'exit' OR 'deposit'),\n    PRIMARY KEY(\"id\"),\n    FOREIGN KEY(\"card_id\") REFERENCES \"cards\"(\"id\")\n);\n", "hints": ["How does SQL read `\"type\" = 'enter' OR 'exit'`? What is the truth value of the string `'exit'` on its own?", "`OR` joins whole conditions, and `'exit'` alone is not a comparison. (A non-numeric string counts as 0, which is false.)", "Use `\"type\" IN ('enter', 'exit', 'deposit')`."], "solution": "CREATE TABLE \"swipes\" (\n    \"id\" INTEGER,\n    \"card_id\" INTEGER,\n    \"type\" TEXT NOT NULL CHECK(\"type\" IN ('enter', 'exit', 'deposit')),\n    PRIMARY KEY(\"id\"),\n    FOREIGN KEY(\"card_id\") REFERENCES \"cards\"(\"id\")\n);\n", "probes": ["INSERT INTO \"swipes\" (\"card_id\", \"type\") VALUES (1, 'enter')", "INSERT INTO \"swipes\" (\"card_id\", \"type\") VALUES (1, 'exit')", "INSERT INTO \"swipes\" (\"card_id\", \"type\") VALUES (1, 'teleport')"], "check": ["SELECT \"type\" FROM \"swipes\""], "diagnosis": "`a = 'x' OR 'y'` means `(a = 'x') OR ('y')`. The string `'y'` counts as 0 (false), so only 'enter' passes.\nLogic bugs inside a CHECK are dangerous because they look like protection. IN states the intent exactly.\n", "source": [{"file": "lecture2", "lines": "1280-1287", "quote": "I could say check that type is in some list of values.", "text": "1280  Let's try also for type.\n1281  I mean, type can only have a few values.\n1282  We saw enter, exit, deposit some funds.\n1283  I could make sure that only those values are included inside my type column.\n1284  I could say check that type is in some list of values.\n1285  Going back to week one here, we talk about in.\n1286  I could say, maybe the type is in enter exit or is in deposit.\n1287  So now when I have this table called swipes,"}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"checks": [{"query": "SELECT \"type\" FROM \"swipes\"", "columns": ["type"], "rows": []}]}}, {"id": "D2-03", "module": "M2", "title": "A foreign key that allows \"no card\"", "bug_type": "design", "origin": "generated", "concepts": ["C2.6", "C2.7"], "difficulty": 3, "db": null, "kind": "modify", "setup": "CREATE TABLE \"cards\" (\"id\" INTEGER, PRIMARY KEY(\"id\"));\nINSERT INTO \"cards\" VALUES (1);\n", "prompt": "Every swipe must belong to a real card. This table still accepts a swipe whose `card_id` is NULL. Fix the design.\n", "broken": "CREATE TABLE \"swipes\" (\n    \"id\" INTEGER,\n    \"card_id\" INTEGER,\n    \"amount\" NUMERIC NOT NULL,\n    PRIMARY KEY(\"id\"),\n    FOREIGN KEY(\"card_id\") REFERENCES \"cards\"(\"id\")\n);\n", "hints": ["Insert `(NULL, -2.40)` and check whether the foreign key complains.", "A NULL foreign key references nothing, so it is never checked.", "Add `NOT NULL` to `card_id`."], "solution": "CREATE TABLE \"swipes\" (\n    \"id\" INTEGER,\n    \"card_id\" INTEGER NOT NULL,\n    \"amount\" NUMERIC NOT NULL,\n    PRIMARY KEY(\"id\"),\n    FOREIGN KEY(\"card_id\") REFERENCES \"cards\"(\"id\")\n);\n", "probes": ["INSERT INTO \"swipes\" (\"card_id\", \"amount\") VALUES (1, -2.40)", "INSERT INTO \"swipes\" (\"card_id\", \"amount\") VALUES (NULL, -2.40)", "INSERT INTO \"swipes\" (\"card_id\", \"amount\") VALUES (9, -2.40)"], "check": ["SELECT \"card_id\" FROM \"swipes\""], "diagnosis": "Lecture 2 calls NOT NULL on foreign-key columns redundant. In SQLite it is not (errata #3).\n", "source": [{"file": "lecture2", "lines": "968-978", "quote": "This would be in this case, redundant.", "text": " 968  You might also think, could I do it for rider ID and station ID?\n 969  Should I include not null here?\n 970  Rider ID, not null, station ID, not null.\n 971  Well, that would be a good thought, but again, we're\n 972  taken care of by our table constraint using our foreign key here.\n 973  Again, this constraint will say, if rider ID doesn't already\n 974  exist in the ID column of rider's, I can't insert that value.\n 975  And we could probably presume that if rider's ID is a primary key,\n 976  well, null will not be part of this column,\n 977  and therefore, I already can't insert null for rider ID or station ID.\n 978  This would be in this case, redundant."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"checks": [{"query": "SELECT \"card_id\" FROM \"swipes\"", "columns": ["card_id"], "rows": []}]}}, {"id": "D2-04", "module": "M2", "title": "A primary key that forbids repeat visits", "bug_type": "design", "origin": "source-question", "concepts": ["C2.6"], "difficulty": 2, "db": null, "kind": "modify", "prompt": "Riders must be able to visit the same station many times, but the second visit is rejected. Fix the table.", "broken": "CREATE TABLE \"visits\" (\n    \"rider_id\" INTEGER,\n    \"station_id\" INTEGER,\n    PRIMARY KEY(\"rider_id\", \"station_id\")\n);\n", "hints": ["What does a composite primary key promise about each (rider_id, station_id) pair?", "Each *visit* is the entity, so give it its own identity.", "Add an `\"id\" INTEGER` column and make it the primary key (or rely on rowid)."], "solution": "CREATE TABLE \"visits\" (\n    \"id\" INTEGER,\n    \"rider_id\" INTEGER,\n    \"station_id\" INTEGER,\n    PRIMARY KEY(\"id\")\n);\n", "probes": ["INSERT INTO \"visits\" (\"rider_id\", \"station_id\") VALUES (1, 1)", "INSERT INTO \"visits\" (\"rider_id\", \"station_id\") VALUES (1, 1)"], "check": ["SELECT \"rider_id\", \"station_id\" FROM \"visits\""], "diagnosis": "A key must match the real-world uniqueness rule. Here that rule is \"each visit is distinct\", not \"each pair is distinct\".", "source": [{"file": "lecture2", "lines": "829-839", "quote": "I want people to able to visit a station more than once.", "text": " 829  But if we think about this logically, I mean,\n 830  it kind of stands to reason that somebody woul
