0  And in this case, SQL will give me what I asked for.\n1371  I said SELECT \"pubsliher\" from \"longlist.\"\n1372  And says, OK, here it is.\n1373  But that column doesn't exist so it creates this data for me.\n1374  So let me try this again.\n1375  I'll go back.\n1376  And I'll hopefully type this correctly now.\n1377  I'll say SELECT, let's say, \"publisher,\" this one, FROM \"longlist\" Semicolon.\n1378  And now I'll see all of the publishers that I have in my table.\n1379  But what do you see?\n1380  Well, some repeat, right?\n1381  I have Harvill Secker multiple times here.\n1382  I have similarly MacLehose Press multiple times as well.\n1383  So if I count it up, these publishers, I would\n1384  get each one counted one time, which I want to find\n1385  the distinct ones the different ones.\n1386  I need a new keyword for this.\n1387  And for this, we'll use this keyword indeed called DISTINCT, trying\n1388  to find unique values from our column.\n1389  So let's try this."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["COUNT(DISTINCT \"publisher\")"], "rows": [[30]], "error": null}}, {"id": "M1-E01", "title": "Read the ER diagram", "origin": "source-question", "concepts": ["C1.1", "C1.2"], "difficulty": 1, "skills": ["ER diagrams", "crow's foot notation", "cardinality"], "db": "longlist", "kind": "selfcheck", "prompt": "In crow's-foot notation, a circle means *zero*, a bar means *one*, and the three-pronged foot means *many*.\nFor the longlist diagram, write down:\n1. Is author ↔ book one-to-one, one-to-many or many-to-many? Why?\n2. Must a book have a translator? Must a translator have translated a book?\n3. What kind of relationship is book → ratings?\n", "hints": [{"Read each line in both directions": "one A has … B, and one B has … A."}, "\"Zero to many\" (circle + crow's foot) means the relationship is optional on that side.", "Ratings belong to exactly one book, and a book can have many ratings."], "solution": "-- Model answer:\n-- 1. Many-to-many: an author can write many books (Olga Tokarczuk wrote three here) and a book can have several authors.\n-- 2. A book has ZERO to many translators (some aren't translated); a translator translated at least one book.\n-- 3. One-to-many: one book, many ratings, so book_id is stored in ratings as a foreign key.\n", "explanation": "These diagrams are how you communicate a design. Lecture 2 makes you draw your own (M2-E01).", "module": "M1", "source": [{"file": "lecture1", "lines": "167-210", "quote": "So here, we have what's called a crow's foot notation", "text": " 167  So here, we have what's called a crow's foot notation,\n 168  a way of trying to represent one-to-one, one-to-many,\n 169  or many-to-many relationships using just lines and, in some cases, circles.\n 170  So here, if you ever see this line with a circle on it,\n 171  you could think of zero.\n 172  This doesn't have to have anything related to it.\n 173  You could think of this one with a bar going perpendicular as one.\n 174  Something with this arrow has to have at least one thing that\n 175  relates to it in some other table.\n 176  And this one down below, the one that looks like a crow's foot-- well,\n 177  this one means that some entity has many that could\n 178  be related to it in some other table.\n 179  So let's try this with an example.\n 180  Here we have, again, our authors and our books.\n 181  And here we can say that an author wrote one book.\n 182  We read this left to right in this case.\n 183  One author can have one book associated with them.\n 184  We know it's one because we see this bar over our line here.\n 185  Now we know, too, that books, at least in our world,\n 186  could be written by one author.\n 187  They must be written by at least one author.\n 188  So let's try this.\n 189  I'll include that arrow on the other side too.\n 190  And I'll read this right to left.\n 191  A book has to have at least one author.\n 192  Now, I could add in more symbols too.\n 193  We know that books could have more than one author\n 194  and an author could write more than one book.\n 195  So let's try enhancing our diagram even further.\n 196  I could say-- adding in these crow's foot notation with the multiple lines\n 197  here, now I could read it like this--\n 198  an author, going from left to right, can write at least one book,\n 199  but they could write many books.\n 200  They could write one or many books.\n 201  And, similarly, a book could be written by at least one author\n 202  but, certainly, also multiple too.\n 203  So this is one example of an ER diagram for our database.\n 204  And, hopefully, now you can see a bit more of this making sense to you.\n 205  So we see that authors, here, could write many books.\n 206  A book could be written by many authors.\n 207  Books, actually, don't need to have a translator."}], "origin_label": "SOURCE · question posed in the lecture"}, {"id": "M1-E02", "title": "Why not use the ISBN as the primary key?", "origin": "source-question", "concepts": ["C1.3"], "difficulty": 2, "skills": ["primary keys", "foreign keys", "key design"], "db": "longlist", "kind": "selfcheck", "prompt": "Every book has a unique ISBN such as `978-1-80427-…`. The lecturer asks what goes wrong if you use it as the primary key everywhere,\nincluding as the foreign key in other tables. Give two problems, and the alternative.\n", "hints": ["The key is copied into every table that references it, so think about size.", "What happens to a leading 0 when text becomes a number?", "The alternative is a key the database makes up for you."], "solution": "-- Model answer:\n-- 1. Size: as text it is ~17 bytes, repeated in every referencing row (e.g. thousands of ratings).\n-- 2. Stored as a number instead, an ISBN that starts with 0 loses that 0, so it no longer identifies the book.\n-- Alternative: a surrogate integer id (1, 2, 3 …) that is unique and never reused for another row.\n--   books.id is then the PRIMARY key; ratings.book_id and authored.book_id are FOREIGN keys to it.\n", "explanation": "\"It doesn't quite matter what number we choose so long as this number uniquely identifies the book\" (L367-369).", "module": "M1", "source": [{"file": "lecture1", "lines": "340-380", "quote": "And we can actually construct our very own primary key.", "text": " 340  So let me ask.\n 341  This is an ISBN.\n 342  But if I want to put this inside of a computer, like,\n 343  over and over and over again as a primary key--\n 344  it's the unique identifier--\n 345  what problems do you think I might run into here, if any?\n 346  What problems would I get by using this ISBN as my primary key?\n 347  SPEAKER: You would, like, run out of memory.\n 348  CARTER ZENKE: Run out of memory-- it's a good guess.\n 349  If I had a lot of ISBNs--\n 350  so, let's say I had not just 78 books, but I had literally millions of books,\n 351  this is a lot of data to store.\n 352  If you treated each of these as an individual character,\n 353  that's about 1 byte, 8 bits per character.\n 354  That's, let's say, 13 plus four dashes--\n 355  17 bytes per ISBN, which takes up a lot, a lot of space.\n 356  So what if I, instead, said, I'll remove the dashes like we did before.\n 357  And I'll treat it as a number.\n 358  Well, in that case, I might also have a problem.\n 359  Let's say an ISBN begins with 0.\n 360  And if I convert that to a number, I'll lose that beginning 0\n 361  because it doesn't really mean anything in the context of being a number.\n 362  And now I've lost my unique identifier.\n 363  So we could improve this even further.\n 364  And we can actually construct our very own primary key.\n 365  This one, let's just say, will be called 1 for this book.\n 366  And some other book, we could call it 2, some other book, maybe, 3.\n 367  And it doesn't quite matter what number we\n 368  choose so long as this number uniquely identifies the book that we choose\n 369  and we don't use that number for any other book as well.\n 370  So let's actually rethink this relationship of one-to-many here.\n 371  Let's not just use ISBN.\n 372  This is a lot of space to use, to someone point earlier.\n 373  Let's go ahead and use the id.\n 374  Let's make our own primary key in our books table\n 375  and use that as the foreign key in ratings.\n 376  So we freed up a good amount of space here.\n 377  And notice, too, that maybe Boulder has the primary key, the id of 1.\n 378  The White Book has the id of 74.\n 379  Well, does it matter if it's 1, 2, 3, or 4?\n 380  It doesn't as long as 74 uniquely identifies The White Book, we're OK."}], "origin_label": "SOURCE · question posed in the lecture"}, {"id": "M1-E03", "title": "What does (23, 1) in authored mean?", "origin": "source-question", "concepts": ["C1.3", "C1.4"], "difficulty": 1, "skills": ["junction table", "subquery"], "db": "longlist", "kind": "query", "prompt": "The `authored` table contains the row `author_id = 23, book_id = 1`.\nReturn the **name** of that author and the **title** of that book, as two one-row queries joined with `UNION ALL`, or just two queries (the checker reads the last one, the title).\n", "hints": ["`authored` holds only ids. Names live in `authors`, and titles live in `books`.", "Look up id 23 in authors and id 1 in books.", "`SELECT \"title\" FROM \"books\" WHERE \"id\" = 1;`"], "solution": "SELECT \"name\" FROM \"authors\" WHERE \"id\" = 23;\nSELECT \"title\" FROM \"books\" WHERE \"id\" = 1;\n", "expected_known": [["Boulder"]], "explanation": "Author 23 is Eva Baltasar and book 1 is *Boulder*, so the row says \"Eva Baltasar wrote Boulder\".", "module": "M1", "source": [{"file": "lecture1", "lines": "393-412", "quote": "has authored the book 1", "text": " 393  And based on the context clues here, what\n 394  might it mean if I looked at the author table\n 395  and saw 23 next to 1, where 23 is in the author_id column\n 396  and 1 is in the book_id column?\n 397  Feel free to raise your hand.\n 398  What would it mean for me to see those two numbers next to each other?\n 399  \n 400  SPEAKER: Yeah, it would mean that the author that\n 401  is read that has the id of 23 has authored the book 1.\n 402  CARTER ZENKE: Yeah, a great instinct here.\n 403  So if I look at author_id, I see 23.\n 404  Well, I could consider that maybe the author with the id of 23\n 405  wrote the book with the id of 1.\n 406  And I'll concede there's some extra work here.\n 407  I have to figure out, now, who has this author idea of 23.\n 408  Well, it turns out if I look in the author's table, it's Eva.\n 409  Similarly, for the book_id, I now have to go\n 410  through the process of figuring out, OK, well the book_id is 1.\n 411  What, then, is the book title?\n 412  And I'll look for that in my books table over here."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["title"], "rows": [["Boulder"]], "error": null}}, {"id": "M1-E04", "title": "Books from Fitzcarraldo Editions", "origin": "source-question", "concepts": ["C1.4"], "difficulty": 2, "skills": ["subquery"], "db": "longlist", "kind": "query", "prompt": "Return the titles published by **Fitzcarraldo Editions**. `books` stores only a `publisher_id`. Don't hard-code it.", "hints": ["Two questions. What is the publisher's id? Which books have that id?", "Put the first query in parentheses inside the second.", "`SELECT \"title\" FROM \"books\" WHERE \"publisher_id\" = (SELECT \"id\" FROM \"publishers\" WHERE \"publisher\" = '...');`"], "solution": "SELECT \"title\" FROM \"books\" WHERE \"publisher_id\" = (\n    SELECT \"id\" FROM \"publishers\" WHERE \"publisher\" = 'Fitzcarraldo Editions'\n);\n", "explanation": "The inner query runs first and returns 5, the id the lecture finds (L521). Hard-coding the 5 works, but the query breaks if the id ever changes.\n", "module": "M1", "source": [{"file": "lecture1", "lines": "553-584", "quote": "So SQL supports this idea of writing a subquery", "text": " 553  Let's say I have this first one to determine what\n 554  is the id of Fitzcarraldo Editions.\n 555  I could say SELECT \"id\" FROM \"publishers\" WHERE\n 556  the publisher is Fitzcarraldo Editions.\n 557  And I'll get back from this query the number 5.\n 558  Well, I could use that number in my next query.\n 559  If we saw visually here, I could then say,\n 560  SELECT \"title\" FROM \"books\" WHERE \"publisher_id\" = 5.\n 561  And I would get, then, back many titles here.\n 562  But here's another question.\n 563  Why is this not very well-designed?\n 564  At least, in the query I have here?\n 565  What could I improve about it?\n 566  Or what kind of smells wrong about it for you?\n 567  SPEAKER: They are not connected.\n 568  CARTER ZENKE: Yeah, so, Jean-Paul, as you said, too, they're not connected.\n 569  And here I have this id of 5.\n 570  But I don't want to remember this number.\n 571  I don't want to have to keep it in my mind and use it later on in my queries.\n 572  I, ideally, could use some other query to find this number for me\n 573  more dynamically.\n 574  And so SQL supports this idea of writing a subquery--\n 575  a query within a query.\n 576  For example, I'll take this, and I'll convert it to the query we had before.\n 577  I'll SELECT \"title\" FROM \"books\" WHERE \"publisher_id\" is equal to, well,\n 578  the result of this query here.\n 579  And notice how I have parentheses.\n 580  This means the query furthest inside the parentheses will be run first.\n 581  So first, this query is run.\n 582  I get back 5.\n 583  Then I could finish out my query and say, SELECT \"title\" FROM \"books\"\n 584  WHERE \"publisher_id\" is equal to 5."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["title"], "rows": [["Still Born"], ["The Birthday Party"], ["While We Were Dreaming"], ["A New Name: Septology VI-VII"], ["The Books of Jacob"], ["Paradais"], ["In Memory of Memory"], ["Minor Detail"], ["Hurricane Season"], ["The Other Name: Septology I-II"], ["The Years"], ["Drive Your Plow Over the Bones of the Dead"], ["Flights"]], "error": null}}, {"id": "M1-E05", "title": "Books from MacLehose Press", "origin": "source-demo", "concepts": ["C1.4"], "difficulty": 1, "skills": ["subquery"], "db": "longlist", "kind": "query", "prompt": "Same pattern. Return the titles published by **MacLehose Press**.", "hints": [{"The table is `publishers`, plural. The lecturer's first try failed with \"no such table": "publisher\"."}, "Find the id first, then the titles.", "`... WHERE \"publisher_id\" = (SELECT \"id\" FROM \"publishers\" WHERE \"publisher\" = 'MacLehose Press');`"], "solution": "SELECT \"title\" FROM \"books\" WHERE \"publisher_id\" = (\n    SELECT \"id\" FROM \"publishers\" WHERE \"publisher\" = 'MacLehose Press'\n);\n", "explanation": "MacLehose Press has id 12, as in the lecture (L645).", "module": "M1", "source": [{"file": "lecture1", "lines": "640-680", "quote": "I do see an id of 12.", "text": " 640  I'll say SELECT \"id\" FROM the \"publishers\" table--\n 641  plural-- and we'll say WHERE the \"publisher\"\n 642  is equal to 'MacLehose Press,' like this.\n 643  And I'll hit a semicolon here.\n 644  And now fingers crossed, this should work.\n 645  I do see an id of 12.\n 646  OK, So MacLehose Press-- the id is 12.\n 647  Now I want to find the books that were published by this id.\n 648  So let me go to my book table.\n 649  I will say SELECT \"title\" FROM \"books\", in this case,\n 650  WHERE the publisher id is equal to 12, as we saw before, semicolon.\n 651  Now I'll hit Enter.\n 652  And I'll see these are the books that MacLehose Press has published.\n 653  But, again, as we saw before, I could improve this.\n 654  I could make this better, more dynamic, by nesting my queries--\n 655  having a subquery, a query inside of a query.\n 656  So let's redo this.\n 657  I'll start at the end, essentially.\n 658  I'll say SELECT \"title\" from my book table\n 659  where the publisher id is or is equal to what?\n 660  Well, let's say I don't know it's 12.\n 661  I have to write another query here.\n 662  So to do that, I could open up some parentheses--\n 663  is equal to a parentheses.\n 664  And then I'll hit Enter to continue my query.\n 665  I'll indent four spaces--\n 666  space, space, space, space-- just a style convention\n 667  to keep things clean for me to show this query is inside of this other query.\n 668  What I'll then do is finish out this query.\n 669  I want to SELECT the \"id\" FROM the publisher's table WHERE--\n 670  let me just indent again--\n 671  WHERE the \"publisher\" is equal to--\n 672  not Fitzcarraldo Editions-- is equal to MacLehose Press, end quote.\n 673  And now, let me close my parentheses.\n 674  I have an open one here that I should close to show this subquery is done.\n 675  I'll hit Enter, close my parentheses, and now my entire query is done.\n 676  I can hit semicolon, hit Enter again.\n 677  And now I'll see the very same results but more dynamic.\n 678  No longer do I have to hardcode the id.\n 679  I can make it more dynamic, and I can actually\n 680  find it using my very own query here."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["title"], "rows": [["Standing Heavy"], ["An Inventory of Losses"], ["The Shape of the Ruins"], ["The Faculty of Dreams"], ["The Impostor"], ["Vernon Subutex 1"]], "error": null}}, {"id": "M1-E06", "title": "Average rating of In Memory of Memory", "origin": "source-demo", "concepts": ["C1.4"], "difficulty": 2, "skills": ["subquery", "AVG"], "db": "longlist", "kind": "query", "prompt": "Return the average of the individual ratings of the book *In Memory of Memory* (one number). Find its id with a subquery.", "hints": ["`ratings` has one row per rating, with a `book_id`.", "The subquery finds the book's id (33 in the lecture).", "`SELECT AVG(\"rating\") FROM \"ratings\" WHERE \"book_id\" = (SELECT \"id\" FROM \"books\" WHERE \"title\" = 'In Memory of Memory');`"], "solution": "SELECT AVG(\"rating\") FROM \"ratings\" WHERE \"book_id\" = (\n    SELECT \"id\" FROM \"books\" WHERE \"title\" = 'In Memory of Memory'\n);\n", "explanation": "The ratings here are synthetic, but the book id (33) is the lecture's.", "module": "M1", "source": [{"file": "lecture1", "lines": "682-731", "quote": "And we'll see 33.", "text": " 682  Maybe I want to find all of the ratings for this book called\n 683  In Memory of Memory.\n 684  Well, maybe I'll try it step-by-step.\n 685  And what I'll first do is try to find the id for In Memory of Memory.\n 686  I'll say SELECT \"id\" FROM--\n 687  let's go from the books table--\n 688  and let's say WHERE the title is In Memory of Memory,\n 689  end quote, semicolon, hit Enter.\n 690  And we'll see 33.\n 691  So this book has the id 33.\n 692  OK, let's now look in our ratings table for this id.\n 693  I'll say SELECT-- let's go for SELECT \"rating\"\n 694  FROM my ratings table WHERE the \"book_id\" is equal to 33,\n 695  I believe it was.\n 696  So now I'll hit Enter.\n 697  And now I should see all of the ratings for this book.\n 698  And there are quite a few that people have\n 699  left on this book-- on the Goodreads website.\n 700  So let me again try to improve this and make it just a little bit better.\n 701  I'll be more dynamic about it and try to nest these queries.\n 702  I'll say SELECT \"rating\" FROM \"ratings\".\n 703  We'll start at the beginning.\n 704  We ultimately want ratings.\n 705  Well, I want those ratings WHERE the \"book_id\" is equal to some number,\n 706  but I don't know what number yet.\n 707  So I have to write my own nested query.\n 708  I'll create a parentheses like this, Enter.\n 709  I'll indent four spaces--\n 710  space, space, space, space.\n 711  And then I'll say I want to find the \"id\" FROM the \"books\"\n 712  table WHERE this \"title\" is equal to 'In Memory of Memory'.\n 713  And that is my o in doing this kind of JOIN, just a regular old JOIN,\n1138  what we're really doing is part of this family of JOINs.\n1139  They're called an INNER JOIN.\n1140  You may have seen this idea of an INNER JOIN or an OUTER JOIN.\n1141  The usual JOIN, at least in SQLite, is going to be an INNER JOIN.\n1142  And what do we mean by INNER JOIN?\n1143  Well let's visualize it a little more slowly here\n1144  and see the process of which we might use to understand this JOIN.\n1145  I'll have, again, my two tables but now simplified.\n1146  I have name and id, and just distance and id.\n1147  And to JOIN these, I could literally kind of nudge them together\n1148  and draw a line down the middle, a bit like this."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["id", "name", "id", "distance", "days"], "rows": [[10484, "Ayah", 10484, 1000, 107], [11728, "Spot", 11728, 1531, 56], [11729, "Tiger", 11729, 1370, 37], [11732, "Mabel", 11732, 1622, 62], [11734, "Rick", 11734, 1491, 58]], "error": null}}, {"id": "M1-E10", "title": "Keep every tracked sea lion (LEFT JOIN)", "origin": "source-demo", "concepts": ["C1.7"], "difficulty": 2, "skills": ["LEFT JOIN"], "db": "sea_lions", "kind": "query", "prompt": "Join the same tables but keep **every sea lion**, including Jolee, who has no migration yet.", "hints": ["An OUTER join keeps unmatched rows and fills the gaps with NULL.", "The table written first (before the JOIN keyword) is the \"left\" one.", "`... FROM \"sea_lions\" LEFT JOIN \"migrations\" ON ...;`"], "solution": "SELECT * FROM \"sea_lions\"\nLEFT JOIN \"migrations\" ON \"migrations\".\"id\" = \"sea_lions\".\"id\";\n", "explanation": "Jolee's distance and days come back as NULL. RIGHT JOIN keeps every row of the right table instead (L1252-1272).", "module": "M1", "source": [{"file": "lecture1", "lines": "1224-1251", "quote": "Where we left off Jolee earlier, we've now", "text": "1224  And let's try to do a LEFT JOIN using our two data sets. \" table.\n1726  But now, I don't want to simply hit Enter.\n1727  I'll get back the same thing I did before,\n1728  which is the average of all the ratings in the ratings table.\n1729  What I want is for these ratings--\n1730  the average ratings-- to be grouped by the book_id.\n1731  So I'll say GROUP BY \"book_id\"; hit Enter.\n1732  And now I should be able to see the results I wanted.\n1733  Let me scroll to the top and notice how using GROUP BY,\n1734  I was able to take each book_id, collapse the rows--\n1735  the ratings that were associated with this book--\n1736  and find the average of that rating--\n1737  3.77, 3.97, 3.04-- for each book, so kind of handy here."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["book_id", "average rating"], "rows": [[1, 3.77], [2, 3.97], [3, 3.04], [4, 3.85], [5, 4.06], [6, 4.0], [7, 3.74], [8, 3.48], [9, 3.85], [10, 4.04], [11, 3.76], [12, 3.73], [13, 3.85], [14, 3.37], [15, 3.68], [16, 3.92], [17, 3.97], [18, 3.58], [19, 3.58], [20, 4.19], [21, 4.27], [22, 4.17], [23, 3.83], [24, 3.78], [25, 3.8], [26, 4.17], [27, 3.7], [28, 3.33], [29, 4.03], [30, 3.55], [31, 3.58], [32, 3.35], [33, 4.19], [34, 3.69], [35, 4.2], [36, 3.41], [37, 3.57], [38, 3.85], [39, 3.52], [40, 4.28], [41, 3.7], [42, 4.23], [43, 4.13], [44, 3.4], [45, 3.77], [46, 4.16], [47, 3.79], [48, 4.2], [49, 3.3], [50, 3.78], [51, 3.36], [52, 4.99], [53, 3.84], [54, 3.21], [55, 3.52], [56, 3.25], [57, 3.97], [58, 3.78], [59, 3.62], [60, 4.18], [61, 3.85], [62, 3.41], [63, 3.45], [64, 3.94], [65, 3.3], [66, 3.53], [67, 3.84], [68, 3.57], [69, 3.87], [70, 3.5], [71, 4.08], [72, 3.62], [73, 4.23], [74, 3.93], [75, 4.1], [76, 3.36], [77, 3.57], [78, 3.55]], "error": null}}, {"id": "M1-E20", "title": "Only the well-rated books (HAVING)", "origin": "source-demo", "concepts": ["C1.10"], "difficulty": 3, "skills": ["HAVING", "ORDER BY"], "db": "longlist", "kind": "query", "ordered": true, "prompt": "Same per-book averages, but keep only books whose rounded average is **above 4.0**, and sort them from best to worst.\n", "hints": ["WHERE filters rows before grouping. Which keyword filters groups?", "`HAVING` comes after GROUP BY, and `ORDER BY` comes last.", "`... GROUP BY \"book_id\" HAVING \"average rating\" > 4.0 ORDER BY \"average rating\" DESC;`"], "solution": "SELECT \"book_id\", ROUND(AVG(\"rating\"), 2) AS \"average rating\"\nFROM \"ratings\"\nGROUP BY \"book_id\"\nHAVING \"average rating\" > 4.0\nORDER BY \"average rating\" DESC, \"book_id\";\n", "explanation": "`WHERE \"average rating\" > 4.0` is an error, because there is no such row-level column yet (L1755-1764, debugging D1-07). Books 5 (4.06) and 10 (4.04) qualify, as in the lecture.", "module": "M1", "source": [{"file": "lecture1", "lines": "1753-1770", "quote": "SQL uses a different keyword for conditions on groups", "text": "1753  Now, though, let's say I only want those books that are pretty well rated,\n1754  greater than 4.0 out of 5.0 stars.\n1755  To include a WHERE clause, I could try following up on this GROUP BY.\n1756  And you might think, I could say, well, WHERE the average--\n1757  WHERE \"average rating\"-- that new column I created--\n1758  is greater than or equal to 4.0.\n1759  But I can't because these are now not individual rows.\n1760  They are groups.\n1761  SQL uses a different keyword for conditions on groups\n1762  than for conditions on individual rows.\n1763  And this keyword is called HAVING--\n1764  H-A-V-I-N-G. Let me try that--\n1765  H-A-V-I-N-G. I want to GROUP BY the \"book_id\"\n1766  and only keep those that have an average rating of greater than 4.0.\n1767  I will scroll over here, and I'll hit Enter.\n1768  And now I should see a much smaller list.\n1769  I see \"book_id\" 5 has a 4.06.\n1770  10 has a 4.04, and so on."}, {"file": "lecture1", "lines": "1811-1829", "quote": "so great question here to re-implement much of what we did last time", "text": "1811  Let me come back to find the average ratings.\n1812  So I'll say SELECT \"book_id\" and the rounded average rating\n1813  to two decimal places, calling that column \"average rating\".\n1814  And I'll SELECT this FROM the \"ratings\" table.\n1815  Well, now, we want not just to find the average rating.\n1816  We also want to SORT by that column too.\n1817  And in fact, use HAVING to only find those books that have 4.0 or higher.\n1818  Well, let's try this.\n1819  I'll say FROM \"ratings\", and I'll still GROUP BY \"book_id\".\n1820  Now, I'll say I only want to filter to those groups that have\n1821  a \"average rating\" of greater than 4.0.\n1822  And finally, after I've filtered out all of these rows, I want to order them.\n1823  I want to sort them.\n1824  So I'll order them by \"average rating\", this column I made up top.\n1825  And I'll say order them in descending order.\n1826  I want biggest to smallest.\n1827  And fingers crossed-- I'll hit Enter, and we'll see our ratings sorted\n1828  for us--\n1829  so great question here to re-implement much of what we did last time."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["book_id", "average rating"], "rows": [[52, 4.99], [40, 4.28], [21, 4.27], [42, 4.23], [73, 4.23], [35, 4.2], [48, 4.2], [20, 4.19], [33, 4.19], [60, 4.18], [22, 4.17], [26, 4.17], [46, 4.16], [43, 4.13], [75, 4.1], [71, 4.08], [5, 4.06], [10, 4.04], [29, 4.03]], "error": null}}, {"id": "M1-E21", "title": "How many ratings per book?", "origin": "source-question", "concepts": ["C1.10"], "difficulty": 1, "skills": ["GROUP BY", "COUNT"], "db": "longlist", "kind": "query", "prompt": "For each `book_id`, return how many ratings it received.", "hints": ["Same grouping as before, with a different aggregate.", "`COUNT(\"rating\")` counts the rows in each group.", "`SELECT \"book_id\", COUNT(\"rating\") FROM \"ratings\" GROUP BY \"book_id\";`"], "solution": "SELECT \"book_id\", COUNT(\"rating\") FROM \"ratings\" GROUP BY \"book_id\";\n", "explanation": "Book 1 has 2,779 ratings and book 2 has 176, as in the lecture (L1799-1800).", "module": "M1", "source": [{"file": "lecture1", "lines": "1777-1800", "quote": "And I'll see book id 1 has 2,779 ratings.", "text": "1777  SPEAKER: What if I don't want to see the average rating of a book,\n1778  but how many ratings does it have?\n1779  CARTER ZENKE: Oh, a good one.\n1780  So I want to know not the average rating, but the number of reviews,\n1781  let's say, the number of ratings it was given in my table.\n1782  Well, for that, I could just modify my query a little bit.\n1783  I could change average to COUNT because COUNT counts up the number of rows\n1784  that I have.\n1785  So let me try that here.\n1786  I'll come back to my laptop.\n1787  And let me try this one I will SELECT \"book_id\",\n1788  and I will also SELECT the COUNT of \"book_id\" in my-- no,\n1789  I'll also select the COUNT of \"ratings,\" we're gonna say how many ratings there\n1790  are-- inside my ratings table--\n1791  COUNT(\"rating\") FROM let's say the \"ratings\" table, like this.\n1792  Now I want to GROUP this data--\n1793  GROUP the counting by book_id.\n1794  So I'll say Group By \"book_id\"--\n1795  give me a count of the ratings for each book_id.\n1796  And now, I could just hit semicolon and Enter.\n1797  And now, I'll see how many ratings each book actually has.\n1798  Let me go to the top here.\n1799  And I'll see book id 1 has 2,779 ratings.\n1800  Book_id 2 has 176 ratings, and so on--"}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"columns": ["book_id", "COUNT(\"rating\")"], "rows": [[1, 2779], [2, 176], [3, 106], [4, 151], [5, 107], [6, 138], [7, 116], [8, 135], [9, 139], [10, 109], [11, 136], [12, 117], [13, 118], [14, 103], [15, 115], [16, 138], [17, 110], [18, 126], [19, 141], [20, 104], [21, 160], [22, 158], [23, 144], [24, 108], [25, 120], [26, 131], [27, 119], [28, 140], [29, 126], [30, 121], [31, 149], [32, 152], [33, 105], [34, 148], [35, 106 o the author who wrote Flights?\n 744  Could you walk me through what I might need to know for that query,\n 745  SPEAKER: You need to know id of author and of that book.\n 746  And based on that relation, you have to join all three tables together.\n 747  CARTER ZENKE: Yeah, I have to know ids.\n 748  And I have to kind of walk across the three tables, as you're saying.\n 749  So let's go back to our tables.\n 750  And I want to know, who wrote Flights?\n 751  Well, a good place to start, to your point,\n 752  is to say, let's start at Flights and find the id.\n 753  Well, the id of this seems to be 78.\n 754  Let me then look in our author table.\n 755  And let me try to find the author id that corresponds with 78.\n 756  Well, I find 78 here.\n 757  What's next to it?\n 758  Well, 58-- so the author id who wrote Flights is 58.\n 759  Well, who is 58?\n 760  I'll look in the author's table, and I'll see this is none other than Olga.\n 761  So let's walk through trying to make this query happen\n 762  but now using SQL keywords.\n 763  I'll start first with trying to find the id of Flight.\n 764  So I'll SELECT the \"id\" FROM the \"books\" table WHERE\n 765  the \"title\" is equal to 'Flights\".\n 766  That's fair enough.\n 767  Now, I could nest this query--\n 768  put it inside another query to find the author\n 769  id of the person who wrote Flights.\n 770  I'll do it a bit like this.\n 771  I'll SELECT \"author_id\" FROM \"authored\" WHERE the \"book_id\"\n 772  is equal to my prior query, SELECT \"id\" FROM \"flights\" WHERE \"title\"\n 773  is equal to-- or From \"books\" WHERE \"title\" is equal to 'Flights'.\n 774  And now I could go one step further.\n 775  I could say I want to find the name of the person who has this author_id.\n 776  Let me nest again."}, {"file": "lecture5", "lines": "364-394", "quote": "I get back all of Tom Hanks's movies", "text": " 364  What I might do now is try to find all of those movies\n 365  that Tom Hanks starred in.\n 366  And we did a bit of a example of this a little earlier visually,\n 367  but my goal is to find all of those titles that Tom Hanks played a role in.\n 368  Well if my goal is to end up with titles of movies,\n 369  I could try selecting \"title\" from the \"movies\" column like this.\n 370  But if I look at that movie's table, oh no, I only\n 371  have titles, year, and the ID of those movies.\n 372  I don't have anything related to Tom Hanks.\n 373  Well Tom Hanks though is probably showing up in the stars table\n 374  where I could correspond Tom Hanks's ID with the movie IDs\n 375  that Tom Hanks played a role in.\n 376  So let me try filtering these movies by an ID.\n 377  I'll say WHERE the \"id\" of that movie is IN some list of movie IDs\n 378  that also correspond with Tom Hanks's person ID.\n 379  So I'll make a subquery here to find exactly those films.\n 380  Now I'll say SELECT \"movie_id\" FROM \"stars\" where the \"person _id\"\n 381  is equal to--\n 382  well I don't know Tom Hanks's person ID.\n 383  I could try to hard-code it here, but I could do better\n 384  by having another subquery to find what is Tom Hanks's ID?\n 385  Now I'll indent not just four times but eight\n 386  to show this is my next level of a subquery here.\n 387  I'll now SELECT \"id\" FROM \"people\" WHERE the \"name\" = 'Tom Hanks'.\n 388  'Tom Hanks' like this.\n 389  And now I can close out my subqueries.\n 390  I've found the ID of Tom Hanks, I've found those movie IDs that\n 391  correspond with the person ID of Tom Hanks,\n 392  and then I've found the titles that correspond to those movie IDs.\n 393  Now I'll hit a semicolon here, press Enter, and I should see--\n 394  I get back all of Tom Hanks's movies, all of those that he played a role in."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["title"], "rows": [["Forrest Gump"], ["Apollo 13"], ["Toy Story"], ["Toy Story 2"], ["Saving Private Ryan"], ["Cast Away"], ["Toy Story 3"], ["Toy Story 4"]], "error": null}}, {"id": "M1-E23", "title": "Tally raw votes", "origin": "source-demo", "concepts": ["C1.10"], "difficulty": 2, "skills": ["GROUP BY", "COUNT"], "db": "votes", "kind": "query", "prompt": "Count the votes for each `title` in the raw `votes` table from Lecture 3 (no cleaning yet). Why are there far more than four groups?\n", "hints": ["You want one row per distinct title, with a count.", "`GROUP BY \"title\"` with `COUNT(\"title\")`.", "`SELECT \"title\", COUNT(\"title\") FROM \"votes\" GROUP BY \"title\";`"], "solution": "SELECT \"title\", COUNT(\"title\") FROM \"votes\" GROUP BY \"title\";\n", "explanation": "GROUP BY compares text exactly, so typos, stray spaces and case variants become separate groups. Fixing this is exercise M3-E13.", "module": "M1", "source": [{"file": "lecture1", "lines": "1712-1714", "quote": "using this GROUP BY keyword", "text": "1712  And, luckily, we actually have the capacity to do that with SQL\n1713  using this GROUP BY keyword.\n1714  So we'll see this in action."}, {"file": "lecture3", "lines": "1229-1246", "quote": "Why do I have so many?", "text": "1229  So I want to tally these votes.\n1230  And we could do that using a technique we learned back in the week\n1231  on querying and relating.\n1232  What if I wanted to group by my titles and count up those groups,\n1233  I could do that.\n1234  I could say SELECT, let's say, \"title,\" and also the COUNT of \"title,\"\n1235  and [? they ?] count up the votes for each title FROM, in this case,\n1236  my \"votes\" table like this.\n1237  Now, I want to count not just each vote individually, but I want to group them.\n1238  I want to count votes by group where that group is, in this case,\n1239  the \"title\" itself.\n1240  So let me try running this query and hitting Enter.\n1241  Well, [? I'll ?] [? see ?] I've started to count some votes,\n1242  like I have Imaginative landscape here, Spring outing, Farmers working at dawn,\n1243  Spring outing down below here too.\n1244  But I seem to be missing something, like I shouldn't have this many groups.\n1245  I should only have four groups.\n1246  Why do I have so many?"}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["title", "COUNT(\"title\")"], "rows": [[" Imaginative landscape", 1], [" Spring outing", 1], ["Famers Working at Dawn", 1], ["Farmers Working", 1], ["Farmers Working at Dawn", 1], ["Farmers working at dawn", 1], ["Farmesr working at dawn", 1], ["Imaginative Landscape", 1], ["Imaginative landscape ", 1], ["Imagintive Landscape", 1], ["Profusion", 1], ["Profusion of Flowers", 2], ["Profusion of flowers", 1], ["Spring Outing", 2], ["farmers working at dawn", 1], ["imaginative landscape", 1], ["profusion of flowers", 1], ["spring outing", 1]], "error": null}}, {"id": "M2-E01", "title": "Spot the redundancy in Charlie's fare log", "origin": "source-question", "concepts": ["C2.2"], "difficulty": 2, "skills": ["normalizing", "design critique"], "db": "charlie", "kind": "selfcheck", "prompt": "The `log` table is the first draft from Lecture 2: `id, name, station, action, fare, balance`.\nRun `SELECT * FROM \"log\";`, then write down:\n1. Which values are repeated, and why that is a problem.\n2. Which **entities** are hiding in this one table.\n3. Which tables you would create instead.\n", "hints": ["Look at the `name` column. What if two different people are both called Charlie?", "Which columns describe a *person*, which describe a *station*, and which describe an *event*?", "Entities → their own tables, each with its own id. The event table refers to them by id."], "solution": "-- Model answer (design, not executable):\n-- 1. Names and station names repeat in every row. Two different \"Charlie\"s are indistinguishable,\n--    and renaming a station means editing many rows.\n-- 2. Entities: riders (people), stations, and the visits/swipes that relate them.\n-- 3. riders(id, name), stations(id, name, line), visits(rider_id, station_id, ...)\n--    -- later refined to cards / stations / swipes (exercise M2-E12).\n", "explanation": "Normalizing means putting each entity in its own table, and keeping every column of a table about that entity only.\n", "module": "M2", "source": [{"file": "lecture2", "lines": "199-227", "quote": "what redundancies or inefficiencies do you see here?", "text": " 199  But I might even say that this table could really be improved substantially.\n 200  And I want to ask you what redundancies or inefficiencies do you see here?\n 201  If we're trying to represent riders and stations,\n 202  what can we improve about this design?\n 203  AUDIENCE: So probably the redundancy will be the names and the stations,\n 204  too.\n 205  For example, if Charlie will go to the train daily,\n 206  then he will become most of the names in the data.\n 207  CARTER ZENKE: Yeah, a good point.\n 208  If I'm hearing what you're saying, [? Loren, ?]\n 209  let me show you some examples that I highlighted here.\n 210  One example could be, to your point, about these names.\n 211  These names seem to be telling us the name of a person.\n 212  But here, we have only three names--\n 213  Charlie, Alice, and Bob.\n 214  Well, my name is Carter.\n 215  And what if somebody else named Carter also\n 216  tried to get on and leave at some stop?\n 217  Well, I wouldn't be able to know which Carter\n 218  was which or which Charlie was which, which Alice was which, and so on.\n 219  So we probably need a way to represent people and their names a little better\n 220  here, too.\n 221  What other ideas do we have for how to improve the design of this table?\n 222  AUDIENCE: Yes, I think we can have a singular ID for a singular person.\n 223  That way, we'll be better able to track their activities.\n 224  CARTER ZENKE: Nice.\n 225  So we probably have an ID for each person,\n 226  a bit what we learned about last week, putting people in their own table\n 227  and giving them their own unique ID, a primary key."}, {"file": "lecture2", "lines": "245-263", "quote": "So that is the process here of normalizing.", "text": " 245  the process we're going through is one called normalizing.\n 246  We're normalizing our data.\n 247  To normalize means to reduce redundancies, effectively,\n 248  to take a table--\n 249  take one table, for instance, split up into multiple,\n 250  and have each entity be part of its very own table.\n 251  Some academics in the world have named different normal forms, quote unquote.\n 252  There's like first normal form, second normal form, third normal form,\n 253  this progression of making your day more and more efficient.\n 254  You can use those as heuristics.\n 255  But end of the day, a few principles might apply.\n 256  First, take your entities, like in this case stations and riders,\n 257  and put them each in their own table.\n 258  And if you add more data, make sure that if I were to add a column, let's say,\n 259  to riders, it is only a data point about riders--\n 260  not about stations, not about fares, only about riders.\n 261  And that process can help us make a data set that\n 262  is more dynamic, more easy to reproduce, and more easy to write queries on.\n 263  So that is the process here of normalizing."}], "origin_label": "SOURCE · question posed in the lecture"}, {"id": "M2-E02", "title": "Create the riders and stations tables", "origin": "source-demo", "concepts": ["C2.4", "C2.5", "C2.6"], "difficulty": 1, "skills": ["CREATE TABLE", "type affinity", "PRIMARY KEY"], "db": null, "kind": "modify", "prompt": "In an empty database, create:\n* `riders` with `id` INTEGER and `name` TEXT, where `id` is the primary key\n* `stations` with `id` INTEGER, `name` TEXT and `line` TEXT, where `id` is the primary key\n\nUse the table-constraint style from the lecture: `PRIMARY KEY(\"id\")` after the columns.\n", "hints": ["One `CREATE TABLE name (...);` per table, columns separated by commas.", "Each column is `\"name\" AFFINITY`. Put the constraint `PRIMARY KEY(\"id\")` after the last column, preceded by a comma.", "`CREATE TABLE \"riders\" (\"id\" INTEGER, \"name\" TEXT, PRIMARY KEY(\"id\"));`, then the same shape for stations."], "solution": "CREATE TABLE \"riders\" (\n    \"id\" INTEGER,\n    \"name\" TEXT,\n    PRIMARY KEY(\"id\")\n);\nCREATE TABLE \"stations\" (\n    \"id\" INTEGER,\n    \"name\" TEXT,\n    \"line\" TEXT,\n    PRIMARY KEY(\"id\")\n);\n", "check": ["SELECT \"name\", upper(\"type\"), \"pk\" FROM pragma_table_info('riders')", "SELECT \"name\", upper(\"type\"), \"pk\" FROM pragma_table_info('stations')"], "explanation": "Riders and stations are separate entities, so they get separate tables, each with its own primary key.\nThe same id value (1, 2, 3) can appear in both tables without any conflict (L319-326).\n", "module": "M2", "source": [{"file": "lecture2", "lines": "672-695", "quote": "I could say, ID has the integer type affinity.", "text": " 672  I'll type Create table riders, and inside I'll\n 673  say it has the ID column of what type affinity?\n 674  Well, IDs are whole numbers, so perhaps integer in this case.\n 675  I could say, ID has the integer type affinity.\n 676  Now let me say the riders also have a name,\n 677  and how could names be best represented?\n 678  Maybe text, right?\n 679  Characters here.\n 680  So I'll say name and text.\n 681  Now I'll include a semicolon to say, this\n 682  is the end of my create table statement.\n 683  And before, remember how I had to kind of air out\n 684  or I had to like, backspace and so on to improve the design?\n 685  Here I can literally just point and click and edit this file\n 686  to improve my schema.\n 687  And I'll later on apply this in my database using\n 688  a command that we'll see a bit later.\n 689  So let's keep going here.\n 690  I'll say create table stations, and inside of the stations table,\n 691  I'll make sure it has an ID column of type integer,\n 692  a name column that probably stores some text,\n 693  and a line column that also stores some text, where name\n 694  is the name of the station like Kendell MIT, Harvard,\n 695  and line is blue line or green line, what line it's part of in our subway."}, {"file": "lecture2", "lines": "800-811", "quote": "and then say, primary key ID, just like this", "text": " 800  So here in the riders table, what was our primary key?\n 801  Well, it was ID.\n 802  Every rider should have their own, unique ID that should not\n 803  be duplicated across any two riders.\n 804  So to ensure that constraint is applied, I could follow this up with a comma\n 805  and then say, primary key ID, just like this.\n 806  Now ID is the primary key of this rider's table.\n 807  I can go down to stations and ask, what was my primary key?\n 808  Well, similarly, it was ID, this ID column on line 8.\n 809  So I'll type a comma followed up with primary key ID,\n 810  and now that ID column is a primary key.\n 811  It has that constraint applied in stations."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT \"name\", upper(\"type\"), \"pk\" FROM pragma_table_info('riders')", "columns": ["name", "upper(\"type\")", "pk"], "rows": [["id", "INTEGER", 1], ["name", "TEXT", 0]]}, {"query": "SELECT \"name\", upper(\"type\"), \"pk\" FROM pragma_table_info('stations')", "columns": ["name", "upper(\"type\")", "pk"], "rows": [["id", "INTEGER", 1], ["name", "TEXT", 0], ["line", "TEXT", 0]]}]}}, {"id": "M2-E03", "title": "The visits junction table", "origin": "source-demo", "concepts": ["C2.3", "C2.6"], "difficulty": 2, "skills": ["junction table", "FOREIGN KEY"], "db": null, "kind": "modify", "setup": "CREATE TABLE \"riders\" (\"id\" INTEGER, \"name\" TEXT, PRIMARY KEY(\"id\"));\nCREATE TABLE \"stations\" (\"id\" INTEGER, \"name\" TEXT, \"line\" TEXT, PRIMARY KEY(\"id\"));\nINSERT INTO \"riders\" VALUES (1, 'Charlie'), (2, 'Alice');\nINSERT INTO \"stations\" VALUES (1, 'Harvard', 'red'), (2, 'Kendall/MIT', 'red');\n", "prompt": "Riders and stations are many-to-many. Create the junction table `visits(rider_id INTEGER, station_id INTEGER)`\nwith two foreign keys: `rider_id` → `riders(id)` and `station_id` → `stations(id)`.\n", "hints": ["A junction table holds pairs of ids. Each column references another table's primary key.", "Table constraint syntax: `FOREIGN KEY(\"col\") REFERENCES \"table\"(\"id\")`.", "`CREATE TABLE \"visits\" (\"rider_id\" INTEGER, \"station_id\" INTEGER, FOREIGN KEY(\"rider_id\") REFERENCES \"riders\"(\"id\"), FOREIGN KEY(...) REFERENCES ...);`"], "solution": "CREATE TABLE \"visits\" (\n    \"rider_id\" INTEGER,\n    \"station_id\" INTEGER,\n    FOREIGN KEY(\"rider_id\") REFERENCES \"riders\"(\"id\"),\n    FOREIGN KEY(\"station_id\") REFERENCES \"stations\"(\"id\")\n);\n", "probes": ["INSERT INTO \"visits\" VALUES (1, 1)", "INSERT INTO \"visits\" VALUES (1, 1)", "INSERT INTO \"visits\" VALUES (99, 1)", "INSERT INTO \"visits\" VALUES (2, 42)"], "check": ["SELECT \"table\", \"from\", \"to\" FROM pragma_foreign_key_list('visits')", "SELECT COUNT(*) FROM \"visits\""], "explanation": "With foreign keys on, `(99, 1)` is rejected because rider 99 doesn't exist. Repeat visits `(1, 1)` are allowed.\nNote that SQLite only enforces foreign keys after `PRAGMA foreign_keys = ON;`, which this trainer always runs (see errata #4).\n", "module": "M2", "source": [{"file": "lecture2", "lines": "425-444", "quote": "So I'll call this table visits.", "text": " 425  So let me try making a table to implement\n 426  this many to many relationship.\n 427  And if you remember, we might call this kind of table a junction table,\n 428  an associative entity, a join table.\n 429  It has a lot of names, but it looks a bit like this.\n 430  I'll create this new table to represent, let's say, visits.\n 431  A rider visits a station.\n 432  So I'll call this table visits.\n 433  And inside, I'll make sure it has two columns, one for a rider\n 434  ID to represent a rider, and one, let's say, for a station ID,\n 435  to represent a station.\n 436  Now when I see a rider ID next to a station ID in this table,\n 437  I'll know the rider with that certain ID visited\n 438  the station with that certain ID.\n 439  So I'll close this out.\n 440  I'll say end, parentheses here, semicolon, Enter, and finally, clear\n 441  my terminal, type dot schema.\n 442  And I can see, I have riders, stations, and visits between riders and stations\n 443  in this associative entity, this junction table or a joined table.\n 444  Up to you what you might want to call it in this case."}, {"file": "lecture2", "lines": "848-865", "quote": "The foreign key of this table is rider ID", "text": " 848  Well, it seems like rider ID and station ID\n 849  are the foreign keys of this table where rider ID references the ID\n 850  column in rider's, and station ID references the ID column in stations.\n 851  So to codify that, to make that a reality in our schema,\n 852  I could follow this up with the foreign key.\n 853  The foreign key of this table is rider ID,\n 854  and it references the rider's table and the ID column\n 855  inside of it using this syntax here.\n 856  Now I could keep going.\n 857  I could say I have more than one foreign key.\n 858  I also have a foreign key--\n 859  foreign key called station ID.\n 860  And that references, like we said before,\n 861  the stations table and the ID column inside of it.\n 862  So now here I have my completed schema.\n 863  I have a primary key for the tables I've declared an explicit column\n 864  for a primary key, and now I also have foreign key constraints\n 865  for those columns that should be foreign keys."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT \"table\", \"from\", \"to\" FROM pragma_foreign_key_list('visits')", "columns": ["table", "from", "to"], "rows": [["stations", "station_id", "id"], ["riders", "rider_id", "id"]]}, {"query": "SELECT COUNT(*) FROM \"visits\"", "columns": ["COUNT(*)"], "rows": [[0]]}]}}, {"id": "M2-E04", "title": "Why a composite primary key is wrong for visits", "origin": "source-question", "concepts": ["C2.6"], "difficulty": 2, "skills": ["composite PRIMARY KEY", "constraint failure"], "db": null, "kind": "error", "expect_error": "UNIQUE constraint failed", "setup": "CREATE TABLE \"visits\" (\"rider_id\" INTEGER, \"station_id\" INTEGER, PRIMARY KEY(\"rider_id\", \"station_id\"));\nINSERT INTO \"visits\" VALUES (1, 1);\n", "prompt": "Here `visits` has the **joint primary key** `(rider_id, station_id)`, and rider 1 has already visited station 1 once.\nWrite the INSERT that records rider 1 visiting station 1 **again**, and observe what happens.\n", "hints": ["A primary key must be unique, so what makes a row unique here?", "Insert the exact same pair again.", "`INSERT INTO \"visits\" VALUES (1, 1);`"], "solution": "INSERT INTO \"visits\" VALUES (1, 1);\n", "explanation": "A composite PK forbids repeating a (rider, station) pair, but real riders visit the same station many times.\nThat is why the lecture prefers its own `id` primary key (or the implicit `rowid`) for visits.\n", "module": "M2", "source": [{"file": "lecture2", "lines": "816-834", "quote": "So maybe not the best design for this table", "text": " 816  One option is actually to make a joint primary key.\n 817  I could have a primary key composed of two columns, both rider ID and station\n 818  ID.\n 819  If I applied that constraint, that would mean\n 820  that if I were to ever insert a row that had the same rider\n 821  ID and the same station ID as another row,\n 822  I would trigger a constraint violation.\n 823  Every row that has a rider ID and a station ID\n 824  has to be unique in their combination of those two values.\n 825  To write that kind of scenario, I could follow this up\n 826  and I could say similarly, the primary key of this table\n 827  is not just rider ID like this, but it's also station ID.\n 828  Now this is a joint primary key constraint.\n 829  But if we think about this logically, I mean,\n 830  it kind of stands to reason that somebody would visit a station more\n 831  than once, and I don't want to make sure that every combination of rider\n 832  and station ID should be unique.\n 833  I want people to able to visit a station more than once.\n 834  So maybe not the best design for this table, but I could certainly use it."}], "origin_label": "SOURCE · question posed in the lecture", "expected": {"error": "UNIQUE constraint failed: visits.rider_id, visits.station_id"}}, {"id": "M2-E05", "title": "Fares in cents", "origin": "generated", "concepts": ["C2.5"], "difficulty": 2, "skills": ["REAL vs INTEGER", "CAST", "ROUND", "SUM"], "db": "charlie", "kind": "query", "prompt": "The `log.fare` column stores dollars as REAL values (0.10, 0.05, ...). Floating-point values aren't exact.\nReturn a single number: the **total of all fares in whole cents**, as an integer.\n", "hints": ["Convert each fare to cents *before* adding, so you add exact integers.", "`fare * 100` can come out as 9.999999...; `ROUND` it, then `CAST(... AS INTEGER)`.", "`SELECT SUM(CAST(ROUND(\"fare\" * 100) AS INTEGER)) FROM \"log\";`"], "solution": "SELECT SUM(CAST(ROUND(\"fare\" * 100) AS INTEGER)) FROM \"log\";\n", "expected_known": [[50]], "explanation": "This is the lecture's integer-vs-real trade-off for fares, made concrete. Whole cents in an INTEGER column are exact and easy to add up.\nREAL dollars risk values like 0.10000056789 (L540-547).\n", "module": "M2", "source": [{"file": "lecture2", "lines": "540-571", "quote": "it can get very wonky if I really need that kind of precision", "text": " 540  So maybe it'll be better after all if I used a real or a decimal like this,\n 541  0.10.\n 542  But I mean even here, you'll run into some problems.\n 543  If you are familiar with how the number is represented in binary,\n 544  you might know that decimal values or floating point values\n 545  can't be perfectly, precisely represented.\n 546  And if I talk about 0.10, the computer might store 0.10000056789.\n 547  It could get very wonky out to the many, many decimal digits down below here.\n 548  So trade offs and challenges overall.\n 549  Let's look at these three, though.\n 550  I have the first one to store as an integer.\n 551  I'm trying to store fares here, second one as text, and the third one\n 552  as a floating point or a real in this case.\n 553  Let me ask for some opinions here, which one\n 554  would you use and why, for trying represent fares in this case?\n 555  AUDIENCE: Thank you.\n 556  I prefer using integers because of course,\n 557  I need to get the calculation very accurately.\n 558  That's my point of view.\n 559  Well, sometimes I can use float but, you know,\n 560  like you said before, it can get very wonky\n 561  if I really need that kind of precision, I don't really recommend using floats.\n 562  CARTER ZENKE: Yeah, a good point.\n 563  So if I go back to some slides here, you might argue for the integer\n 564  because you know you can precisely represent integers.\n 565  And let's say I want to add up fares over a lot, a lot of riders.\n 566  This might be useful for me because I know that each number will\n 567  be perfectly, precisely represented.\n 568  I can do lots of big kind of math with this number here.\n 569  To your point, this decimal might kind of, as you said,\n 570  get wonky later on towards the later decimal points.\n 571  I might get some unexpected results if we add up these overall."}], "origin_label": "GENERATED · written for this system (reinforces a concept from the source)", "expected": {"columns": ["SUM(CAST(ROUND(\"fare\" * 100) AS INTEGER))"], "rows": [[50]], "error": null}}, {"id": "M2-E06", "title": "Watch type affinity convert values", "origin": "source-demo", "concepts": ["C2.5"], "difficulty": 2, "skills": ["type affinity", "typeof"], "db": null, "kind": "query", "prompt": "Recreate the lecture's demo:\n1. Create `fares_text(\"amount\" TEXT)` and `fares_int(\"amount\" INTEGER)`.\n2. Insert the **integer** `10` into `fares_text`, and the **text** `'25'` into `fares_int`.\n3. Finish with one query returning two rows: `typeof(\"amount\")` from each table, `fares_text` first (use `UNION ALL`).\n", "hints": ["The column's affinity, not the literal you typed, decides how the value is stored when conversion is possible.", "`typeof(x)` returns 'integer', 'text', 'real', 'blob' or 'null'.", "`SELECT typeof(\"amount\") FROM \"fares_text\" UNION ALL SELECT typeof(\"amount\") FROM \"fares_int\";`"], "solution": "CREATE TABLE \"fares_text\" (\"amount\" TEXT);\nCREATE TABLE \"fares_int\" (\"amount\" INTEGER);\nINSERT INTO \"fares_text\" VALUES (10);\nINSERT INTO \"fares_int\" VALUES ('25');\nSELECT typeof(\"amount\") FROM \"fares_text\"\nUNION ALL\nSELECT typeof(\"amount\") FROM \"fares_int\";\n", "ordered": true, "expected_known": [["text"], ["integer"]], "explanation": "Storage classes belong to **values**, and affinities belong to **columns**. A column converts what you insert to its preferred class when it can.\nA value that can't be converted (e.g. `'red line'` into INTEGER) is stored as it is.\n", "module": "M2", "source": [{"file": "lecture2", "lines": "613-638", "quote": "I'll get back not 10, the text, but 10 the integer", "text": " 613  Let's say I have this table of fares, and we've\n 614  decided to store fares as integers.\n 615  Well, if I said that this column called amount has the affinity for the text\n 616  storage class, what would happen is if I insert this integer, 10,\n 617  it would look a bit like this later on.\n 618  It would be converted to text, it would be quoted in a sense,\n 619  to represent-- it's now been converted to some set of characters.\n 620  Let's say I insert this value 25.\n 621  Well, 25 has a storage class right now of an integer.\n 622  It is a whole number.\n 623  But if I insert this into a column that has the text affinity,\n 624  it will be converted into, in this case, text at the end of the day.\n 625  Let's do the opposite.\n 626  Let's say I have my fare as a string, some text in this case.\n 627  I want to insert it into this column called amount,\n 628  but now amount has the integer type affinity.\n 629  Well, if I insert 10, quote unquote, into the column amount,\n 630  I'll get back not 10, the text, but 10 the integer, because again, amount--\n 631  this column here-- has an affinity for the integer storage class.\n 632  Let's try this.\n 633  25, some text again I'll insert it into this table.\n 634  Now I'll have 25 as an integer.\n 635  So this is how SQLite allows us to give certain columns\n 636  an affinity for certain types, that they'll\n 637  try to store values of that type, so long as we insert values it could be\n 638  feasibly converted to that type here."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"columns": ["typeof(\"amount\")"], "rows": [["text"], ["integer"]], "error": null}}, {"id": "M2-E07", "title": "Stations with NOT NULL and UNIQUE", "origin": "source-demo", "concepts": ["C2.7"], "difficulty": 2, "skills": ["NOT NULL", "UNIQUE"], "db": null, "kind": "modify", "prompt": "Create `stations(id, name, line)` where:\n* `id` is an INTEGER primary key\n* `name` is TEXT, required and unique\n* `line` is TEXT and required, but **not** unique (many stations share a line)\n", "hints": ["Column constraints go right after the column's affinity.", "`NOT NULL` makes a value required; `UNIQUE` forbids repeats.", "`\"name\" TEXT NOT NULL UNIQUE, \"line\" TEXT NOT NULL, PRIMARY KEY(\"id\")`"], "solution": "CREATE TABLE \"stations\" (\n    \"id\" INTEGER,\n    \"name\" TEXT NOT NULL UNIQUE,\n    \"line\" TEXT NOT NULL,\n    PRIMARY KEY(\"id\")\n);\n", "probes": ["INSERT INTO \"stations\" (\"name\", \"line\") VALUES ('Harvard', 'red')", "INSERT INTO \"stations\" (\"name\", \"line\") VALUES ('Kendall/MIT', 'red')", "INSERT INTO \"stations\" hat station.\n1202  So let's now say visits becomes swipes.\n1203  And among these new columns to add are the following.\n1204  I want to have not just an ID for each swipe,\n1205  not an ID for rider ID and station ID and so on,\n1206  but also I want to have a type of swipe.\n1207  Am I entering the station, exiting, or depositing some funds?\n1208  So I'll say the type of this is going to be a new column,\n1209  and the data type, this whole will be text, enter, exit,\n1210  or deposit for funds.\n1211  Now let me try another column, two.\n1212  I'll include a date time.\n1213  A date time is like a timestamp.\n1214  What time did this swipe actually happen?\n1215  And I'll make this type numeric.\n1216  Numeric can store all kinds of dates and times for me in this table.\n1217  Now let me add one final column.\n1218  This one will be an amount.\n1219  I'll also use numeric for this kind of column here.\n1220  And I'll say that this column called amount\n1221  can store, in this case integers or real numbers, like floats and so on.\n1222  I'll probably decide on that when I actually add some data to this table.\n1223  So here we've updated our schema to represent that diagram we saw before.\n1224  I have cards, I have stations, and I have\n1225  swipes that have some type associated with them, enter, exit, deposit,\n1226  some date, time, and some amount that was charged to me\n1227  while I made this swipe.\n1228  Either I added some funds, in which case amount is positive,\n1229  or I subtracted some funds, entering exiting, in this case from the station."}, {"file": "lecture2", "lines": "1299-1305", "quote": "So let me say that this is now a card ID", "text": "1299  I'll go back to my computer, and let's try fixing this.\n1300  I have a rider ID inside of my swipes table, but no longer do I have riders,\n1301  I have cards.\n1302  So let me say that this is now a card ID, and down below in my foreign key,\n1303  I'll say that this card ID column references the ate table visits.\n 698  And then I'll do rider ID, which has what type affinity?\n 699  Probably integer."}], "origin_label": "SOURCE · demonstrated in the lecture"}, {"id": "M3-E01", "title": "Insert the first artwork", "origin": "source-demo", "concepts": ["C3.1"], "difficulty": 1, "skills": ["INSERT INTO"], "db": "mfa", "kind": "modify", "setup": "DELETE FROM \"created\"; DELETE FROM \"collections\";\n", "prompt": "The `collections` table is empty. The museum acquires **Profusion of Flowers**, accession number `56.257`, acquired `1956-04-12`.\nInsert it with **id 1**, listing all four columns explicitly.\n", "hints": ["INSERT needs three things: the table, the list of columns, and the matching list of values.", "The statement is `INSERT INTO table (column, ...) VALUES (value, ...);`. The n-th value goes into the n-th listed column.", "List all four columns (id, title, accession_number, acquired), then the four values in the same order. Quote the text values, including the accession number."], "solution": "INSERT INTO \"collections\" (\"id\", \"title\", \"accession_number\", \"acquired\")\nVALUES (1, 'Profusion of Flowers', '56.257', '1956-04-12');\n", "check": ["SELECT * FROM \"collections\""], "explanation": "Value 1 goes into column 1, value 2 into column 2, and so on.", "module": "M3", "source": [{"file": "lecture3", "lines": "130-153", "quote": "The accession number that we gave it was 56.257.", "text": " 130  I'll say INSERT INTO the \"collections table.\"\n 131  And now, I have to ask, what columns inside of \"collections\"\n 132  [? do I ?] [? want ?] to add data to.\n 133  Well, I probably want to add to the first the \"id\" column,\n 134  that primary key column.\n 135  Then maybe, I want to add a \"title\" to this row, and also\n 136  an \"accession_number,\" and also, of course, the date this piece\n 137  was \"acquired.\"\n 138  So now, I have the table I'm inserting into along\n 139  with the columns I'm adding values for.\n 140  So for style's sake, I'll hit Enter here.\n 141  And now, I could type a list of values to insert into this new row.\n 142  I could say VALUES, and then inside parentheses, the values\n 143  I want to insert.\n 144  Maybe the first primary key that I give to this item\n 145  is going to be just [? 1, ?] start at 1, and add up as we add new items.\n 146  For the title, I'll say let's call this one \"Profusion of flowers.\"\n 147  This is the piece we recently acquired into our collection.\n 148  The accession number that we gave it was 56.257.\n 149  And the date it was acquired was back in 1956-04-12.\n 150  Now, I have all these values here.\n 151  I'll type [? semicolon ?] hit Enter, and nothing seems to happen.\n 152  But if I type, let's say, select [? star ?] from collections\n 153  [? semicolon, ?] what do I see, but this new row inside."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"collections\"", "columns": ["id", "title", "accession_number", "acquired"], "rows": [[1, "Profusion of Flowers", "56.257", "1956-04-12"]]}]}}, {"id": "M3-E02", "title": "Let SQLite choose the primary key", "origin": "source-demo", "concepts": ["C3.1"], "difficulty": 1, "skills": ["INSERT INTO", "implicit primary key"], "db": "mfa", "kind": "modify", "setup": "DELETE FROM \"created\"; DELETE FROM \"collections\";\nINSERT INTO \"collections\" VALUES (1, 'Profusion of Flowers', '56.257', '1956-04-12');\nINSERT INTO \"collections\" VALUES (2, 'Farmers Working at Dawn', '11.6152', '1911-08-03');\n", "prompt": "Insert **Spring Outing** (accession `14.76`, acquired `1914-01-08`) **without** giving an id.\nThen check: what id did it receive?\n", "hints": ["Simply leave `id` out of the column list.", "An `INTEGER` primary key is filled in automatically.", "`INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES (...);`"], "solution": "INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\")\nVALUES ('Spring Outing', '14.76', '1914-01-08');\n", "check": ["SELECT * FROM \"collections\""], "explanation": "SQLite takes the current highest id (2) and adds 1, giving 3. Choosing ids yourself risks reusing one that is already taken.\nFor what changes with `AUTOINCREMENT`, see errata #2: the lecture states it backwards.\n", "module": "M3", "source": [{"file": "lecture3", "lines": "206-232", "quote": "So it seems like SQLite actually increments the primary key for me.", "text": " 206  And if I specify the primary key, I might actually\n 207  add a value that's already in there.\n 208  So I could, thankfully, leave it up to SQLite to actually increment\n 209  this value for me.\n 210  Let me try leaving off \"id\" in this case.\n 211  I'll omit the \"id\" altogether, which seems\n 212  at first like a bit of a bad thought, like shouldn't every row\n 213  have its own id?\n 214  Well, let's just try and figure out what happened.\n 215  I'll hit Enter here.\n 216  And now I'll say, let me give the VALUES.\n 217  Well, now the first column is the title column.\n 218  So I'll go ahead and say that this one will be called \"Spring outing.\"\n 219  We're going to add this one to our collection here.\n 220  The accession number, in this case, is 14.76.\n 221  And we acquired this one all the way back in 1914-01-08 [? semicolon. ?]\n 222  So I'll hit Enter here.\n 223  And notice how there's no [? id ?] that I have specified.\n 224  But now if I hit Enter, seems to work.\n 225  I'll type SELECT [? star ?] [? FROM ?] \"collections,\"\n 226  and what do I see but the new primary key of 3.\n 227  So it seems like SQLite actually increments the primary key for me.\n 228  If I add some new row, it looks, what is the current highest primary key\n 229  and adds 1 to that automatically for me.\n 230  And I've gotten that by specifying in my schema\n 231  this primary key constraint down on line 6.\n 232  So pretty handy for me here."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT * FROM \"collections\"", "columns": ["id", "title", "accession_number", "acquired"], "rows": [[1, "Profusion of Flowers", "56.257", "1956-04-12"], [2, "Farmers Working at Dawn", "11.6152", "1911-08-03"], [3, "Spring Outing", "14.76", "1914-01-08"]]}]}}, {"id": "M3-E03", "title": "Break the UNIQUE constraint", "origin": "source-demo", "concepts": ["C3.2"], "difficulty": 1, "skills": ["UNIQUE"], "db": "mfa", "kind": "error", "expect_error": "UNIQUE constraint failed", "prompt": "*Spring Outing* (accession `14.76`) is already in `collections`. Try inserting it **again** with the same accession number, and read the error.\n", "hints": ["`accession_number` was declared `UNIQUE`.", "Write a normal INSERT with the duplicate value.", "`INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES ('Spring Outing', '14.76', '1914-01-08');`"], "solution": "INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\")\nVALUES ('Spring Outing', '14.76', '1914-01-08');\n", "explanation": "The constraint protected the table from a duplicate record. Nothing was inserted.", "module": "M3", "source": [{"file": "lecture3", "lines": "262-284", "quote": "Runtime error-- UNIQUE constraint failed.", "text": " 262  So I'll come back to my [? TERMINAL. ?] Let me just reinsert,\n 263  let's say \"Spring outing.\"\n 264  Notice how if I SELECT [? star ?] FROM \"collections,\" it's already in here.\n 265  But I'll try to add it yet again with the same [? accession ?] [? number. ?]\n 266  So I'll say INSERT INTO \"collections.\"\n 267  And by now this is [? hopefully ?] [? becoming ?] a little more familiar.\n 268  I now want to say the columns I want to add data to.\n 269  So I'll say the \"title\" column, the \"accession_number\" column,\n 270  and also the \"acquired\" date I'll hit Enter.\n 271  And now I'll say the VALUES again.\n 272  Let's reinsert [? \"Spring ?] [? outing.\" ?] I'll say \"Spring outing\"\n 273  as a title, the accession number is 14.76,\n 274  and the date it was acquired was again 1914-01-08 semicolon.\n 275  Now if I hit Enter, what do we see?\n 276  Runtime error-- UNIQUE constraint failed.\n 277  So it seems we ran against this constraint\n 278  here that we specified on line 4 here.\n 279  [? \"Accession number\" ?] should always be unique.\n 280  But by trying to add a new row that had that same accession number,\n 281  we ran into this runtime error and our operation was not completed.\n 282  If I say in this case, SELECT [? star ?] FROM \"collections,\"\n 283  notice how I guarded myself from adding Spring outing more than once\n 284  with the same accession number."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"error": "UNIQUE constraint failed: collections.accession_number"}}, {"id": "M3-E04", "title": "Break the NOT NULL constraint", "origin": "source-demo", "concepts": ["C3.2"], "difficulty": 1, "skills": ["NOT NULL", "NULL"], "db": "mfa", "kind": "error", "expect_error": "NOT NULL constraint failed", "prompt": "Try to insert an artwork whose `title` and `accession_number` are both `NULL` (acquired `1900-01-10`).", "hints": ["`NULL` is written without quotes. `'NULL'` would be a four-letter string.", "Both columns were declared NOT NULL.", "`INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES (NULL, NULL, '1900-01-10');`"], "solution": "INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\")\nVALUES (NULL, NULL, '1900-01-10');\n", "explanation": "", "module": "M3", "source": [{"file": "lecture3", "lines": "286-307", "quote": "the NOT NULL constraint", "text": " 286  Let's try violating NOT NULL too.\n 287  I'll try adding a title that is actually [? null, ?] non-existent.\n 288  It's trying to add a painting without a title itself.\n 289  Let's try this.\n 290  I might try INSERT INTO the \"collections\" table,\n 291  and I'll add to the \"title\" columns, the \"accession_number,\" and also\n 292  the \"acquired\" column.\n 293  Now, I'll say the VALUES here.\n 294  But remember, this [? null ?] value.\n 295  Null meaning nothing.\n 296  This value doesn't exist.\n 297  I could insert that into my table, or at least try to.\n 298  I'll say NULL is a title.\n 299  And similarly, NULL is the accession number.\n 300  Now let's say, just playfully, we got this painting back in 1900-01-10\n 301  like this.\n 302  OK now, semicolon.\n 303  I'll hit Enter, and we see the same runtime error-- constraint failed,\n 304  in this case, the NOT NULL constraint.\n 305  So notice again how in my schema, I specified \"title\" should be NOT NULL.\n 306  But here when I try to insert a [? null ?] [? value, ?] I run into that\n 307  constraint and I can't insert that value."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"error": "NOT NULL constraint failed: collections.title"}}, {"id": "M3-E05", "title": "Insert two rows in one statement", "origin": "source-demo", "concepts": ["C3.3"], "difficulty": 1, "skills": ["multi-row INSERT", "NULL"], "db": "mfa", "kind": "modify", "setup": "DELETE FROM \"created\"; DELETE FROM \"collections\";\nINSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES\n  ('Profusion of Flowers', '56.257', '1956-04-12'),\n  ('Farmers Working at Dawn', '11.6152', '1911-08-03'),\n  ('Spring Outing', '14.76', '1914-01-08');\n", "prompt": "With **one** INSERT statement, add:\n* **Imaginative Landscape**, accession `56.496`. The museum doesn't know when it was acquired.\n* **Peonies and Butterfly**, accession `06.1899`, acquired `1906-01-01`\n", "hints": ["One VALUES keyword, then several parenthesized rows separated by commas.", "An unknown date is `NULL`. Quote `'06.1899'`, or the leading zero disappears (errata", "`INSERT INTO ... (...) VALUES ('Imaginative Landscape', '56.496', NULL), ('Peonies and Butterfly', '06.1899', '1906-01-01');`"], "solution": "INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\")\nVALUES\n('Imaginative Landscape', '56.496', NULL),\n('Peonies and Butterfly', '06.1899', '1906-01-01');\n", "check": ["SELECT \"title\", \"accession_number\", \"acquired\" FROM \"collections\""], "explanation": "One multi-row INSERT is both more convenient and faster than many single inserts. It is also all-or-nothing:\nif one row violates a constraint, none are inserted (L632-638).\n", "module": "M3", "source": [{"file": "lecture3", "lines": "334-364", "quote": "So a handy way to insert more than one value.", "text": " 334  And this time, let's say we got two paintings at once.\n 335  We got two.\n 336  So I'll try to add both of them.\n 337  I'll say INSERT INTO the \"collections\" table.\n 338  And again, I want to keep adding to my \"title\" column, my \"accession_number\"\n 339  column, and even my \"acquired\" column, like this.\n 340  Now, I want to add in some values.\n 341  So I'll type VALUES here.\n 342  And as a matter of style, let me just say I'll make a new line.\n 343  I'll Enter here.\n 344  And now I can type each of my new rows on their very own line.\n 345  So again, I'll type all of the values that I want in my first row.\n 346  I might call this one \"Imaginative landscape.\"\n 347  We got this one back in--\n 348  actually, we don't quite know when we got this one.\n 349  If I type 56.496 is the accession number, like, yeah, 56.496.\n 350  The MFA actually doesn't know when they got this painting.\n 351  So if they don't know, let's just insert NULL.\n 352  This is intentionally left blank.\n 353  This is my first row.\n 354  Now, I want to add a second one in one go.\n 355  I'll follow this up with a comma.\n 356  And now, I'll type out my next set of values.\n 357  This next one we acquired is called \"Peonies and butterfly.\"\n 358  Now, I'll say the [? accession ?] [? number ?] is 06.1899.\n 359  And we got this one-- it was back in 1906-01-01 now I'll hit semicolon here.\n 360  And now, if I hit Enter, nothing happens.\n 361  But if I type Select [? star ?] FROM \"collections\" semicolon,\n 362  what do we see, but now two new rows being inserted.\n 363  So a handy way to insert more than one value.\n 364  And also, if you have a lot of values, a more efficient way as well."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT \"title\", \"accession_number\", \"acquired\" FROM \"collections\"", "columns": ["title", "accession_number", "acquired"], "rows": [["Profusion of Flowers", "56.257", "1956-04-12"], ["Farmers Working at Dawn", "11.6152", "1911-08-03"], ["Spring Outing", "14.76", "1914-01-08"], ["Imaginative Landscape", "56.496", null], ["Peonies and Butterfly", "06.1899", "1906-01-01"]]}]}}, {"id": "M3-E06", "title": "From an imported CSV into the real table", "origin": "source-demo", "concepts": ["C3.3", "C3.4"], "difficulty": 3, "skills": ["INSERT INTO ... SELECT", "NULLIF", "DROP TABLE"], "db": "mfa", "kind": "modify", "setup": "DELETE FROM \"created\"; DELETE FROM \"collections\";\n-- What `.import --csv mfa_noid.csv temp` produces: every value is TEXT, and blanks are '' (not NULL)\nCREATE TABLE \"temp\" (\"title\" TEXT, \"accession_number\" TEXT, \"acquired\" TEXT);\nINSERT INTO \"temp\" VALUES\n  ('Profusion of Flowers', '56.257', '1956-04-12'),\n  ('Farmers Working at Dawn', '11.6152', '1911-08-03'),\n  ('Spring Outing', '14.76', '1914-01-08'),\n  ('Imaginative Landscape', '56.496', ''),\n  ('Peonies and Butterfly', '06.1899', '1906-01-01');\n", "prompt": "You imported `database/csv/mfa_noid.csv` (no id column) into a new table `temp`, as in the lecture.\n1. Copy all of its rows into `collections` so that SQLite generates the ids. Turn the empty-string acquisition date into a real `NULL` while copying.\n2. Drop `temp`.\n", "hints": ["`INSERT INTO table (cols) SELECT cols FROM other;` inserts a query's result. The columns must line up.", "`NULLIF(x, '')` returns NULL when x is t g outing, but WHERE the acquired date-- sorry,\n 736  the \"acquired\" date IS NULL semicolon.\n 737  I could also use is NOT NULL--\n 738  WHERE \"acquired\" IS NOT NULL, but that would delete all the pieces of artwork\n 739  that actually have an acquired date.\n 740  Here, I want to leave only those that do not have an acquired date.\n 741  So I'll say where \"acquired\" IS NULL.\n 742  Now, I'll hit Enter, nothing seems to happen,\n 743  but I'll say Select [? star ?] FROM \"collections\" semicolon.\n 744  And I'll see that piece of artwork is now gone.\n 745  I only have those that have an acquired date."}], "origin_label": "SOURCE · demonstrated in the lecture", "expected": {"checks": [{"query": "SELECT \"title\" FROM \"collections\"", "columns": ["title"], "rows": [["Farmers Working at Dawn"], ["Profusion of Flowers"], ["Spring Outing"]]}, {"query": "SELECT * FROM \"created\"", "columns": ["artist_id", "collection_id"], "rows": [[3, 1], [2, 3], [2, 4]]}]}}, {"id": "M3-E09", "title": "Delete an artist the two-step way", "origin": "source-demo", "concepts": ["C3.5", "C3.6", "C1.4"], "difficulty": 3, "skills": ["DELETE", "subquery", "FOREIGN KEY"], "db": "mfa", "kind": "modify", "setup": "-- rebuild \"created\" WITHOUT ON DELETE CASCADE (the first version in the lecture)\nDROP TABLE \"created\";\nCREATE TABLE \"created\" (\n    \"artist_id\" INTEGER, \"collection_id\" INTEGER,\n    FOREIGN KEY(\"artist_id\") REFERENCES \"artists\"(\"id\"),\n    FOREIGN KEY(\"collection_id\") REFERENCES \"collections\"(\"id\")\n);\nINSERT INTO \"created\" VALUES (1, 2), (3, 1), (2, 3), (2, 4);\n", "prompt": "Remove **Unidentified artist** completely. `created` has no ON DELETE action here, so deleting the artist first fails.\nDo it in the right order, and **don't hard-code the artist's id**.\n", "hints": ["First remove what *references* the artist, then the artist.", "Find the id with a subquery on `artists`.", "`DELETE FROM \"created\" WHERE \"artist_id\" = (SELECT \"id\" FROM \
