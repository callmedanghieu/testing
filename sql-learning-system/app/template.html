<script>
"use strict";
const DATA = /*__DATA__*/null;
const MODS = DATA.modules;
const MOD = Object.fromEntries(MODS.map(m => [m.id, m]));
const ITEMS = Object.fromEntries(DATA.exercises.concat(DATA.debugging).map(e => [e.id, e]));
const ORDERED = DATA.exercises.concat(DATA.debugging);
const view = document.getElementById("view");
let E = null; // grading engine, set once sql.js loads

/* ---------- storage (per-viewer convenience; never required) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("sqlline:" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("sqlline:" + k, JSON.stringify(v)); } catch (e) {} }
};
let P = store.get("progress", { items: {}, cards: {} });
const saveP = () => { store.set("progress", P); paintRail(); };
const st = id => (P.items[id] = P.items[id] || {});
const isDone = id => !!(P.items[id] && (P.items[id].passed || P.items[id].selfDone));
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- tiny helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const h = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content; };
const modColor = m => `var(--m${m[1]})`;
const stars = n => "★".repeat(n);
function inline(s) {
  const codes = [];
  let t = String(s).replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = esc(t);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
  t = t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<span title="$2">$1</span>');
  return t.replace(/\u0000(\d+)\u0000/g, (m, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function md(src) {
  const lines = String(src).replace(/<!--[\s\S]*?-->/g, "").split("\n");
  let out = [], i = 0;
  while (i < lines.length) {
    let l = lines[i];
    if (/^```/.test(l)) {
      const lang = l.slice(3).trim(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(lang === "mermaid" ? `<pre class="mermaid">${esc(buf.join("\n"))}</pre>` : `<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    if (/^#{1,4} /.test(l)) { const n = l.match(/^#+/)[0].length; out.push(`<h${n + 1}>${inline(l.slice(n + 1))}</h${n + 1}>`); i++; continue; }
    if (/^---\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\|/.test(l) && i + 1 < lines.length && /^\|[\s:-]+\|/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => inline(c.trim().replace(/\\\|/g, "|")));
      const head = cells(l); i += 2; const body = [];
      while (i < lines.length && /^\|/.test(lines[i])) body.push(cells(lines[i++]));
      out.push(`<div class="tablewrap"><table><thead><tr>${head.map(c => `<th>${c}</th>`).join("")}</tr></thead><tbody>${body.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (/^> ?/.test(l)) { const buf = []; while (i < lines.length && /^> ?/.test(lines[i])) buf.push(lines[i++].replace(/^> ?/, "")); out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`); continue; }
    if (/^\s*([-*]|\d+\.) /.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const buf = [];
      while (i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i])) { let item = lines[i++].replace(/^\s*([-*]|\d+\.) /, ""); while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.) /.test(lines[i])) item += " " + lines[i++].trim(); buf.push(item); }
      out.push(`<${ordered ? "ol" : "ul"}>${buf.map(x => `<li>${inline(x.replace(/^\[ \] /, "☐ "))}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [l]; i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,4} |```|\||> |\s*([-*]|\d+\.) |---)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}
function resultTable(res, limit = 200) {
  if (res.error) return `<div class="feedback bad"><b>Error.</b> ${esc(res.error)}</div>`;
  if (!res.columns) return `<p class="muted small">Statement ran. No result set${res.notes && res.notes.length ? " (errors along the way: " + esc(res.notes.join("; ")) + ")" : ""}.</p>`;
  const rows = res.rows || [];
  const body = rows.slice(0, limit).map(r => "<tr>" + r.map(v => v === null ? `<td class="null">NULL</td>` : `<td>${esc(v)}</td>`).join("") + "</tr>").join("");
  return `<div class="tablewrap"><table><thead><tr>${res.columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="muted small">${rows.length} row${rows.length === 1 ? "" : "s"}${rows.length > limit ? `, first ${limit} shown` : ""}</p>`;
}
function expectedHtml(ex) {
  const o = ex.expected;
  if (!o) return "<p class='muted'>Self-check item.</p>";
  if (o.checks) return "<p class='small muted'>After your SQL, the checker runs these and compares them with the reference:</p>" + o.checks.map(c =>
    `<p class="small"><code>${esc(c.query)}</code></p>` + (c.plan ? `<pre>${esc(c.plan)}</pre>` : resultTable({ columns: c.columns, rows: c.rows }))).join("");
  if (o.error && !(o.rows && o.rows.length)) return `<p>The statement must fail with:</p><pre>${esc(o.error)}</pre>`;
  return resultTable(o);
}
function sourceHtml(refs) {
  return refs.map(r => `<details class="src"><summary>Source: <b>${esc(r.file)} L${esc(r.lines)}</b>${r.quote ? ` · “${esc(r.quote)}”` : ""}</summary><pre class="excerpt">${esc(r.text || "")}</pre></details>`).join("");
}
const originBadge = e => e.origin === "generated"
  ? `<span class="badge gen" title="${esc(e.origin_label)}">Generated</span>`
  : `<span class="badge src" title="${esc(e.origin_label)}">Source · ${esc(e.origin.replace("source-", ""))}</span>`;
function itemState(id) {
  const s = P.items[id] || {};
  if (s.passed) return `<span class="state done">✔ solved${s.sawSolution ? " · saw solution" : s.hints ? ` · ${s.hints} hint${s.hints > 1 ? "s" : ""}` : ""}</span>`;
  if (s.selfDone) return `<span class="state done">✔ self-checked</span>`;
  if (s.attempts) return `<span class="state">${s.attempts} attempt${s.attempts > 1 ? "s" : ""}</span>`;
  return `<span class="state muted">new</span>`;
}

/* ---------- rail ---------- */
const YARD = [["debug", "Debugging yard"], ["review", "Review"], ["sandbox", "Sandbox"], ["sources", "Source map"], ["errata", "Errata & notes"], ["roadmap", "Roadmap"], ["backup", "Progress backup"]];
function modCounts(m) {
  const ids = ORDERED.filter(e => e.module === m).map(e => e.id);
  return [ids.filter(isDone).length, ids.length];
}
function dueCards() { return DATA.review.filter(c => P.cards[c.id] && P.cards[c.id].due <= today()); }
function paintRail() {
  const cur = location.hash.slice(1) || "home";
  document.getElementById("line").innerHTML = MODS.map(m => {
    const [d, n] = modCounts(m.id);
    const on = cur === m.id || (ITEMS[cur] && ITEMS[cur].module === m.id);
    return `<li><button class="stop" style="--c:${modColor(m.id)}" data-go="${m.id}" aria-current="${on}">
      <span class="dot ${d === n ? "full" : ""}"></span><span><span class="nm">${m.id} · ${esc(m.title.replace(" (prerequisite)", ""))}</span><span class="meta">${d}/${n} done</span></span></button></li>`;
  }).join("");
  const due = dueCards().length;
  document.getElementById("yard").innerHTML = YARD.map(([k, label]) =>
    `<button data-go="${k}" aria-current="${cur === k}"><span>${label}</span>${k === "review" && due ? `<span class="pill">${due} due</span>` : ""}</button>`).join("");
  const all = ORDERED.length, done = ORDERED.filter(e => isDone(e.id)).length;
  document.getElementById("pill-progress").textContent = `${done} / ${all} done`;
  document.getElementById("pill-due").textContent = due ? `${due} review${due > 1 ? "s" : ""} due` : "no reviews due";
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-go]");
  if (b) { ev.preventDefault(); go(b.dataset.go); }
});
function go(token) { if (location.hash.slice(1) === token) route(); else location.hash = token; }
window.addEventListener("hashchange", route);

function renderModule(m, tab) {

  let body = "";
  if (tab === "lesson") body = `<article class="prose">${md(mod.lesson_md)}</article>`;
  if (tab === "practice" || tab === "debug") {
    const src = tab === "practice" ? DATA.exercises : DATA.debugging;
    body = `<div class="list">` + src.filter(e => e.module === m).map(e => `<button class="row" data-go="${e.id}">
      <span class="line-chip" style="--c:${modColor(m)}">${e.id.split("-")[1]}</span>
      <span><span class="t">${esc(e.title)}</span><br><span class="s">${originBadge(e)} <span class="stars">${stars(e.difficulty)}</span> · ${esc(e.concepts.join(", "))}${e.bug_type ? " · bug: ?" : ""}${e.engine ? " · " + e.engine : ""}</span></span>
      ${itemState(e.id)}</button>`).join("") + `</div>`;
  }
  if (tab === "review") body = deckHtml(DATA.review.filter(c => c.module === m), m);
  if (tab === "plan") body = `<div class="prose"><p><b>Source:</b> ${esc(mod.sources)} · <b>Prerequisites:</b> ${esc(mod.prerequisites.join(", "))}</p>
    <h3>Learning objectives</h3><ul>${mod.objectives.map(o => `<li>${inline(o)}</li>`).join("")}</ul>
    <h3>Challenge exercises</h3><ul>${mod.challenge.map(c => `<li><a href="#${c}">${c} · ${esc(ITEMS[c].title)}</a> ${isDone(c) ? "✔" : ""}</li>`).join("")}</ul>
    <h3>Mastery criteria</h3><ul>${mod.mastery.map(x => `<li>☐ ${inline(x)}</li>`).join("")}</ul></div>`;
  view.innerHTML = `<p class="crumb"><span class="line-chip" style="--c:${modColor(m)}">${m}</span> Station</p>
    <h1 style="margin-top:4px">${esc(mod.title)}</h1>
    <div class="tabs" role="tablist" style="--c:${modColor(m)}">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" data-tab="${k}">${l}</button>`).join("")}</div>

function renderItem(id) {
  const e = ITEMS[id], s = st(id), m = e.module, isDbg = id.startsWith("D");
  const exec = !(e.kind === "selfcheck" && e.engine);
  const draftKey = "draft:" + id;
  const initial = store.get(draftKey, e.kind === "injection" ? "" : (e.broken ? e.broken.trim() + "\n" : ""));
  const list = ORDERED.filter(x => x.module === m && x.id.startsWith(isDbg ? "D" : "M"));
  const pos = list.findIndex(x => x.id === id), next = list[pos + 1] || ORDERED[ORDERED.indexOf(e) + 1];
  view.innerHTML = `
  <p class="crumb"><span class="line-chip" style="--c:${modColor(m)}">${m}</span> <button data-go="${m}">${esc(MOD[m].title)}</button> › ${isDbg ? "Debugging" : "Practice"} ${pos + 1}/${list.length}</p>
  <h2 style="margin-top:4px">${esc(e.id)} · ${esc(e.title)}</h2>
  <p>${originBadge(e)} <span class="stars" title="difficulty">${stars(e.difficulty)}</span>
    ${e.concepts.map(c => `<span class="chip" title="${esc((DATA.concepts[c] || {}).name || "")}">${c} ${esc((DATA.concepts[c] || {}).name || "")}</span>`).join("")}
    <span class="chip">dataset: ${esc(e.db || "empty")}</span>${e.engine ? `<span class="chip">engine: ${e.engine}</span>` : ""}</p>
  <section class="panel prompt">${md(e.prompt)}
    ${e.template ? `<p class="small">Query the site builds: <code>${esc(e.template)}</code></p>` : ""}
    ${sourceHtml(e.source)}
    ${e.setup ? `<details class="src"><summary>Setup run before your SQL</summary><pre>${esc(e.setup)}</pre></details>` : ""}
    <details class="src" id="schema"><summary>Schema of this dataset</summary><div id="schemabody" class="small muted">Open to load…</div></details>
  </section>
  <div class="bench">
    ${e.kind === "injection"
      ? `<label class="out-label" for="ed">Your input (replaces &lt;your input&gt;)</label><input class="inj" id="ed" value="${esc(initial)}" autocomplete="off" spellcheck="false">`
      : `<label class="out-label" for="ed">${e.kind === "selfcheck" ? (exec ? "Your answer: notes or SQL (Run executes it on SQLite)" : `Your answer (${e.engine} SQL; it can't run in the browser)`) : "Your SQL"}</label>
         <textarea class="sql" id="ed" spellcheck="false">${esc(initial)}</textarea>`}
    <div class="tools">
      ${exec ? `<button class="btn" id="run">Run</button>` : ""}
      ${e.kind !== "selfcheck" ? `<button class="btn primary" id="check">Check</button>` : `<button class="btn go" id="selfdone">${s.selfDone ? "Marked done ✔" : "Mark as done"}</button>`}
      <button class="btn" id="hint">Hint (${Math.min(s.hints || 0, 3)}/3)</button>
      ${e.kind !== "selfcheck" ? `<button class="btn" id="expected">Show expected</button>` : ""}
      <button class="btn" id="solution">${e.kind === "selfcheck" ? "Compare with reference" : "Solution"}</button>
      <button class="btn" id="reset">Reset</button>
      ${exec ? `<span class="kbd">Ctrl+Enter run${e.kind !== "selfcheck" ? " · Ctrl+Shift+Enter check" : ""}</span>` : ""}
    </div>
    <div id="hints" class="list"></div>
    <div id="fb"></div>
    <div id="out"></div>
    <div id="extra"></div>
  </div>
  <p style="margin-top:22px">${next ? `<button class="btn" data-go="${next.id}">Next: ${esc(next.id)} · ${esc(next.title)} →</button>` : ""}</p>`;
  const ed = document.getElementById("ed");
  const get = () => ed.value;
  ed.addEventListener("input", () => store.set(draftKey, get()));
  if (ed.tagName === "TEXTAREA") ed.addEventListener("keydown", ev => {
    if (ev.key === "Tab" && !ev.shiftKey) { ev.preventDefault(); const a = ed.selectionStart; ed.setRangeText("    ", a, ed.selectionEnd, "end"); }
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); (ev.shiftKey ? document.getElementById("check") : document.getElementById("run"))?.click(); }
  });
  const out = document.getElementById("out"), fb = document.getElementById("fb"), extra = document.getElementById("extra");
  const showHints = () => {
    const n = Math.min(s.hints || 0, 3), labels = ["Direction", "Technique", "Structure"];
    document.getElementById("hints").innerHTML = e.hints.slice(0, n).map((x, i) => `<div class="hint"><b>Hint ${i + 1} · ${labels[i]}.</b> ${inline(x)}</div>`).join("");
    document.getElementById("hint").textContent = n >= 3 ? "No more hints" : `Hint (${n}/3)`;
    document.getElementById("hint").disabled = n >= 3;
  };
  showHints();
  const solved = () => {
    extra.innerHTML = (e.explanation ? `<div class="panel" style="margin-top:6px"><b>Why it works.</b> ${md(e.explanation)}</div>` : "") +
      (e.diagnosis ? `<div class="panel" style="margin-top:6px"><b>Diagnosis</b> <span class="chip">bug type: ${esc(e.bug_type)}</span> ${md(e.diagnosis)}</div>` : "");
  };
  if (s.passed) { fb.innerHTML = `<div class="feedback ok">✔ You solved this already. Feel free to try again.</div>`; solved(); }
  const runBtn = document.getElementById("run");
  if (runBtn) runBtn.onclick = () => {
    const sql = e.kind === "injection" ? e.template.replace("{input}", get().trim()) : get();
    const db = E.prepare(e);
    try {
      const res = E.runScript(db, sql, !!e.continue_on_error);
      out.innerHTML = `<p class="out-label">Your result${e.kind === "injection" ? ` · ran <code>${esc(sql)}</code>` : ""}</p>` + resultTable(res) +
        (res.notes && res.notes.length && res.columns ? `<p class="small muted">Errors along the way: ${esc(res.notes.join("; "))}</p>` : "");
    } finally { db.close(); }
  };
  const chk = document.getElementById("check");
  if (chk) chk.onclick = () => {
    s.attempts = (s.attempts || 0) + 1;
    const [ok, msg] = E.evaluate(e, get());
    if (ok) { s.passed = true; s.passedAt = today(); }
    saveP();
    fb.innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}">${ok ? "✔ " : "✘ "}${esc(msg)}${ok ? "" : ` <span class="muted">Attempt ${s.attempts}. Run your SQL to inspect it, or take a hint.</span>`}</div>`;
    if (ok) solved();
    if (runBtn && (e.kind === "query" || e.kind === "injection")) runBtn.click();
    document.getElementById("solution").disabled = false;
  };
  const sd = document.getElementById("selfdone");
  if (sd) sd.onclick = () => { s.selfDone = !s.selfDone; saveP(); sd.textContent = s.selfDone ? "Marked done ✔" : "Mark as done"; };
  document.getElementById("hint").onclick = () => { s.hints = Math.min((s.hints || 0) + 1, 3); saveP(); showHints(); document.getElementById("solution").disabled = false; };
  const armed = (btn, label, fn) => {
    btn.onclick = () => {
      if (!btn.classList.contains("armed")) { btn.classList.add("armed"); btn.dataset.l = btn.textContent; btn.textContent = label; return; }
      btn.classList.remove("armed"); btn.textContent = btn.dataset.l; fn();
    };
  };
  const exp = document.getElementById("expected");
  if (exp) armed(exp, "Sure? Click again", () => { out.innerHTML = `<p class="out-label">Expected</p>` + expectedHtml(e); });
  const sol = document.getElementById("solution");
  const triedEnough = () => (s.attempts || 0) > 0 || (s.hints || 0) >= 3 || e.kind === "selfcheck" || s.passed;
  if (!triedEnough()) { sol.disabled = true; sol.title = "Check an attempt or use all hints first"; }
  armed(sol, e.kind === "selfcheck" ? "Reveal the reference?" : "Reveal? Click again", () => {
    if (!s.passed) { s.sawSolution = true; saveP(); }
    out.innerHTML = `<p class="out-label">Reference ${e.kind === "injection" ? "input" : "solution"}</p><pre><code>${esc(e.solution)}</code></pre>`; solved();
  });
  document.getElementById("reset").onclick = () => { ed.value = e.kind === "injection" ? "" : (e.broken ? e.broken.trim() + "\n" : ""); store.set(draftKey, ed.value); out.innerHTML = fb.innerHTML = ""; };
  document.getElementById("schema").addEventListener("toggle", function () {
    if (!this.open) return;
    const db = E.prepare(e);
    try {
      const r = db.exec(`SELECT "type", "name", "sql" FROM sqlite_master WHERE "sql" IS NOT NULL ORDER BY "type" DESC, "name"`);
      document.getElementById("schemabody").innerHTML = r.length ? `<pre>${esc(r[0].values.map(v => v[2] + ";").join("\n\n"))}</pre>` : "<p>(empty database)</p>";
    } finally { db.close(); }
  });
}

/* ---------- review ---------- */
const INTERVALS = { again: 1, hard: 3, good: 7, easy: 14 };
let deck = [], deckPos = 0, deckLabel = "";
function deckHtml(cards, label) {
  deck = cards; deckPos = 0; deckLabel = label;
  return `<div id="deck" class="panel card"></div>`;
}
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
function wireDeck() {
  const box = document.getElementById("deck");
  if (!box) return;
  if (!deck.length) { box.innerHTML = "<p>No cards here. Nothing is due. Pick a module deck instead.</p>"; return; }
  if (deckPos >= deck.length) { box.innerHTML = `<p><b>Deck finished.</b> Your ratings set each card's next review date.</p><button class="btn" id="again">Go through again</button>`; document.getElementById("again").onclick = () => { deckPos = 0; wireDeck(); }; return; }
  const c = deck[deckPos], ref = c.ref && ITEMS[c.ref];
  const kinds = { quick: "Quick review", concept: "Concept check", predict: "Predict the output", debug: "Debugging", write: "Query writing" };
  let body = "";
  if (c.type === "quick") body = `<div class="prompt">${md(c.front)}</div><button class="btn" id="reveal">Reveal answer</button><div id="ans" hidden>${md(c.back)}</div>`;
  if (c.type === "concept" || c.type === "predict") {
    body = (c.type === "predict" ? `<p class="small muted">Dataset <code>${esc(c.db || "empty")}</code>${c.setup ? ", after this setup:" : ":"}</p>${c.setup ? `<pre><code>${esc(c.setup)}</code></pre>` : ""}<pre><code>${esc(c.sql)}</code></pre><p>What is printed?</p>` : `<div class="prompt">${md(c.question)}</div>`) +
      `<div class="choices">${c.choices.map((ch, i) => `<button data-i="${i}">${String.fromCharCode(65 + i)}. ${c.type === "predict" ? `<code>${esc(ch)}</code>` : inline(ch)}</button>`).join("")}</div><div id="ans" hidden></div>`;
  }
  if (c.type === "debug" || c.type === "write") body = `<p>Solve <b>${esc(ref.id)} · ${esc(ref.title)}</b> without hints, then rate yourself.</p><button class="btn" data-go="${ref.id}">Open ${esc(ref.id)}</button><div id="ans"></div>`;
  box.innerHTML = `<p class="out-label">${esc(kinds[c.type])} · card ${deckPos + 1}/${deck.length} · ${esc(c.id)}</p>${body}
    ${c.source && c.source.length ? sourceHtml(c.source) : ""}
    <div class="rate" id="rate" ${c.type === "quick" || c.type === "concept" || c.type === "predict" ? "hidden" : ""}><span class="small muted">How well did you know it?</span>
    ${Object.keys(INTERVALS).map(k => `<button class="btn" data-rate="${k}">${k[0].toUpperCase() + k.slice(1)}</button>`).join("")}</div>`;
  const rate = document.getElementById("rate"), ans = document.getElementById("ans");
  const rv = document.getElementById("reveal");
  if (rv) rv.onclick = () => { ans.hidden = false; rate.hidden = false; rv.remove(); };
  box.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    box.querySelectorAll(".choices button").forEach(x => { x.disabled = true; if (+x.dataset.i === c.answer) x.classList.add("right"); });
    if (i !== c.answer) b.classList.add("wrong");
    ans.hidden = false;
    ans.innerHTML = `<div class="feedback ${i === c.answer ? "ok" : "bad"}">${i === c.answer ? "✔ Right." : "✘ Not quite."} ${inline(c.why)}</div>` +
      (c.type === "predict" ? `<p><button class="btn" id="runit">Run it and see</button></p><div id="runout"></div>` : "");
    const ri = document.getElementById("runit");
    if (ri) ri.onclick = () => { const db = E.freshDb(c.db); try { if (c.setup) db.exec(c.setup); document.getElementById("runout").innerHTML = resultTable(E.runScript(db, c.sql)); } finally { db.close(); } };
    rate.hidden = false;
  });
  box.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => {
    const k = b.dataset.rate, prev = P.cards[c.id];
    const interval = k === "again" || !prev ? INTERVALS[k] : Math.max(INTERVALS[k], prev.interval * 2);
    P.cards[c.id] = { interval, due: addDays(interval), last: k };
    saveP(); deckPos++; wireDeck();
  });
}

  const ed = document.getElementById("sbx"), sel = document.getElementById("dsel");

  document.getElementById("srun").onclick = () => { store.set("sandbox:sql", ed.value); store.set("sandbox:db", sel.value); run(ed.value); };

function renderSources() {
  const files = { lecture2: "Designing", lecture3: "Writing", lecture4: "Viewing", lecture5: "Optimizing", lecture6: "Scaling" };
  const byFile = {};
  for (const [cid, c] of Object.entries(DATA.concepts)) for (const r of c.refs) (byFile[r.file] = byFile[r.file] || []).push([+r.lines.split("-")[0], `<b>${cid}</b> ${esc(c.name)}`, r.lines, null]);
  for (const e of ORDERED) for (const r of e.source) (byFile[r.file] = byFile[r.file] || []).push([+r.lines.split("-")[0], `${esc(e.id)} ${esc(e.title)} ${originBadge(e)}`, r.lines, e.id]);
  view.innerHTML = `<h1>Source map</h1><p class="prose">Where every concept and practice item comes from in your transcripts (line numbers refer to the uploaded <code>.txt</code> files).
  Concepts come from <code>curriculum/knowledge_map.md</code>. Each practice item shows its excerpt on its own page.</p>` +
    Object.entries(files).map(([f, t]) => `<h3>${f} · ${t}</h3><div class="tablewrap"><table><thead><tr><th>Lines</th><th>Concept / item</th></tr></thead><tbody>${(byFile[f] || []).sort((a, b) => a[0] - b[0]).map(([, label, lines, id]) =>
      `<tr><td>L${esc(lines)}</td><td>${id ? `<a href="#${id}">${label}</a>` : label}</td></tr>`).join("")}</tbody></table></div>`).join("");
}
function renderBackup() {
  view.innerHTML = `<h1>Progress backup</h1><p class="prose">Your progress lives in this browser only. Copy it somewhere safe, or paste a backup to restore it (it also works with <code>progress/progress.json</code> from the terminal trainer).</p>
  <textarea class="backup" id="bk" spellcheck="false">${esc(JSON.stringify(P))}</textarea>
  <div class="tools"><button class="btn" id="cp">Copy</button><button class="btn" id="rs">Restore from the box</button><span id="bmsg" class="small"></span></div>`;
  const msg = t => document.getElementById("bmsg").textContent = t;
  document.getElementById("cp").onclick = () => { const t = document.getElementById("bk"); (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).then(() => msg("Copied."), () => { t.select(); msg("Selected. Press Ctrl+C to copy."); }); };
  document.getElementById("rs").onclick = () => { try { const v = JSON.parse(document.getElementById("bk").value); const fromCli = v.items && Object.values(v.items).some(x => "passed_on" in x || "saw_solution" in x || "self_done" in x);
    if (fromCli) for (const x of Object.values(v.items)) { x.sawSolution = x.saw_solution; x.selfDone = x.self_done; }
    P = { items: v.items || {}, cards: v.cards || {} }; saveP(); msg("Restored."); } catch (e) { msg("That isn't valid progress JSON."); } };
}
function route() {
  const t = location.hash.slice(1) || "home";
  if (!E) return;
  if (MOD[t]) renderModule(t);
  else if (ITEMS[t]) renderItem(t);
  else if (t === "review") renderReview();
  else if (t === "debug") renderDebugIndex();
  else if (t === "sandbox") renderSandbox();
  else if (t === "sources") renderSources();
  else if (t === "errata") view.innerHTML = `<article class="prose">${md(DATA.errata_md)}</article>`;
  else if (t === "roadmap") view.innerHTML = `<article class="prose">${md(DATA.roadmap_md)}</article>`;
  else if (t === "backup") renderBackup();
  else renderHome();
  paintRail();
  window.scrollTo(0, 0);
}
paintRail();
if (typeof initSqlJs !== "function") {
  view.innerHTML = `<div class="feedback bad">The SQLite engine (vendor/sql-asm.js) did not load. Open this page from the <code>app/</code> folder so that <code>vendor/sql-asm.js</code> is next to it.</div>`;
} else {
  initSqlJs().then(SQL => { E = SQLEngine.make(SQL, DATA.datasets); route(); })
    .catch(err => { view.innerHTML = `<div class="feedback bad">Could not start SQLite: ${esc(err.message || err)}</div>`; });
}
</script>
