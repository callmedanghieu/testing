- id: D1-06
  module: M1
  title: no such table
  bug_type: syntax
  origin: source-demo
  concepts: [C1.4]
  difficulty: 1
  db: longlist
  kind: query
  prompt: The lecturer's first attempt to find MacLehose Press's id fails. Read the error and fix it.
  broken: |
    SELECT "id" FROM "publisher" WHERE "publisher" = 'MacLehose Press';
  hints:
    - The error message names the problem precisely.
    - Run `SELECT "name" FROM sqlite_master WHERE "type" = 'table';` to list the table names.
    - The table is plural.
