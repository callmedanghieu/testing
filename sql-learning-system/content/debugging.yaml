- id: D3-02
  module: M3
  title: Deleting from the wrong table
  bug_type: logic
  origin: source-demo
  concepts: [C3.5, C3.6]
  difficulty: 2
  db: mfa
  kind: modify
  setup: |
    DROP TABLE "created";
    CREATE TABLE "created" ("artist_id" INTEGER, "collection_id" INTEGER,
      FOREIGN KEY("artist_id") REFERENCES "artists"("id"),
      FOREIGN KEY("collection_id") REFERENCES "collections"("id"));
    INSERT INTO "created" VALUES (1, 2), (3, 1), (2, 3), (2, 4);
  prompt: |
    Step 1 of removing Unidentified artist: delete their *affiliations*. The lecturer's first attempt (below) errors.
  broken: |
    DELETE FROM "artists" WHERE "artist_id" = (
        SELECT "id" FROM "artists" WHERE "name" = 'Unidentified artist'
    );
  hints:
    - Read the error. Which table actually has an `artist_id` column?
    - Affiliations live in the junction table.
    - "`DELETE FROM \"created\" WHERE \"artist_id\" = (...)`"
  solution: |
    DELETE FROM "created" WHERE "artist_id" = (
        SELECT "id" FROM "artists" WHERE "name" = 'Unidentified artist'
    );
  check:
    - SELECT * FROM "created"
    - SELECT * FROM "artists"
  diagnosis: |
    The lecturer catches this live. The error `no such column: artist_id` points straight at the wrong table.
  source:
    - {file: lecture3, lines: "947-961", quote: "What I should do instead is delete from the created table."}

- id: D3-03
  module: M3
  title: An UPDATE that re-attributed everything
  bug_type: logic
  origin: generated
  concepts: [C3.7]
  difficulty: 2
  db: mfa
  kind: modify
