- id: D5-01
  module: M5
  title: An index with the columns backwards
  bug_type: performance
  origin: generated
  concepts: [C5.3]
  difficulty: 3
  db: movies
  kind: modify
  setup: |
    CREATE INDEX "name_index" ON "people" ("name");
  prompt: |
    Meant to give the Tom Hanks query a covering index on `stars`, but EXPLAIN QUERY PLAN shows it can't **search** with it. Fix the index.
  broken: |
    CREATE INDEX "person_index" ON "stars" ("movie_id", "person_id");
  hints:
    - A multi-column index is sorted by its first column, then by the second.
    - The query filters on `person_id`. Can a list sorted by movie_id be searched by person_id?
    - Put the filter column first, `("person_id", "movie_id")`.
  solution: |
    CREATE INDEX "person_index" ON "stars" ("person_id", "movie_id");
  check:
    - plan: SELECT "title" FROM "movies" WHERE "id" IN (SELECT "movie_id" FROM "stars" WHERE "person_id" = (SELECT "id" FROM "people" WHERE "name" = 'Tom Hanks'))
      contains: ["SEARCH stars USING COVERING INDEX person_index"]
  diagnosis: Column order in an index matters. The leading column(s) must match the WHERE clause.
  source:
    - {file: lecture5, lines: "507-517", quote: "Let's also include in this case, the movie ID column like this."}

- id: D5-02
  module: M5
  title: An index nobody uses
  bug_type: performance
  origin: generated
  concepts: [C5.2]
  difficulty: 2
  db: movies
  kind: modify
  prompt: The 'Cars' lookup is still a SCAN after creating this index. Create the index that fixes it.
  broken: |
    CREATE INDEX "year_index" ON "movies" ("year");
  hints:
    - Run EXPLAIN QUERY PLAN on `SELECT * FROM "movies" WHERE "title" = 'Cars';`
    - An index only helps queries that filter (or sort) on its columns.
    - Index `title`.
  solution: |
    CREATE INDEX "title_index" ON "movies" ("title");
  check:
    - plan: SELECT * FROM "movies" WHERE "title" = 'Cars'
      contains: ["USING INDEX title_index"]
  diagnosis: Every index costs space and write time (lecture5 L548-561, L852-861), so build only the ones your queries use.
  source:
    - {file: lecture5, lines: "273-278", quote: "I should probably include the Title column in this index"}

- id: D5-03
  module: M5
  title: A partial index that doesn't match the query
  bug_type: performance
  origin: generated
  concepts: [C5.5]
  difficulty: 3
  db: movies
  kind: modify
  prompt: |
    Searching this year's titles should use a partial index. The query is `SELECT "title" FROM "movies" WHERE "year" = 2023;`.
    The index below isn't used. Write one that is (name it `recents`).
  broken: |
    CREATE INDEX "recents" ON "movies" ("title") WHERE "year" = 2022;
  hints:
    - SQLite can use a partial index only when the query's WHERE implies the index's WHERE.
    - Does `year = 2023` imply `year = 2022`?
    - Make the index condition match the query.
  solution: |
    CREATE INDEX "recents" ON "movies" ("title") WHERE "year" = 2023;
  check:
    - plan: SELECT "title" FROM "movies" WHERE "year" = 2023
      contains: ["recents"]
  diagnosis: A partial index is a bet on which rows people query. Make it match the real query.
  source:
    - {file: lecture5, lines: "917-924", quote: "because my WHERE clause included 2023"}

- id: D5-04
  module: M5
  title: A transfer that created money
  bug_type: transaction
  origin: source-demo
  concepts: [C5.7]
  difficulty: 3
  db: bank
  kind: modify
  continue_on_error: true
  require: [BEGIN, ROLLBACK]
  setup: |
    UPDATE "accounts" SET "balance" = 0 WHERE "id" = 1;
    UPDATE "accounts" SET "balance" = 30 WHERE "id" = 2;
  prompt: |
    Alice ($0) "pays" Bob $10. The debit fails its CHECK, but Bob keeps the $10, so the bank now holds $70 instead of $60.
    Rewrite it so a failure leaves both balances untouched. (Statements keep running after an error here.)
  broken: |
    UPDATE "accounts" SET "balance" = "balance" + 10 WHERE "id" = 2;
    UPDATE "accounts" SET "balance" = "balance" - 10 WHERE "id" = 1;
  hints:
    - Without a transaction, each statement commits on its own.
    - Group the two updates into one unit of work.
    - "`BEGIN TRANSACTION;` … both updates … then `ROLLBACK;` after the failure."
  solution: |
    BEGIN TRANSACTION;
    UPDATE "accounts" SET "balance" = "balance" + 10 WHERE "id" = 2;
    UPDATE "accounts" SET "balance" = "balance" - 10 WHERE "id" = 1;
    ROLLBACK;
  check:
    - SELECT * FROM "accounts"
  diagnosis: The lecturer hits this exact state without a transaction (lecture5 L1270-1305).
  source:
    - {file: lecture5, lines: "1285-1296", quote: "So I need to undo this but I don't have a transaction here."}

- id: D6-01
  module: M6
  title: Query built by string formatting
  bug_type: security
  origin: source-question
  concepts: [C6.8]
  difficulty: 2
  db: bank
  kind: selfcheck
  prompt: |
    This Python code is vulnerable. What input exploits it, and what is the fix?
    ```python
    account = input("Account id: ")
    rows = db.execute(f"SELECT * FROM accounts WHERE id = {account}").fetchall()
    ```
  broken: |
    -- f"SELECT * FROM accounts WHERE id = {account}"
  hints:
    - What happens if `account` is `1 UNION SELECT * FROM accounts`?
    - The input becomes SQL code. The fix is to keep code and data separate.
    - Use a placeholder and pass the value separately.
  solution: |
    -- exploit input: 1 UNION SELECT * FROM accounts      (or: 1 OR 1=1)
    -- fix (Python sqlite3):
    --   rows = db.execute("SELECT * FROM accounts WHERE id = ?", (account,)).fetchall()
    -- MySQL equivalent:
    PREPARE balance_check FROM 'SELECT * FROM accounts WHERE id = ?';
    SET @id = 1;
    EXECUTE balance_check USING @id;
  diagnosis: Formatting user input into SQL is the root cause. Placeholders (`?`) fix it. `python3 tools/labs.py injection` demonstrates both.
  source:
    - {file: lecture6, lines: "2138-2147", quote: "So is this the same reason why we"}

- id: D6-02
  module: M6
  title: A procedure cut short by the delimiter
  bug_type: syntax
  origin: source-question
  concepts: [C6.4]
  difficulty: 2
  db: null
  kind: selfcheck
  engine: mysql
  verify_setup: |
    CREATE TABLE `collections` (`id` INT AUTO_INCREMENT, `title` VARCHAR(64), `deleted` TINYINT DEFAULT 0, PRIMARY KEY(`id`));
  prompt: In the `mysql` client this fails with a syntax error near the end of the SELECT line. Why, and how do you fix it?
  broken: |
    CREATE PROCEDURE `current_collection`()
    BEGIN
        SELECT `title` FROM `collections` WHERE `deleted` = 0;
    END;
  hints:
    - Where does the client think your statement ends?
    - At the first `;`, which is in the middle of the procedure body.
    - Temporarily change the delimiter with `DELIMITER //`.
  solution: |
    DELIMITER //
    CREATE PROCEDURE `current_collection`()
    BEGIN
        SELECT `title` FROM `collections` WHERE `deleted` = 0;
    END//
    DELIMITER ;
  diagnosis: The client splits statements at the delimiter before the server sees them. SQLite's shell recognises trigger bodies automatically, but the MySQL client doesn't.
  source:
    - {file: lecture6, lines: "1049-1063", quote: "So a workaround is to temporarily declare a different delimiter."}
