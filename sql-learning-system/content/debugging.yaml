# Debugging & error training (Phase 11).
# Each item starts from a BROKEN query (prefilled in the trainer). Your job: diagnose, then fix.
# The checker grades the fixed version exactly like a normal exercise.
# tests/test_system.py proves every `broken` query really is wrong (it errors, or it fails the check).
# Bug types: syntax, logic, join, duplicates, aggregation, null, design, subquery, trigger, performance, transaction, security
# No window-function items: the source material never covers window functions (see curriculum/roadmap.md#gaps).

- id: D0-01
  module: M0
  title: The NULL that never matches
  bug_type: "null"
  origin: generated
  concepts: [C0.6]
  difficulty: 1
  db: longlist0
  kind: query
  prompt: This should list the books that have no translator. It returns nothing.
  broken: |
    SELECT "title" FROM "longlist" WHERE "translator" = NULL;
  hints:
    - What is the result of `NULL = NULL` in SQL? Is it true?
    - Comparisons with NULL produce NULL (unknown), and WHERE keeps only rows where the condition is true.
    - Use the operator built for NULL tests.
  solution: |
    SELECT "title" FROM "longlist" WHERE "translator" IS NULL;
  diagnosis: "`= NULL` is never true. NULL means unknown, so use `IS NULL` / `IS NOT NULL`."
  source:
    - {file: lecture0, lines: "596-633", quote: "We could use IS NULL to figure out if a value is null."}

- id: D0-02
  module: M0
  title: AND without parentheses
  bug_type: logic
  origin: generated
  concepts: [C0.5]
  difficulty: 2
  db: longlist0
  kind: query
  prompt: Meant to list 2022 and 2023 books that are not hardcover, but hardcovers from 2022 slip through.
  broken: |
    SELECT "title", "format" FROM "longlist"
    WHERE "year" = 2022 OR "year" = 2023 AND "format" != 'hardcover';
  hints:
    - Which operator binds more tightly, AND or OR?
    - The condition is read as `year = 2022 OR (year = 2023 AND format != 'hardcover')`.
    - Put parentheses around the OR.
  solution: |
    SELECT "title", "format" FROM "longlist"
    WHERE ("year" = 2022 OR "year" = 2023) AND "format" != 'hardcover';
  diagnosis: AND is evaluated before OR. Parentheses make the grouping you mean explicit (lecture0 L528-530).
  source:
    - {file: lecture0, lines: "524-530", quote: "So here, we have these called AND, OR, and these parentheses here too."}

- id: D0-03
  module: M0
  title: A column that doesn't exist, but no error
  bug_type: syntax
  origin: source-demo
  concepts: [C0.2]
  difficulty: 2
  db: longlist0
  kind: query
  prompt: |
    This should list every book's publisher. Instead it prints the word `pubsliher` 78 times, with no error. Explain and fix it.
  broken: |
    SELECT "pubsliher" FROM "longlist";
  hints:
    - Read the identifier letter by letter.
    - When a double-quoted name matches no column, SQLite quietly treats it as a string literal.
    - Spell the column correctly.
  solution: |
    SELECT "publisher" FROM "longlist";
  diagnosis: |
    SQLite's legacy rule: a double-quoted identifier that matches no column becomes a string. The typo therefore returns the text 'pubsliher' on every row instead of an error.
    Other DBMSs would fail with "unknown column".
  source:
    - {file: lecture0, lines: "1363-1377", quote: "But that column doesn't exist so it creates this data for me."}

- id: D0-04
  module: M0
  title: Counting publishers twice
  bug_type: aggregation
  origin: source-question
  concepts: [C0.10, C0.11]
  difficulty: 1
  db: longlist0
  kind: query
  prompt: Meant to report how many **different** publishers there are. It reports one per book.
  broken: |
    SELECT COUNT("publisher") FROM "longlist";
  hints:
    - Does Fitzcarraldo Editions appear once or many times in the column?
    - Remove the duplicates before counting.
    - "`COUNT(DISTINCT \"publisher\")`"
  solution: |
    SELECT COUNT(DISTINCT "publisher") FROM "longlist";
  diagnosis: COUNT counts values (non-NULL), not distinct values. Add DISTINCT inside the parentheses.
  source:
    - {file: lecture0, lines: "1349-1357", quote: "I might double count the publisher along the way."}

- id: D1-01
  module: M1
  title: Joined on the wrong column
  bug_type: join
  origin: generated
  concepts: [C1.6]
  difficulty: 2
  db: longlist
  kind: query
  prompt: This should return Fernanda Melchor's book titles, but the titles are wrong.
  broken: |
    SELECT "title" FROM "authors"
    JOIN "authored" ON "authors"."id" = "authored"."book_id"
    JOIN "books" ON "books"."id" = "authored"."book_id"
    WHERE "name" = 'Fernanda Melchor';
  hints:
    - Read each ON clause aloud. Does it connect a primary key to the matching foreign key?
    - "`authors.id` is an *author* id. Which column of `authored` holds author ids?"
    - The first ON should use `authored.author_id`.
  solution: |
    SELECT "title" FROM "authors"
    JOIN "authored" ON "authors"."id" = "authored"."author_id"
    JOIN "books" ON "books"."id" = "authored"."book_id"
    WHERE "name" = 'Fernanda Melchor';
  diagnosis: |
    The broken query matched author id 24 with **book** id 24, which is a coincidence of numbers, not a relationship.
    Ids from different tables share values (lecture2 L310-326), so the database can't catch this. Only you can.
  source:
    - {file: lecture1, lines: "1119-1132", quote: "I have to tell SQL which two columns to try to JOIN these tables by."}
    - {file: lecture4, lines: "207-219", quote: "linking it up by looking at the authors dot ID column"}

- id: D1-02
  module: M1
  title: Duplicate rows from a one-to-many join
  bug_type: duplicates
  origin: generated
  concepts: [C1.6, C1.10]
  difficulty: 2
  db: longlist
  kind: query
  prompt: |
    Goal: the titles of 2022 books that have at least one rating, each title **once**.
    The query returns hundreds of rows.
  broken: |
    SELECT "title" FROM "books"
    JOIN "ratings" ON "ratings"."book_id" = "books"."id"
    WHERE "year" = 2022;
  hints:
    - How many rows of `ratings` match one book?
    - A JOIN outputs one row per *matching pair*, so a book with 20 ratings appears 20 times.
    - Collapse the duplicates with `DISTINCT` or `GROUP BY "books"."id"`, or use `WHERE "id" IN (SELECT "book_id" FROM "ratings")`.
  solution: |
    SELECT "title" FROM "books"
    WHERE "year" = 2022
    AND "id" IN (SELECT "book_id" FROM "ratings");
  diagnosis: Joining to the "many" side of a one-to-many relationship multiplies rows.
  source:
    - {file: lecture1, lines: "320-334", quote: "So this is an example of how we could represent"}

- id: D1-03
  module: M1
  title: One average instead of one per book
  bug_type: aggregation
  origin: generated
  concepts: [C1.10]
  difficulty: 1
  db: longlist
  kind: query
  prompt: Should return each book_id with its average rating (rounded to 2). It returns a single row.
  broken: |
    SELECT "book_id", ROUND(AVG("rating"), 2) AS "rating" FROM "ratings";
  hints:
    - Without grouping, an aggregate collapses the *whole table* into one row.
    - Which column defines "per book"?
    - Add `GROUP BY "book_id"`.
  solution: |
    SELECT "book_id", ROUND(AVG("rating"), 2) AS "rating" FROM "ratings" GROUP BY "book_id";
  diagnosis: |
    SQLite even let you select the bare `book_id` next to the aggregate (it picks an arbitrary row's value). Most other DBMSs reject that query outright.
  source:
    - {file: lecture1, lines: "1683-1703", quote: "I'm getting the average of all of these ratings not grouped by book_id."}

- id: D1-04
  module: M1
  title: "`=` with a subquery that returns many rows"
  bug_type: subquery
  origin: generated
  concepts: [C1.4, C1.5]
  difficulty: 2
  db: movies
  kind: query
  prompt: Should list all of Tom Hanks's movies. It returns only one.
  broken: |
    SELECT "title" FROM "movies" WHERE "id" = (
        SELECT "movie_id" FROM "stars" WHERE "person_id" = (
            SELECT "id" FROM "people" WHERE "name" = 'Tom Hanks'
        )
    );
  hints:
    - How many rows does the middle subquery return?
    - "`= (subquery)` in SQLite silently uses only the **first** row."
    - Use the set-membership operator.
  solution: |
    SELECT "title" FROM "movies" WHERE "id" IN (
        SELECT "movie_id" FROM "stars" WHERE "person_id" = (
            SELECT "id" FROM "people" WHERE "name" = 'Tom Hanks'
        )
    );
  diagnosis: Use `IN` when a subquery can return several rows. `=` is fine for the innermost one, since there is one Tom Hanks.
  source:
    - {file: lecture1, lines: "969-984", quote: "if you're looking to see if some id is part of a list of ids"}

- id: D1-05
  module: M1
  title: Grouped by the wrong column
  bug_type: aggregation
  origin: generated
  concepts: [C1.10]
  difficulty: 1
  db: longlist
  kind: query
  prompt: Should return how many books were longlisted each year (year, count). It returns 75 rows of 1.
  broken: |
    SELECT "year", COUNT(*) FROM "books" GROUP BY "id";
  hints:
    - Each group becomes one output row. How many distinct ids are there?
    - Group by what you want one row *per*.
