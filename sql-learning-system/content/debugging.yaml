    - {file: lecture3, lines: "1155-1162", quote: "but what I've forgotten"}

- id: D3-04
  module: M3
  title: Missing dates that aren't NULL
  bug_type: "null"
  origin: source-question
  concepts: [C3.4, C3.7]
  difficulty: 2
  db: mfa
  kind: modify
  setup: |
    UPDATE "collections" SET "acquired" = '' WHERE "title" = 'Imaginative Landscape';
