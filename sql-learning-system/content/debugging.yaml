- id: D1-07
  module: M1
  title: WHERE on an aggregate
  bug_type: aggregation
  origin: source-question
  concepts: [C1.10]
  difficulty: 2
  db: longlist
  kind: query
  prompt: Meant to keep only books whose rounded average rating is above 4.0. It errors.
  broken: |
    SELECT "book_id", ROUND(AVG("rating"), 2) AS "average rating"
    FROM "ratings"
    WHERE "average rating" > 4.0
    GROUP BY "book_id";
  hints:
    - WHERE runs before rows are grouped. Does the average exist at that point?
    - Conditions on groups use a different keyword.
    - Move the condition into `HAVING`, after GROUP BY.
  solution: |
    SELECT "book_id", ROUND(AVG("rating"), 2) AS "average rating"
    FROM "ratings"
    GROUP BY "book_id"
    HAVING "average rating" > 4.0;
  diagnosis: WHERE filters individual rows and HAVING filters groups after aggregation.
  source:
    - {file: lecture1, lines: "1755-1764", quote: "But I can't because these are now not individual rows."}

- id: D1-08
  module: M1
  title: LEFT JOIN wanted, INNER JOIN written
  bug_type: join
  origin: generated
  concepts: [C1.7]
  difficulty: 2
  db: sea_lions
  kind: query
  prompt: The research report must list **every tracked sea lion**, with its distance if known. Jolee is missing.
  broken: |
    SELECT "name", "distance" FROM "sea_lions"
    JOIN "migrations" ON "migrations"."id" = "sea_lions"."id";
  hints:
    - What happens to a row with no match in an INNER JOIN?
    - You want every row of the table written first.
    - "`LEFT JOIN`"
  solution: |
    SELECT "name", "distance" FROM "sea_lions"
    LEFT JOIN "migrations" ON "migrations"."id" = "sea_lions"."id";
  diagnosis: An INNER JOIN silently drops unmatched rows. Choose the join from the question ("every sea lion" means LEFT).
  source:
    - {file: lecture1, lines: "1149-1162", quote: "well, let's sadly just get rid of the row."}

- id: D1-09
  module: M1
  title: UNION of mismatched columns
  bug_type: syntax
  origin: source-question
  concepts: [C1.9]
  difficulty: 1
  db: longlist
  kind: query
  prompt: Meant to list everyone who is an author or a translator, but it fails.
  broken: |
    SELECT "id", "name" FROM "authors"
    UNION
    SELECT "name" FROM "translators";
  hints:
    - Compare the number of columns on each side.
    - Set operators stack rows, so every row must have the same shape.
    - Select the same columns on both sides, here just `"name"`.
  solution: |
    SELECT "name" FROM "authors"
    UNION
    SELECT "name" FROM "translators";
  diagnosis: |
    "SELECTs to the left and right of UNION do not have the same number of result columns". Both sides need the same number of columns, and they should hold the same kind of data (L1652-1662).
  source:
    - {file: lecture1, lines: "1652-1662", quote: "you always have to have the same number"}

- id: D2-01
  module: M2
  title: A comma too many
  bug_type: syntax
  origin: source-question
  concepts: [C2.4]
  difficulty: 1
  db: null
  kind: modify
  prompt: This CREATE TABLE fails with a syntax error. Fix it.
  broken: |
    CREATE TABLE "riders" (
        "id" INTEGER,
        "name" TEXT,
        PRIMARY KEY("id"),
    );
  hints:
    - Read the error position. What comes right before `)`?
    - Commas *separate* items; they don't end them.
    - Remove the comma after the last item.
  solution: |
    CREATE TABLE "riders" (
        "id" INTEGER,
        "name" TEXT,
        PRIMARY KEY("id")
    );
  check:
    - SELECT "name", upper("type"), "pk" FROM pragma_table_info('riders')
  diagnosis: Every item except the last one ends with a comma.
  source:
    - {file: lecture2, lines: "883-895", quote: "So whatever is the last portion, I should not have a comma after"}

- id: D2-02
  module: M2
  title: A CHECK that checks nothing
  bug_type: logic
  origin: generated
  concepts: [C2.7]
  difficulty: 3
  db: null
  kind: modify
  setup: |
    CREATE TABLE "cards" ("id" INTEGER, PRIMARY KEY("id"));
    INSERT INTO "cards" VALUES (1);
  prompt: This swipes table should accept exactly 'enter', 'exit' and 'deposit'. Valid 'exit' and 'deposit' swipes are rejected. Fix the CHECK.
  broken: |
    CREATE TABLE "swipes" (
        "id" INTEGER,
        "card_id" INTEGER,
        "type" TEXT NOT NULL CHECK("type" = 'enter' OR 'exit' OR 'deposit'),
        PRIMARY KEY("id"),
        FOREIGN KEY("card_id") REFERENCES "cards"("id")
    );
  hints:
    - "How does SQL read `\"type\" = 'enter' OR 'exit'`? What is the truth value of the string `'exit'` on its own?"
    - "`OR` joins whole conditions, and `'exit'` alone is not a comparison. (A non-numeric string counts as 0, which is false.)"
    - "Use `\"type\" IN ('enter', 'exit', 'deposit')`."
  solution: |
    CREATE TABLE "swipes" (
        "id" INTEGER,
        "card_id" INTEGER,
        "type" TEXT NOT NULL CHECK("type" IN ('enter', 'exit', 'deposit')),
        PRIMARY KEY("id"),
        FOREIGN KEY("card_id") REFERENCES "cards"("id")
    );
  probes:
    - INSERT INTO "swipes" ("card_id", "type") VALUES (1, 'enter')
    - INSERT INTO "swipes" ("card_id", "type") VALUES (1, 'exit')
    - INSERT INTO "swipes" ("card_id", "type") VALUES (1, 'teleport')
  check:
    - SELECT "type" FROM "swipes"
  diagnosis: |
    `a = 'x' OR 'y'` means `(a = 'x') OR ('y')`. The string `'y'` counts as 0 (false), so only 'enter' passes.
    Logic bugs inside a CHECK are dangerous because they look like protection. IN states the intent exactly.
  source:
    - {file: lecture2, lines: "1280-1287", quote: "I could say check that type is in some list of values."}

- id: D2-03
  module: M2
  title: A foreign key that allows "no card"
  bug_type: design
  origin: generated
  concepts: [C2.6, C2.7]
  difficulty: 3
  db: null
  kind: modify
  setup: |
    CREATE TABLE "cards" ("id" INTEGER, PRIMARY KEY("id"));
    INSERT INTO "cards" VALUES (1);
  prompt: |
    Every swipe must belong to a real card. This table still accepts a swipe whose `card_id` is NULL. Fix the design.
  broken: |
    CREATE TABLE "swipes" (
        "id" INTEGER,
        "card_id" INTEGER,
        "amount" NUMERIC NOT NULL,
        PRIMARY KEY("id"),
        FOREIGN KEY("card_id") REFERENCES "cards"("id")
    );
  hints:
    - Insert `(NULL, -2.40)` and check whether the foreign key complains.
    - A NULL foreign key references nothing, so it is never checked.
    - Add `NOT NULL` to `card_id`.
  solution: |
    CREATE TABLE "swipes" (
        "id" INTEGER,
        "card_id" INTEGER NOT NULL,
        "amount" NUMERIC NOT NULL,
        PRIMARY KEY("id"),
        FOREIGN KEY("card_id") REFERENCES "cards"("id")
    );
  probes:
    - INSERT INTO "swipes" ("card_id", "amount") VALUES (1, -2.40)
    - INSERT INTO "swipes" ("card_id", "amount") VALUES (NULL, -2.40)
    - INSERT INTO "swipes" ("card_id", "amount") VALUES (9, -2.40)
  check:
    - SELECT "card_id" FROM "swipes"
  diagnosis: |
    Lecture 2 calls NOT NULL on foreign-key columns redundant. In SQLite it is not (errata #3).
  source:
    - {file: lecture2, lines: "968-978", quote: "This would be in this case, redundant."}

- id: D2-04
  module: M2
  title: A primary key that forbids repeat visits
  bug_type: design
  origin: source-question
  concepts: [C2.6]
  difficulty: 2
  db: null
  kind: modify
  prompt: Riders must be able to visit the same station many times, but the second visit is rejected. Fix the table.
  broken: |
    CREATE TABLE "visits" (
        "rider_id" INTEGER,
        "station_id" INTEGER,
        PRIMARY KEY("rider_id", "station_id")
    );
  hints:
    - What does a composite primary key promise about each (rider_id, station_id) pair?
    - Each *visit* is the entity, so give it its own identity.
    - Add an `"id" INTEGER` column and make it the primary key (or rely on rowid).
  solution: |
    CREATE TABLE "visits" (
        "id" INTEGER,
        "rider_id" INTEGER,
        "station_id" INTEGER,
        PRIMARY KEY("id")
    );
  probes:
    - INSERT INTO "visits" ("rider_id", "station_id") VALUES (1, 1)
    - INSERT INTO "visits" ("rider_id", "station_id") VALUES (1, 1)
  check:
    - SELECT "rider_id", "station_id" FROM "visits"
  diagnosis: A key must match the real-world uniqueness rule. Here that rule is "each visit is distinct", not "each pair is distinct".
  source:
    - {file: lecture2, lines: "829-839", quote: "I want people to able to visit a station more than once."}

- id: D3-01
  module: M3
  title: The DELETE that emptied the table
