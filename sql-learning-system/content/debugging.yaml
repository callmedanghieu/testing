- id: D3-05
  module: M3
  title: NEW in a DELETE trigger
  bug_type: trigger
  origin: generated
  concepts: [C3.9]
  difficulty: 2
  db: mfa
  kind: modify
  setup: |
    CREATE TABLE "transactions" ("id" INTEGER, "title" TEXT, "action" TEXT, PRIMARY KEY("id"));
  prompt: This trigger is supposed to log sales. SQLite creates it without complaint, but now every DELETE on collections fails. Fix the trigger.
  broken: |
    CREATE TRIGGER "sell" BEFORE DELETE ON "collections"
    FOR EACH ROW
    BEGIN
        INSERT INTO "transactions" ("title", "action") VALUES (NEW."title", 'sold');
    END;
  hints:
    - In a DELETE, is there a *new* row?
    - "DELETE triggers see `OLD`, INSERT triggers see `NEW`, and UPDATE triggers see both."
    - "Use `OLD.\"title\"`."
  solution: |
    CREATE TRIGGER "sell" BEFORE DELETE ON "collections"
    FOR EACH ROW
    BEGIN
        INSERT INTO "transactions" ("title", "action") VALUES (OLD."title", 'sold');
    END;
  probes:
    - DELETE FROM "collections" WHERE "title" = 'Spring Outing'
  check:
    - SELECT "title", "action" FROM "transactions"
  diagnosis: |
    `OLD` is the row being removed. `NEW` only exists for INSERT and UPDATE.
    SQLite does not check this when you create the trigger. The error (`no such column: NEW.title`) appears only when the trigger fires.
  source:
    - {file: lecture3, lines: "1603-1608", quote: "you get access to this keyword called old"}

- id: D3-06
  module: M3
  title: An over-eager LIKE
  bug_type: logic
  origin: source-question
  concepts: [C3.8]
  difficulty: 3
  db: votes
  kind: modify
  setup: |
    INSERT INTO "votes" VALUES ('Fan Painting with Birds'), ('Fan Painting with Birds');
  prompt: |
    The museum added *Fan Painting with Birds*. The lecture's cleanup pattern now corrupts its two votes. Fix the pattern so only the *Farmers* variants are rewritten.
  broken: |
    UPDATE "votes" SET "title" = 'Farmers Working at Dawn' WHERE "title" LIKE 'Fa%';
  hints:
    - What else starts with "Fa"?
    - Look at the variants (Farmers, Famers, Farmesr, farmers). What do they share that "Fan" doesn't?
    - "`LIKE 'Fa%' AND \"title\" NOT LIKE 'Fan %'`, or `LIKE 'Farm%' OR LIKE 'Fame%'`"
  solution: |
    UPDATE "votes" SET "title" = 'Farmers Working at Dawn'
    WHERE "title" LIKE 'Farm%' OR "title" LIKE 'Fame%';
  check:
    - SELECT "title", COUNT(*) FROM "votes" WHERE "title" LIKE 'Fa%' GROUP BY "title"
  diagnosis: The lecturer warns that `'Fa%'` only works on this tiny data set (lecture3 L1388-1394).
  source:
    - {file: lecture3, lines: "1388-1394", quote: "because you could match much more than Farmers Working At Dawn"}

- id: D4-01
  module: M4
  title: A trailing comma after the CTE
  bug_type: syntax
  origin: generated
  concepts: [C4.5]
  difficulty: 1
  db: longlist
  kind: query
  prompt: Syntax error near SELECT. Fix it.
  broken: |
    WITH "average_book_ratings" AS (
        SELECT "book_id", "year", ROUND(AVG("rating"), 2) AS "rating"
        FROM "ratings" JOIN "books" ON "ratings"."book_id" = "books"."id"
        GROUP BY "book_id"
    ),
    SELECT "year", ROUND(AVG("rating"), 2) AS "rating"
    FROM "average_book_ratings" GROUP BY "year";
  hints:
    - What does a comma after a CTE announce?
    - Another CTE follows. Here there is none.
    - Remove the comma after `)`.
  solution: |
    WITH "average_book_ratings" AS (
        SELECT "book_id", "year", ROUND(AVG("rating"), 2) AS "rating"
        FROM "ratings" JOIN "books" ON "ratings"."book_id" = "books"."id"
        GROUP BY "book_id"
    )
    SELECT "year", ROUND(AVG("rating"), 2) AS "rating"
    FROM "average_book_ratings" GROUP BY "year";
  diagnosis: "Several CTEs are separated by commas. The last one is followed directly by the main query."
  source:
    - {file: lecture4, lines: "644-646", quote: "Or I could omit the comma"}

- id: D4-02
  module: M4
  title: The soft-delete trigger that hid everything
  bug_type: trigger
  origin: source-question
  concepts: [C4.8]
  difficulty: 3
  db: mfa
  kind: modify
  setup: |
    ALTER TABLE "collections" ADD COLUMN "deleted" INTEGER DEFAULT 0;
    CREATE VIEW "current_collections" AS
    SELECT "id", "title", "accession_number", "acquired" FROM "collections" WHERE "deleted" = 0;
  prompt: |
    After creating this trigger, deleting one painting through the view makes **all** paintings disappear. Fix the trigger.
  broken: |
    CREATE TRIGGER "delete" INSTEAD OF DELETE ON "current_collections"
    FOR EACH ROW
    BEGIN
        UPDATE "collections" SET "deleted" = 1;
    END;
  hints:
    - Which rows does the UPDATE inside the trigger touch?
    - The trigger runs once per deleted view row. Use that row's identity.
    - "`WHERE \"id\" = OLD.\"id\"`"
  solution: |
    CREATE TRIGGER "delete" INSTEAD OF DELETE ON "current_collections"
    FOR EACH ROW
    BEGIN
        UPDATE "collections" SET "deleted" = 1 WHERE "id" = OLD."id";
    END;
  probes:
    - DELETE FROM "current_collections" WHERE "title" = 'Spring Outing'
  check:
    - SELECT "title", "deleted" FROM "collections"
  diagnosis: A missing WHERE inside a trigger is just as dangerous as anywhere else, and harder to spot.
  source:
    - {file: lecture4, lines: "1147-1153", quote: "with no condition it'll update all the columns here"}

- id: D4-03
  module: M4
  title: A view name made of digits
  bug_type: syntax
  origin: generated
  concepts: [C4.6]
  difficulty: 1
  db: longlist
  kind: modify
  prompt: Creating the partition view fails with a syntax error.
  broken: |
    CREATE VIEW 2022 AS SELECT "id", "title" FROM "books" WHERE "year" = 2022;
  hints:
    - Is `2022` an identifier or a number to the parser?
    - Names that aren't plain identifiers need quoting.
    - "`CREATE VIEW \"2022\" AS ...`"
  solution: |
    CREATE VIEW "2022" AS SELECT "id", "title" FROM "books" WHERE "year" = 2022;
  check:
    - SELECT * FROM "2022"
  diagnosis: Double quotes mark identifiers (table, column and view names). Single quotes mark text values.
  source:
