# Module 0: Query toolkit (prerequisite).
# The five lectures USE these queries but never teach them (weeks 0-1 are not in the material set).
# Where the exact query is performed in a lecture, the exercise is SOURCE-DEMO; otherwise GENERATED.
- id: M0-E01
  title: Peek at the first five books
  origin: source-demo
  concepts: [C0.1, C0.3]
  difficulty: 1
  skills: [SELECT, LIMIT, ORDER BY]
  db: longlist
  kind: query
  ordered: true
  prompt: |
    The lecture peeks at a table with `LIMIT 5` instead of printing every row.
    Return the **title** and **year** of the first five books in `books`, ordered by `id`.
  hints:
    - You only want a few rows. Which clause caps the number of rows returned?
    - "`SELECT ... FROM ... ORDER BY ... LIMIT n`. ORDER BY makes \"first\" well-defined."
    - "`SELECT \"title\", \"year\" FROM \"books\" ORDER BY \"id\" LIMIT ...;`"
  solution: |
    SELECT "title", "year" FROM "books" ORDER BY "id" LIMIT 5;
  explanation: |
    `LIMIT` caps the rows. Without `ORDER BY`, "the first five" is whatever order SQLite happens to read the table in.
    That is usually rowid order, but it is not guaranteed, so we make it explicit.
  source:
    - {file: lecture2, lines: "42-48", quote: "but limit now to the first five rows"}

- id: M0-E02
  title: Search for a movie by title
  origin: source-demo
  concepts: [C0.2]
  difficulty: 1
  skills: [WHERE, "="]
  db: movies
  kind: query
  prompt: |
    You are searching IMDb for your favourite movie, *Cars*. Return every column of every movie whose title is exactly `Cars`.
  hints:
    - Filter rows with a condition on the `title` column.
    - Use `WHERE` with `=` and a quoted string.
    - "`SELECT * FROM \"movies\" WHERE \"title\" = '...';`"
  solution: |
    SELECT * FROM "movies" WHERE "title" = 'Cars';
  expected_known: [[317219, "Cars", 2006]]
  explanation: |
    `=` is an exact match, so *Cars 3* is not returned. The lecture's answer: id 317219, released 2006.
  source:
    - {file: lecture5, lines: "116-123", quote: "Came out in 2006 and the ID is 317219."}

- id: M0-E03
  title: Artworks with no acquisition date
  origin: generated
  concepts: [C0.2]
  difficulty: 1
  skills: [IS NULL]
  db: mfa
  kind: query
  prompt: |
    Return the **title** of every item in `collections` whose `acquired` date is unknown (NULL).
  hints:
    - NULL means "no value". Comparing anything to NULL with `=` never yields true.
    - SQL has a special operator for testing NULL.
    - "`... WHERE \"acquired\" IS NULL;`"
  solution: |
    SELECT "title" FROM "collections" WHERE "acquired" IS NULL;
  expected_known: [["Imaginative Landscape"]]
  explanation: |
    Lecture 3 uses exactly this condition, but in a DELETE. Writing the SELECT first is a good habit before any DELETE.
  source:
    - {file: lecture3, lines: "734-741", quote: "IS NULL semicolon"}

- id: M0-E04
  title: 2023 longlist, alphabetically
  origin: generated
  concepts: [C0.2, C0.3]
  difficulty: 1
  skills: [WHERE, ORDER BY]
  db: longlist
  kind: query
  ordered: true
  prompt: |
    Return the **titles** of the books longlisted in 2023, sorted A→Z.
  hints:
    - Two jobs, filtering and sorting. Which clauses do each?
    - "`WHERE \"year\" = 2023` plus `ORDER BY \"title\"`."
    - "`SELECT \"title\" FROM \"books\" WHERE ... ORDER BY ...;`"
  solution: |
    SELECT "title" FROM "books" WHERE "year" = 2023 ORDER BY "title";
  explanation: |
    Lecture 4 combines these two ideas: partitioning by year (L728) and ordering by title (L317-323).
  source:
    - {file: lecture4, lines: "726-732", quote: "where, in this case, the year is 2023"}
