- id: M0-E08
  title: Fernanda Melchor's books, with nested subqueries
  origin: source-demo
  concepts: [C0.5]
  difficulty: 2
  skills: [subquery, IN]
  db: longlist
  kind: query
  prompt: |
    Return the **titles** of every book written by Fernanda Melchor.
    Use **nested subqueries** only (no JOIN) and do not hard-code her id.
  hints:
    - Work inside-out. First her id (authors), then her book ids (authored), then their titles (books).
    - The middle step can return several rows, so the outer filter needs `IN (...)`.
    - "`SELECT \"title\" FROM \"books\" WHERE \"id\" IN (SELECT \"book_id\" FROM \"authored\" WHERE \"author_id\" = (SELECT \"id\" FROM \"authors\" WHERE ...));`"
  solution: |
    SELECT "title" FROM "books"
    WHERE "id" IN (
        SELECT "book_id" FROM "authored"
        WHERE "author_id" = (
            SELECT "id" FROM "authors"
            WHERE "name" = 'Fernanda Melchor'
        )
    );
  expected_known: [["Hurricane Season"], ["Paradais"]]
  explanation: |
    Three tables are needed because books and authors are linked through the junction table `authored`.
    Lecture 4 then shows how a view collapses this to one line (M3-E02).
  source:
    - {file: lecture4, lines: "168-192", quote: "then find the titles associated with those book IDs themselves"}
    - {file: lecture4, lines: "296-297", quote: "Fernanda has written Paradais and Hurricane Season"}

- id: M0-E09
  title: Author names next to book titles, with JOIN
  origin: source-demo
  concepts: [C0.6]
  difficulty: 2
  skills: [JOIN]
  db: longlist
  kind: query
  prompt: |
    Return every author's **name** next to the **title** of each book they wrote (two columns, one row per authorship).
  hints:
    - "`authors` has names and `books` has titles. They connect through `authored`."
    - Two JOINs, each matching a primary key with a foreign key.
    - "`FROM \"authors\" JOIN \"authored\" ON \"authors\".\"id\" = \"authored\".\"author_id\" JOIN \"books\" ON ...`"
  solution: |
    SELECT "name", "title" FROM "authors"
    JOIN "authored" ON "authors"."id" = "authored"."author_id"
    JOIN "books" ON "books"."id" = "authored"."book_id";
  explanation: |
    This is the query behind the `longlist` view in Lecture 4. Each JOIN lines up a primary key with the matching foreign key ("touching your fingertips together", L68).
  source:
    - {file: lecture4, lines: "203-240", quote: "JOIN books ON books dot id equals, in this case, authored dot book_id"}

- id: M0-E10
  title: Tom Hanks's movies
  origin: source-demo
  concepts: [C0.5]
  difficulty: 2
  skills: [subquery, IN]
  db: movies
  kind: query
  prompt: |
    Return the **titles** of all movies Tom Hanks starred in, using nested subqueries (people → stars → movies).
  hints:
    - People and movies are many-to-many through `stars`.
    - Find his `id` in people, then his `movie_id`s in stars, then their titles.
    - "`SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT ...));`"
  solution: |
    SELECT "title" FROM "movies" WHERE "id" IN (
        SELECT "movie_id" FROM "stars" WHERE "person_id" = (
            SELECT "id" FROM "people" WHERE "name" = 'Tom Hanks'
        )
    );
  explanation: |
    This exact query is the one Lecture 5 later speeds up with indexes (M4-E02, M4-E03).
  source:
    - {file: lecture5, lines: "364-394", quote: "I get back all of Tom Hanks's movies"}
