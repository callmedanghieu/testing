- id: M0-E05
  title: Tally raw votes
  origin: source-demo
  concepts: [C0.4]
  difficulty: 2
  skills: [GROUP BY, COUNT]
  db: votes
  kind: query
  prompt: |
    Count the votes for each `title` in the raw `votes` table (no cleaning yet). Return the title and its count.
    Look at the output. Why are there far more than four groups?
  hints:
    - You want one row per distinct title, with a count.
    - "`GROUP BY \"title\"` with `COUNT(\"title\")`."
    - "`SELECT \"title\", COUNT(\"title\") FROM \"votes\" GROUP BY \"title\";`"
  solution: |
    SELECT "title", COUNT("title") FROM "votes" GROUP BY "title";
  explanation: |
    GROUP BY compares text exactly. `'Farmers Working at Dawn'` and `'farmers working at dawn'` and `' Spring outing'` (leading space) are all different groups.
    Fixing this is exercise M2-E13.
  source:
    - {file: lecture3, lines: "1229-1246", quote: "Why do I have so many?"}

- id: M0-E06
  title: Average rating per book
  origin: source-demo
  concepts: [C0.4]
  difficulty: 2
  skills: [AVG, ROUND, GROUP BY, AS]
  db: longlist
  kind: query
  prompt: |
    For each `book_id` in `ratings`, return the book id and its average rating rounded to 2 decimal places, as a column named `rating`.
  hints:
    - Many ratings per book become one row per book, so you need a grouping.
    - "`AVG(...)` inside `ROUND(..., 2)`, then `AS \"rating\"`, then `GROUP BY \"book_id\"`."
    - "`SELECT \"book_id\", ROUND(AVG(\"rating\"), 2) AS \"rating\" FROM \"ratings\" GROUP BY ...;`"
  solution: |
    SELECT "book_id", ROUND(AVG("rating"), 2) AS "rating"
    FROM "ratings"
    GROUP BY "book_id";
  explanation: |
    Book 1 has ratings 4, 3, 4, so its average is 3.67. Book 2 has 2 and 3, so 2.5. These are the two values on the lecture's slide.
  source:
    - {file: lecture4, lines: "423-433", quote: "I should see I have rounded ratings now"}
    - {file: lecture4, lines: "374-386", quote: "3.67 book 1 and 2.5 for book 2"}

