- id: M1-E22
  title: Tom Hanks's movies
  origin: source-demo
  concepts: [C1.4, C1.5]
  difficulty: 2
  skills: [subquery, IN]
  db: movies
  kind: query
  prompt: |
    Same many-to-many pattern on another dataset. Return the **titles** of all movies Tom Hanks starred in (people → stars → movies), using nested subqueries.
  hints:
    - "`stars` is the junction table between people and movies."
    - Find his id, then his movie ids (several, so use IN), then the titles.
    - "`SELECT \"title\" FROM \"movies\" WHERE \"id\" IN (SELECT \"movie_id\" FROM \"stars\" WHERE \"person_id\" = (SELECT ...));`"
  solution: |
    SELECT "title" FROM "movies" WHERE "id" IN (
        SELECT "movie_id" FROM "stars" WHERE "person_id" = (
            SELECT "id" FROM "people" WHERE "name" = 'Tom Hanks'
        )
    );
  explanation: This exact query is the one Lecture 5 later speeds up with indexes (M5-E02, M5-E03).
  source:
    - {file: lecture1, lines: "736-782", quote: "We could also use subqueries with many-to-many relationships"}
    - {file: lecture5, lines: "364-394", quote: "I get back all of Tom Hanks's movies"}

- id: M1-E23
  title: Tally raw votes
  origin: source-demo
  concepts: [C1.10]
  difficulty: 2
  skills: [GROUP BY, COUNT]
  db: votes
  kind: query
  prompt: |
    Count the votes for each `title` in the raw `votes` table from Lecture 3 (no cleaning yet). Why are there far more than four groups?
  hints:
    - You want one row per distinct title, with a count.
    - "`GROUP BY \"title\"` with `COUNT(\"title\")`."
    - "`SELECT \"title\", COUNT(\"title\") FROM \"votes\" GROUP BY \"title\";`"
  solution: |
    SELECT "title", COUNT("title") FROM "votes" GROUP BY "title";
  explanation: GROUP BY compares text exactly, so typos, stray spaces and case variants become separate groups. Fixing this is exercise M3-E13.
  source:
    - {file: lecture1, lines: "1712-1714", quote: "using this GROUP BY keyword"}
    - {file: lecture3, lines: "1229-1246", quote: "Why do I have so many?"}
