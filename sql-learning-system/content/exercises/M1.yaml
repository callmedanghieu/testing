- id: M1-E17
  title: "Finish the lecture's query: the book Hughes and Jull Costa share"
  origin: source-assigned
  concepts: [C1.9, C1.4]
  difficulty: 3
  skills: [INTERSECT, subquery, IN]
  db: longlist
  kind: query
  prompt: |
    The lecture finds the **book_id** that Sophie Hughes and Margaret Jull Costa both translated, then says:
    *"You could imagine going beyond this to find the title of this book_id using another nested query. But I won't spend time on that."*
    Do it. Return the **title**.
  hints:
    - Each translator's book ids come from `translated` with a subquery for their translator id. Intersect the two lists.
    - Then wrap the whole INTERSECT inside `WHERE "id" IN (...)`.
    - "`SELECT \"title\" FROM \"books\" WHERE \"id\" IN (SELECT \"book_id\" FROM \"translated\" WHERE \"translator_id\" = (...) INTERSECT SELECT \"book_id\" FROM \"translated\" WHERE \"translator_id\" = (...));`"
  solution: |
    SELECT "title" FROM "books" WHERE "id" IN (
        SELECT "book_id" FROM "translated" WHERE "translator_id" = (
            SELECT "id" FROM "translators" WHERE "name" = 'Sophie Hughes'
        )
        INTERSECT
        SELECT "book_id" FROM "translated" WHERE "translator_id" = (
            SELECT "id" FROM "translators" WHERE "name" = 'Margaret Jull Costa'
        )
    );
  expected_known: [["Mac and His Problem"]]
  explanation: A set operation can itself be the subquery inside IN.
  source:
    - {file: lecture1, lines: "1559-1600", quote: "But I won't spend time on that"}

- id: M1-E18
  title: "Homework: in exactly one of the two sets"
  origin: source-assigned
  concepts: [C1.9]
  difficulty: 3
  skills: [EXCEPT, UNION, parentheses/subqueries]
  db: longlist
  kind: query
  prompt: |
    The lecture's last Venn diagram shades the two outer parts: people who are an author **or** a translator, **but not both**.
    *"I actually saved that one for you to do as homework."* Return those names.
  hints:
    - The two outer parts are (authors EXCEPT translators) and (translators EXCEPT authors).
    - Combine the two parts with UNION. Wrap each part in a subquery so that the set operators apply in the right order.
    - "`SELECT \"name\" FROM (SELECT ... EXCEPT SELECT ...) UNION SELECT \"name\" FROM (SELECT ... EXCEPT SELECT ...);`"
  solution: |
    SELECT "name" FROM (
        SELECT "name" FROM "authors" EXCEPT SELECT "name" FROM "translators"
    )
    UNION
    SELECT "name" FROM (
        SELECT "name" FROM "translators" EXCEPT SELECT "name" FROM "authors"
    );
  explanation: |
    Without the subqueries, chained set operators run left to right: `A EXCEPT T UNION T EXCEPT A` means `((A EXCEPT T) UNION T) EXCEPT A`, which is not the symmetric difference.
    Equivalent: `(A UNION T) EXCEPT (A INTERSECT T)`.
  source:
    - {file: lecture1, lines: "1461-1466", quote: "I actually saved that one for you to do as homework"}

- id: M1-E19
  title: Average rating per book
  origin: source-demo
  concepts: [C1.10]
  difficulty: 2
  skills: [GROUP BY, AVG, ROUND, AS]
  db: longlist
  kind: query
  prompt: For each `book_id` in `ratings`, return the id and its average rating rounded to 2 decimals as `average rating`.
  hints:
    - "`AVG(\"rating\")` on its own averages the whole table (3.84 here). You need one average per book."
    - Group the rows by the book they belong to.
    - "`SELECT \"book_id\", ROUND(AVG(\"rating\"), 2) AS \"average rating\" FROM \"ratings\" GROUP BY \"book_id\";`"
  solution: |
    SELECT "book_id", ROUND(AVG("rating"), 2) AS "average rating"
    FROM "ratings"
    GROUP BY "book_id";
  explanation: |
    As in the lecture, books 1, 2 and 3 come out at 3.77, 3.97 and 3.04 (L1737). The slide's tiny example (ratings 4, 3, 4 → 3.67) only illustrates the idea.
  source:
    - {file: lecture1, lines: "1716-1737", quote: "3.77, 3.97, 3.04-- for each book"}

- id: M1-E20
  title: Only the well-rated books (HAVING)
  origin: source-demo
  concepts: [C1.10]
  difficulty: 3
  skills: [HAVING, ORDER BY]
  db: longlist
  kind: query
  ordered: true
  prompt: |
    Same per-book averages, but keep only books whose rounded average is **above 4.0**, and sort them from best to worst.
  hints:
    - WHERE filters rows before grouping. Which keyword filters groups?
    - "`HAVING` comes after GROUP BY, and `ORDER BY` comes last."
    - "`... GROUP BY \"book_id\" HAVING \"average rating\" > 4.0 ORDER BY \"average rating\" DESC;`"
  solution: |
    SELECT "book_id", ROUND(AVG("rating"), 2) AS "average rating"
    FROM "ratings"
    GROUP BY "book_id"
    HAVING "average rating" > 4.0
    ORDER BY "average rating" DESC, "book_id";
  explanation: "`WHERE \"average rating\" > 4.0` is an error, because there is no such row-level column yet (L1755-1764, debugging D1-07). Books 5 (4.06) and 10 (4.04) qualify, as in the lecture."
  source:
    - {file: lecture1, lines: "1753-1770", quote: "SQL uses a different keyword for conditions on groups"}
    - {file: lecture1, lines: "1811-1829", quote: "so great question here to re-implement much of what we did last time"}

