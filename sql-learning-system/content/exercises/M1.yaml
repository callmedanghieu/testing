# Module 1: Relating (sources/lecture1.txt). Datasets: longlist (relational), sea_lions.
- id: M1-E01
  title: Read the ER diagram
  origin: source-question
  concepts: [C1.1, C1.2]
  difficulty: 1
  skills: [ER diagrams, crow's foot notation, cardinality]
  db: longlist
  kind: selfcheck
  prompt: |
    In crow's-foot notation, a circle means *zero*, a bar means *one*, and the three-pronged foot means *many*.
    For the longlist diagram, write down:
    1. Is author ↔ book one-to-one, one-to-many or many-to-many? Why?
    2. Must a book have a translator? Must a translator have translated a book?
    3. What kind of relationship is book → ratings?
  hints:
    - Read each line in both directions: one A has … B, and one B has … A.
    - "\"Zero to many\" (circle + crow's foot) means the relationship is optional on that side."
    - Ratings belong to exactly one book, and a book can have many ratings.
  solution: |
    -- Model answer:
    -- 1. Many-to-many: an author can write many books (Olga Tokarczuk wrote three here) and a book can have several authors.
    -- 2. A book has ZERO to many translators (some aren't translated); a translator translated at least one book.
    -- 3. One-to-many: one book, many ratings, so book_id is stored in ratings as a foreign key.
  explanation: These diagrams are how you communicate a design. Lecture 2 makes you draw your own (M2-E01).
  source:
    - {file: lecture1, lines: "167-210", quote: "So here, we have what's called a crow's foot notation"}

- id: M1-E02
  title: Why not use the ISBN as the primary key?
  origin: source-question
  concepts: [C1.3]
  difficulty: 2
  skills: [primary keys, foreign keys, key design]
  db: longlist
  kind: selfcheck
  prompt: |
    Every book has a unique ISBN such as `978-1-80427-…`. The lecturer asks what goes wrong if you use it as the primary key everywhere,
    including as the foreign key in other tables. Give two problems, and the alternative.
  hints:
    - The key is copied into every table that references it, so think about size.
    - What happens to a leading 0 when text becomes a number?
    - The alternative is a key the database makes up for you.
  solution: |
    -- Model answer:
    -- 1. Size: as text it is ~17 bytes, repeated in every referencing row (e.g. thousands of ratings).
    -- 2. Stored as a number instead, an ISBN that starts with 0 loses that 0, so it no longer identifies the book.
    -- Alternative: a surrogate integer id (1, 2, 3 …) that is unique and never reused for another row.
    --   books.id is then the PRIMARY key; ratings.book_id and authored.book_id are FOREIGN keys to it.
  explanation: "\"It doesn't quite matter what number we choose so long as this number uniquely identifies the book\" (L367-369)."
  source:
    - {file: lecture1, lines: "340-380", quote: "And we can actually construct our very own primary key."}

- id: M1-E03
  title: What does (23, 1) in authored mean?
  origin: source-question
  concepts: [C1.3, C1.4]
  difficulty: 1
  skills: [junction table, subquery]
  db: longlist
  kind: query
  prompt: |
    The `authored` table contains the row `author_id = 23, book_id = 1`.
    Return the **name** of that author and the **title** of that book, as two one-row queries joined with `UNION ALL`, or just two queries (the checker reads the last one, the title).
  hints:
    - "`authored` holds only ids. Names live in `authors`, and titles live in `books`."
    - Look up id 23 in authors and id 1 in books.
    - "`SELECT \"title\" FROM \"books\" WHERE \"id\" = 1;`"
  solution: |
    SELECT "name" FROM "authors" WHERE "id" = 23;
    SELECT "title" FROM "books" WHERE "id" = 1;
  expected_known: [["Boulder"]]
  explanation: Author 23 is Eva Baltasar and book 1 is *Boulder*, so the row says "Eva Baltasar wrote Boulder".
  source:
    - {file: lecture1, lines: "393-412", quote: "has authored the book 1"}

- id: M1-E04
  title: Books from Fitzcarraldo Editions
  origin: source-question
  concepts: [C1.4]
  difficulty: 2
  skills: [subquery]
  db: longlist
  kind: query
  prompt: Return the titles published by **Fitzcarraldo Editions**. `books` stores only a `publisher_id`. Don't hard-code it.
  hints:
    - Two questions. What is the publisher's id? Which books have that id?
    - Put the first query in parentheses inside the second.
    - "`SELECT \"title\" FROM \"books\" WHERE \"publisher_id\" = (SELECT \"id\" FROM \"publishers\" WHERE \"publisher\" = '...');`"
  solution: |
    SELECT "title" FROM "books" WHERE "publisher_id" = (
        SELECT "id" FROM "publishers" WHERE "publisher" = 'Fitzcarraldo Editions'
    );
  explanation: |
    The inner query runs first and returns 5, the id the lecture finds (L521). Hard-coding the 5 works, but the query breaks if the id ever changes.
  source:
    - {file: lecture1, lines: "553-584", quote: "So SQL supports this idea of writing a subquery"}

