- id: M1-E12
  title: "Capstone: the full CharlieCard schema"
  origin: generated
  concepts: [C1.2, C1.3, C1.4, C1.6, C1.7]
  difficulty: 4
  skills: [schema design]
  db: null
  kind: modify
  prompt: |
    From a blank database, write the complete final schema of Lecture 2: `cards`, `stations`, `swipes`.
    Use the same constraints the lecture ends with: unique, required station names; a required line;
    the swipe-type list; the timestamp default; a non-zero amount; and all keys.
    (This combines M1-E07 and M1-E08, so try it without looking.)
  hints:
    - Create the tables that are referenced (`cards`, `stations`) before the table that references them.
    - "`cards` has only an `id`. `stations` and `swipes` are as in the previous exercises."
    - Check your answer against `database/mbta/schema.sql`.
  solution: |
    CREATE TABLE "cards" (
        "id" INTEGER,
        PRIMARY KEY("id")
    );
    CREATE TABLE "stations" (
        "id" INTEGER,
        "name" TEXT NOT NULL UNIQUE,
        "line" TEXT NOT NULL,
        PRIMARY KEY("id")
    );
    CREATE TABLE "swipes" (
        "id" INTEGER,
        "card_id" INTEGER,
        "station_id" INTEGER,
        "type" TEXT NOT NULL CHECK("type" IN ('enter', 'exit', 'deposit')),
        "datetime" NUMERIC NOT NULL DEFAULT CURRENT_TIMESTAMP,
        "amount" NUMERIC NOT NULL CHECK("amount" != 0),
        PRIMARY KEY("id"),
        FOREIGN KEY("card_id") REFERENCES "cards"("id"),
        FOREIGN KEY("station_id") REFERENCES "stations"("id")
    );
  probes:
    - INSERT INTO "cards" ("id") VALUES (1)
    - INSERT INTO "stations" ("name", "line") VALUES ('Harvard', 'red')
    - INSERT INTO "stations" ("name", "line") VALUES ('Harvard', 'red')
    - INSERT INTO "stations" ("name") VALUES ('Alewife')
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, 'enter', -2.40)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (2, 1, 'enter', -2.40)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, 'board', -2.40)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, 'exit', 0)
  check:
    - SELECT "name" FROM sqlite_master WHERE "type" = 'table' ORDER BY "name"
    - SELECT COUNT(*) FROM "swipes" WHERE "datetime" IS NOT NULL
  explanation: |
    Riders were dropped from the design because the MBTA tracks CharlieCards, not people (L1033-1061).
  source:
    - {file: lecture2, lines: "1189-1230", quote: "So let's now say visits becomes swipes."}
    - {file: lecture2, lines: "1299-1305", quote: "So let me say that this is now a card ID"}

- id: M1-E13
  title: "Lab: rebuild a database from schema.sql"
  origin: source-demo
  concepts: [C1.1]
  difficulty: 1
  skills: [sqlite3 shell, .read, .schema]
  db: null
  kind: selfcheck
  prompt: |
    In a terminal (not in the browser):
    1. Save your M1-E12 answer as `schema.sql`.
    2. `sqlite3 mbta.db`, then `.read schema.sql`, then `.schema`, then `.quit`.
    3. Change something in `schema.sql` (e.g. add a column), then `DROP TABLE` the tables and `.read` the file again.

    Compare with `database/mbta/schema.sql`, which is exactly this workflow, and with `python3 tools/build_db.py`, which rebuilds every practice database from such files.
  hints:
    - Dot-commands belong to the sqlite3 shell, not to SQL. They take no semicolon.
    - "`.read FILE` runs every statement in FILE; `.schema [TABLE]` prints the CREATE statements."
    - "Order matters when re-running: drop referencing tables (swipes) before referenced ones (cards, stations)."
  solution: |
    -- shell session
    sqlite3 mbta.db
    .read schema.sql
    .schema
    .quit
    -- after editing schema.sql:
    DROP TABLE "swipes"; DROP TABLE "stations"; DROP TABLE "cards";
    .read schema.sql
  explanation: A schema file you can re-run is documentation, a backup, and an undo button in one.
  source:
    - {file: lecture2, lines: "659-720", quote: "I could say dot read schema.sql"}

