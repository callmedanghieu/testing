# Module 1: Designing (sources/lecture2.txt)
- id: M1-E01
  title: Spot the redundancy in Charlie's fare log
  origin: source-question
  concepts: [C1.2]
  difficulty: 2
  skills: [normalizing, design critique]
  db: charlie
  kind: selfcheck
  prompt: |
    The `log` table is the first draft from Lecture 2: `id, name, station, action, fare, balance`.
    Run `SELECT * FROM "log";`, then write down:
    1. Which values are repeated, and why that is a problem.
    2. Which **entities** are hiding in this one table.
    3. Which tables you would create instead.
  hints:
    - Look at the `name` column. What if two different people are both called Charlie?
    - Which columns describe a *person*, which describe a *station*, and which describe an *event*?
    - "Entities → their own tables, each with its own id. The event table refers to them by id."
  solution: |
    -- Model answer (design, not executable):
    -- 1. Names and station names repeat in every row. Two different "Charlie"s are indistinguishable,
    --    and renaming a station means editing many rows.
    -- 2. Entities: riders (people), stations, and the visits/swipes that relate them.
    -- 3. riders(id, name), stations(id, name, line), visits(rider_id, station_id, ...)
    --    -- later refined to cards / stations / swipes (exercise M1-E12).
  explanation: |
    Normalizing means putting each entity in its own table, and keeping every column of a table about that entity only.
  source:
    - {file: lecture2, lines: "199-227", quote: "what redundancies or inefficiencies do you see here?"}
    - {file: lecture2, lines: "245-263", quote: "So that is the process here of normalizing."}

- id: M1-E02
  title: Create the riders and stations tables
  origin: source-demo
  concepts: [C1.4, C1.5, C1.6]
  difficulty: 1
  skills: [CREATE TABLE, type affinity, PRIMARY KEY]
  db: null
  kind: modify
  prompt: |
    In an empty database, create:
    * `riders` with `id` INTEGER and `name` TEXT, where `id` is the primary key
    * `stations` with `id` INTEGER, `name` TEXT and `line` TEXT, where `id` is the primary key

    Use the table-constraint style from the lecture: `PRIMARY KEY("id")` after the columns.
  hints:
    - One `CREATE TABLE name (...);` per table, columns separated by commas.
    - Each column is `"name" AFFINITY`. Put the constraint `PRIMARY KEY("id")` after the last column, preceded by a comma.
    - "`CREATE TABLE \"riders\" (\"id\" INTEGER, \"name\" TEXT, PRIMARY KEY(\"id\"));`, then the same shape for stations."
  solution: |
    CREATE TABLE "riders" (
        "id" INTEGER,
        "name" TEXT,
        PRIMARY KEY("id")
    );
    CREATE TABLE "stations" (
        "id" INTEGER,
        "name" TEXT,
        "line" TEXT,
        PRIMARY KEY("id")
    );
  check:
    - SELECT "name", upper("type"), "pk" FROM pragma_table_info('riders')
    - SELECT "name", upper("type"), "pk" FROM pragma_table_info('stations')
  explanation: |
    Riders and stations are separate entities, so they get separate tables, each with its own primary key.
    The same id value (1, 2, 3) can appear in both tables without any conflict (L319-326).
  source:
    - {file: lecture2, lines: "672-695", quote: "I could say, ID has the integer type affinity."}
    - {file: lecture2, lines: "800-811", quote: "and then say, primary key ID, just like this"}

- id: M1-E03
  title: The visits junction table
  origin: source-demo
  concepts: [C1.3, C1.6]
  difficulty: 2
  skills: [junction table, FOREIGN KEY]
  db: null
  kind: modify
  setup: |
    CREATE TABLE "riders" ("id" INTEGER, "name" TEXT, PRIMARY KEY("id"));
    CREATE TABLE "stations" ("id" INTEGER, "name" TEXT, "line" TEXT, PRIMARY KEY("id"));
    INSERT INTO "riders" VALUES (1, 'Charlie'), (2, 'Alice');
    INSERT INTO "stations" VALUES (1, 'Harvard', 'red'), (2, 'Kendall/MIT', 'red');
  prompt: |
    Riders and stations are many-to-many. Create the junction table `visits(rider_id INTEGER, station_id INTEGER)`
    with two foreign keys: `rider_id` → `riders(id)` and `station_id` → `stations(id)`.
  hints:
    - A junction table holds pairs of ids. Each column references another table's primary key.
    - "Table constraint syntax: `FOREIGN KEY(\"col\") REFERENCES \"table\"(\"id\")`."
    - "`CREATE TABLE \"visits\" (\"rider_id\" INTEGER, \"station_id\" INTEGER, FOREIGN KEY(\"rider_id\") REFERENCES \"riders\"(\"id\"), FOREIGN KEY(...) REFERENCES ...);`"
  solution: |
    CREATE TABLE "visits" (
        "rider_id" INTEGER,
        "station_id" INTEGER,
        FOREIGN KEY("rider_id") REFERENCES "riders"("id"),
        FOREIGN KEY("station_id") REFERENCES "stations"("id")
    );
  probes:
    - INSERT INTO "visits" VALUES (1, 1)
    - INSERT INTO "visits" VALUES (1, 1)
    - INSERT INTO "visits" VALUES (99, 1)
    - INSERT INTO "visits" VALUES (2, 42)
  check:
    - SELECT "table", "from", "to" FROM pragma_foreign_key_list('visits')
    - SELECT COUNT(*) FROM "visits"
  explanation: |
    With foreign keys on, `(99, 1)` is rejected because rider 99 doesn't exist. Repeat visits `(1, 1)` are allowed.
    Note that SQLite only enforces foreign keys after `PRAGMA foreign_keys = ON;`, which this trainer always runs (see errata #4).
  source:
    - {file: lecture2, lines: "425-444", quote: "So I'll call this table visits."}
    - {file: lecture2, lines: "848-865", quote: "The foreign key of this table is rider ID"}

- id: M1-E04
  title: Why a composite primary key is wrong for visits
  origin: source-question
  concepts: [C1.6]
  difficulty: 2
  skills: [composite PRIMARY KEY, constraint failure]
  db: null
  kind: error
  expect_error: UNIQUE constraint failed
  setup: |
    CREATE TABLE "visits" ("rider_id" INTEGER, "station_id" INTEGER, PRIMARY KEY("rider_id", "station_id"));
    INSERT INTO "visits" VALUES (1, 1);
  prompt: |
    Here `visits` has the **joint primary key** `(rider_id, station_id)`, and rider 1 has already visited station 1 once.
    Write the INSERT that records rider 1 visiting station 1 **again**, and observe what happens.
  hints:
    - A primary key must be unique, so what makes a row unique here?
    - Insert the exact same pair again.
    - "`INSERT INTO \"visits\" VALUES (1, 1);`"
  solution: |
    INSERT INTO "visits" VALUES (1, 1);
  explanation: |
    A composite PK forbids repeating a (rider, station) pair, but real riders visit the same station many times.
    That is why the lecture prefers its own `id` primary key (or the implicit `rowid`) for visits.
  source:
    - {file: lecture2, lines: "816-834", quote: "So maybe not the best design for this table"}

- id: M1-E05
  title: Fares in cents
  origin: generated
  concepts: [C1.5]
  difficulty: 2
  skills: [REAL vs INTEGER, CAST, ROUND, SUM]
  db: charlie
  kind: query
  prompt: |
    The `log.fare` column stores dollars as REAL values (0.10, 0.05, ...). Floating-point values aren't exact.
    Return a single number: the **total of all fares in whole cents**, as an integer.
  hints:
    - Convert each fare to cents *before* adding, so you add exact integers.
    - "`fare * 100` can come out as 9.999999...; `ROUND` it, then `CAST(... AS INTEGER)`."
    - "`SELECT SUM(CAST(ROUND(\"fare\" * 100) AS INTEGER)) FROM \"log\";`"
  solution: |
    SELECT SUM(CAST(ROUND("fare" * 100) AS INTEGER)) FROM "log";
  expected_known: [[50]]
  explanation: |
    This is the lecture's integer-vs-real trade-off for fares, made concrete. Whole cents in an INTEGER column are exact and easy to add up.
    REAL dollars risk values like 0.10000056789 (L540-547).
  source:
    - {file: lecture2, lines: "540-571", quote: "it can get very wonky if I really need that kind of precision"}

- id: M1-E06
  title: Watch type affinity convert values
  origin: source-demo
  concepts: [C1.5]
  difficulty: 2
  skills: [type affinity, typeof]
  db: null
  kind: query
  prompt: |
    Recreate the lecture's demo:
    1. Create `fares_text("amount" TEXT)` and `fares_int("amount" INTEGER)`.
    2. Insert the **integer** `10` into `fares_text`, and the **text** `'25'` into `fares_int`.
    3. Finish with one query returning two rows: `typeof("amount")` from each table, `fares_text` first (use `UNION ALL`).
  hints:
    - The column's affinity, not the literal you typed, decides how the value is stored when conversion is possible.
    - "`typeof(x)` returns 'integer', 'text', 'real', 'blob' or 'null'."
    - "`SELECT typeof(\"amount\") FROM \"fares_text\" UNION ALL SELECT typeof(\"amount\") FROM \"fares_int\";`"
  solution: |
    CREATE TABLE "fares_text" ("amount" TEXT);
    CREATE TABLE "fares_int" ("amount" INTEGER);
    INSERT INTO "fares_text" VALUES (10);
    INSERT INTO "fares_int" VALUES ('25');
    SELECT typeof("amount") FROM "fares_text"
    UNION ALL
    SELECT typeof("amount") FROM "fares_int";
  ordered: true
  expected_known: [["text"], ["integer"]]
  explanation: |
    Storage classes belong to **values**, and affinities belong to **columns**. A column converts what you insert to its preferred class when it can.
    A value that can't be converted (e.g. `'red line'` into INTEGER) is stored as it is.
  source:
    - {file: lecture2, lines: "613-638", quote: "I'll get back not 10, the text, but 10 the integer"}

- id: M1-E07
  title: Stations with NOT NULL and UNIQUE
  origin: source-demo
  concepts: [C1.7]
  difficulty: 2
  skills: [NOT NULL, UNIQUE]
  db: null
  kind: modify
  prompt: |
    Create `stations(id, name, line)` where:
    * `id` is an INTEGER primary key
    * `name` is TEXT, required and unique
    * `line` is TEXT and required, but **not** unique (many stations share a line)
  hints:
    - Column constraints go right after the column's affinity.
    - "`NOT NULL` makes a value required; `UNIQUE` forbids repeats."
    - "`\"name\" TEXT NOT NULL UNIQUE, \"line\" TEXT NOT NULL, PRIMARY KEY(\"id\")`"
  solution: |
    CREATE TABLE "stations" (
        "id" INTEGER,
        "name" TEXT NOT NULL UNIQUE,
        "line" TEXT NOT NULL,
        PRIMARY KEY("id")
    );
  probes:
    - INSERT INTO "stations" ("name", "line") VALUES ('Harvard', 'red')
    - INSERT INTO "stations" ("name", "line") VALUES ('Kendall/MIT', 'red')
    - INSERT INTO "stations" ("name", "line") VALUES ('Harvard', 'red')
    - INSERT INTO "stations" ("name", "line") VALUES (NULL, 'blue')
    - INSERT INTO "stations" ("name", "line") VALUES ('Aquarium', NULL)
  check:
    - SELECT "name", "line" FROM "stations"
  explanation: |
    There is no need to add NOT NULL or UNIQUE to `id`, because `PRIMARY KEY` already implies both (L958-966, L1016-1022).
  source:
    - {file: lecture2, lines: "940-1005", quote: "So I'll say not null and unique."}

- id: M1-E08
  title: The swipes table with CHECK and DEFAULT
  origin: source-demo
  concepts: [C1.6, C1.7]
  difficulty: 3
  skills: [CHECK, DEFAULT, CURRENT_TIMESTAMP, FOREIGN KEY]
  db: null
  kind: modify
  setup: |
    CREATE TABLE "cards" ("id" INTEGER, PRIMARY KEY("id"));
    CREATE TABLE "stations" ("id" INTEGER, "name" TEXT NOT NULL UNIQUE, "line" TEXT NOT NULL, PRIMARY KEY("id"));
    INSERT INTO "cards" VALUES (1);
    INSERT INTO "stations" VALUES (1, 'Harvard', 'red');
  prompt: |
    Create `swipes` exactly as designed in Lecture 2:
    * `id` INTEGER primary key; `card_id` and `station_id` INTEGER foreign keys to `cards(id)` / `stations(id)`
    * `type` TEXT, required, only `'enter'`, `'exit'` or `'deposit'`
    * `datetime` NUMERIC, required, defaulting to the current timestamp
    * `amount` NUMERIC, required, never 0
  hints:
    - "Restricting a column to a list of values: `CHECK(\"type\" IN (...))`."
    - "`DEFAULT CURRENT_TIMESTAMP`; `CHECK(\"amount\" != 0)`."
    - "`\"type\" TEXT NOT NULL CHECK(\"type\" IN ('enter', 'exit', 'deposit')), \"datetime\" NUMERIC NOT NULL DEFAULT CURRENT_TIMESTAMP, ...` then PRIMARY KEY and two FOREIGN KEYs."
  solution: |
    CREATE TABLE "swipes" (
        "id" INTEGER,
        "card_id" INTEGER,
        "station_id" INTEGER,
        "type" TEXT NOT NULL CHECK("type" IN ('enter', 'exit', 'deposit')),
        "datetime" NUMERIC NOT NULL DEFAULT CURRENT_TIMESTAMP,
        "amount" NUMERIC NOT NULL CHECK("amount" != 0),
        PRIMARY KEY("id"),
        FOREIGN KEY("card_id") REFERENCES "cards"("id"),
        FOREIGN KEY("station_id") REFERENCES "stations"("id")
    );
  probes:
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, 'enter', -2.40)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, 'teleport', -2.40)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, 'deposit', 0)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, NULL, 5)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (7, 1, 'enter', -2.40)
    - INSERT INTO "swipes" ("card_id", "station_id", "type", "amount") VALUES (1, 1, 'deposit', NULL)
  check:
    - SELECT "type", "amount", "datetime" IS NOT NULL FROM "swipes"
  explanation: |
    Constraints are guardrails. Each rejected probe above is a bad row that could never get into this table.
  source:
    - {file: lecture2, lines: "1241-1290", quote: "I could say, maybe the type is in enter exit or is in deposit."}

- id: M1-E09
  title: Rename visits to swipes and add a column
  origin: source-demo
  concepts: [C1.8]
  difficulty: 1
  skills: [ALTER TABLE RENAME TO, ADD COLUMN]
  db: null
  kind: modify
  setup: |
    CREATE TABLE "visits" ("rider_id" INTEGER, "station_id" INTEGER);
    INSERT INTO "visits" VALUES (1, 1), (2, 1);
  prompt: |
    Without dropping any data:
    1. Rename table `visits` to `swipes`.
    2. Add a column `type` with TEXT affinity to `swipes`.
  hints:
    - Use `ALTER TABLE`, not `DROP TABLE`, so the rows survive.
    - "`ALTER TABLE ... RENAME TO ...;` then `ALTER TABLE ... ADD COLUMN ... TEXT;`"
    - "`ALTER TABLE \"visits\" RENAME TO \"swipes\"; ALTER TABLE \"swipes\" ADD COLUMN \"type\" TEXT;`"
  solution: |
    ALTER TABLE "visits" RENAME TO "swipes";
    ALTER TABLE "swipes" ADD COLUMN "type" TEXT;
  check:
    - SELECT "name" FROM sqlite_master WHERE "type" = 'table' ORDER BY "name"
    - SELECT "name", upper("type") FROM pragma_table_info('swipes')
    - SELECT COUNT(*) FROM "swipes"
  explanation: Existing rows get NULL in the new column, or the column's DEFAULT if one is declared.
  source:
    - {file: lecture2, lines: "1128-1151", quote: "alter table, as we saw before, visits"}

