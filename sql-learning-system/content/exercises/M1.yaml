- id: M1-E07
  title: Who wrote The Birthday Party?
  origin: source-demo
  concepts: [C1.4]
  difficulty: 2
  skills: [nested subqueries, many-to-many]
  db: longlist
  kind: query
  prompt: Return the `name` of the author of *The Birthday Party*, crossing books → authored → authors with nested subqueries.
  hints:
    - Start from what you know (the title) and walk to what you want (the name).
    - "Three steps: book id → author_id (in authored) → name."
    - "`SELECT \"name\" FROM \"authors\" WHERE \"id\" = (SELECT \"author_id\" FROM \"authored\" WHERE \"book_id\" = (SELECT \"id\" FROM \"books\" WHERE ...));`"
  solution: |
    SELECT "name" FROM "authors" WHERE "id" = (
        SELECT "author_id" FROM "authored" WHERE "book_id" = (
            SELECT "id" FROM "books" WHERE "title" = 'The Birthday Party'
        )
    );
  expected_known: [["Laurent Mauvignier"]]
  explanation: The ids match the lecture's walk-through. The book is 8, and the author is 44, Laurent Mauvignier.
  source:
    - {file: lecture1, lines: "791-835", quote: "We see our friend Laurent Mauvignier."}

- id: M1-E08
  title: Fernanda Melchor's books, with IN
  origin: source-demo
  concepts: [C1.4, C1.5]
  difficulty: 2
  skills: [subquery, IN]
  db: longlist
  kind: query
  prompt: Return the titles of every book written by Fernanda Melchor, using nested subqueries (no JOIN and no hard-coded ids).
  hints:
    - The middle step returns *two* book ids.
    - "`= (subquery)` is for exactly one value. For a list, use `IN (subquery)`."
    - "`SELECT \"title\" FROM \"books\" WHERE \"id\" IN (SELECT \"book_id\" FROM \"authored\" WHERE \"author_id\" = (SELECT \"id\" FROM \"authors\" WHERE ...));`"
  solution: |
    SELECT "title" FROM "books"
    WHERE "id" IN (
        SELECT "book_id" FROM "authored"
        WHERE "author_id" = (
            SELECT "id" FROM "authors"
            WHERE "name" = 'Fernanda Melchor'
        )
    );
  expected_known: [["Hurricane Season"], ["Paradais"]]
  explanation: "Rule of thumb from the lecture: use `=` when you know there is one id, and `IN` when there may be several (L975-984). Lecture 4 later collapses this into one line with a view (M4-E02)."
  source:
    - {file: lecture1, lines: "896-941", quote: "And now I should see, finally, Fernanda's two books."}

- id: M1-E09
  title: Join sea lions to their migrations
  origin: source-demo
  concepts: [C1.6]
  difficulty: 2
  skills: [JOIN ... ON]
  db: sea_lions
  kind: query
  prompt: Return every column of `sea_lions` joined with `migrations`, matching on their `id` columns.
  hints:
    - JOIN puts a row of one table next to the matching row of another.
    - "`ON` says which columns must be equal."
    - "`SELECT * FROM \"sea_lions\" JOIN \"migrations\" ON \"migrations\".\"id\" = \"sea_lions\".\"id\";`"
  solution: |
    SELECT * FROM "sea_lions"
    JOIN "migrations" ON "migrations"."id" = "sea_lions"."id";
  explanation: |
    A plain JOIN is an INNER JOIN. Jolee (no migration) and the two migrations of untracked sea lions disappear, because only matching rows survive.
  source:
    - {file: lecture1, lines: "1108-1162", quote: "So, this is our example, then, of an INNER JOIN."}

- id: M1-E10
  title: Keep every tracked sea lion (LEFT JOIN)
  origin: source-demo
  concepts: [C1.7]
  difficulty: 2
  skills: [LEFT JOIN]
  db: sea_lions
  kind: query
  prompt: Join the same tables but keep **every sea lion**, including Jolee, who has no migration yet.
  hints:
    - An OUTER join keeps unmatched rows and fills the gaps with NULL.
    - The table written first (before the JOIN keyword) is the "left" one.
    - "`... FROM \"sea_lions\" LEFT JOIN \"migrations\" ON ...;`"
  solution: |
    SELECT * FROM "sea_lions"
    LEFT JOIN "migrations" ON "migrations"."id" = "sea_lions"."id";
  explanation: "Jolee's distance and days come back as NULL. RIGHT JOIN keeps every row of the right table instead (L1252-1272)."
  source:
    - {file: lecture1, lines: "1224-1251", quote: "Where we left off Jolee earlier, we've now"}

- id: M1-E11
  title: Keep everything (FULL JOIN)
  origin: source-demo
  concepts: [C1.7]
  difficulty: 2
  skills: [FULL JOIN]
  db: sea_lions
  kind: query
  prompt: Join the tables so that **both** unmatched sea lions and unmatched migrations appear.
  hints:
    - LEFT keeps the left side and RIGHT keeps the right side. What keeps both?
    - Missing values on either side become NULL.
    - "`... FROM \"sea_lions\" FULL JOIN \"migrations\" ON ...;`"
  solution: |
    SELECT * FROM "sea_lions"
    FULL JOIN "migrations" ON "migrations"."id" = "sea_lions"."id";
  explanation: RIGHT and FULL JOIN need SQLite 3.39 (2022) or newer. Older versions report a syntax error.
  source:
    - {file: lecture1, lines: "1274-1288", quote: "A FULL JOIN, though, allows us to see the entirety of both tables"}

- id: M1-E12
  title: Let the column names decide (NATURAL JOIN)
  origin: source-demo
  concepts: [C1.8]
  difficulty: 1
  skills: [NATURAL JOIN]
  db: sea_lions
  kind: query
  prompt: Join `sea_lions` and `migrations` without writing an ON clause. Notice that `id` appears only once in the result.
  hints:
    - A NATURAL JOIN matches every column whose name appears in both tables.
    - Both tables have a column named `id`.
    - "`SELECT * FROM \"sea_lions\" NATURAL JOIN \"migrations\";`"
  solution: |
    SELECT * FROM "sea_lions" NATURAL JOIN "migrations";
  explanation: |
    It is convenient but fragile. If both tables later gain another same-named column (e.g. `name`), the join silently changes meaning.
  source:
    - {file: lecture1, lines: "1380-1399", quote: "Notice, too, we don't get a duplicate id column."}

- id: M1-E13
  title: Author names next to titles, with JOIN
  origin: source-demo
  concepts: [C1.6]
  difficulty: 2
  skills: [JOIN, many-to-many]
  db: longlist
  kind: query
  prompt: Return every author's **name** next to the **title** of each book they wrote (one row per authorship).
  hints:
    - The two entities are connected through `authored`.
    - Two JOINs, each matching a primary key with a foreign key.
    - "`FROM \"authors\" JOIN \"authored\" ON \"authors\".\"id\" = \"authored\".\"author_id\" JOIN \"books\" ON ...`"
  solution: |
    SELECT "name", "title" FROM "authors"
    JOIN "authored" ON "authors"."id" = "authored"."author_id"
    JOIN "books" ON "books"."id" = "authored"."book_id";
  explanation: This is the query behind the `longlist` view in Lecture 4 (M4-E01).
  source:
    - {file: lecture1, lines: "1025-1032", quote: "And this one is going to be called a JOIN."}
    - {file: lecture4, lines: "203-240", quote: "JOIN books ON books dot id equals, in this case, authored dot book_id"}

- id: M1-E14
  title: Authors and translators in one list, labelled
  origin: source-demo
  concepts: [C1.9]
  difficulty: 2
  skills: [UNION, constant column, AS]
  db: longlist
  kind: query
  prompt: |
    Return one list of everyone who is an author or a translator, with two columns, `profession` ('author' or 'translator') and `name`.
  hints:
    - Two queries with the same number of columns can be stacked with a set operator.
    - "A literal `'author' AS \"profession\"` adds a constant column."
    - "`SELECT 'author' AS \"profession\", \"name\" FROM \"authors\" UNION SELECT 'translator' AS \"profession\", \"name\" FROM \"translators\";`"
  solution: |
    SELECT 'author' AS "profession", "name" FROM "authors"
    UNION
    SELECT 'translator' AS "profession", "name" FROM "translators";
  explanation: UNION removes duplicate rows (UNION ALL keeps them). Ngũgĩ appears twice here because his two rows differ in `profession`.
  source:
    - {file: lecture1, lines: "1504-1528", quote: "So I've combined these two sets into one that works for me here."}

