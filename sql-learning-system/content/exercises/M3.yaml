- id: M3-E05
  title: Insert two rows in one statement
  origin: source-demo
  concepts: [C3.3]
  difficulty: 1
  skills: [multi-row INSERT, "NULL"]
  db: mfa
  kind: modify
  setup: |
    DELETE FROM "created"; DELETE FROM "collections";
    INSERT INTO "collections" ("title", "accession_number", "acquired") VALUES
      ('Profusion of Flowers', '56.257', '1956-04-12'),
      ('Farmers Working at Dawn', '11.6152', '1911-08-03'),
      ('Spring Outing', '14.76', '1914-01-08');
  prompt: |
    With **one** INSERT statement, add:
    * **Imaginative Landscape**, accession `56.496`. The museum doesn't know when it was acquired.
    * **Peonies and Butterfly**, accession `06.1899`, acquired `1906-01-01`
  hints:
    - One VALUES keyword, then several parenthesized rows separated by commas.
    - An unknown date is `NULL`. Quote `'06.1899'`, or the leading zero disappears (errata #5).
    - "`INSERT INTO ... (...) VALUES ('Imaginative Landscape', '56.496', NULL), ('Peonies and Butterfly', '06.1899', '1906-01-01');`"
  solution: |
    INSERT INTO "collections" ("title", "accession_number", "acquired")
    VALUES
    ('Imaginative Landscape', '56.496', NULL),
    ('Peonies and Butterfly', '06.1899', '1906-01-01');
  check:
    - SELECT "title", "accession_number", "acquired" FROM "collections"
  explanation: |
    One multi-row INSERT is both more convenient and faster than many single inserts. It is also all-or-nothing:
    if one row violates a constraint, none are inserted (L632-638).
  source:
    - {file: lecture3, lines: "334-364", quote: "So a handy way to insert more than one value."}

- id: M3-E06
  title: From an imported CSV into the real table
  origin: source-demo
  concepts: [C3.3, C3.4]
  difficulty: 3
  skills: [INSERT INTO ... SELECT, NULLIF, DROP TABLE]
  db: mfa
  kind: modify
  setup: |
    DELETE FROM "created"; DELETE FROM "collections";
    -- What `.import --csv mfa_noid.csv temp` produces: every value is TEXT, and blanks are '' (not NULL)
    CREATE TABLE "temp" ("title" TEXT, "accession_number" TEXT, "acquired" TEXT);
    INSERT INTO "temp" VALUES
      ('Profusion of Flowers', '56.257', '1956-04-12'),
      ('Farmers Working at Dawn', '11.6152', '1911-08-03'),
      ('Spring Outing', '14.76', '1914-01-08'),
      ('Imaginative Landscape', '56.496', ''),
      ('Peonies and Butterfly', '06.1899', '1906-01-01');
  prompt: |
    You imported `database/csv/mfa_noid.csv` (no id column) into a new table `temp`, as in the lecture.
    1. Copy all of its rows into `collections` so that SQLite generates the ids. Turn the empty-string acquisition date into a real `NULL` while copying.
    2. Drop `temp`.
  hints:
    - "`INSERT INTO table (cols) SELECT cols FROM other;` inserts a query's result. The columns must line up."
    - "`NULLIF(x, '')` returns NULL when x is the empty string, otherwise x."
    - "`INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") SELECT \"title\", \"accession_number\", NULLIF(\"acquired\", '') FROM \"temp\"; DROP TABLE \"temp\";`"
  solution: |
    INSERT INTO "collections" ("title", "accession_number", "acquired")
    SELECT "title", "accession_number", NULLIF("acquired", '') FROM "temp";
    DROP TABLE "temp";
  check:
    - SELECT "title", "accession_number", "acquired" FROM "collections"
    - SELECT COUNT(*) FROM sqlite_master WHERE "name" = 'temp'
    - SELECT COUNT(*) FROM "collections" WHERE "acquired" IS NULL
  explanation: |
    The lecture moves the rows with `INSERT INTO ... SELECT` (L570-595) and notes that CSV blanks import as empty text, not NULL (L640-663).
    `NULLIF` is one way to do the clean-up it recommends. The lecture suggests a later UPDATE instead, and either works.
  source:
    - {file: lecture3, lines: "570-603", quote: "I actually have a way to dynamically select all the values I want to insert"}
    - {file: lecture3, lines: "644-663", quote: "it won't be converted to"}

- id: M3-E07
  title: Delete everything acquired before 1909
  origin: source-question
  concepts: [C3.5]
  difficulty: 2
  skills: [DELETE, date comparison]
  db: mfa
  kind: modify
  setup: |
    INSERT INTO "collections" ("title", "accession_number", "acquired") VALUES
      ('Peonies and Butterfly', '06.1899', '1906-01-01');
  prompt: |
    The MFA moved to a new building in 1909, and pieces acquired *before* 1909 stayed behind.
    Delete every item with an acquisition date earlier than 1 January 1909.
    Think first: what happens to *Imaginative Landscape*, whose date is NULL?
  hints:
    - Which column expresses "before 1909"? Ids are a fragile proxy (L787-792).
    - "Dates in `YYYY-MM-DD` text compare correctly with `<`."
    - "`DELETE FROM \"collections\" WHERE \"acquired\" < '1909-01-01';`"
  solution: |
    DELETE FROM "collections" WHERE "acquired" < '1909-01-01';
  check:
    - SELECT "title" FROM "collections"
  explanation: |
    `NULL < '1909-01-01'` is NULL (unknown), not true, so the undated artwork is **kept**.
  source:
    - {file: lecture3, lines: "750-813", quote: "WHERE the \"acquired\" column is less than some date"}

- id: M3-E08
  title: Delete the undated artwork
  origin: source-demo
  concepts: [C3.5]
  difficulty: 1
  skills: [DELETE, IS NULL]
  db: mfa
  kind: modify
  prompt: The museum sells *Imaginative Landscape*. Delete it by selecting the row whose acquisition date is unknown.
