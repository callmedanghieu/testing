    - SELECT * FROM "2021"
  explanation: |
    Naming trade-off from the lecture: `"2021"` is short but ambiguous, and `books_nominated_in_2021` is clear but long.
  source:
    - {file: lecture4, lines: "749-790", quote: "I'll say create view 2021 as select ID, title from books."}

- id: M3-E07
  title: Try to update a view
  origin: source-demo
  concepts: [C3.1, C3.6]
  difficulty: 1
  skills: [read-only views]
  db: longlist
  kind: error
  expect_error: is a view
  setup: |
    CREATE VIEW "2021" AS SELECT "id", "title" FROM "books" WHERE "year" = 2021;
  prompt: |
    Through the `"2021"` view, try to rename *Minor Detail* to *The Minor Detail* with an UPDATE. Read the error.
  hints:
    - Write the UPDATE against the view's name.
    - "`UPDATE \"2021\" SET ... WHERE ...;`"
    - "`UPDATE \"2021\" SET \"title\" = 'The Minor Detail' WHERE \"title\" = 'Minor Detail';`"
  solution: |
    UPDATE "2021" SET "title" = 'The Minor Detail' WHERE "title" = 'Minor Detail';
  explanation: |
    In SQLite a view holds no data of its own, so it cannot be modified directly (MySQL and PostgreSQL allow it for simple views, errata #11).
  source:
    - {file: lecture4, lines: "827-838", quote: "cannot modify 2021 because it is"}

