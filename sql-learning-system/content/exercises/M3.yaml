- id: M3-E09
  title: Delete an artist the two-step way
  origin: source-demo
  concepts: [C3.5, C3.6, C1.4]
  difficulty: 3
  skills: [DELETE, subquery, FOREIGN KEY]
  db: mfa
  kind: modify
  setup: |
    -- rebuild "created" WITHOUT ON DELETE CASCADE (the first version in the lecture)
    DROP TABLE "created";
    CREATE TABLE "created" (
        "artist_id" INTEGER, "collection_id" INTEGER,
        FOREIGN KEY("artist_id") REFERENCES "artists"("id"),
        FOREIGN KEY("collection_id") REFERENCES "collections"("id")
    );
    INSERT INTO "created" VALUES (1, 2), (3, 1), (2, 3), (2, 4);
  prompt: |
    Remove **Unidentified artist** completely. `created` has no ON DELETE action here, so deleting the artist first fails.
    Do it in the right order, and **don't hard-code the artist's id**.
  hints:
    - First remove what *references* the artist, then the artist.
    - Find the id with a subquery on `artists`.
    - "`DELETE FROM \"created\" WHERE \"artist_id\" = (SELECT \"id\" FROM \"artists\" WHERE \"name\" = 'Unidentified artist');` then `DELETE FROM \"artists\" WHERE ...;`"
  solution: |
    DELETE FROM "created" WHERE "artist_id" = (
        SELECT "id" FROM "artists" WHERE "name" = 'Unidentified artist'
    );
    DELETE FROM "artists" WHERE "name" = 'Unidentified artist';
  check:
    - SELECT * FROM "artists"
    - SELECT * FROM "created"
  explanation: The order matters. Delete the referencing rows first, then the row they reference.
  source:
    - {file: lecture3, lines: "954-979", quote: "First delete their affiliation, then delete their name."}

- id: M3-E10
  title: Hit the FOREIGN KEY constraint
  origin: source-demo
  concepts: [C3.6]
  difficulty: 1
  skills: [FOREIGN KEY]
  db: mfa
  kind: error
  expect_error: FOREIGN KEY constraint failed
  setup: |
    DROP TABLE "created";
    CREATE TABLE "created" (
        "artist_id" INTEGER, "collection_id" INTEGER,
        FOREIGN KEY("artist_id") REFERENCES "artists"("id"),
        FOREIGN KEY("collection_id") REFERENCES "collections"("id")
    );
    INSERT INTO "created" VALUES (1, 2), (3, 1), (2, 3), (2, 4);
  prompt: Delete *Unidentified artist* directly from `artists` and read the error.
  hints:
    - The artist's id is still referenced in `created`.
    - A plain DELETE with a WHERE on the name.
    - "`DELETE FROM \"artists\" WHERE \"name\" = 'Unidentified artist';`"
  solution: |
    DELETE FROM "artists" WHERE "name" = 'Unidentified artist';
  explanation: |
    The default action is effectively RESTRICT. SQLite refuses to leave `created` pointing at nothing.
    (This only happens with `PRAGMA foreign_keys = ON`.)
  source:
    - {file: lecture3, lines: "885-896", quote: "I do get that FOREIGN KEY constraint error"}

- id: M3-E11
  title: Let ON DELETE CASCADE do both steps
  origin: source-demo
  concepts: [C3.6]
  difficulty: 2
  skills: [ON DELETE CASCADE]
  db: mfa
  kind: modify
  prompt: |
    In this version of the schema, `created`'s foreign keys say `ON DELETE CASCADE` (check with `.schema` or `SELECT sql FROM sqlite_master`).
    Delete *Unidentified artist* with **one** statement and confirm their row in `created` is gone too.
  hints:
    - With CASCADE, deleting the referenced row also deletes the referencing rows.
    - Just delete from `artists`.
    - "`DELETE FROM \"artists\" WHERE \"name\" = 'Unidentified artist';`"
  solution: |
    DELETE FROM "artists" WHERE "name" = 'Unidentified artist';
  check:
    - SELECT * FROM "artists"
    - SELECT * FROM "created"
  explanation: |
    The other ON DELETE choices: RESTRICT (refuse), NO ACTION (allow, leaving dangling ids), SET NULL, SET DEFAULT, and CASCADE.
  source:
    - {file: lecture3, lines: "988-1013", quote: "This converts our 2-step process into a 1-step process."}
    - {file: lecture3, lines: "1044-1052", quote: "I've also deleted the artist's affiliation with their work"}

- id: M3-E12
  title: Re-attribute an artwork with UPDATE
  origin: source-demo
  concepts: [C3.7, C1.4]
  difficulty: 2
  skills: [UPDATE, subquery]
  db: mfa
  kind: modify
  prompt: |
    Research shows *Farmers Working at Dawn* was painted by **Li Yin**, not by "Unidentified artist".
    Update `created` accordingly, using subqueries for both ids.
  hints:
    - The fact to change lives in the junction table `created`, not in `artists`.
    - "`SET \"artist_id\" = (subquery for Li Yin)` and `WHERE \"collection_id\" = (subquery for the painting)`."
    - "`UPDATE \"created\" SET \"artist_id\" = (SELECT \"id\" FROM \"artists\" WHERE \"name\" = 'Li Yin') WHERE \"collection_id\" = (SELECT \"id\" FROM \"collections\" WHERE \"title\" = 'Farmers Working at Dawn');`"
  solution: |
    UPDATE "created" SET "artist_id" = (
        SELECT "id" FROM "artists" WHERE "name" = 'Li Yin'
    )
    WHERE "collection_id" = (
        SELECT "id" FROM "collections" WHERE "title" = 'Farmers Working at Dawn'
    );
  check:
    - SELECT * FROM "created"
  explanation: Without the WHERE, every artwork would be attributed to Li Yin (debugging D3-03).
  source:
    - {file: lecture3, lines: "1146-1176", quote: "So I have Li Yin associated with now two paintings overall."}

- id: M3-E13
  title: Clean the votes and get four groups
  origin: source-demo
  concepts: [C3.8]
  difficulty: 3
  skills: [UPDATE, trim, upper, LIKE]
  db: votes
  kind: modify
  prompt: |
    The `votes` table holds 20 typed-in votes with stray spaces, inconsistent capitals and typos.
    Write UPDATE statements so that `SELECT "title", COUNT(*) FROM "votes" GROUP BY "title";` returns exactly four groups:
    *Farmers Working at Dawn*, *Imaginative Landscape*, *Profusion of Flowers*, *Spring Outing*.
    Capitalization is up to you; the checker compares case-insensitively but requires no leading or trailing spaces.
  hints:
    - "Fix the systematic problems first, for all rows (no WHERE): whitespace with `trim()`, case with `upper()`."
    - "Then fix families of typos with `LIKE` patterns (`%` = any characters; LIKE ignores case), and fix the one-off typos with `=`."
    - "Run the GROUP BY after each step. For example `UPDATE \"votes\" SET \"title\" = 'FARMERS WORKING AT DAWN' WHERE \"title\" LIKE 'Fa%';` Then do Imaginative, the `Imagintive` typo, and Profusion."
  solution: |
    UPDATE "votes" SET "title" = trim("title");
    UPDATE "votes" SET "title" = upper("title");
    UPDATE "votes" SET "title" = 'FARMERS WORKING AT DAWN' WHERE "title" LIKE 'Fa%';
    UPDATE "votes" SET "title" = 'IMAGINATIVE LANDSCAPE' WHERE "title" LIKE 'Imaginative %';
    UPDATE "votes" SET "title" = 'IMAGINATIVE LANDSCAPE' WHERE "title" = 'IMAGINTIVE LANDSCAPE';
    UPDATE "votes" SET "title" = 'PROFUSION OF FLOWERS' WHERE "title" LIKE 'Profusion%';
  check:
    - SELECT upper("title"), COUNT(*) FROM "votes" GROUP BY upper("title")
    - SELECT COUNT(*) FROM "votes" WHERE "title" != trim("title")
  explanation: |
    The final tally is Farmers 6, Imaginative 5, Profusion 5, Spring Outing 4. The lecture reports 6 and 5 for the first two.
    `LIKE 'Fa%'` is fine for this tiny data set, but in real data it could also match other titles (see debugging D3-06).
  source:
    - {file: lecture3, lines: "1281-1299", quote: "takes a string and just removes leading and trailing"}
    - {file: lecture3, lines: "1384-1394", quote: "so be careful with this"}
    - {file: lecture3, lines: "1444-1448", quote: "Farmers Working At Dawn has six votes."}

- id: M3-E14
  title: Triggers that log sales and purchases
  origin: source-demo
  concepts: [C3.9]
  difficulty: 3
  skills: [CREATE TRIGGER, OLD, NEW]
  db: mfa
  kind: modify
  prompt: |
    1. Create `transactions(id INTEGER primary key, title TEXT, action TEXT)`.
    2. Create trigger **sell**: *before* a row is deleted from `collections`, insert its title with action `'sold'`.
    3. Create trigger **buy**: *after* a row is inserted into `collections`, insert its title with action `'bought'`.

    The checker then deletes *Profusion of Flowers* and re-inserts it, and inspects `transactions`.
  hints:
    - "Shape: `CREATE TRIGGER name BEFORE DELETE ON table FOR EACH ROW BEGIN ...; END;`"
    - "In a DELETE trigger the row being removed is `OLD`. In an INSERT trigger the new row is `NEW`."
    - "Body of sell: `INSERT INTO \"transactions\" (\"title\", \"action\") VALUES (OLD.\"title\", 'sold');`"
  solution: |
    CREATE TABLE "transactions" (
        "id" INTEGER,
        "title" TEXT,
        "action" TEXT,
        PRIMARY KEY("id")
    );
    CREATE TRIGGER "sell"
    BEFORE DELETE ON "collections"
    FOR EACH ROW
    BEGIN
        INSERT INTO "transactions" ("title", "action")
        VALUES (OLD."title", 'sold');
    END;
    CREATE TRIGGER "buy"
    AFTER INSERT ON "collections"
    FOR EACH ROW
    BEGIN
        INSERT INTO "transactions" ("title", "action")
        VALUES (NEW."title", 'bought');
    END;
  probes:
    - DELETE FROM "collections" WHERE "title" = 'Profusion of Flowers'
    - INSERT INTO "collections" ("title", "accession_number", "acquired") VALUES ('Profusion of Flowers', '56.257', '1956-04-12')
  check:
    - SELECT "title", "action" FROM "transactions" ORDER BY "id"
  explanation: |
    You never typed an INSERT into `transactions`. The triggers ran it for you. `FOR EACH ROW` means a DELETE of 3 rows logs 3 sales.
  source:
    - {file: lecture3, lines: "1588-1631", quote: "So automatically, I added \"Profusion of Flowers\""}
    - {file: lecture3, lines: "1638-1678", quote: "So this is the power of triggers."}

- id: M3-E15
  title: Soft-delete instead of delete
  origin: source-demo
  concepts: [C3.10, C2.8]
  difficulty: 2
  skills: [ALTER TABLE ADD COLUMN DEFAULT, UPDATE]
  db: mfa
  kind: modify
  prompt: |
    1. Add a `deleted` column (INTEGER, default 0) to `collections`.
    2. "Delete" *Farmers Working at Dawn* by marking it, so the row stays in the table.
  hints:
    - "`ALTER TABLE ... ADD COLUMN \"deleted\" INTEGER DEFAULT 0;`"
    - "A soft delete is an UPDATE, not a DELETE."
    - "`UPDATE \"collections\" SET \"deleted\" = 1 WHERE \"title\" = 'Farmers Working at Dawn';`"
  solution: |
    ALTER TABLE "collections" ADD COLUMN "deleted" INTEGER DEFAULT 0;
    UPDATE "collections" SET "deleted" = 1 WHERE "title" = 'Farmers Working at Dawn';
  check:
    - SELECT "title", "deleted" FROM "collections"
  explanation: |
    Now every query must filter on `"deleted" = 0` (or `!= 1`), which is why Lecture 4 wraps that filter in a view.
    Ethics: for personal data, a soft delete may not honour a request to be forgotten (GDPR, L1774-1784).
  source:
    - {file: lecture3, lines: "1737-1757", quote: "but technically-- at least we marked it as deleted"}
