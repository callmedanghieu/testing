# Module 3: Viewing (sources/lecture4.txt)
- id: M3-E01
  title: A view that hides the joins
  origin: source-demo
  concepts: [C3.1, C3.2]
  difficulty: 2
  skills: [CREATE VIEW, JOIN]
  db: longlist
  kind: modify
  prompt: |
    Create a view named `longlist` with two columns, `name` (author) and `title` (book), one row per authorship.
  hints:
    - A view is `CREATE VIEW name AS <any SELECT>;`
    - Reuse the three-table JOIN from M0-E09.
    - "`CREATE VIEW \"longlist\" AS SELECT \"name\", \"title\" FROM \"authors\" JOIN \"authored\" ON ... JOIN \"books\" ON ...;`"
  solution: |
    CREATE VIEW "longlist" AS
    SELECT "name", "title" FROM "authors"
    JOIN "authored" ON "authors"."id" = "authored"."author_id"
    JOIN "books" ON "books"."id" = "authored"."book_id";
  check:
    - SELECT "name", "title" FROM "longlist"
    - SELECT "type" FROM sqlite_master WHERE "name" = 'longlist'
  explanation: |
    The view stores the *query*, not a copy of the rows, so it costs almost no disk space and is always up to date.
  source:
    - {file: lecture4, lines: "255-278", quote: "I'll say create a view and call it longlist"}
    - {file: lecture4, lines: "77-80", quote: "a virtual table"}

- id: M3-E02
  title: Fernanda's books, now in one line
  origin: source-question
  concepts: [C3.2]
  difficulty: 1
  skills: [querying a view]
  db: longlist
  kind: query
  setup: |
    CREATE VIEW "longlist" AS
    SELECT "name", "title" FROM "authors"
    JOIN "authored" ON "authors"."id" = "authored"."author_id"
    JOIN "books" ON "books"."id" = "authored"."book_id";
  prompt: |
    The `longlist` view exists. Using **only the view**, return the titles Fernanda Melchor wrote.
    Compare this with your three-level subquery from M0-E08.
  hints:
    - You can query a view exactly like a table.
    - It already has a `name` and a `title` column.
    - "`SELECT \"title\" FROM \"longlist\" WHERE \"name\" = 'Fernanda Melchor';`"
  solution: |
    SELECT "title" FROM "longlist" WHERE "name" = 'Fernanda Melchor';
  expected_known: [["Hurricane Season"], ["Paradais"]]
  explanation: The view did the simplifying. The complexity is written once, inside the view definition.
  source:
    - {file: lecture4, lines: "280-304", quote: "SELECT title FROM longlist WHERE the name equals Fernanda."}

- id: M3-E03
  title: The average_book_ratings view
  origin: source-demo
  concepts: [C3.3, C0.4, C0.6]
  difficulty: 3
  skills: [CREATE VIEW, AVG, ROUND, JOIN, GROUP BY]
  db: longlist
  kind: modify
  prompt: |
    Create a view `average_book_ratings` with columns `book_id`, `title`, `year`, `rating`.
    `rating` is the book's average rating rounded to 2 decimals.
  hints:
    - Ratings live in `ratings`, but title and year live in `books`, so you need a JOIN.
    - Group by the book so each book becomes one row.
    - "`SELECT \"book_id\", \"title\", \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\" FROM \"ratings\" JOIN \"books\" ON \"ratings\".\"book_id\" = \"books\".\"id\" GROUP BY \"book_id\"`"
  solution: |
    CREATE VIEW "average_book_ratings" AS
    SELECT "book_id", "title", "year", ROUND(AVG("rating"), 2) AS "rating"
    FROM "ratings"
    JOIN "books" ON "ratings"."book_id" = "books"."id"
    GROUP BY "book_id";
  probes:
    - INSERT INTO "ratings" ("book_id", "rating") VALUES (1, 5), (1, 5)
  check:
    - SELECT * FROM "average_book_ratings"
  explanation: |
    The probe adds two new 5-star ratings to book 1 after the view exists. The view shows the new average immediately, with no refresh.
  source:
    - {file: lecture4, lines: "471-495", quote: "create a view called maybe average book ratings"}
    - {file: lecture4, lines: "514-526", quote: "Every time I query this view, I'll rerun essentially that query from before."}

- id: M3-E04
  title: A temporary view built on a view
  origin: source-demo
  concepts: [C3.3, C3.4]
  difficulty: 2
  skills: [CREATE TEMPORARY VIEW, view on view]
  db: longlist
  kind: modify
  setup: |
    CREATE VIEW "average_book_ratings" AS
    SELECT "book_id", "title", "year", ROUND(AVG("rating"), 2) AS "rating"
    FROM "ratings" JOIN "books" ON "ratings"."book_id" = "books"."id"
    GROUP BY "book_id";
  prompt: |
    Using `average_book_ratings`, create a **temporary** view `average_ratings_by_year` with columns
    `year` and `rating` (the average of the books' averages for that year, rounded to 2 decimals).
  hints:
    - A view can be built on top of another view.
    - "`CREATE TEMPORARY VIEW name AS <query>;` The query aggregates per year with AVG and ROUND."
    - "`SELECT \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\" FROM \"average_book_ratings\" GROUP BY \"year\"`, wrapped in the CREATE TEMPORARY VIEW."
  solution: |
    CREATE TEMPORARY VIEW "average_ratings_by_year" AS
    SELECT "year", ROUND(AVG("rating"), 2) AS "rating"
    FROM "average_book_ratings"
    GROUP BY "year";
  check:
    - SELECT * FROM "average_ratings_by_year"
    - SELECT COUNT(*) FROM sqlite_temp_master WHERE "name" = 'average_ratings_by_year'
  explanation: |
    A TEMPORARY view lives in the `temp` schema and disappears when the connection closes (`.quit`), which suits a one-day analysis.
    Your numbers differ from the lecture's (2022 = 3.87, …) because the ratings here are synthetic.
  source:
    - {file: lecture4, lines: "588-612", quote: "I'll say create a temporary view."}

- id: M3-E05
  title: The same analysis with a CTE
  origin: source-demo
  concepts: [C3.5]
  difficulty: 3
  skills: [WITH (CTE)]
  db: longlist
  kind: query
  prompt: |
    Without creating any view, return `year` and the rounded average of the per-book average ratings (`rating`), one row per year.
    Use a common table expression named `average_book_ratings` for the per-book step.
  hints:
    - "`WITH name AS ( query ) SELECT ... FROM name ...;`"
    - The CTE body is the per-book average query from M3-E03, without CREATE VIEW.
    - "`WITH \"average_book_ratings\" AS (SELECT ... GROUP BY \"book_id\") SELECT \"year\", ROUND(AVG(\"rating\"), 2) AS \"rating\" FROM \"average_book_ratings\" GROUP BY \"year\";`"
  solution: |
    WITH "average_book_ratings" AS (
        SELECT "book_id", "title", "year", ROUND(AVG("rating"), 2) AS "rating"
        FROM "ratings"
        JOIN "books" ON "ratings"."book_id" = "books"."id"
        GROUP BY "book_id"
    )
    SELECT "year", ROUND(AVG("rating"), 2) AS "rating"
    FROM "average_book_ratings"
    GROUP BY "year";
  explanation: |
    Lifetimes: a view lasts forever, a temporary view lasts for one connection, and a CTE lasts for one query.
  source:
    - {file: lecture4, lines: "633-648", quote: "a CTE exists for a single query"}
    - {file: lecture4, lines: "664-696", quote: "I'll use a CTE."}

- id: M3-E06
