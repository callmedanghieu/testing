# Module 2: Writing (sources/lecture3.txt)
- id: M3-E01
  title: Insert the first artwork
  origin: source-demo
  concepts: [C3.1]
  difficulty: 1
  skills: [INSERT INTO]
  db: mfa
  kind: modify
  setup: |
    DELETE FROM "created"; DELETE FROM "collections";
  prompt: |
    The `collections` table is empty. The museum acquires **Profusion of Flowers**, accession number `56.257`, acquired `1956-04-12`.
    Insert it with **id 1**, listing all four columns explicitly.
  hints:
    - "INSERT needs three things: the table, the list of columns, and the matching list of values."
    - "The statement is `INSERT INTO table (column, ...) VALUES (value, ...);`. The n-th value goes into the n-th listed column."
    - "List all four columns (id, title, accession_number, acquired), then the four values in the same order. Quote the text values, including the accession number."
  solution: |
    INSERT INTO "collections" ("id", "title", "accession_number", "acquired")
    VALUES (1, 'Profusion of Flowers', '56.257', '1956-04-12');
  check:
    - SELECT * FROM "collections"
  explanation: Value 1 goes into column 1, value 2 into column 2, and so on.
  source:
    - {file: lecture3, lines: "130-153", quote: "The accession number that we gave it was 56.257."}

- id: M3-E02
  title: Let SQLite choose the primary key
  origin: source-demo
  concepts: [C3.1]
  difficulty: 1
  skills: [INSERT INTO, implicit primary key]
  db: mfa
  kind: modify
  setup: |
    DELETE FROM "created"; DELETE FROM "collections";
    INSERT INTO "collections" VALUES (1, 'Profusion of Flowers', '56.257', '1956-04-12');
    INSERT INTO "collections" VALUES (2, 'Farmers Working at Dawn', '11.6152', '1911-08-03');
  prompt: |
    Insert **Spring Outing** (accession `14.76`, acquired `1914-01-08`) **without** giving an id.
    Then check: what id did it receive?
  hints:
    - Simply leave `id` out of the column list.
    - An `INTEGER` primary key is filled in automatically.
    - "`INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES (...);`"
  solution: |
    INSERT INTO "collections" ("title", "accession_number", "acquired")
    VALUES ('Spring Outing', '14.76', '1914-01-08');
  check:
    - SELECT * FROM "collections"
  explanation: |
    SQLite takes the current highest id (2) and adds 1, giving 3. Choosing ids yourself risks reusing one that is already taken.
    For what changes with `AUTOINCREMENT`, see errata #2: the lecture states it backwards.
  source:
    - {file: lecture3, lines: "206-232", quote: "So it seems like SQLite actually increments the primary key for me."}

- id: M3-E03
  title: Break the UNIQUE constraint
  origin: source-demo
  concepts: [C3.2]
  difficulty: 1
  skills: [UNIQUE]
  db: mfa
  kind: error
  expect_error: UNIQUE constraint failed
  prompt: |
    *Spring Outing* (accession `14.76`) is already in `collections`. Try inserting it **again** with the same accession number, and read the error.
  hints:
    - "`accession_number` was declared `UNIQUE`."
    - Write a normal INSERT with the duplicate value.
    - "`INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES ('Spring Outing', '14.76', '1914-01-08');`"
  solution: |
    INSERT INTO "collections" ("title", "accession_number", "acquired")
    VALUES ('Spring Outing', '14.76', '1914-01-08');
  explanation: The constraint protected the table from a duplicate record. Nothing was inserted.
  source:
    - {file: lecture3, lines: "262-284", quote: "Runtime error-- UNIQUE constraint failed."}

