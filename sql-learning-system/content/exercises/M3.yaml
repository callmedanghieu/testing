- id: M3-E09
  title: An anonymized view for analysts
  origin: source-demo
  concepts: [C3.7]
  difficulty: 2
  skills: [CREATE VIEW, constant column, AS]
  db: rideshare
  kind: modify
  prompt: |
    Create a view `analysis` with `id`, `origin`, `destination`, and a `rider` column that always contains the text `anonymous`.
  hints:
    - Leave out the real `rider` column, which is personally identifiable information (PII).
    - "A literal in the SELECT list produces that value on every row: `'anonymous' AS \"rider\"`."
    - "`CREATE VIEW \"analysis\" AS SELECT \"id\", \"origin\", \"destination\", 'anonymous' AS \"rider\" FROM \"rides\";`"
  solution: |
    CREATE VIEW "analysis" AS
    SELECT "id", "origin", "destination", 'anonymous' AS "rider"
    FROM "rides";
  check:
    - SELECT * FROM "analysis"
  explanation: |
    In SQLite anyone who can open the file can still run `SELECT * FROM "rides"`. There are no per-user permissions.
    MySQL/PostgreSQL fix this with GRANT (M5-E10).
  source:
    - {file: lecture4, lines: "916-942", quote: "I'll say quote unquote \"anonymous\" as this column name called rider."}
    - {file: lecture4, lines: "962-968", quote: "In SQLite we can't set access controls"}

- id: M3-E10
  title: current_collections, a view over soft deletes
  origin: source-demo
  concepts: [C3.1, C2.10]
  difficulty: 2
  skills: [CREATE VIEW, soft delete]
  db: mfa
  kind: modify
  setup: |
    ALTER TABLE "collections" ADD COLUMN "deleted" INTEGER DEFAULT 0;
    UPDATE "collections" SET "deleted" = 1 WHERE "title" = 'Farmers Working at Dawn';
  prompt: |
    `collections` now has a `deleted` flag. Create a view `current_collections` with `id`, `title`, `accession_number` and `acquired`
    (no `deleted` column) that contains only items **not** marked deleted.
  hints:
    - Filter on the flag, and don't expose it.
    - "`WHERE \"deleted\" = 0`"
    - "`CREATE VIEW \"current_collections\" AS SELECT \"id\", \"title\", \"accession_number\", \"acquired\" FROM \"collections\" WHERE \"deleted\" = 0;`"
  solution: |
    CREATE VIEW "current_collections" AS
    SELECT "id", "title", "accession_number", "acquired"
    FROM "collections"
    WHERE "deleted" = 0;
  probes:
    - UPDATE "collections" SET "deleted" = 1 WHERE "title" = 'Spring Outing'
  check:
    - SELECT * FROM "current_collections"
  explanation: Soft-deleting another item (the probe) removes it from the view at once.
  source:
    - {file: lecture4, lines: "1065-1077", quote: "And now I'll see only those items that have not been deleted."}

- id: M3-E11
  title: INSTEAD OF DELETE, turning a delete into a soft delete
  origin: source-demo
  concepts: [C3.8]
  difficulty: 3
  skills: [INSTEAD OF trigger, OLD]
  db: mfa
  kind: modify
  setup: |
    ALTER TABLE "collections" ADD COLUMN "deleted" INTEGER DEFAULT 0;
    CREATE VIEW "current_collections" AS
    SELECT "id", "title", "accession_number", "acquired" FROM "collections" WHERE "deleted" = 0;
  prompt: |
    Make `DELETE FROM "current_collections" WHERE ...` work: instead of deleting, set `deleted = 1` on the matching base row.
    Name the trigger `"delete"` (quoted, because it is a keyword).
  hints:
    - "`CREATE TRIGGER \"delete\" INSTEAD OF DELETE ON \"current_collections\" FOR EACH ROW BEGIN ... END;`"
    - "`OLD.\"id\"` is the id of the view row being deleted."
    - "Body: `UPDATE \"collections\" SET \"deleted\" = 1 WHERE \"id\" = OLD.\"id\";` Don't forget the WHERE."
  solution: |
    CREATE TRIGGER "delete"
    INSTEAD OF DELETE ON "current_collections"
    FOR EACH ROW
    BEGIN
        UPDATE "collections" SET "deleted" = 1
        WHERE "id" = OLD."id";
    END;
  probes:
    - DELETE FROM "current_collections" WHERE "title" = 'Imaginative Landscape'
  check:
    - SELECT "title", "deleted" FROM "collections"
    - SELECT "title" FROM "current_collections"
  explanation: |
    Without `WHERE "id" = OLD."id"` the UPDATE would soft-delete every artwork (L1148-1153, debugging D3-02).
  source:
    - {file: lecture4, lines: "1133-1170", quote: "where, in this case, the ID column is equal to the old ID"}
    - {file: lecture4, lines: "1178-1194", quote: "So a good way of trying to use triggers here"}

- id: M3-E12
  title: INSTEAD OF INSERT ... WHEN, re-acquiring a deleted item
  origin: source-demo
  concepts: [C3.8]
  difficulty: 4
  skills: [INSTEAD OF trigger, WHEN, NEW, subquery]
  db: mfa
  kind: modify
  setup: |
    ALTER TABLE "collections" ADD COLUMN "deleted" INTEGER DEFAULT 0;
    UPDATE "collections" SET "deleted" = 1 WHERE "title" = 'Imaginative Landscape';
    CREATE VIEW "current_collections" AS
    SELECT "id", "title", "accession_number", "acquired" FROM "collections" WHERE "deleted" = 0;
  prompt: |
    *Imaginative Landscape* (accession `56.496`) was soft-deleted. When someone inserts into `current_collections`
    an item whose **accession number already exists** in `collections`, flip its `deleted` back to 0 instead of adding a row.
    Name the trigger `"insert_when_exists"`.
  hints:
    - "Triggers can be conditional: `FOR EACH ROW WHEN <condition> BEGIN ... END;`"
    - "The condition: `NEW.\"accession_number\" IN (SELECT \"accession_number\" FROM \"collections\")`."
    - "Body: `UPDATE \"collections\" SET \"deleted\" = 0 WHERE \"accession_number\" = NEW.\"accession_number\";`"
  solution: |
    CREATE TRIGGER "insert_when_exists"
    INSTEAD OF INSERT ON "current_collections"
    FOR EACH ROW
    WHEN NEW."accession_number" IN (
        SELECT "accession_number" FROM "collections"
    )
    BEGIN
        UPDATE "collections" SET "deleted" = 0
        WHERE "accession_number" = NEW."accession_number";
    END;
  probes:
    - INSERT INTO "current_collections" ("title", "accession_number", "acquired") VALUES ('Imaginative Landscape', '56.496', NULL)
  check:
    - SELECT "id", "title", "deleted" FROM "collections"
  explanation: |
    The accession number is the museum's own unique id, which makes it the right thing to match on (not `id`, which an INSERT doesn't supply).
  source:
    - {file: lecture4, lines: "1246-1278", quote: "I'll say create trigger insert when exists."}
    - {file: lecture4, lines: "1311-1330", quote: "I only flipped that deleted value from a 1 back down to a 0."}

- id: M3-E13
  title: "Assigned: INSTEAD OF INSERT for genuinely new items"
  origin: source-assigned
  concepts: [C3.8]
  difficulty: 4
  skills: [INSTEAD OF trigger, WHEN NOT IN]
  db: mfa
  kind: modify
  setup: |
    ALTER TABLE "collections" ADD COLUMN "deleted" INTEGER DEFAULT 0;
    UPDATE "collections" SET "deleted" = 1 WHERE "title" = 'Imaginative Landscape';
    CREATE VIEW "current_collections" AS
    SELECT "id", "title", "accession_number", "acquired" FROM "collections" WHERE "deleted" = 0;
    CREATE TRIGGER "insert_when_exists" INSTEAD OF INSERT ON "current_collections" FOR EACH ROW
    WHEN NEW."accession_number" IN (SELECT "accession_number" FROM "collections")
    BEGIN
        UPDATE "collections" SET "deleted" = 0 WHERE "accession_number" = NEW."accession_number";
    END;
  prompt: |
    The lecture ends: *"I could write a trigger to actually add a brand new row to this table here … we leave all that up to you."*
    Write `"insert_when_new"`: when the inserted accession number does **not** exist yet, insert a real new row into `collections`.
    The checker inserts one brand-new artwork and one re-acquired artwork.
  hints:
    - Same shape as `insert_when_exists`, with the opposite condition.
    - "`WHEN NEW.\"accession_number\" NOT IN (SELECT \"accession_number\" FROM \"collections\")`"
    - "Body: `INSERT INTO \"collections\" (\"title\", \"accession_number\", \"acquired\") VALUES (NEW.\"title\", NEW.\"accession_number\", NEW.\"acquired\");`"
  solution: |
    CREATE TRIGGER "insert_when_new"
    INSTEAD OF INSERT ON "current_collections"
    FOR EACH ROW
    WHEN NEW."accession_number" NOT IN (
        SELECT "accession_number" FROM "collections"
    )
    BEGIN
        INSERT INTO "collections" ("title", "accession_number", "acquired")
        VALUES (NEW."title", NEW."accession_number", NEW."acquired");
    END;
  probes:
    - INSERT INTO "current_collections" ("title", "accession_number", "acquired") VALUES ('Peonies and Butterfly', '06.1899', '1906-01-01')
    - INSERT INTO "current_collections" ("title", "accession_number", "acquired") VALUES ('Imaginative Landscape', '56.496', NULL)
  check:
    - SELECT "title", "accession_number", "deleted" FROM "collections"
  explanation: |
    Two complementary conditional triggers cover both cases. The lecture also suggests a follow-up you can try on your own:
    an INSTEAD OF UPDATE trigger, for example to fill in the unknown acquired date (L1333-1334).
  source:
    - {file: lecture4, lines: "1331-1336", quote: "For now though, we leave all that up to you."}
    - {file: lecture4, lines: "1236-1242", quote: "In that case, actually inserting a brand new row"}
