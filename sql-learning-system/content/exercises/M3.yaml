  skills: [CREATE VIEW, WHERE, quoted identifiers]
  db: longlist
  kind: modify
  prompt: |
    Create two views, `"2022"` and `"2021"`, each with the `id` and `title` of the books longlisted in that year.
  hints:
    - A partition is a filtered SELECT saved as a view.
    - A name that is just digits must be quoted, as `"2022"`.
    - "`CREATE VIEW \"2022\" AS SELECT \"id\", \"title\" FROM \"books\" WHERE \"year\" = 2022;`"
  solution: |
    CREATE VIEW "2022" AS SELECT "id", "title" FROM "books" WHERE "year" = 2022;
    CREATE VIEW "2021" AS SELECT "id", "title" FROM "books" WHERE "year" = 2021;
  check:
