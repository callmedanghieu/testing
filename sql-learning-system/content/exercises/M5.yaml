# Module 4: Optimizing (sources/lecture5.txt)
- id: M5-E01
  title: Index the title column
  origin: source-demo
  concepts: [C5.1, C5.2]
  difficulty: 1
  skills: [CREATE INDEX, EXPLAIN QUERY PLAN]
  db: movies
  kind: modify
  prompt: |
    First run `EXPLAIN QUERY PLAN SELECT * FROM "movies" WHERE "title" = 'Cars';` and note the word **SCAN**.
    Then create an index named `title_index` so that the plan becomes a **SEARCH** using that index.
  hints:
    - An index is built on the column(s) your WHERE clause filters on.
    - "`CREATE INDEX name ON table (column);`"
    - "`CREATE INDEX \"title_index\" ON \"movies\" (\"title\");`"
  solution: |
    CREATE INDEX "title_index" ON "movies" ("title");
  check:
    - plan: SELECT * FROM "movies" WHERE "title" = 'Cars'
      contains: ["SEARCH movies USING INDEX title_index"]
  explanation: |
    SCAN means reading every row top to bottom. SEARCH means using a structure to jump to matching rows.
    On the full 400k-row IMDb file the lecture measured 0.084 s before the index and 0.01 s after.
  source:
    - {file: lecture5, lines: "273-286", quote: "That's a savings of almost eight times."}
    - {file: lecture5, lines: "297-316", quote: "using the index that we called title_index"}

- id: M5-E02
  title: Which columns should be indexed for the Tom Hanks query?
  origin: source-question
  concepts: [C5.2]
  difficulty: 3
  skills: [EXPLAIN QUERY PLAN, choosing index columns]
  db: movies
  kind: modify
  prompt: |
    Run `EXPLAIN QUERY PLAN` on the Tom Hanks query (M1-E22). Two tables are **scanned**.
    Create one index per scanned table (`name_index` on people, `person_index` on stars) so that **neither table is scanned**.
  hints:
    - Read the plan from the innermost subquery outward. Which tables say SCAN?
    - Index the column each WHERE clause filters on, `people.name` and `stars.person_id`.
    - "`CREATE INDEX \"person_index\" ON \"stars\" (\"person_id\"); CREATE INDEX \"name_index\" ON \"people\" (\"name\");`"
  solution: |
    CREATE INDEX "person_index" ON "stars" ("person_id");
    CREATE INDEX "name_index" ON "people" ("name");
  check:
    - plan: SELECT "title" FROM "movies" WHERE "id" IN (SELECT "movie_id" FROM "stars" WHERE "person_id" = (SELECT "id" FROM "people" WHERE "name" = 'Tom Hanks'))
      contains: ["USING INDEX person_index", "COVERING INDEX name_index"]
      not_contains: ["SCAN people", "SCAN stars"]
  explanation: |
    `movies` is searched by `id`, its INTEGER PRIMARY KEY, which is always indexed for free.
    Note that `name_index` is reported as a *covering* index: the query needs only `people.id`, which every index entry already carries (rowid).
  source:
    - {file: lecture5, lines: "405-447", quote: "Perhaps two separate indexes."}
    - {file: lecture5, lines: "338-348", quote: "will automatically create an index via which I can search for a primary key"}

- id: M5-E03
  title: Make the stars index covering
  origin: source-demo
  concepts: [C5.3]
  difficulty: 3
  skills: [multi-column index, covering index]
  db: movies
  kind: modify
  setup: |
    CREATE INDEX "person_index" ON "stars" ("person_id");
    CREATE INDEX "name_index" ON "people" ("name");
  prompt: |
    The plan still says `SEARCH stars USING INDEX person_index`, which means SQLite looks up each matching row in the table to get `movie_id`.
    Replace `person_index` with a two-column index so that `stars` is searched with a **covering index**.
  hints:
    - A covering index contains every column the query reads from that table.
    - "Drop the old index, then create it on (`person_id`, `movie_id`). The filter column comes first."
    - "`DROP INDEX \"person_index\"; CREATE INDEX \"person_index\" ON \"stars\" (\"person_id\", \"movie_id\");`"
  solution: |
    DROP INDEX "person_index";
    CREATE INDEX "person_index" ON "stars" ("person_id", "movie_id");
  check:
    - plan: SELECT "title" FROM "movies" WHERE "id" IN (SELECT "movie_id" FROM "stars" WHERE "person_id" = (SELECT "id" FROM "people" WHERE "name" = 'Tom Hanks'))
      contains: ["SEARCH stars USING COVERING INDEX person_index"]
  explanation: |
    On the full data the lecture measured 0.197 s with no indexes and 0.004 s with two covering indexes.
  source:
    - {file: lecture5, lines: "499-542", quote: "Now I have two covering indexes."}
    - {file: lecture5, lines: "482-496", quote: "It's one in which the query data can be found only by searching the index."}

- id: M5-E04
  title: A partial index for recent movies
  origin: source-demo
  concepts: [C5.5]
  difficulty: 3
  skills: [partial index, WHERE in CREATE INDEX]
  db: movies
  kind: modify
  prompt: |
    Users mostly search this year's movies. Create a **partial** index named `recents` on `movies(title)` that only includes rows from **2023**.
    The checker confirms it is used for `year = 2023` and **not** for `year = 1998`.
  hints:
    - A partial index is a normal CREATE INDEX with a WHERE clause at the end.
    - Only rows matching that WHERE are stored in the index, so it is smaller.
    - "`CREATE INDEX \"recents\" ON \"movies\" (\"title\") WHERE \"year\" = 2023;`"
  solution: |
    CREATE INDEX "recents" ON "movies" ("title") WHERE "year" = 2023;
  check:
    - plan: SELECT "title" FROM "movies" WHERE "year" = 2023
      contains: ["recents"]
    - plan: SELECT "title" FROM "movies" WHERE "year" = 1998
      not_contains: ["recents"]
  explanation: |
    The trade-off is a smaller index (less space and cheaper writes) that helps only the queries its condition covers.
  source:
    - {file: lecture5, lines: "892-924", quote: "Now though I'm using 1998, which were rows that were not"}

- id: M5-E05
  title: Drop an index
  origin: source-demo
  concepts: [C5.2]
  difficulty: 1
  skills: [DROP INDEX]
  db: movies
  kind: modify
  setup: |
    CREATE INDEX "title_index" ON "movies" ("title");
  prompt: Remove `title_index` and confirm that the 'Cars' lookup goes back to a SCAN.
  hints:
    - Indexes are dropped like tables and views.
    - "`DROP INDEX name;`"
    - "`DROP INDEX \"title_index\";`"
  solution: |
    DROP INDEX "title_index";
  check:
    - plan: SELECT * FROM "movies" WHERE "title" = 'Cars'
      contains: ["SCAN movies"]
    - SELECT COUNT(*) FROM sqlite_master WHERE "type" = 'index' AND "name" = 'title_index'
  explanation: Dropping an index doesn't shrink the database file until you VACUUM (M5-E10).
  source:
    - {file: lecture5, lines: "322-332", quote: "I can say DROP INDEX \"title_index\" semicolon."}

- id: M5-E06
  title: Alice pays Bob $10, atomically
  origin: source-demo
  concepts: [C5.7]
  difficulty: 2
  skills: [BEGIN TRANSACTION, COMMIT]
  db: bank
  kind: modify
  require: [BEGIN, COMMIT]
  prompt: |
    Move $10 from Alice (id 1) to Bob (id 2) inside a single transaction so that no other connection can ever see Bob credited before Alice is debited.
  hints:
    - Wrap both UPDATEs between `BEGIN TRANSACTION;` and `COMMIT;`
    - "Update relative to the current value: `SET \"balance\" = \"balance\" + 10`."
    - "`BEGIN TRANSACTION; UPDATE \"accounts\" SET \"balance\" = \"balance\" + 10 WHERE \"id\" = 2; UPDATE ... - 10 WHERE \"id\" = 1; COMMIT;`"
  solution: |
    BEGIN TRANSACTION;
    UPDATE "accounts" SET "balance" = "balance" + 10 WHERE "id" = 2;
    UPDATE "accounts" SET "balance" = "balance" - 10 WHERE "id" = 1;
    COMMIT;
  check:
    - SELECT * FROM "accounts"
  explanation: |
    Atomicity: a second terminal sees the old balances until COMMIT, then both changes at once (L1201-1230).
    The checker also fails your answer if you leave the transaction open.
  source:
    - {file: lecture5, lines: "1201-1230", quote: "So this is the atomicity part of transactions."}

- id: M5-E07
  title: Roll back a transfer that breaks a constraint
  origin: source-demo
  concepts: [C5.7]
  difficulty: 3
  skills: [ROLLBACK, CHECK constraint]
  db: bank
  kind: modify
  continue_on_error: true
  require: [BEGIN, ROLLBACK]
  setup: |
    UPDATE "accounts" SET "balance" = 0 WHERE "id" = 1;
    UPDATE "accounts" SET "balance" = 30 WHERE "id" = 2;
  prompt: |
    Alice now has $0 and Bob has $30. Run the same transfer of $10 from Alice to Bob in a transaction.
    The debit violates `CHECK("balance" >= 0)`, so undo the whole transaction so that nobody ever sees Bob at $40.
    (In this exercise, statements keep running after an error, just like typing them one by one in the shell.)
  hints:
    - Credit Bob, then try to debit Alice. Which statement fails?
    - After a failure inside a transaction, the earlier statements are *still pending*, not undone.
    - "`BEGIN TRANSACTION; UPDATE ... + 10 WHERE \"id\" = 2; UPDATE ... - 10 WHERE \"id\" = 1; ROLLBACK;`"
  solution: |
    BEGIN TRANSACTION;
    UPDATE "accounts" SET "balance" = "balance" + 10 WHERE "id" = 2;
    UPDATE "accounts" SET "balance" = "balance" - 10 WHERE "id" = 1;
    ROLLBACK;
  check:
    - SELECT * FROM "accounts"
  explanation: |
    ROLLBACK only works inside a transaction. Without BEGIN, the lecturer had to "undo" Bob's credit by hand with another UPDATE (L1289-1305).
    This is Consistency in ACID: the database never ends in a state that violates its constraints.
  source:
    - {file: lecture5, lines: "1309-1325", quote: "ROLLBACK like this, hit Enter"}
    - {file: lecture5, lines: "1292-1296", quote: "A rollback only works while we're inside of a transaction."}

- id: M5-E08
  title: Defuse the race condition
  origin: source-question
  concepts: [C5.8]
  difficulty: 4
  skills: [isolation, transaction design]
  db: bank
  kind: selfcheck
  prompt: |
    Charlie ($30) clicks "transfer $30 to Alice" on two laptops at the same moment, while Alice waits at an ATM to withdraw $60.
    1. Using the lecture's timeline, explain how the bank loses $30.
    2. Rewrite each transfer so the attack fails, and say which ACID property is at work.
  hints:
    - The danger is checking the balance in one step and spending it in a later step that runs concurrently.
    - Each transfer (check + credit + debit) must run as one isolated unit, one after another.
    - Put the balance check and both updates in one transaction; the second transfer then sees $0 and rolls back.
  solution: |
    -- Model answer:
    -- 1. Both transfers read Charlie's balance (30) before either one subtracts. Both credit Alice $30,
    --    so Alice sees $60 and withdraws it before the bank notices Charlie couldn't cover the second.
    -- 2. Make each transfer one transaction and process transactions sequentially (isolated):
    BEGIN TRANSACTION;
    -- (application checks: SELECT "balance" FROM "accounts" WHERE "id" = 3;  -> must be >= 30)
    UPDATE "accounts" SET "balance" = "balance" + 30 WHERE "id" = 1;
    UPDATE "accounts" SET "balance" = "balance" - 30 WHERE "id" = 3;
    COMMIT;
    -- The second transfer starts after the first committed, sees Charlie at $0, and its debit violates
    -- CHECK("balance" >= 0), so it is rolled back. Property: Isolation (with Consistency enforced by the CHECK).
  explanation: The exclusive lock taken by a writing transaction is what makes the transactions happen one after another (see M5-E09).
  source:
    - {file: lecture5, lines: "1337-1388", quote: "Charlie opened up his bank account"}
    - {file: lecture5, lines: "1397-1430", quote: "and the word for this"}

- id: M5-E09
  title: "Lab: see an exclusive lock block a reader"
  origin: source-demo
  concepts: [C5.9]
  difficulty: 2
  skills: [BEGIN EXCLUSIVE, locks]
  db: bank
  kind: selfcheck
  prompt: |
    This needs two connections, so it runs as a lab: `python3 tools/labs.py locks`
    (or open `database/bank.db` in two terminals with `sqlite3`).
    In connection A run `BEGIN EXCLUSIVE TRANSACTION;`. In connection B run `SELECT * FROM "accounts";`.
    What happens in B, and what happens after A runs `COMMIT;`?
  hints:
    - Which lock kinds exist in SQLite? Which one allows other readers?
    - EXCLUSIVE means nobody else may read or write.
    - B gets an error until A ends its transaction.
  solution: |
    -- connection A
    BEGIN EXCLUSIVE TRANSACTION;
    -- connection B
    SELECT * FROM "accounts";   -- Runtime error: database is locked
    -- connection A
    COMMIT;
    -- connection B
    SELECT * FROM "accounts";   -- works again
  explanation: |
    SHARED locks let many readers in at once. An EXCLUSIVE lock blocks everyone else. In SQLite the lock covers the whole database file (the coarsest granularity).
  source:
    - {file: lecture5, lines: "1534-1546", quote: "Runtime error--"}
    - {file: lecture5, lines: "1464-1494", quote: "unlocked, shared, and exclusive"}

- id: M5-E10
  title: "Lab: VACUUM gives space back"
  origin: source-demo
  concepts: [C5.6]
  difficulty: 1
  skills: [VACUUM]
  db: movies
  kind: selfcheck
  prompt: |
    Run `python3 tools/labs.py vacuum`. It builds a big movies file, creates indexes, drops them, and prints the file size after each step.
    Before running it, predict: does the file shrink after `DROP INDEX`? After `VACUUM`?
  hints:
    - What does SQLite do with the pages an index used to occupy?
    - It marks them free for reuse and keeps them in the file.
    - Only VACUUM rebuilds the file and returns those pages to the operating system.
  solution: |
    DROP INDEX "title_index";   -- file size unchanged (pages only marked as free)
    VACUUM;                     -- file shrinks
  explanation: The lecture saw 158 MB → 158 MB after dropping three indexes, then 100 MB after VACUUM.
  source:
    - {file: lecture5, lines: "991-1010", quote: "We're down to in this case 100 million after dropping our indexes"}

- id: M5-E11
  title: "Lab: time a query before and after an index"
  origin: source-demo
  concepts: [C5.1, C5.2]
  difficulty: 1
  skills: [.timer]
  db: movies
  kind: selfcheck
  prompt: |
    Run `python3 tools/build_db.py --big`, then `sqlite3 database/movies_big.db`, then `.timer on`.
    Time `SELECT * FROM "movies" WHERE "title" = 'Cars';` before and after `CREATE INDEX "title_index" ON "movies" ("title");`.
    `python3 tools/labs.py timer` does the same automatically.
  hints:
    - "`.timer on` is a sqlite3 shell command (no semicolon)."
    - Look at the "real" figure, the wall-clock time.
    - Creating the index takes a while, but you pay that cost only once.
  solution: |
    .timer on
    SELECT * FROM "movies" WHERE "title" = 'Cars';      -- e.g. Run Time: real 0.03x
    CREATE INDEX "title_index" ON "movies" ("title");
    SELECT * FROM "movies" WHERE "title" = 'Cars';      -- e.g. Run Time: real 0.000x
  explanation: "real = stopwatch time, user = CPU time spent on the query, sys = time spent in the operating system (the lecture loosely calls it waiting for other processes)."
  source:
    - {file: lecture5, lines: "127-148", quote: "I'll say .timer on to make sure that I time my future queries."}

- id: M5-E12
  title: Walk the B-tree to find Turning Red
  origin: source-question
  concepts: [C5.4]
  difficulty: 2
  skills: [B-tree search, index trade-offs]
  db: movies
  kind: selfcheck
  prompt: |
    The lecture's index on `title` is a small B-tree: the root node holds **Frozen | Soul**,
    and its three leaf nodes hold *Cars, Cars 3, Frozen* · *Luca, Ratatouille, Soul* · *Toy Story, Turning Red, WALL-E*.
    1. List the comparisons SQLite makes to find **Turning Red**, and say what it gets back from the index.
    2. Why can't SQLite simply sort the `title` column of the table itself?
    3. Name the two costs you pay for this index.
  hints:
    - At each node, ask "does my value come before this key?" to pick the child to follow.
    - Turning Red comes after Frozen and after Soul, so which child does that leave?
    - "Costs: think about pages in a printed book, and about where a new title has to be inserted."
  solution: |
    -- Model answer:
    -- 1. Root: is "Turning Red" before "Frozen"? No. Before "Soul"? No, so follow the third child.
    --    Leaf: Toy Story, then Turning Red, found. The index returns the ROW NUMBER (pointer) of Turning Red in the table,
    --    which SQLite then uses to fetch the other columns (unless the index is covering).
    -- 2. Sorting the table would change which title sits next to which id. Other tables reference those ids, so the
    --    primary key would no longer identify the same movie. The index is a sorted COPY instead.
    -- 3. Space (the copy plus pointers) and slower writes (every INSERT/UPDATE/DELETE must also update the tree).
  explanation: Each comparison discards most of the remaining candidates, which is why the search stays fast even with millions of rows.
  source:
    - {file: lecture5, lines: "782-809", quote: "How could I find Turning Red?"}
    - {file: lecture5, lines: "624-648", quote: "I've broken that relationship"}
    - {file: lecture5, lines: "848-861", quote: "So these trade-offs are something you should"}
