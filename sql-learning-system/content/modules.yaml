M0:
  title: Querying
  lesson: lessons/M0-querying.md
  sources: lecture0 (whole file)
  prerequisites: [none]
  objectives:
    - Explain what databases, DBMSs and SQL are, and why they beat spreadsheets at scale
    - Read data with SELECT / FROM / LIMIT, quoting identifiers and strings correctly
    - Filter with =, != / <>, NOT, AND / OR (with parentheses), IS NULL, LIKE (% and _), ranges and BETWEEN
    - Sort with ORDER BY (ASC / DESC, several keys)
    - Summarize with COUNT, AVG, MIN, MAX, SUM, ROUND, AS and DISTINCT
  challenge: [M0-E13, M0-E17, M0-E05]
  mastery:
    - Solve M0-E05, M0-E13 and M0-E17 without opening any hint
    - Explain why `= NULL` and `COUNT("translator")` behave as they do (D0-01, R0-05)
    - Score ≥ 80% on review deck R0
M1:
  title: Relating
  lesson: lessons/M1-relating.md
  sources: lecture1 (whole file)
  prerequisites: [M0]
  objectives:
    - Classify relationships as one-to-one, one-to-many or many-to-many and read crow's-foot ER diagrams
    - Explain primary keys, foreign keys and junction tables (and why ISBNs make poor keys)
    - Query across tables with subqueries and IN
    - Combine tables with JOIN, LEFT / RIGHT / FULL JOIN and NATURAL JOIN, predicting which rows survive
    - Combine result sets with UNION, INTERSECT and EXCEPT
    - Aggregate per group with GROUP BY, filter groups with HAVING, and sort the result
  challenge: [M1-E17, M1-E18, M1-E20]
  mastery:
    - Solve the lecture's two assignments (M1-E17, M1-E18) without hints
    - Predict the row counts of INNER vs FULL JOIN on sea_lions (R1-04, R1-05)
    - Explain WHERE vs HAVING (D1-07) and = vs IN (D1-04)
M2:
  title: Designing
  lesson: lessons/M2-designing.md
  sources: lecture2 (whole file)
  prerequisites: [M0, M1]
  objectives:
    - Use the sqlite3 shell (.schema, .read) and keep the schema in a re-runnable schema.sql
    - Normalize a messy table into entity tables and describe relationships with ER cardinalities
    - Write CREATE TABLE with suitable type affinities, PRIMARY/FOREIGN KEYs and NOT NULL / UNIQUE / DEFAULT / CHECK
    - Explain storage classes vs type affinities (including the fares-as-integer argument)
    - Evolve a schema with ALTER TABLE (RENAME TO, ADD/RENAME/DROP COLUMN)
  challenge: [M2-E12, M2-E08]
  mastery:
    - Write the complete mbta schema (M2-E12) from a blank file and pass every probe
    - Predict typeof() results for values inserted into INTEGER, TEXT and untyped columns (R2-04, R2-05, R2-08)
    - Explain when a composite primary key is wrong (M2-E04 / D2-04)
M3:
  title: Writing
  lesson: lessons/M3-writing.md
  sources: lecture3 (whole file)
  prerequisites: [M0, M1, M2]
  objectives:
    - Insert single and multiple rows and let SQLite generate primary keys
    - Read constraint errors (UNIQUE, NOT NULL, FOREIGN KEY) as guardrails
    - Import CSV data, including via a temporary table and INSERT … SELECT, and fix '' vs NULL
    - Delete safely (WHERE, IS NULL, dates, subqueries) and choose ON DELETE actions
    - Update rows with subqueries and clean text data with trim / upper / LIKE
    - Automate side effects with BEFORE/AFTER triggers using OLD and NEW
    - Implement soft deletion and discuss its ethics
  challenge: [M3-E13, M3-E14, M3-E06]
  mastery:
    - Clean the votes table to four groups (M3-E13) in ≤ 6 statements
    - Write the sell/buy triggers (M3-E14) from memory
    - Spot the bug in D3-02, D3-03 and D3-06 within a minute each
M4:
  title: Viewing
  lesson: lessons/M4-viewing.md
  sources: lecture4 (whole file)
  prerequisites: [M1, M3]
  objectives:
    - Create, query and drop views; explain why they cost almost no space and stay current
    - Use views to simplify (hide joins), aggregate (and build views on views), partition and secure
    - Choose between VIEW, TEMPORARY VIEW and CTE by lifetime
    - Make a read-only view writable with INSTEAD OF triggers, including conditional (WHEN) triggers
  challenge: [M4-E12, M4-E13, M4-E05]
  mastery:
    - Build current_collections with all three INSTEAD OF triggers (M4-E11 … M4-E13)
    - Rewrite a view-on-view analysis as a single CTE (M4-E05)
    - Explain why the rideshare view is not real security in SQLite
M5:
  title: Optimizing
  lesson: lessons/M5-optimizing.md
  sources: lecture5 (whole file)
  prerequisites: [M0, M1, M2, M3]
  objectives:
    - Measure queries (.timer) and read EXPLAIN QUERY PLAN (SCAN vs SEARCH)
    - Create single-column, multi-column/covering and partial indexes for a given query
    - Explain B-tree indexes and their space/write-time trade-offs; reclaim space with VACUUM
    - Use BEGIN / COMMIT / ROLLBACK; explain ACID, race conditions and SQLite locks
  challenge: [M5-E03, M5-E07, M5-E08]
  mastery:
    - Reach two covering indexes for the Tom Hanks query (M5-E03) and explain column order (D5-01)
    - Recover from the failed transfer with ROLLBACK (M5-E07) and explain why ROLLBACK needs BEGIN
    - Explain the double-transfer attack and its fix in your own words (M5-E08)
M6:
  title: Scaling
  lesson: lessons/M6-scaling.md
  sources: lecture6 (whole file)
  prerequisites: [M2, M3, M4, M5]
  objectives:
    - Connect to and navigate MySQL and PostgreSQL; translate a SQLite schema with appropriate types
    - Modify columns (MODIFY) and write stored procedures with parameters (MySQL)
    - Compare vertical/horizontal scaling, replication models (sync/async, read replicas) and sharding
    - Grant least-privilege access; demonstrate SQL injection and defend with prepared statements
  challenge: [M6-E06, M6-E03, M6-E09]
  mastery:
    - Translate the mbta schema to MySQL and PostgreSQL and run it (database/scaling/*)
    - Write the double-sale-proof sell procedure (M6-E06)
    - Pick sync vs async replication for two scenarios and justify it (R6-06)
    - Exploit M6-E08 / M6-E09, then explain exactly why a bound parameter stops it
