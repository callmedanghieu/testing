# Review deck M0 (lecture0). Types: quick, concept, predict (answer verified by executing `sql` in tests), debug, write.
# Predict output format: columns joined by " | ", rows by "; ", "(no rows)" when empty, "ERROR: <message start>" on error.
- id: R0-01
  type: quick
  front: What does `LIMIT 5` do, and why use it on a big table?
  back: It returns at most 5 rows. It lets you peek at the data without printing every row.
  source: {file: lecture0, lines: "366-374", quote: "And for that, I could use this other SQL keyword, this one called LIMIT."}
- id: R0-02
  type: predict
  db: longlist0
  sql: SELECT COUNT(*) FROM "longlist" WHERE "translator" = NULL;
  choices: ["2", "0", "78", "ERROR: no such column"]
  answer: 1
  why: "`= NULL` is never true, so nothing is counted. `IS NULL` would find 2."
  source: {file: lecture0, lines: "598-606", quote: "We could use IS NULL to figure out if a value is null."}
- id: R0-03
  type: concept
  question: Which quotes go around what in SQLite?
  choices: ["Double quotes for strings, single quotes for column names", "Double quotes for identifiers (tables, columns), single quotes for strings", "Either, interchangeably", "No quotes ever"]
  answer: 1
  why: The lecture's style convention is `"title"` for identifiers and `'hardcover'` for strings. Mixing them up can silently change meaning (debugging D0-03).
  source: {file: lecture0, lines: "306-315", quote: "double quotes for column names and single quotes for string names"}
- id: R0-04
  type: predict
  db: longlist0
  sql: SELECT "title" FROM "longlist" WHERE "title" = 'pyre';
  choices: ["Pyre", "(no rows)", "ERROR: no such column: pyre"]
  answer: 1
  why: "`=` compares text exactly, including case. `LIKE 'pyre'` would match *Pyre* because LIKE ignores (ASCII) case."
  source: {file: lecture0, lines: "963-971", quote: "So in this case, the equal is going to be case-sensitive."}
- id: R0-05
  type: predict
  db: longlist0
  sql: SELECT COUNT(*), COUNT("translator") FROM "longlist";
  choices: ["78 | 78", "78 | 76", "76 | 78", "76 | 76"]
  answer: 1
  why: COUNT(column) skips NULLs, and two books have no translator.
  source: {file: lecture0, lines: "1336-1343", quote: "So COUNT, when given a column, counts only those that"}
- id: R0-06
  type: concept
  question: "`ORDER BY \"rating\" LIMIT 10` returns…"
  choices: ["the 10 best-rated books", "the 10 worst-rated books", "10 random books", "an error: DESC is required"]
  answer: 1
  why: ORDER BY is ascending (smallest first) by default. The lecturer got 3.05 … 3.42 at first and fixed it with DESC.
  source: {file: lecture0, lines: "1002-1017", quote: "So let me show you that ORDER BY does by default sort from least to greatest."}
- id: R0-07
  type: predict
  db: longlist0
  sql: SELECT MAX("title"), MIN("title") FROM "longlist";
  choices: ["A New Name: Septology VI-VII | Wretchedness", "Wretchedness | A New Name: Septology VI-VII", "The Adventures of China Iron | Tyll"]
  answer: 1
  why: On text, MAX and MIN compare alphabetically, not by length. MAX is the alphabetically last title.
  source: {file: lecture0, lines: "1305-1325", quote: "So MAX seems to give us the lowest alphabetically"}
- id: R0-08
  type: concept
  question: "Which pattern matches exactly four-character titles beginning with T?"
  choices: ["'T%'", "'T___'", "'T_%'", "'%T___%'"]
  answer: 1
  why: Each `_` is exactly one character, while `%` is any run of characters (including none).
  source: {file: lecture0, lines: "805-814", quote: "This is the only title that has T and then three characters after it."}
- id: R0-09
  type: quick
  front: "What does `BETWEEN 2019 AND 2022` include?"
  back: Both ends, so it is the same as `>= 2019 AND <= 2022`.
  source: {file: lecture0, lines: "878-883", quote: "This is inclusive."}
