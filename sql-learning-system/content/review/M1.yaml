# Review deck M1 (lecture1).
- id: R1-01
  type: quick
  front: Name the three kinds of relationship between tables and give a longlist example of each.
  back: One-to-one (each author writes exactly one book, an assumption the lecture rejects), one-to-many (a book has many ratings, a publisher many books), many-to-many (authors ↔ books, translators ↔ books).
  source: {file: lecture1, lines: "119-146", quote: "one-to-one,"}
- id: R1-02
  type: concept
  question: In `ratings(book_id, rating)`, what is `book_id`?
  choices: ["The primary key of ratings", "A foreign key: books' primary key stored in another table", "A composite key", "An ISBN"]
  answer: 1
  why: A foreign key is a primary key from one table placed in a column of another table, here linking each rating to its book.
  source: {file: lecture1, lines: "317-324", quote: "Well, a foreign key is simply taking a primary key from one table"}
- id: R1-03
  type: concept
  question: A subquery returns several rows. Which outer operator compares against all of them?
  choices: ["=", "IN", "LIKE", "IS"]
  answer: 1
  why: "`= (subquery)` uses only the first row in SQLite. `IN (subquery)` tests membership in the whole list."
  source: {file: lecture1, lines: "975-984", quote: "if you're looking to see if some id is part of a list of ids"}
- id: R1-04
  type: predict
  db: sea_lions
  sql: SELECT COUNT(*) FROM "sea_lions" JOIN "migrations" ON "migrations"."id" = "sea_lions"."id";
  choices: ["5", "6", "7", "8"]
  answer: 0
  why: An INNER JOIN keeps only matching ids. Jolee has no migration, and two migrations have no sea lion, so 5 rows remain.
  source: {file: lecture1, lines: "1149-1162", quote: "So, this is our example, then, of an INNER JOIN."}
- id: R1-05
  type: predict
  db: sea_lions
  sql: SELECT COUNT(*) FROM "sea_lions" FULL JOIN "migrations" ON "migrations"."id" = "sea_lions"."id";
  choices: ["5", "6", "7", "8"]
  answer: 3
  why: 5 matches + Jolee (left only) + 2 untracked migrations (right only) = 8 rows.
  source: {file: lecture1, lines: "1274-1287", quote: "Well, we see both tables in their entirety."}
- id: R1-06
  type: predict
  db: longlist
  sql: SELECT ROUND(AVG("rating"), 2) FROM "ratings" WHERE "book_id" = 1;
  choices: ["3.67", "3.77", "3.84", "4"]
  answer: 1
  why: Book 1 (Boulder) has 2,779 ratings averaging 3.774…, the real figure in lecture1 L1737 and lecture4 L409. The slides' 4, 3, 4 example (3.67) is only an illustration.
  source: {file: lecture1, lines: "1733-1737", quote: "3.77, 3.97, 3.04-- for each book"}
- id: R1-07
  type: concept
  question: Which clause filters *groups* (e.g. average > 4.0) rather than rows?
  choices: ["WHERE", "HAVING", "ORDER BY", "LIMIT"]
  answer: 1
  why: WHERE runs before grouping, and HAVING runs after it. The order is GROUP BY → HAVING → ORDER BY → LIMIT.
  source: {file: lecture1, lines: "1759-1764", quote: "SQL uses a different keyword for conditions on groups"}
- id: R1-08
  type: predict
  db: longlist
  sql: SELECT "name" FROM "authors" INTERSECT SELECT "name" FROM "translators";
  choices: ["(no rows)", "Ngũgĩ wa Thiong'o", "Sophie Hughes", "ERROR: no such column"]
  answer: 1
  why: INTERSECT keeps the names present in both sets. Ngũgĩ translated his own book.
  source: {file: lecture1, lines: "1537-1542", quote: "His name is Ngugi"}
- id: R1-09
  type: concept
  question: What do UNION, INTERSECT and EXCEPT require of the two queries?
  choices: ["Same table", "Same number of columns (of compatible kinds)", "Same WHERE clause", "An ORDER BY"]
  answer: 1
  why: Rows from both sides are stacked or compared, so they must have the same shape (debugging D1-09).
  source: {file: lecture1, lines: "1652-1662", quote: "you always have to have the same number"}
- id: R1-10
  type: quick
  front: What does a NATURAL JOIN do, and what is its risk?
  back: It joins on every column whose name appears in both tables and keeps one copy of it. If another shared name appears later, the join silently changes.
  source: {file: lecture1, lines: "1380-1399", quote: "A NATURAL JOIN kind of allows me to omit the part of my previous JOINs"}
