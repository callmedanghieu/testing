- id: R3-01
  type: quick
  front: Syntax of a multi-row INSERT, and its two advantages?
  back: "`INSERT INTO t (a, b) VALUES (1, 2), (3, 4);`. It is more convenient and usually faster than many single INSERTs, and it is all-or-nothing if a row breaks a constraint."
  source: {file: lecture3, lines: "324-330", quote: "this is not just a manner of convenience"}
- id: R3-02
  type: predict
  db: mfa
  sql: |
    INSERT INTO "collections" ("title", "accession_number") VALUES ('A', 'x1'), ('B', '56.257');
    SELECT COUNT(*) FROM "collections";
  choices: ["4", "5", "6", "ERROR: UNIQUE constraint failed"]
  answer: 3
  why: The second row duplicates an accession number. The statement fails, and neither row is inserted.
  source: {file: lecture3, lines: "632-638", quote: "then we won't actually insert any of those rows"}
- id: R3-03
  type: quick
  front: Two ways to import a CSV with `.import`, and when to use each?
  back: "`.import --csv --skip 1 file.csv existing_table` when the columns match the table. `.import --csv file.csv new_table` (the header names the columns), then `INSERT INTO real (...) SELECT ... FROM new_table;` and `DROP TABLE new_table;` when they don't (e.g. no id column)."
  source: {file: lecture3, lines: "604-605", quote: "one to import into an existing table and one to import into a brand new table"}
- id: R3-04
  type: concept
  question: "`id INTEGER PRIMARY KEY AUTOINCREMENT`; rows 1, 2, 3 exist; you delete row 3 and insert a new row. Its id?"
  choices: ["3", "4", "1", "NULL"]
  answer: 1
  why: AUTOINCREMENT never reuses an id, not even the deleted maximum. Without AUTOINCREMENT you would get 3 (max + 1). Lecture 3 states this backwards (errata #2).
  source: {file: lecture3, lines: "1077-1087", quote: "autoincrement"}
- id: R3-05
  type: predict
  db: mfa
  sql: |
    DELETE FROM "collections" WHERE "acquired" < '1912-01-01';
    SELECT "title" FROM "collections" ORDER BY "id";
  choices: ["Profusion of Flowers; Spring Outing", "Imaginative Landscape; Profusion of Flowers; Spring Outing", "Spring Outing", "(no rows)"]
  answer: 1
  why: Farmers (1911) is deleted. `NULL < date` is not true, so Imaginative Landscape stays.
  source: {file: lecture3, lines: "798-808", quote: "And I can use these same operators with dates."}
- id: R3-06
  type: concept
  question: Which ON DELETE action turns "delete the artist, then their links" into one step?
  choices: ["RESTRICT", "NO ACTION", "SET NULL", "CASCADE"]
  answer: 3
  why: CASCADE deletes the referencing rows automatically. SET NULL would keep them with artist_id = NULL.
  source: {file: lecture3, lines: "1010-1013", quote: "Or perhaps, most compellingly, I could try to CASCADE the deletion."}
- id: R3-07
  type: predict
  db: votes
  sql: |
    UPDATE "votes" SET "title" = upper(trim("title"));
    SELECT COUNT(DISTINCT "title") FROM "votes";
  choices: ["4", "9", "12", "20"]
  answer: 1
  why: |
    trim and upper merge the whitespace and case variants, but the typos remain as their own groups: FAMERS…, FARMESR…, FARMERS WORKING, IMAGINTIVE…, and PROFUSION. That gives 4 + 5 = 9.
  source: {file: lecture3, lines: "1330-1339", quote: "But there's still some typos"}
- id: R3-08
  type: concept
  question: In a `BEFORE DELETE` trigger, how do you refer to the title of the row being deleted?
  choices: ["NEW.title", "OLD.title", "DELETED.title", "title"]
  answer: 1
  why: OLD is the row being removed. NEW exists only for INSERT and UPDATE.
  source: {file: lecture3, lines: "1604-1608", quote: "So old.title gives me access to the old row"}
- id: R3-09
  type: predict
  db: null
  setup: |
    CREATE TABLE "c" ("accession_number" TEXT);
    INSERT INTO "c" VALUES (06.1899);
  sql: SELECT "accession_number" FROM "c";
  choices: ["06.1899", "6.1899", "ERROR: syntax error", "6"]
  answer: 1
  why: Unquoted, 06.1899 is a number. The TEXT column stores its text form, and the leading zero is gone. Quote identifiers that look numeric (errata #5).
  source: {file: lecture3, lines: "357-359", quote: "Now, I'll say the"}
- id: R3-10
  type: quick
  front: What is a soft delete, and one ethical concern?
  back: Marking a row as deleted (e.g. deleted = 1) instead of removing it. For personal data it may not honour a user's request to be forgotten (GDPR).
  source: {file: lecture3, lines: "1774-1784", quote: "and the right to be forgotten"}
