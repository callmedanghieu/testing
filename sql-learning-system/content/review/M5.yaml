- id: R5-01
  type: quick
  front: SCAN vs SEARCH in EXPLAIN QUERY PLAN?
  back: SCAN reads every row of the table (or index) in order. SEARCH uses an index (or the primary key) to jump straight to matching rows.
  source: {file: lecture5, lines: "328-332", quote: "The plan is to scan movies"}
- id: R5-02
  type: predict
  db: movies
  sql: EXPLAIN QUERY PLAN SELECT "title" FROM "movies" WHERE "id" = 114709;
  choices: ["SCAN movies", "SEARCH movies USING INTEGER PRIMARY KEY (rowid=?)", "SEARCH movies USING INDEX title_index (title=?)"]
  answer: 1
  why: Primary keys are indexed automatically, so no CREATE INDEX is needed.
  source: {file: lecture5, lines: "427-430", quote: "using integer primary key"}
- id: R5-03
  type: concept
  question: What makes an index *covering* for a query?
  choices: ["It has more than one column", "It contains every column the query needs from that table, so no table lookup", "It is on the primary key", "It has a WHERE clause"]
  answer: 1
  why: Multi-column is common but not sufficient. What matters is that the query never has to go back to the table.
  source: {file: lecture5, lines: "483-488", quote: "It's one in which the query data can be found only by searching the index."}
- id: R5-04
  type: concept
  question: Two costs of an index (lecture's B-tree discussion)?
  choices: ["More disk space and slower INSERT/UPDATE/DELETE", "Slower SELECTs and less space", "It locks the table forever", "It disables foreign keys"]
  answer: 0
  why: An index is a sorted copy plus pointers, which costs space, and every write must also update the tree.
  source: {file: lecture5, lines: "852-857", quote: "if I want to insert something into this structure, it'll take me more time"}
- id: R5-05
  type: predict
  db: movies
  setup: |
    CREATE INDEX "recents" ON "movies" ("title") WHERE "year" = 2023;
  sql: EXPLAIN QUERY PLAN SELECT "title" FROM "movies" WHERE "year" = 1998;
  choices: ["SCAN movies", "SCAN movies USING COVERING INDEX recents", "SEARCH movies USING INDEX recents"]
  answer: 0
  why: 1998 rows aren't in the partial index, so it can't be used.
  source: {file: lecture5, lines: "917-924", quote: "Now I'm only back to scanning movies."}
- id: R5-06
  type: concept
  question: You DROP three large indexes. What happens to the database file size?
  choices: ["Shrinks immediately", "Unchanged until VACUUM", "Grows", "The file is deleted"]
  answer: 1
  why: Freed pages are only marked reusable. VACUUM returns them to the OS.
  source: {file: lecture5, lines: "996-999", quote: "we don't actually shrink our database file"}
- id: R5-07
  type: quick
  front: Spell out ACID in one line each.
  back: Atomicity, all or nothing. Consistency, never violate constraints. Isolation, concurrent transactions don't interfere. Durability, committed data survives crashes.
  source: {file: lecture5, lines: "1110-1127", quote: "A stands for atomicity"}
- id: R5-08
  type: predict
  db: bank
  sql: |
    BEGIN TRANSACTION;
    UPDATE "accounts" SET "balance" = "balance" + 10 WHERE "id" = 2;
    ROLLBACK;
    SELECT "balance" FROM "accounts" WHERE "id" = 2;
  choices: ["20", "30", "ERROR: cannot rollback"]
  answer: 0
  why: ROLLBACK undoes everything since BEGIN.
  source: {file: lecture5, lines: "1263-1267", quote: "think about it as if this transaction never even"}
- id: R5-09
  type: concept
  question: Which SQLite lock lets many connections read at once?
  choices: ["EXCLUSIVE", "SHARED", "UNLOCKED"]
  answer: 1
  why: SHARED is for readers. A writer needs EXCLUSIVE, which blocks everyone else.
  source: {file: lecture5, lines: "1476-1479", quote: "A shared lock means I'm only reading."}
