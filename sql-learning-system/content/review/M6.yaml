- id: R6-04
  type: quick
  front: Identifier quoting in SQLite vs MySQL vs PostgreSQL?
  back: "SQLite: double quotes. MySQL: backticks. PostgreSQL: double quotes."
  source: {file: lecture6, lines: "1320-1323", quote: "Well, in Postgres you have double quotes for your identifiers here."}
- id: R6-05
  type: quick
  front: Why change the DELIMITER before CREATE PROCEDURE in MySQL?
  back: The body contains `;`. The client would end the statement at the first one, so you switch the delimiter (e.g. to `//`) while defining the procedure.
  source: {file: lecture6, lines: "1049-1058", quote: "temporarily declare a different delimiter"}
- id: R6-06
  type: concept
  question: Synchronous vs asynchronous replication. Which is right for a bank's ledger?
  choices: ["Asynchronous: faster", "Synchronous: the leader confirms only after the follower has the data", "Neither; use sharding", "Leaderless only"]
  answer: 1
  why: Synchronous is slower but guarantees the copy exists. Asynchronous risks losing acknowledged writes, which is acceptable for a lost tweet, not for money.
  source: {file: lecture6, lines: "1700-1706", quote: "You might use this, though, if you're working in finance or healthcare"}
- id: R6-07
  type: concept
  question: Names A-I, J-R, S-Z are sharded on three servers. What two risks does the lecture name?
  choices: ["Hotspots (one shard overloaded) and a single point of failure without replication", "Slower writes and type errors", "Deadlocks and VACUUM", "None"]
  answer: 0
  why: Shard keys should spread load evenly, and each shard should be replicated.
  source: {file: lecture6, lines: "1763-1784", quote: "The goal is to really to avoid what we call a hotspot"}
- id: R6-08
  type: concept
  question: Which statement lets user carter read only the `analysis` view?
  choices: ["GRANT ALL ON *.* TO 'carter';", "GRANT SELECT ON rideshare.analysis TO 'carter';", "CREATE VIEW carter AS …", "REVOKE SELECT ON rides FROM 'carter';"]
  answer: 1
  why: Grant the smallest privilege on the smallest object.
  source: {file: lecture6, lines: "1883-1886", quote: "and in particular,"}
