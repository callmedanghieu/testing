- id: R6-01
  type: concept
  question: How many values can a MySQL `TINYINT` (signed) hold at most, and why does it matter?
  choices: ["127 (1 byte), so pick the smallest type that safely fits", "255 always", "2^31", "Unlimited"]
  answer: 0
  why: Signed TINYINT is −128…127. More bytes count higher, and fewer bytes save space.
  source: {file: lecture6, lines: "227-233", quote: "You could see for a tiny int we can only count up to 127."}
- id: R6-02
  type: concept
  question: A station has exactly one line, from a fixed list. Which MySQL type fits best?
  choices: ["SET", "ENUM", "TEXT", "BLOB"]
  answer: 1
  why: ENUM allows exactly one value from the list, and SET allows several.
  source: {file: lecture6, lines: "423-432", quote: "Now, set complements enum."}
